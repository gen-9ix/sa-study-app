@CARD hw3.states | Sandbox 狀態與 Execution
A> pause 不是把容器「凍結」，而是「把房間裡的工作桌（/workspace）收起來，整間房拆掉」；resume 是「蓋一間新房間，把工作桌搬回來」，所以 /workspace 以外的改動都會消失。這正好是 Docker 的 volume 概念：容器可丟、資料留在 volume。
B> **Create**：建立並啟動容器 → running；**Pause**：停止所有執行中的 execution、保留 /workspace、**刪除容器** → paused
B> **Resume**：**建立新容器**，/workspace 與 pause 前相同 → running；**Close**：刪除容器與保留的內容 → closed
B> **/workspace 以外的變更在 resume 後會消失**（容器可寫層隨容器刪除）
B> 平台停止時 **pause 所有 running sandbox**；平台重啟後它們**保持 paused，不自動 resume**
B> Execution：type **command** → bash -c "<input>"，output = **stdout 與 stderr 依序（同 2>&1）**；type **agent** → sallm-cli run --json --task "<input>"
B> status：**running**（exit_code、output 皆 null）、**succeeded**（0、完整輸出）、**failed**（實際 exit code、完整輸出）、**stopped**（被 stop API 或 sandbox pause/close，exit_code null、output 為停止前的輸出）
?mc 在 sandbox 中執行 apt-get install vim（安裝到 /usr/bin），然後 pause 再 resume，vim 還在嗎？
+ 不在，/workspace 以外的變更在 resume 後消失
- 在，因為 pause 會凍結容器
- 在，因為 Docker 會保留 image layer
- 要看 vim 的版本
E> Resume 會建立新容器，只有 /workspace 被保留（例如用 volume）。
?mt 配對 execution status：
> running :: 還在執行，exit_code 與 output 都是 null
> succeeded :: exit code 0，回傳完整輸出
> failed :: exit code 非 0，回傳實際 exit code
> stopped :: 被 stop 或 sandbox 被 pause/close
E> stopped 的 exit_code 是 null，output 是停止前已產生的輸出。
?fill command 類型的 execution 要讓 stdout 和 stderr 依序合併輸出，相當於在指令後加＿＿
= 2>&1
E> 先把 stderr 導向目前的 stdout，兩者就會依產生順序寫在一起。
?mc 實作 pause 時，最適合用來保留 /workspace 的 Docker 機制是？
+ 把 /workspace 放在 volume（或 bind mount），刪除容器後 volume 仍存在，resume 時掛到新容器
- docker pause
- docker commit 成新 image
- 把檔案存在容器的可寫層
E> docker pause 只是凍結 process，容器沒被刪除，不符合規格；commit 會把 /workspace 外的變更也保留下來。

@CARD hw3.netctl | Sandbox 網路控制：gateway、allowlist、SNI
A> 平台是 sandbox 唯一的出口和電話簿：sandbox 的預設路由和 DNS 都指向平台。平台只放行「打給 ta.cs.nycu」的 HTTP/HTTPS 與 DNS；而且不信任客人自己報的地址，一律自己查電話簿後再撥，避免「嘴上說要去合法網站、實際上連到別的 IP」。
B> sandbox 的 **default route 與 DNS resolver 都是平台容器 IP**；sandbox 內的程式**不能改路由或防火牆**（不給 **CAP_NET_ADMIN**）
B> 只允許兩種流量：**TCP 80/443**（交給平台的 HTTP/HTTPS proxy）與**給平台的 DNS 查詢**；其他全部擋掉
B> 只放行 **ta.cs.nycu 及其子網域**：HTTP 看 **Host header**、HTTPS 看 **SNI**（TLS ClientHello 中的主機名）
B> **擋掉直接連 IP 位址**的連線
B> proxy 用**平台的 DNS** 解析 Host / SNI，再連到該 IP；**不使用 sandbox 原本的目的 IP**
?mc 為什麼 proxy 不能直接使用 sandbox 連線的原始目的 IP，而要自己解析 SNI？
+ 否則 sandbox 可以在 SNI 填允許的網域、實際連向任意 IP，繞過 allowlist
- 因為原始目的 IP 一定是錯的
- 因為 TLS 不允許轉送到原本的 IP
- 為了讓連線速度變快
E> 名稱與實際連線目標必須一致，allowlist 才有意義。
?mc 平台在「還沒解密」的情況下，如何知道 sandbox 的 HTTPS 連線要去哪個網站？
+ 讀取 TLS ClientHello 中的 SNI（Server Name Indication）
- 讀取 HTTP Host header
- 查詢目的 IP 的反向 DNS
- 讀取憑證的 SAN
E> HTTP 才能直接看 Host header；HTTPS 的 Host 在加密層內。
?tf 只要不給容器 CAP_NET_ADMIN，容器內即使是 root 也無法修改路由表與 iptables 規則。
=T
E> 修改網路設定需要 CAP_NET_ADMIN；Docker 預設不給。
?mc sandbox 執行 curl http://1.2.3.4/，依規格平台應該？
+ 擋下並記錄為 network event，reason 為 ip_address
- 放行，因為是 HTTP
- 反查 1.2.3.4 的網域後決定
- 轉送到 TA DNS
E> Block connections to IP addresses。

@CARD hw3.mitm | HTTPS 攔截、憑證驗證與 CRL
A> 平台扮演「合法的中間人」：對 sandbox 出示自己 CA 臨時簽的假憑證（sandbox 被設定成信任它），解開流量記錄後，再以真正客戶的身分去連真網站，並且嚴格檢查真網站的證件與「黑名單」（CRL）。真網站有問題就拒絕，並回 TLS alert。
B> 平台有專用的**攔截 root CA**，只用來攔截 sandbox 的 HTTPS；**不是** Part 2 的 root CA，**VM 不信任它**
B> 平台解密 sandbox 的 HTTPS，再**連到真正的網站**；用 **VM 信任的 root CA** 驗證真網站憑證
B> 用 **CRL** 檢查真網站憑證鏈的撤銷狀態：**每 60 秒內重新下載**；**POST /api/crl/refresh** 立即下載
B> 驗證失敗 → **拒絕連線並送 tls alert**（tls_invalid / tls_revoked）
B> 測試 tls_revoked：https://revoked.ta.cs.nycu（CRL 撤銷了它的 **intermediate CA**）
?mc 為什麼攔截用的 root CA「不應該」被 VM（host）信任？
+ 這把 CA 可以替任何網域即時簽憑證，若 host 也信任它，私鑰外洩時 host 上所有 HTTPS 都可能被冒充
- 因為 host 不需要上網
- 因為一台機器只能信任一個 CA
- 因為 CRL 不支援攔截 CA
E> 攔截 CA 的信任範圍應只限 sandbox。
?mc revoked.ta.cs.nycu 的 leaf 憑證本身沒被撤銷，但它的 intermediate CA 在 CRL 中。平台應該？
+ 判定 tls_revoked 並拒絕連線，因為要檢查整條憑證鏈的撤銷狀態
- 放行，因為 leaf 沒被撤銷
- 只記錄警告但放行
- 改用 HTTP 連線
E> checks revocation of the real site cert chain with CRLs。
?mt 配對 TLS 驗證失敗原因與 network event 的 reason：
> 憑證鏈無法串到信任的 root :: tls_invalid
> 憑證或其 CA 在 CRL 中 :: tls_revoked
> 網域不在 allowlist :: not_allowlisted
> 直接連 IP 位址 :: ip_address
E> blocked 的 network event 中，status 與 response_body 都是 null。
?tf CRL 只要在平台啟動時下載一次就夠了。
=F
E> 規格要求至少每 60 秒重新下載，否則新撤銷的憑證會被放行。

@CARD hw3.dnsevents | DNS 過濾與事件紀錄
A> 平台的 DNS 是「只接特定號碼的總機」：問 ta.cs.nycu 家族就轉給 TA 的 DNS，問別的一律回「查無此號」（NXDOMAIN）。每通電話、每次上網、每次呼叫 LLM 都寫進資料庫的事件簿。
B> DNS：allowlist 的名稱**轉送給 TA resolver 192.168.255.66**；其他名稱回 **NXDOMAIN**
B> 事件類型：https://llm.ta.cs.nycu 的請求 → **llm**；其他 HTTP/HTTPS（**含被擋的連線**）→ **network**；DNS 查詢 → **dns**；syscall 監控 → **syscall**
B> 資料表 **events**（資料庫 llm_sandbox_platform）：**id uuid、sandbox_id uuid（pause/resume 不變）、time timestamptz、type text、verdict text（allow / block，syscall 一律 allow）、detail jsonb**
B> network：一組 request+response 一個 event（同連線多個 request 各一個）；body 用 **base64**、去掉 chunked 編碼、保留 Content-Encoding 的原始 bytes
B> dns：qname（小寫、無結尾 .）、qtype、rcode、answers（name、type、ttl、data；data 用 dig 的 RDATA 格式）；被擋 → verdict block、NXDOMAIN、answers []
B> llm：model、stream、status、request_body、response_body（串流時包含所有 data: 行與最後的 data: [DONE]）
X> SELECT time, detail->>'host' AS host, detail->>'reason' AS reason
X>   FROM events
X>  WHERE type = 'network' AND verdict = 'block'
X>  ORDER BY time DESC;
?mc sandbox 查詢 example.com 的 DNS，平台應該？
+ 回 NXDOMAIN，記錄 dns event，verdict 為 block、answers 為空陣列
- 轉送給 TA resolver 再回應
- 不回應讓查詢逾時
- 回應 127.0.0.1
E> 只有 ta.cs.nycu 及其子網域會被轉送給 192.168.255.66。
?fill 從 jsonb 欄位 detail 取出 host 的「文字」值，PostgreSQL 運算子是 detail＿＿'host'
= ->>
E> -> 取出 jsonb，->> 取出 text。
?mc 為什麼 events 的 sandbox_id 要在 pause/resume 之後保持不變，而不是用 Docker 的 container ID？
+ resume 會建立新容器，container ID 會變；sandbox_id 才能把同一個 sandbox 的所有事件串起來
- container ID 太長無法存進 uuid
- Docker 不提供 container ID
- 為了讓查詢比較快
E> pause 會刪除容器、resume 建新容器，所以 container ID 會改變。
?tf 被平台擋下、根本沒送出 HTTP request 的 HTTPS 連線不需要記錄 event。
=F
E> 規格：Other HTTP and HTTPS requests, including blocked connections → network event（method、url、body 為 null）。

@CARD hw3.falco | Syscall 監控：偵測危險行為
A> 只看 agent「說它要做什麼」不夠，換個寫法就能騙過；要直接看它向 kernel 要了什麼（syscall）。不管是 cat、python 還是 dd 讀 /etc/shadow，在 syscall 層都是「open 這個檔案來讀」，一個規則全部抓到。
B> 在 **syscall 層**監控每個 sandbox（推薦 **Falco**）；6 種行為 → 記錄 syscall event 並送 alert；**同一行為的不同做法都要偵測**；符合多個類別就**每類各記一筆**（/tmp/nc 同時是 suspicious_command 與 tmp_script）
B> **讀敏感檔**（read_sensitive_file）：/etc/shadow、/etc/gshadow、/etc/sudoers、/root/.bash_history、/proc/1/environ、/root/.ssh/id_*（非 .pub）、/run/secrets/、/etc/ssl/private/
B> **改受保護檔**（modify_protected_file）：write、truncate、rename、delete、chmod、chown /etc/passwd、/etc/shadow、/etc/hosts、/etc/resolv.conf、authorized_keys、/etc/crontab、/etc/ld.so.preload…
B> **清除 shell history**（clear_history）：刪除、truncate、寫入 /root/.bash_history，或換成 symlink（ln -sf /dev/null）
B> **可疑指令**（suspicious_command）：execve 執行 nc、ncat、socat、telnet、nmap、iptables、nft、apt、apt-get、dpkg、pip、pip3（**含透過 symlink**，例如 nc → nc.openbsd）
B> **pipe to shell**：curl / wget / base64 -d 的輸出接到 shell（每條 pipeline 一筆）；**temp script**：執行 /tmp 或 /dev/shm 下的程式或腳本
?mc 為什麼偵測「讀取 /etc/shadow」要在 syscall 層做，而不是比對指令字串有沒有 cat /etc/shadow？
+ 同一件事有無數種寫法（python、dd、less、head…），但都會產生對該檔案的 open 讀取 syscall
- 因為指令字串無法取得
- 因為 syscall 監控比較省資源
- 因為 cat 不是可疑指令
E> Detect different ways to do the same behavior。
?mt 配對行為與 rule：
> python3 -c "open('/etc/shadow').read()" :: read_sensitive_file
> echo 1.2.3.4 evil >> /etc/hosts :: modify_protected_file
> ln -sf /dev/null /root/.bash_history :: clear_history
> curl -fsSL URL | sh :: pipe_to_shell
> sh /tmp/x.sh :: tmp_script
E> 要依實際的 syscall 判斷行為，而不是看指令字串。
?mc agent 執行 /tmp/nc（nc 的複本）連到外部，應記錄幾筆 syscall event？
+ 2 筆：suspicious_command 與 tmp_script
- 1 筆：suspicious_command
- 1 筆：tmp_script
- 0 筆，因為是複本不是系統的 nc
E> 投影片範例：running /tmp/nc matches both Suspicious Commands and Temp Scripts。
?tf 執行 /usr/bin/nc 時若 nc 是指向 nc.openbsd 的 symlink，仍要被偵測為 suspicious_command，path 記錄 symlink 解析後的檔案。
=T
E> path：File run by execve, symlinks resolved。

@CARD hw3.prom | Prometheus 與 /metrics
A> Prometheus 是「定時抄表員」：每 15 秒到各服務的 /metrics 抄一次數字。counter 是只會往上跳的里程表（請求總數），gauge 是會上下動的油表（各狀態 sandbox 數量）。抄表的路徑要上鎖（basic auth），也不要從大門（NGINX）對外開放。
B> https://prom.{STU_ID}.cs.nycu，**basic auth**：user sa、password {STU_ID}
B> 每 **15 秒** scrape：job **ip-srv**（3 個 replica）、job **llm-sandbox-platform**
B> IP-Srv 與平台的 **/metrics 用 basic auth**；**NGINX 不轉發 /metrics**（https://{STU_ID}.cs.nycu/metrics、sandbox 的 /metrics 回 **404**）→ Prometheus 直接在 Docker 網路內抓
B> metric：**ip_srv_requests_total**（counter）、**lmsp_sandboxes**（gauge，label status）、**lmsp_executions_total**（counter，label type）
B> 命名慣例：counter 以 **_total** 結尾；查速率用 **rate(x_total[5m])**
X> scrape_configs:
X>   - job_name: ip-srv
X>     scrape_interval: 15s
X>     basic_auth: { username: sa, password: "19" }
X>     static_configs:
X>       - targets: ['ipsrv1:8000', 'ipsrv2:8000', 'ipsrv3:8000']
X> # nginx
X> location = /metrics { return 404; }
?mt 配對 metric 與型別：
> ip_srv_requests_total :: counter
> lmsp_sandboxes{status="running"} :: gauge
> lmsp_executions_total{type="agent"} :: counter
E> 數量會減少的（sandbox 數）用 gauge；只增不減的累計數用 counter。
?mc counter 與 gauge 的差別？
+ counter 只會增加（重啟時歸零）；gauge 可以上升也可以下降
- counter 可以上下變動；gauge 只會增加
- counter 只能是整數；gauge 只能是小數
- 兩者相同
E> counter 要用 rate() / increase() 看變化速度；gauge 直接看當下的值。
?fill 計算 ip_srv_requests_total 最近 5 分鐘每秒的平均請求數：＿＿(ip_srv_requests_total[5m])
= rate
E> rate() 會自動處理 counter 重啟歸零的情況。
?tf /metrics 應該透過 NGINX 對外公開，讓 Prometheus 經由 HTTPS 抓取。
=F
E> 規格要求 NGINX 對 /metrics 回 404；Prometheus 在內部網路直接 scrape。

@CARD hw3.otel | OpenTelemetry：Logs、Traces 與 mTLS
A> 可觀測性三兄弟：metrics 是「數字儀表板」，logs 是「流水帳」，traces 是「一次請求的完整行程表」。每段行程（span）有父子關係：API 請求是起點（SERVER），途中呼叫 Docker（CLIENT），執行任務（INTERNAL），工具呼叫又是它底下的小行程。log 帶上 trace ID，就能從流水帳跳回行程表。
B> TA **OTLP** collector：https://otel.ta.cs.nycu:**4318**（**OTLP/HTTP**；gRPC 慣例是 4317）
B> 用 **client 憑證**認證（**mTLS**）：由 intermediate 簽、**CN = {STU_ID}**、EKU 含 **clientAuth**；handshake 時送出 **client 憑證 + intermediate**
B> NGINX access log：所有主機寫到 /home/judge/hw3/logs/access.log（每請求一行），每行送成一筆 log record：**service.name=nginx**、body = 該行、sa.uri、sa.host、sa.method、sa.user_agent、sa.status（integer）；**User-Agent 為 sa-probe/{STU_ID} 的請求不記錄也不送**
B> 平台 log：service.name **llm-sandbox-platform**；事件 api_request、sandbox_status、execution_start、execution_end（INFO）、error（ERROR）；帶 **trace ID / span ID**
B> Traces：每個 API 請求一條 trace；span kind：**API request = SERVER（root）**、**Docker API call = CLIENT**、**execution = INTERNAL**（parent 是 API span，可以比它晚結束）、**tool call = INTERNAL**（parent 是 execution，從 tool_call 到同 call_id 的 tool_result）；失敗 → span status **ERROR**
X> # nginx：不記錄特定 User-Agent
X> map $http_user_agent $loggable { "sa-probe/19" 0; default 1; }
X> access_log /home/judge/hw3/logs/access.log combined if=$loggable;
?mt 配對 span 與 span kind：
> 平台收到的 API 請求 :: SERVER
> 平台呼叫 Docker API :: CLIENT
> 一次 execution :: INTERNAL
> agent 的一次 tool call :: INTERNAL
E> SERVER 處理進來的請求、CLIENT 發出對外的呼叫、INTERNAL 是內部工作。
?mc 為什麼平台的 log record 要帶上 trace ID 與 span ID？
+ 讓 log 能和產生它的 trace / span 關聯，從一筆錯誤 log 直接找到整個請求的執行過程
- 為了加密 log
- collector 要求每筆 log 都有唯一 ID
- 為了減少 log 大小
E> 這叫 log 與 trace 的關聯（correlation），OTLP log record 本身就有 trace_id、span_id 欄位。
?mc 用 client 憑證連 OTLP collector 時，為什麼要連 intermediate 憑證一起送出？
+ collector 需要從 client 憑證建立到它信任的 root 的完整鏈；它沒有你的 intermediate
- 因為 client 憑證太短
- intermediate 用來加密資料
- OTLP 規定一定要送兩張憑證
E> 跟伺服器送 fullchain 是同一個道理。
?fill OTLP/HTTP 的慣用 port 是＿＿
= 4318
E> OTLP/gRPC 是 4317。
?fill nginx 依變數決定是否記錄：access_log /path/access.log combined ＿＿=$loggable;
= if
E> $loggable 為 0 或空字串時，這筆請求就不會被記錄。

@CARD hw3.alerts | Alerts：規則、DNS 異常與 Alert API
A> alert 是「打電話報警」：每個符合規則的事件都要打一通（符合多條規則就打多通）。DNS 的三條規則都在抓「把資料偷偷塞在 DNS 查詢裡送出去」（DNS tunneling）：超長的子網域標籤、TXT 查詢、短時間大量查詢。
B> 每個符合的事件送一個 alert；**符合多條規則就每條各送一個**
B> syscall 規則（read_sensitive_file、modify_protected_file、clear_history、suspicious_command、tmp_script → detail 是 **path**；pipe_to_shell → detail 是 **command**）
B> tls 規則：**tls_invalid、tls_revoked** → detail 是真網站的 host
B> dns 規則：**dns_long_label**（qname 中某個 label **超過 40 字元**）、**dns_txt**（查詢類型 **TXT**）、**dns_burst**（同一 sandbox **任意 10 秒內超過 20 次**查詢，含被擋的；**第 21 次時送一次，之後 10 秒內不重複**）
B> Alert API：**POST https://alert.ta.cs.nycu/api/alerts**、**Authorization: Bearer <token>**、成功回 **201**；JSON 欄位 sandbox_id、type、rule、time（RFC 3339）、detail
X> {"sandbox_id":"3f2b8c1e-...","type":"file_read","rule":"read_sensitive_file",
X>  "time":"2026-12-01T10:00:05+08:00","detail":"/etc/shadow"}
?mc dns_long_label、dns_txt、dns_burst 這三條規則，主要想偵測哪種攻擊手法？
+ DNS tunneling：把資料編碼在 DNS 查詢或 TXT 回應中偷偷傳出或接收指令
- DNS cache poisoning
- DDoS 攻擊 DNS 伺服器
- 釣魚網站
E> 長 label 可以塞編碼後的資料；TXT 記錄可以攜帶任意文字。
?mc 某 sandbox 在 10 秒內送出 25 次 DNS 查詢，依 dns_burst 規則會送出幾個 alert？
+ 1 個（在第 21 次時），之後 10 秒內不重複
- 5 個（第 21–25 次各一個）
- 25 個
- 0 個，因為被擋的查詢不算
E> 被擋的查詢也算；第 21 次送一次後冷卻 10 秒。
?fill Alert API 成功建立 alert 時回傳的 HTTP 狀態碼是＿＿
= 201
E> 201 Created。
?tf 一個 DNS 查詢若同時是 TXT 類型且有超過 40 字元的 label，只需要送一個 alert。
=F
E> 每條符合的規則各送一個。

@CARD hw3.judgeenv | Judge 設定與作業注意事項
A> 評分機器人會用非互動式 SSH 登入、讀環境變數、甚至故意關容器、推 tag、改檔案。所以每個設定都要「自動復原」，環境變數要放在非互動式 shell 也讀得到的地方；提交前先拍快照。
B> judge 能讀 /home/judge/hw3/ 下所有檔案
B> 環境變數要在 **judge 的非互動式 SSH session** 生效：SA_OIDC_ISSUER、SA_OIDC_CLIENT_ID、SA_OIDC_CLIENT_SECRET、SA_FORGEJO_TOKEN
B> Debian 的 ~/.bashrc 開頭會在「非互動式」時直接 return → export 要寫在那段**之前**（ssh 執行指令時 bash 會讀 ~/.bashrc）
B> judge 會**改變你的系統**（停容器、推 git tag、改檔案）→ **重開機後所有服務要自動恢復**；**每次提交前拍 VM snapshot**
B> 提醒：確認服務**聽在哪個 IP**、容器與應用**信任哪些憑證**、**檔案權限**；**用官方文件驗證 LLM 的輸出**；必要時讀原始碼；用自動化工具（如 **Ansible**）
?mc 在 ~/.bashrc 最後一行加了 export SA_OIDC_ISSUER=…，但 judge 用 ssh judge@vm 'echo $SA_OIDC_ISSUER' 卻是空的。最可能的原因？
+ Debian 預設 .bashrc 開頭在非互動式 shell 時就 return，後面的 export 沒有執行
- ssh 不支援環境變數
- 變數名稱不能有底線
- 需要重開機才生效
E> 把 export 移到 .bashrc 中「case $- in *i*) …」那段之前。
?mc 作業規格要求服務「重開機後自動恢復」。下列何者「不是」必要的？
+ 把所有容器 docker commit 成 image
- nginx.service 與 docker.service 已 enable
- Compose 服務設定 restart: always 或 unless-stopped
- 資料存放在 volume 或 bind mount
E> commit 不需要；重點是 daemon 會自動啟動、容器會被重新拉起、資料不在容器可寫層。
?tf HW3 的評分只看最後一次提交，遲交不被接受。
=T
E> 所以每次提交前都要確認全部功能，並先拍 VM snapshot。

@CARD hw3.p_openssl | 實作：用 openssl 建立 CA 與簽發憑證
A> 簽憑證的流程像辦證件：先做一把私鑰（印章）；拿私鑰填一張申請書（CSR），寫上名字與主機名；發證中心（CA）審核後蓋章，加上「用途限制」（extension），就是一張憑證。最常見的錯誤是 extension 沒帶進去，例如 SAN 不見了。
B> 私鑰：**openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out x.key**（或 -algorithm RSA -pkeyopt rsa_keygen_bits:3072）；**chmod 600**
B> CSR：**openssl req -new -key x.key -subj "/CN=git.19.cs.nycu" -addext "subjectAltName=DNS:git.19.cs.nycu" -out x.csr**
B> 簽發：**openssl x509 -req -in x.csr -CA intermediate.crt -CAkey intermediate.key -CAcreateserial -days 365 -extfile ext.cnf -out x.crt**（**-extfile** 才會加入 SAN、EKU；CSR 裡的 extension 預設**不會**自動複製，可用 -copy_extensions copy）
B> 檢查：**openssl x509 -in x.crt -noout -text**、**-noout -ext subjectAltName,basicConstraints,extendedKeyUsage**
B> fullchain：**cat x.crt intermediate.crt > x.fullchain.crt**（**leaf 在前**，intermediate 在後；root 不必放）
X> # ext.cnf（伺服器憑證）
X> basicConstraints = critical, CA:FALSE
X> keyUsage = critical, digitalSignature
X> extendedKeyUsage = serverAuth
X> subjectAltName = DNS:git.19.cs.nycu
X> $ openssl x509 -req -in git.csr -CA intermediate.crt -CAkey intermediate.key -CAcreateserial -days 365 -extfile ext.cnf -out git.crt
X> $ cat git.crt intermediate.crt > git.fullchain.crt
?mc 用 openssl x509 -req 簽完的伺服器憑證，瀏覽器說沒有 SAN，但 CSR 裡明明有 -addext subjectAltName。原因？
+ x509 -req 預設不會複製 CSR 的 extension，要用 -extfile 指定或加 -copy_extensions copy
- SAN 只能寫在 CN 裡
- 必須使用 RSA 金鑰才有 SAN
- 瀏覽器不支援 EC 憑證
E> 簽發時由 CA 決定要放哪些 extension，這也是 CA 審核的意義。
?mc fullchain 檔中憑證的正確順序是？
+ 伺服器（leaf）憑證在最前面，接著 intermediate
- intermediate 在前，leaf 在後
- root、intermediate、leaf
- 順序無所謂
E> TLS 規定伺服器送出的第一張必須是自己的憑證，之後每張簽發前一張。
?cmd 顯示 git.crt 的 subjectAltName extension：
= openssl x509 -in git.crt -noout -ext subjectAltName
= openssl x509 -noout -ext subjectAltName -in git.crt
= openssl x509 -in git.crt -noout -text
E> -text 會印出全部內容，-ext 只印指定的 extension。
?fill 簽發憑證時若希望 openssl 自動產生並記錄序號檔，加上選項 -CA＿＿
= createserial
E> 會建立 intermediate.srl，之後用 -CAserial 沿用。

@CARD hw3.p_tlsdebug | 實作：TLS 連不上怎麼查
A> 用 openssl s_client 扮演「最挑剔的客人」去敲門：它會把伺服器出示的整條憑證鏈印出來、告訴你驗證結果和錯誤代碼。curl -v 則是「一般客人」的視角。兩個一起看，問題幾乎都能找到。
B> **openssl s_client -connect git.19.cs.nycu:443 -servername git.19.cs.nycu -CAfile root.crt -showcerts**：看伺服器送了哪些憑證、**Verify return code**
B> **curl -v --cacert root.crt https://git.19.cs.nycu/**：看 TLS 握手與 HTTP 回應；**curl --resolve 主機:443:127.0.0.1** 不改 hosts 也能指定 IP
B> 常見錯誤：**unable to get local issuer certificate**（沒送 intermediate 或不信任 root）、**hostname mismatch**（SAN 不符）、**certificate has expired**、**self-signed certificate in certificate chain**（客戶端沒信任你的 root）
B> 確認系統信任：**openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt 憑證**（需搭配 -untrusted intermediate）
B> 只看到 nginx 預設站？檢查 **SNI**：沒帶 -servername 時 nginx 回 default_server 的憑證
X> openssl s_client -connect git.19.cs.nycu:443 -servername git.19.cs.nycu -CAfile root.crt </dev/null | grep -E 'subject=|issuer=|Verify return'
X> curl -v --cacert root.crt https://git.19.cs.nycu/
X> curl --resolve git.19.cs.nycu:443:127.0.0.1 https://git.19.cs.nycu/
?mc curl 回報 unable to get local issuer certificate，但 root CA 確定已被信任。最可能的原因？
+ 伺服器沒有送出 intermediate 憑證，客戶端無法串到 root
- 憑證過期
- SAN 不符
- 伺服器沒開 443
E> 把 ssl_certificate 改成 fullchain（leaf + intermediate）。
?mc openssl s_client 不加 -servername 時，拿到的憑證跟瀏覽器看到的不同。原因？
+ 沒有送 SNI，nginx 不知道要哪個虛擬主機，就回 default_server 的憑證
- s_client 不支援 TLS 1.3
- 瀏覽器有快取
- s_client 會自動忽略 SAN
E> 同一個 IP:443 上有多個 server_name 時，nginx 靠 SNI 選憑證。
?cmd 不修改 /etc/hosts，讓 curl 把 git.19.cs.nycu:443 直接連到 127.0.0.1：
= curl --resolve git.19.cs.nycu:443:127.0.0.1 https://git.19.cs.nycu/
= curl --resolve git.19.cs.nycu:443:127.0.0.1 https://git.19.cs.nycu
= curl -v --resolve git.19.cs.nycu:443:127.0.0.1 https://git.19.cs.nycu/
E> --resolve 也會讓 SNI 與 Host 保持正確的主機名，比直接連 IP 更準確。

@CARD hw3.p_nginxlayout | 實作：NGINX 設定檔架構與虛擬主機
A> Debian 的 nginx 把設定拆成積木：nginx.conf 是總表，sites-available 放每個網站的設定、sites-enabled 放「啟用的」symlink。同一個 443 port 上有好幾個網站，nginx 靠請求裡的主機名（SNI 與 Host）決定由哪個 server 區塊接待。
B> 主設定 **/etc/nginx/nginx.conf** → include **conf.d/*.conf** 與 **sites-enabled/***（sites-available 的 symlink）
B> 一個 **server { }** = 一個虛擬主機；用 **server_name** 比對；都不符時用 **default_server**
B> 建議加一個 default_server 對未知主機回 **444**（直接斷線）或 404，避免用 IP 就能連到某個服務
B> 共用設定（TLS 參數、proxy header）抽成 **snippets/*.conf** 再 include
B> 檢查：**nginx -t**（語法）、**nginx -T**（印出合併後的完整設定）；**systemctl reload nginx** 不中斷連線；log：**/var/log/nginx/error.log**
X> server { listen 443 ssl default_server; server_name _; ssl_certificate /etc/nginx/tls/default.fullchain.crt; ssl_certificate_key /etc/nginx/tls/default.key; return 444; }
X> sudo ln -s /etc/nginx/sites-available/hw3.conf /etc/nginx/sites-enabled/
X> sudo nginx -t && sudo systemctl reload nginx
?mc 請求的 Host 不符合任何 server_name 時，nginx 會交給誰處理？
+ 該 listen 位址上標記為 default_server 的 server（沒有標記時是第一個）
- 回 500 錯誤
- 隨機一個 server
- 第一個在 conf.d 中的檔案
E> 建議明確寫一個 default_server，避免順序改變時意外由別的網站接手。
?cmd 印出 nginx 合併所有 include 之後的完整設定：
= nginx -T
= sudo nginx -T
E> 找不到某個設定從哪來時很好用。
?fill nginx 中「直接關閉連線、不回應任何內容」的特殊狀態碼是 return ＿＿;
= 444
E> 444 是 nginx 專用的非標準代碼。

@CARD hw3.p_proxyhdr | 實作：反向代理的 header 與後端設定
A> 後端服務躲在 NGINX 後面，看到的連線都是「從 127.0.0.1 來的 HTTP」。如果沒有把原本的主機名、協定、client IP 用 header 告訴它，它產生的連結、轉址、OIDC 的 issuer 都會變成 http://localhost:8100 這種錯誤網址。
B> 一定要傳：**Host $host**、**X-Forwarded-For $proxy_add_x_forwarded_for**、**X-Forwarded-Proto $scheme**（或 https）、X-Real-IP $remote_addr
B> 後端也要設定**對外網址**：Forgejo **ROOT_URL = https://git.19.cs.nycu/**；Keycloak **KC_HOSTNAME=https://auth.19.cs.nycu**、**KC_PROXY_HEADERS=xforwarded**
B> container registry push 很大：**client_max_body_size 0;**（不限制，否則 **413 Request Entity Too Large**）
B> SSE / 串流回應：**proxy_buffering off;**；WebSocket：**proxy_http_version 1.1** + Upgrade / Connection header
B> 隱藏後端 header：**proxy_hide_header X-Powered-By;**、proxy_hide_header Via;
X> location / {
X>     proxy_pass http://127.0.0.1:8101;
X>     proxy_set_header Host $host;
X>     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
X>     proxy_set_header X-Forwarded-Proto https;
X>     client_max_body_size 0;
X> }
?mc docker push 到 git.19.cs.nycu 時，大的 layer 一直回 413。最可能要改哪個設定？
+ nginx 的 client_max_body_size（預設只有 1m）
- Forgejo 的 ROOT_URL
- Docker 的 max-concurrent-uploads
- PostgreSQL 的 max_connections
E> 設成 0 代表不限制大小。
?mc Keycloak 放在 nginx 後面，discovery 文件中的 issuer 卻是 http://127.0.0.1:8100/realms/sa。會造成什麼問題，該怎麼修？
+ token 的 iss 與 judge 預期的 https://auth.19.cs.nycu/realms/sa 不符；設定 KC_HOSTNAME 與 proxy headers 讓 Keycloak 知道對外網址
- 沒有問題，issuer 只是顯示用
- 改成 HTTP/2 就好
- 要把 Keycloak 改聽 443
E> OIDC 用戶端會嚴格比對 issuer 字串。
?mc 平台的串流 LLM 回應（SSE）經過 nginx 後，要等全部結束才一次出現。該調整？
+ 在該 location 設 proxy_buffering off;
- 加大 client_max_body_size
- 開啟 gzip
- 改用 HTTP/1.0
E> nginx 預設會先把後端回應緩衝起來。

@CARD hw3.p_containerdns | 實作：容器裡的名稱解析與信任 CA
A> 容器是另一個世界：它看不到 host 的 /etc/hosts，也不信任你裝在 host 上的 CA。所以 Forgejo 要連 auth.19.cs.nycu 做 OIDC、平台要驗證 OIDC token、Forgejo 要用 verify-full 連 pg.19.cs.nycu，都得在容器裡「另外教一次」：名字指去哪、要相信哪個 CA。
B> 容器**不讀 host 的 /etc/hosts**；用 Docker 內建 DNS（**127.0.0.11**）解析服務名稱，其他轉給 host 的上游 DNS
B> 讓容器把 *.cs.nycu 指向 host 的 NGINX：**extra_hosts: ["auth.19.cs.nycu:host-gateway"]**
B> 讓 pg.19.cs.nycu 在 Docker 網路內解析到 DB 容器（TLS verify-full 的主機名才對得上）：**networks.<net>.aliases: [pg.19.cs.nycu]**
B> 容器信任你的 CA：image 內 **update-ca-certificates**，或掛載 CA 並設 **SSL_CERT_FILE**、**REQUESTS_CA_BUNDLE**（Python requests）、**NODE_EXTRA_CA_CERTS**（Node）；Java（Keycloak）有自己的 truststore（**KC_TRUSTSTORE_PATHS**）
B> 測試：**docker compose exec forgejo getent hosts auth.19.cs.nycu**、在容器內 curl https://auth.19.cs.nycu/
X>   forgejo:
X>     extra_hosts:
X>       - "auth.19.cs.nycu:host-gateway"
X>     volumes:
X>       - ./ca/root.crt:/usr/local/share/ca-certificates/sa-root.crt:ro
X>   db:
X>     networks:
X>       backend:
X>         aliases: [pg.19.cs.nycu]
?mc host 的 /etc/hosts 已把 auth.19.cs.nycu 指向自己，Forgejo 容器卻解析不到。原因？
+ 容器不會讀取 host 的 /etc/hosts，需用 extra_hosts 或 DNS 設定
- Forgejo 不支援 OIDC
- 需要重開 nginx
- host-gateway 只能用在 Windows
E> extra_hosts 會寫進容器自己的 /etc/hosts。
?mc Forgejo 以 sslmode=verify-full 連 db:5432 失敗，錯誤是主機名與憑證不符。最好的修法？
+ 給 db 容器一個網路別名 pg.19.cs.nycu，Forgejo 改連 pg.19.cs.nycu
- 改用 sslmode=disable
- 把憑證的 CN 改成 db
- 用 IP 位址連線
E> verify-full 會比對連線時用的主機名與 SAN；規格要求容器內也只能 TLS。
?fill extra_hosts 中代表「host 本機 IP」的特殊值是＿＿
= host-gateway
E> Docker 20.10 起支援，會解析成 host 在預設 bridge 上的 IP。

@CARD hw3.p_keycloak | 實作：Keycloak 的 realm 與 client credentials client
A> Keycloak 裡的 realm 是「一個獨立的身分王國」，issuer 網址就是 https://auth…/realms/王國名。要給 judge 一個機器用的 client：打開 client authentication（有 secret 的 confidential client）並啟用 service accounts（允許 client credentials），judge 才能用 ID + secret 換 token。
B> issuer：**https://auth.{STU_ID}.cs.nycu/realms/<realm>**；discovery 在其後加 **/.well-known/openid-configuration**
B> confidential client：**Client authentication ON**；client credentials：**Service accounts roles 啟用**
B> endpoints（Keycloak）：token **…/protocol/openid-connect/token**、introspect **…/token/introspect**、revoke **…/revoke**、JWKS **…/certs**
B> 平台驗 token：檢查 **iss**、**exp**、簽章（JWKS），必要時檢查 **aud** / **azp**；要支援撤銷就呼叫 introspection
B> Forgejo / 平台的使用者登入用同一個 realm 的另一個 client（authorization code flow）
X> $ ISS=https://auth.19.cs.nycu/realms/sa
X> $ TOKEN_EP=$(curl -s $ISS/.well-known/openid-configuration | jq -r .token_endpoint)
X> $ curl -s -u "$CID:$SECRET" -d grant_type=client_credentials $TOKEN_EP | jq -r .access_token
X> $ curl -s -u "$CID:$SECRET" -d token=$TOKEN $ISS/protocol/openid-connect/token/introspect | jq .active
?mc 在 Keycloak 建立給 judge 使用的 client，要支援 client credentials grant，必須打開哪個設定？
+ Client authentication（confidential）與 Service accounts roles
- Standard flow 與 Implicit flow
- Direct access grants
- Front channel logout
E> Service account 讓 client 能以自己的身分取得 token。
?fill Keycloak realm 為 sa 時，issuer 是 https://auth.19.cs.nycu/＿＿/sa
= realms
E> discovery 就在 https://auth.19.cs.nycu/realms/sa/.well-known/openid-configuration。
?mc introspection 回應 {"active": false} 代表？
+ token 無效：已過期、已被撤銷或不是這個 provider 發的
- token 有效但權限不足
- introspection endpoint 故障
- 需要重新 discovery
E> RFC 7662：active=false 時不提供其他資訊。

@CARD hw3.p_jwt | 實作：驗證 JWT access token
A> JWT 是一張「自帶防偽標記的通行證」：header 說明用哪把鑰匙簽（kid、alg），payload 寫著發給誰、誰發的、何時過期，signature 是發證單位的簽章。驗證時不能只看內容，一定要用 provider 公布的公鑰（JWKS）驗簽，並檢查發行者與期限。
B> 格式：**header.payload.signature**（各段 base64url）；payload 常見 claim：**iss**、**sub**、**aud**、**exp**、**iat**、**azp**、**scope**
B> 驗證步驟：依 header 的 **kid** 從 **jwks_uri** 取公鑰 → 驗簽章 → **iss** 等於設定的 issuer → **exp** 未過（容許少量時鐘誤差）→（需要時）**aud**
B> **alg 要固定**（例如只接受 RS256），不能相信 token 自己說的 alg（避免 alg=none 攻擊）
B> JWKS 要快取並在找不到 kid 時重新抓（provider 會輪換金鑰）
B> HTTP 慣例：沒帶或無效 token 回 **401**（WWW-Authenticate: Bearer）；token 有效但權限不夠回 **403**
X> Authorization: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
?mc 平台驗證 JWT 時，下列哪個做法是錯的？
+ 依 token header 中的 alg 決定用什麼演算法驗證，包括 none
- 用 kid 從 JWKS 找公鑰
- 檢查 iss 是否等於自己的 issuer
- 檢查 exp 是否已過期
E> 驗證端要事先固定允許的演算法。
?mt 配對 HTTP 狀態碼：
> 401 :: 沒有 token 或 token 無效
> 403 :: token 有效但沒有權限
> 201 :: 成功建立資源
> 404 :: 資源不存在
E> WWW-Authenticate: Bearer error="invalid_token" 是 RFC 6750 定義的回應方式。
?mc JWT 的 payload 可以被任何人 base64 解碼讀出來。這代表？
+ JWT 只防竄改、不防偷看，不應該放機密資料
- JWT 沒有任何安全性
- 必須用 HTTPS 才能解碼
- 簽章也會被解碼出私鑰
E> 安全性來自簽章；內容是公開的。

@CARD hw3.p_pgdocker | 實作：PostgreSQL 容器的 TLS 與權限設定
A> 在容器裡跑 PostgreSQL 要注意三件事：憑證私鑰的擁有者與權限（postgres 很挑剔）、設定要用 -c 參數或掛設定檔傳進去、初始化腳本只在「第一次、資料目錄是空的時候」執行一次。
B> 啟動參數：**command: ["postgres","-c","ssl=on","-c","ssl_cert_file=…","-c","ssl_key_file=…","-c","ssl_ca_file=…","-c","hba_file=…"]**
B> 私鑰權限：擁有者 **postgres（容器內 UID 999）且 0600**（或 root 擁有、0640 且群組為 postgres），否則拒絕啟動
B> **ssl_cert_file** 放伺服器憑證 **+ intermediate**；**ssl_ca_file** 放用來驗證 client 憑證的 CA（root 與 intermediate）
B> pg_hba：只寫 **hostssl**，最後加 **host all all all reject** 明確拒絕非 TLS；judge 用 **cert**
B> 帳號與資料庫：**/docker-entrypoint-initdb.d/*.sql** 只在**資料目錄為空**時執行；之後要改就直接連進去下 SQL
B> PostgreSQL 18 的官方 image 調整過資料目錄位置，掛 volume 前先看 image 說明確認正確路徑
X> -- init.sql
X> CREATE ROLE forgejo LOGIN PASSWORD 'xxx';
X> CREATE DATABASE forgejo OWNER forgejo;
X> REVOKE ALL ON DATABASE forgejo FROM PUBLIC;
X> CREATE ROLE judge LOGIN SUPERUSER;
X> # pg_hba.conf
X> local   all  all  peer
X> hostssl all  judge  all  cert
X> hostssl forgejo forgejo all scram-sha-256
X> host    all  all  all  reject
?mc PostgreSQL 容器啟動失敗，log 顯示 private key file has group or world access。應該怎麼修？
+ 讓私鑰的擁有者是容器內的 postgres 使用者，權限改成 0600
- 改成 0777
- 把私鑰放進 ssl_ca_file
- 關閉 ssl
E> postgres 拒絕使用其他人可讀的私鑰。
?mc 在 /docker-entrypoint-initdb.d/ 新增了 SQL 檔，重啟容器後沒有執行。原因？
+ 初始化腳本只在資料目錄為空、第一次初始化時執行
- 檔名必須以 .sh 結尾
- 要先 docker compose build
- PostgreSQL 18 不支援初始化腳本
E> 已有資料時要手動 psql 執行，或清空 volume 重新初始化。
?mc pg_hba.conf 最後加 host all all all reject 的作用？
+ 明確拒絕任何沒有被前面 hostssl 規則接受的 TCP 連線（包括非 TLS 連線）
- 拒絕所有本機 socket 連線
- 拒絕 judge 登入
- 讓所有連線改用 TLS
E> pg_hba 由上而下比對，第一條符合的規則決定結果。

@CARD hw3.p_forgejo2 | 實作：Forgejo 的設定重點
A> Forgejo 的設定集中在 app.ini（容器中也能用 FORGEJO__區段__鍵 這種環境變數）。重點是讓它知道自己的對外網址、用 TLS 連 PostgreSQL、把登入交給 OIDC、開啟 container registry 與 Actions。
B> **[server]**：ROOT_URL = https://git.{STU_ID}.cs.nycu/、DOMAIN、HTTP_PORT；SSH 不對外時 DISABLE_SSH
B> **[database]**：DB_TYPE=postgres、HOST=pg.{STU_ID}.cs.nycu:5432、NAME=forgejo、USER=forgejo、**SSL_MODE=verify-full**（容器要信任你的 CA）
B> OIDC 登入：新增 authentication source，provider **OpenID Connect**，**auto-discover URL = issuer/.well-known/openid-configuration**（CLI：forgejo admin auth add-oauth）
B> **[packages] ENABLED=true**（container registry）；**[actions] ENABLED=true**
B> main 保護：repo 設定的 **Branch protection**，禁止 force push 與刪除；預設分支 main
B> 環境變數寫法：**FORGEJO__database__SSL_MODE=verify-full**、FORGEJO__server__ROOT_URL=…
X>   forgejo:
X>     image: codeberg.org/forgejo/forgejo:11
X>     environment:
X>       - FORGEJO__server__ROOT_URL=https://git.19.cs.nycu/
X>       - FORGEJO__database__DB_TYPE=postgres
X>       - FORGEJO__database__HOST=pg.19.cs.nycu:5432
X>       - FORGEJO__database__SSL_MODE=verify-full
X>     ports: ["127.0.0.1:8101:3000"]
?fill 用環境變數設定 Forgejo 的 [server] ROOT_URL：FORGEJO__＿＿__ROOT_URL=https://git.19.cs.nycu/
= server
E> 格式是 FORGEJO__區段__鍵，兩個底線分隔。
?mc 讓 Forgejo 用 OIDC provider 登入，auto-discover URL 應填？
+ issuer 加上 /.well-known/openid-configuration
- issuer 加上 /token
- OIDC provider 的首頁
- Forgejo 自己的 ROOT_URL
E> Forgejo 會從 discovery 文件取得 authorization、token、userinfo endpoint。
?tf Forgejo 的 ROOT_URL 設錯（例如 http://localhost:3000/），會讓 clone 網址、OAuth 回呼網址都變成錯誤的位址。
=T
E> OIDC 的 redirect URI 由 ROOT_URL 組成，必須與 provider 中登記的一致。

@CARD hw3.p_runner | 實作：Forgejo runner 與 Docker-in-Docker
A> runner 是「派工的工人」：先拿 Forgejo 發的報到碼（registration token）報到，之後不斷問「有沒有工作」；每個 job 開一個新容器執行。用 Docker-in-Docker 時，工人旁邊還有一台「專屬的小 Docker 主機」（docker:dind），job 裡的 docker build 都在那台上進行，不會碰到 host 的 Docker。
B> 註冊：在 Forgejo 取得 runner token → **forgejo-runner register --no-interactive --instance https://git.19.cs.nycu --token … --labels docker:docker://…** → **forgejo-runner daemon**
B> DinD：另開 **docker:dind** 服務（需要 **privileged: true**），runner 用 **DOCKER_HOST=tcp://dind:2376**（TLS）連它
B> job 容器要**信任你的 CA**（clone、docker login、push 都走 HTTPS），也要能解析 git.{STU_ID}.cs.nycu（extra_hosts 或 DNS）
B> dind 推 image 到你的 registry 也要信任 CA：把 CA 放進 dind 的 **/etc/docker/certs.d/git.{STU_ID}.cs.nycu/ca.crt**
B> secrets 在 repo 的 Actions 設定中新增（部署用 SSH 私鑰、registry 密碼），在 workflow 用 **${{ secrets.NAME }}**
X>   dind:
X>     image: docker:dind
X>     privileged: true
X>     environment: [DOCKER_TLS_CERTDIR=/certs]
X>     volumes: [dind-certs:/certs]
X>   runner:
X>     image: code.forgejo.org/forgejo/runner:6
X>     environment:
X>       - DOCKER_HOST=tcp://dind:2376
X>       - DOCKER_TLS_VERIFY=1
X>       - DOCKER_CERT_PATH=/certs/client
?mc 為什麼 docker:dind 服務需要 privileged: true？
+ 在容器內執行完整的 dockerd 需要建立 namespace、cgroup、掛載等，必須有完整權限
- 為了讓它能存取網路
- 為了讀取 host 的 /etc/hosts
- 為了使用 GPU
E> 這也是 DinD 要和其他服務隔離、不要給不信任工作的原因。
?mc job 中 docker push git.19.cs.nycu/... 出現 x509 錯誤，但 host 上 push 正常。原因？
+ 實際執行 push 的是 dind 裡的 dockerd，它沒有信任你的 CA
- runner 沒有網路
- registry 帳號錯誤
- job 沒有 checkout
E> host 的 /etc/docker/certs.d 不會自動出現在 dind 容器中。
?fill workflow 中取用名為 DEPLOY_KEY 的 secret：${{ ＿＿.DEPLOY_KEY }}
= secrets
E> secrets 不會出現在 workflow 的 log 中（會被遮蔽）。

@CARD hw3.p_workflow | 實作：Forgejo Actions workflow
A> workflow 是「生產線的作業說明書」：什麼事件觸發（推 tag）、在哪種工人上跑（runs-on 標籤）、照順序做哪些步驟（檢查 tag → build → push → 部署）。tag 名稱從 github.ref_name 拿到，一路傳給 image tag 和 /api/version。
B> 位置：**.forgejo/workflows/*.yml**（也讀 .github/workflows）
B> 觸發：**on: push: tags: ['v[0-9]+.[0-9]+.[0-9]+']**（只寫 tags 時，推 branch 不會觸發）
B> 取得 tag：**${{ github.ref_name }}**（例如 v1.2.3）；在 job 開頭再用正規表示式檢查
B> 版本寫進 image：**docker build --build-arg VERSION=$TAG**，Dockerfile 用 **ARG VERSION → ENV APP_VERSION=$VERSION**，/api/version 讀它
B> 步驟：checkout → **docker login -u … --password-stdin** → build → push → SSH 部署
X> on:
X>   push:
X>     tags: ['v[0-9]+.[0-9]+.[0-9]+']
X> jobs:
X>   release:
X>     runs-on: docker
X>     steps:
X>       - uses: actions/checkout@v4
X>       - run: |
X>           TAG=${{ github.ref_name }}
X>           echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || exit 1
X>           echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.19.cs.nycu -u ci --password-stdin
X>           docker build --build-arg VERSION=$TAG -t git.19.cs.nycu/hw3/llm-sandbox-platform:$TAG .
X>           docker push git.19.cs.nycu/hw3/llm-sandbox-platform:$TAG
?mc workflow 只寫了 on.push.tags，沒有寫 branches。推送 main 分支會觸發嗎？
+ 不會，只有符合 tags 的 tag 推送會觸發
- 會，branches 預設是全部
- 只有 main 會觸發
- 會觸發但不會 push image
E> 符合規格「其他 tag 或分支不能 build image」。
?mc 為什麼 docker login 要用 --password-stdin 而不是 -p 密碼？
+ 避免密碼出現在指令列參數中（process 列表、log 都看得到）
- -p 不支援 token
- --password-stdin 比較快
- 規定只能用 stdin
E> --password-stdin 從標準輸入讀取密碼，不會留在 shell history 或 process 列表。
?mc 如何讓 GET /api/version 回傳 CI 正在建置的 tag？
+ build 時用 --build-arg 傳入 tag，Dockerfile 中轉成 ENV，程式讀這個環境變數
- 程式啟動時執行 git describe
- 從 Forgejo API 查詢最新 tag
- 寫死在程式碼中，每次手動改
E> 容器裡通常沒有 .git 目錄，build 時注入最可靠。

@CARD hw3.p_sshdeploy | 實作：用 SSH key 安全地部署
A> CI 要「遙控」host 換版本，最安全的作法是發給它一把「只能開一扇門的鑰匙」：這把 SSH key 在 host 的 authorized_keys 裡被限制成只能執行部署腳本，連 shell 都拿不到。就算 CI 的 secret 外洩，攻擊者也只能做「部署某個合法版本」這一件事。
B> 專用的部署 key：私鑰存成 CI secret，公鑰放 host 部署帳號的 authorized_keys
B> 限制：**restrict,command="/usr/local/bin/deploy-lmsp"**：不管對方要求執行什麼，都只跑這支腳本；原本的要求放在 **$SSH_ORIGINAL_COMMAND**
B> 部署腳本**驗證參數**（只接受 ^v[0-9]+\.[0-9]+\.[0-9]+$），把 tag 寫進 compose 的 **.env**，再 **docker compose pull && up -d**
B> CI 端：**known_hosts 預先放 host 的公鑰**，用 StrictHostKeyChecking=yes，避免被中間人冒充
B> 能執行 docker 等於 root：部署帳號的能力要靠 forced command 限縮
X> # ~deploy/.ssh/authorized_keys
X> restrict,command="/usr/local/bin/deploy-lmsp" ssh-ed25519 AAAA... ci-deploy
X> # /usr/local/bin/deploy-lmsp
X> tag=$SSH_ORIGINAL_COMMAND
X> echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo bad tag >&2; exit 1; }
X> cd /home/judge/hw3 && sed -i "s/^LMSP_TAG=.*/LMSP_TAG=$tag/" .env
X> docker compose pull platform && docker compose up -d platform
?mc authorized_keys 中的 command="/usr/local/bin/deploy-lmsp" 有什麼效果？
+ 用這把 key 登入時，不論要求執行什麼，sshd 都只執行指定的腳本，原本的指令放在 SSH_ORIGINAL_COMMAND
- 登入後自動執行一次腳本，再給 shell
- 只允許從某個 IP 登入
- 讓 key 不需要密碼
E> 這叫 forced command，常用於備份、部署這類只需要做一件事的金鑰。
?mc 為什麼部署腳本要用正規表示式檢查 SSH_ORIGINAL_COMMAND？
+ 它來自遠端，必須當成不可信的輸入，避免被注入其他指令或任意字串
- 為了讓 log 好看
- sshd 要求一定要檢查
- 為了加快部署
E> 永遠假設遠端輸入可能是惡意的：白名單驗證，再使用。
?fill authorized_keys 選項中，一次關閉 port forwarding、agent forwarding、PTY 等所有額外功能的是＿＿
= restrict
E> restrict 之後可以再個別打開需要的功能，例如 restrict,pty。

@CARD hw3.p_dockerapi | 實作：平台透過 Docker API 管理 sandbox
A> 平台跟 Docker 溝通不是打 docker 指令，而是對 /var/run/docker.sock 送 HTTP 請求（Docker Engine API），或用 SDK 包好的函式。建立、啟動、執行指令、查結果、刪除，都有對應的 API。
B> 以 HTTP over unix socket：**curl --unix-socket /var/run/docker.sock http://localhost/containers/json**
B> 生命週期：**POST /containers/create**（Image、Env、HostConfig：Binds/Mounts、NetworkMode、Dns、CapDrop、Memory、PidsLimit）→ **POST /containers/{id}/start** → **POST /containers/{id}/stop** → **DELETE /containers/{id}?force=true**
B> 執行指令：**POST /containers/{id}/exec**（Cmd、WorkingDir=/workspace、AttachStdout/Stderr）→ **POST /exec/{id}/start**（串流輸出）→ **GET /exec/{id}/json**（Running、**ExitCode**）
B> Tty=false 時輸出是**多工串流**：每段前面 8 bytes header（第 1 byte 1=stdout、2=stderr，最後 4 bytes 為長度）；要「依序合併」就讓指令自己 **2>&1**
B> exec **沒有 stop API**：要停止 execution，得找出它的 process 再送訊號（例如記下 PID、用另一個 exec 對 process group 送 SIGTERM）
B> Docker API 呼叫會形成 CLIENT span，名稱如 **POST /containers/create**
X> curl -s --unix-socket /var/run/docker.sock -X POST -H 'Content-Type: application/json' \
X>   -d '{"Image":"sandbox:latest","HostConfig":{"Binds":["sbx-123-ws:/workspace"],"PidsLimit":256}}' \
X>   'http://localhost/containers/create?name=sbx-123'
X> # 依序合併 stdout/stderr，並避免引號問題
X> ["sh","-c","exec bash -c \"$1\" 2>&1","_","<使用者的 input>"]
?mc 用 exec API（Tty=false）讀到的原始輸出開頭有奇怪的位元組。原因？
+ Docker 用 8-byte header 多工 stdout 與 stderr，需要解析 header 才是真正內容
- 輸出被 gzip 壓縮
- 容器的語系設定錯誤
- 需要改用 HTTP/2
E> SDK（如 docker-py 的 demux）會幫你處理；Tty=true 不會多工，但會把 \n 轉成 \r\n。
?mc 要取得某次 execution 的 exit code，應該呼叫？
+ GET /exec/{id}/json，讀 ExitCode（Running 為 false 時）
- GET /containers/{id}/logs
- POST /exec/{id}/stop
- GET /containers/json
E> Running 為 true 時 ExitCode 還沒有意義（execution 狀態應為 running、exit_code 為 null）。
?mc 為什麼把使用者的 input 當成 sh -c 'exec bash -c "$1" 2>&1' _ "<input>" 的參數，而不是字串拼接成指令？
+ 以參數傳遞不需要處理引號跳脫，input 中的引號或特殊字元不會破壞外層指令
- 這樣執行比較快
- bash 不接受超過 100 字的 -c
- Docker 規定要這樣寫
E> $1 是第一個位置參數；_ 佔住 $0。

@CARD hw3.p_lifecycle | 實作：pause / resume 與平台的優雅關機
A> 平台關機時要「先幫每個房客收拾工作桌」：停掉正在跑的 execution、保留 /workspace、刪掉容器、狀態改成 paused。這些動作需要時間，所以 compose 給平台的關機寬限期要夠長，平台也要接住 SIGTERM 才有機會做事。
B> /workspace 放在**每個 sandbox 一個 volume**（例如 sbx-<id>-ws）；容器名稱帶 sandbox_id，ID 本身存資料庫、pause/resume 不變
B> pause：stop 執行中的 execution（狀態 **stopped**，保留已產生的輸出）→ 刪除容器（**不刪 volume**）→ paused
B> resume：用同一個 image 與 volume **建立新容器**、套用相同的網路與環境變數 → running
B> close：刪除容器**與 volume** → closed
B> 平台收到 **SIGTERM** 時 pause 所有 running sandbox；compose 設 **stop_grace_period: 60s**（預設 10 秒可能不夠）；重啟後**不自動 resume**
B> 啟動時對帳：資料庫說 running、但容器不存在的 sandbox 要修正狀態
X>   platform:
X>     stop_grace_period: 60s
X>     volumes:
X>       - /var/run/docker.sock:/var/run/docker.sock
X> # Python：接住 SIGTERM
X> signal.signal(signal.SIGTERM, lambda *_: pause_all_and_exit())
?mc docker compose down 時，平台來不及 pause 所有 sandbox 就被殺掉。最可能的原因？
+ 預設只等 10 秒就送 SIGKILL，要調高 stop_grace_period，並確保程式有處理 SIGTERM
- 平台沒有掛 docker.sock
- volume 太大
- 平台用的是 alpine image
E> 若 CMD 是 shell form，平台甚至收不到 SIGTERM（PID 1 問題）。
?mc resume 時為什麼不用 docker start 重新啟動原本的容器？
+ pause 時容器已被刪除；規格要求 resume 建立新容器，只有 /workspace 保留
- docker start 不能用在 sandbox
- 原本的容器 ID 會衝突
- docker start 需要 root
E> 新容器會有新的 container ID，所以資料庫要用自己的 sandbox_id 追蹤。
?tf close 一個 sandbox 時，應該連 /workspace 的 volume 一起刪除。
=T
E> Close：Delete the container and the kept content。

@CARD hw3.p_sbxnet | 實作：怎麼讓 sandbox 的流量只能走平台
A> 讓 sandbox 住在一座「只有一座橋的島」上：島（internal 網路）本身不通外面，唯一的橋就是平台容器。sandbox 的預設路由和 DNS 都指向平台；平台不幫忙轉送封包，只把 80、443、53 的連線「攔下來交給自己的 proxy 和 DNS」，其他封包自然就到不了任何地方。
B> sandbox 只接 **internal 網路**（沒有對外路由）；平台同時接 internal 網路與一般網路
B> DNS：建立容器時 **Dns=[平台 IP]**；預設路由：由有 NET_ADMIN 的輔助容器 **--network container:<sbx>** 執行 **ip route replace default via 平台 IP**（sandbox 本身沒有 NET_ADMIN 改不回來）
B> 平台容器（需 **NET_ADMIN**）：**ip_forward 關閉**（不轉送）；iptables **REDIRECT** 把 tcp/80、tcp/443 導到 HTTP / HTTPS proxy，udp+tcp/53 導到 DNS
B> 其他流量：沒有被 REDIRECT、也不轉送 → 被丟棄（也可明確 DROP）
B> proxy 依 Host / SNI 自己用平台 DNS 解析再連線；用來源 IP 對應到 sandbox_id 以記錄事件
X> # 平台容器內
X> sysctl -w net.ipv4.ip_forward=0
X> iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 80  -j REDIRECT --to-ports 8080
X> iptables -t nat -A PREROUTING -i eth1 -p tcp --dport 443 -j REDIRECT --to-ports 8443
X> iptables -t nat -A PREROUTING -i eth1 -p udp --dport 53  -j REDIRECT --to-ports 5353
?mc 平台容器把 ip_forward 關閉的目的？
+ 平台不會替 sandbox 轉送任何封包，只有被 REDIRECT 給 proxy / DNS 的連線能出去
- 讓 DNS 查詢變快
- 防止平台被 OOM kill
- 讓 sandbox 可以直接上網
E> 所有對外連線都必須由平台的程式代為發出，才能檢查與記錄。
?mc iptables 的 REDIRECT 目標做了什麼？
+ 把封包的目的地改成本機的指定 port，讓本機程式（proxy）接手這條連線
- 把封包丟棄
- 把封包轉送到另一台主機
- 加密封包
E> 透明代理的常見做法，用戶端不需要設定 proxy。
?mc 平台如何知道某個連線來自哪個 sandbox？
+ 依連線的來源 IP，對照每個 sandbox 容器在 internal 網路上的 IP
- 依 HTTP User-Agent
- 依 TLS 的 SNI
- 依 DNS 查詢的內容
E> 建立容器後用 inspect 取得 IP，存進對照表。

@CARD hw3.p_mitmimpl | 實作：HTTPS 攔截 proxy 的流程
A> 攔截 HTTPS 的順序很重要：先偷看信封上的收件人（ClientHello 的 SNI），檢查名單、去真正的網站驗證身分與黑名單；確認沒問題，才用自己的印章臨時做一張該網站的證件給 sandbox。上游驗證失敗，就直接在握手時回一個 TLS alert 拒絕。
B> ① 讀 **ClientHello 的 SNI**（還沒解密）→ 不在 allowlist、或是 IP → 記錄 block event 並斷線
B> ② 用平台 DNS 解析 SNI、連到真網站，以 **VM 信任的 CA**（例如掛入 host 的 /etc/ssl/certs/ca-certificates.crt）驗證憑證鏈與主機名
B> ③ 檢查撤銷：從憑證的 **CRL Distribution Points** 下載 CRL、**每 60 秒內更新**、檢查**整條鏈**（Python：**ssl.VERIFY_CRL_CHECK_CHAIN** 並載入 CRL）
B> ④ 通過後，以**攔截 CA** 即時簽一張 **SAN = SNI** 的憑證（依 SNI 快取），完成與 sandbox 的握手；失敗則送 **TLS alert** 並記錄 tls_invalid / tls_revoked
B> ⑤ 解密後逐一轉送 request：同一條連線上的**每個 request 各記一筆 event**；body 去掉 chunked、保留 Content-Encoding、base64
?ord 攔截一條 sandbox 的 HTTPS 連線，合理的處理順序：
> 讀取 ClientHello 中的 SNI 並檢查 allowlist
> 解析 SNI、連到真網站並驗證憑證與 CRL
> 以攔截 CA 簽發 SAN 為該網域的憑證，完成與 sandbox 的握手
> 轉送並記錄每一個 HTTP request 與 response
E> 先驗上游，才能在上游有問題時，用 TLS alert 拒絕 sandbox。
?mc 為什麼平台要用「VM 信任的 CA」來驗證真網站，而不是 sandbox 裡的 CA？
+ sandbox 可以被 agent 任意修改（例如加入惡意 CA），平台的判斷不能依賴它
- sandbox 裡沒有任何 CA
- VM 的 CA 比較新
- 規格沒有理由
E> 平台是信任邊界，要用自己可控的信任清單。
?mc CRL 是什麼？
+ CA 定期發布的「已撤銷憑證序號清單」，用來判斷憑證是否被撤銷
- 憑證的申請檔
- 加密用的對稱金鑰
- DNS 的記錄類型
E> 另一種機制是 OCSP（即時詢問 CA）；HW3 指定用 CRL。

@CARD hw3.p_dnsimpl | 實作：平台 DNS 伺服器
A> 平台的 DNS 是「只轉接特定號碼的總機」：收到查詢先看名字是不是 ta.cs.nycu 家族，是就轉給 TA 的 DNS 並原封不動回覆，不是就回 NXDOMAIN。每通電話都要記錄成 event，並且即時檢查三條告警規則。
B> 判斷 allowlist：qname **轉小寫、去掉結尾的 .**，等於 ta.cs.nycu 或以 **.ta.cs.nycu** 結尾（注意 evilta.cs.nycu 不算）
B> 轉送到 **192.168.255.66**，把回應（含 rcode）原樣回給 sandbox；不在名單 → **NXDOMAIN**、verdict block、answers []
B> event detail：qname、**qtype**（A、AAAA、TXT…）、**rcode**（NOERROR、NXDOMAIN、SERVFAIL）、answers（name、type、ttl、data 用 **dig 的 RDATA 格式**）
B> RDATA 例：A → 192.168.255.10；CNAME → target.example.；TXT → "text"；MX → 10 mail.example.
B> 告警：label > 40 字元 → dns_long_label；qtype TXT → dns_txt；同 sandbox 10 秒內第 21 次 → dns_burst（之後冷卻 10 秒）
B> 實作工具：Python dnslib、Go miekg/dns，或 CoreDNS 加外掛
X> def allowed(q):
X>     q = q.lower().rstrip('.')
X>     return q == 'ta.cs.nycu' or q.endswith('.ta.cs.nycu')
?mc 用 q.endswith('ta.cs.nycu') 判斷 allowlist 有什麼漏洞？
+ evilta.cs.nycu 這種名稱也會通過；應檢查等於 ta.cs.nycu 或以 .ta.cs.nycu 結尾
- 大小寫不同的名稱會被擋
- 結尾有 . 的名稱會通過
- 沒有漏洞
E> 網域比對要以 label 為單位。
?mc dns event 中 qname 應記錄成？
+ 小寫、去掉結尾的點，例如 llm.ta.cs.nycu
- 原樣保留大小寫與結尾的點
- 只記錄第一個 label
- 轉成 IP
E> 規格：qname (lowercase, no trailing .)。
?mc 某個 allowlist 中的名稱，TA DNS 回應 NXDOMAIN。這筆 dns event 的 verdict 應該是？
+ allow（轉送的查詢一律 allow，不論 rcode）
- block
- 不需要記錄
- error
E> 規格：Forwarded queries: verdict is allow, whatever the rcode。

@CARD hw3.p_falcoimpl | 實作：用 Falco 寫 syscall 規則
A> Falco 在 kernel 裡裝了「監視器」（eBPF），每個 syscall 都會被看到。規則就是「什麼條件要報警」：哪個 syscall、開了哪個檔、是誰（哪個容器、哪個指令）。平台再把 Falco 的警報對應到 sandbox，寫成 syscall event 並轉發 alert。
B> 部署：在 host 上或特權容器中執行，driver 用 **modern eBPF**；輸出 **JSON**，用 **http_output**（或 program_output、falcosidekick）送給平台
B> 規則結構：**rule、desc、condition、output、priority**；常用 macro：**open_read**、**open_write**、**spawned_process**
B> 常用欄位：**evt.type**（openat、unlinkat、renameat2、fchmodat、truncate…）、**fd.name**、**proc.exepath**（實際執行檔，已解析 symlink）、**proc.cmdline**、**proc.pcmdline**、**container.id**
B> 只監看 sandbox：condition 加 **container.name startswith "sbx-"** 或對照 container.id
B> 用 syscall 層判斷，才能抓到 cat、python、dd、重導向（> 會以 O_TRUNC 開檔）等各種做法
X> - rule: sandbox read sensitive file
X>   condition: >
X>     open_read and container.name startswith "sbx-" and
X>     (fd.name in (/etc/shadow, /etc/gshadow, /etc/sudoers, /root/.bash_history, /proc/1/environ)
X>      or fd.name startswith /run/secrets/ or fd.name startswith /etc/ssl/private/)
X>   output: "path=%fd.name cmd=%proc.cmdline container=%container.id"
X>   priority: WARNING
?mc 執行 /usr/bin/nc（是指向 nc.openbsd 的 symlink），要記錄「symlink 解析後」的執行檔路徑，應該用哪個 Falco 欄位？
+ proc.exepath
- proc.name
- fd.name
- evt.type
E> 規格：path 是 File run by execve, symlinks resolved。
?mc 用 echo > /root/.bash_history 清除歷史，在 syscall 層看起來是什麼？
+ 以寫入並截斷（O_TRUNC）的方式 open 該檔案
- execve 一個名為 echo 的檔案
- unlink 該檔案
- 不會產生任何 syscall
E> shell 的重導向由 shell 自己 open 檔案，echo 是 builtin。
?mt 配對 Falco 規則欄位：
> condition :: 觸發條件
> output :: 警報訊息格式（可帶 %欄位）
> priority :: 嚴重程度
> macro :: 可重用的條件片段（如 open_read）
E> Falco 內建規則檔定義了很多 macro 與 list，自訂規則可以直接引用。

@CARD hw3.p_eventsql | 實作：events 資料表與查詢
A> events 表是平台的「黑盒子」，所有網路、DNS、LLM、syscall 事件都寫在這裡。固定欄位放查詢常用的（誰、何時、哪類、結果），各類型的細節放在 jsonb 的 detail 中，彈性又能查。
B> 建表：**id uuid PRIMARY KEY DEFAULT gen_random_uuid()**、sandbox_id uuid、**time timestamptz**、type text、verdict text、**detail jsonb**
B> **timestamptz**：帶時區、存成 UTC，輸出可轉成 RFC 3339；不要用不帶時區的 timestamp
B> 加 CHECK：type IN ('network','llm','dns','syscall')、verdict IN ('allow','block')
B> 索引：**(sandbox_id, time)**；常查 detail 的欄位可建 **GIN 索引**
B> jsonb 查詢：**detail->>'host'**（文字）、**detail->'answers'**（jsonb）、**detail @> '{"rule":"pipe_to_shell"}'**（包含）
X> CREATE TABLE events (
X>   id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
X>   sandbox_id uuid NOT NULL,
X>   time timestamptz NOT NULL,
X>   type text NOT NULL CHECK (type IN ('network','llm','dns','syscall')),
X>   verdict text NOT NULL CHECK (verdict IN ('allow','block')),
X>   detail jsonb NOT NULL
X> );
X> CREATE INDEX ON events (sandbox_id, time);
X> SELECT count(*) FROM events WHERE type='syscall' AND detail @> '{"rule":"tmp_script"}';
?mc 為什麼 time 欄位建議用 timestamptz 而不是 timestamp？
+ timestamptz 會正確處理時區（內部存 UTC），輸出 RFC 3339 時不會因伺服器時區設定而出錯
- timestamptz 比較省空間
- timestamp 不能排序
- PostgreSQL 18 移除了 timestamp
E> 輸出時用 to_char 或在程式中格式化成 2026-12-01T10:00:05+08:00 的 RFC 3339 格式。
?fill 查詢 detail 中包含 {"rule":"dns_txt"} 的事件，jsonb 的「包含」運算子是 detail ＿＿ '{"rule":"dns_txt"}'
= @>
E> @> 可以搭配 GIN 索引加速。
?cmd 在 PostgreSQL 中產生一個隨機 UUID（SQL）：
= SELECT gen_random_uuid();
= select gen_random_uuid();
= SELECT gen_random_uuid()
E> PostgreSQL 13 起內建，不需要擴充套件。

@CARD hw3.p_promimpl | 實作：Prometheus 設定與 /metrics 格式
A> Prometheus 抄表時是「在 Docker 網路裡直接走到每台機器旁邊」，用服務名稱當地址，而不是繞到大門（NGINX）。它自己的網頁也要上鎖：用 web.config.file 設 basic auth，密碼存 bcrypt 雜湊。
B> **prometheus.yml**：global **scrape_interval: 15s**；scrape_configs 每個 job 寫 **basic_auth**（username sa、password {STU_ID}）與 **targets**（用 compose 服務名稱，例如 ipsrv1:8000）
B> Prometheus 網頁的 basic auth：**--web.config.file=web.yml**，內容 **basic_auth_users: { sa: <bcrypt 雜湊> }**（用 htpasswd -nBC 10 sa 產生）
B> 暴露格式：**# HELP**、**# TYPE x counter**、**x_total{label="v"} 123**；每個 target 會自動有 **up** 指標（1=抓得到）
B> 平台：**lmsp_sandboxes{status="running"}**（gauge，各狀態都輸出，0 也輸出）、**lmsp_executions_total{type="agent"}**（counter）
B> 檢查：Prometheus 網頁的 **Status → Targets**、或查詢 **up{job="ip-srv"}**
X> global: { scrape_interval: 15s }
X> scrape_configs:
X>   - job_name: llm-sandbox-platform
X>     basic_auth: { username: sa, password: "19" }
X>     static_configs: [ { targets: ['platform:8103'] } ]
X> # web.yml
X> basic_auth_users:
X>   sa: $2y$10$...
?mc Prometheus 的 target 寫成 127.0.0.1:8000，但 Prometheus 跑在容器裡，結果全部 down。原因？
+ 容器內的 127.0.0.1 是 Prometheus 容器自己，不是 host；應改用 compose 服務名稱
- IP-Srv 沒有 /metrics
- 15 秒太短
- 需要用 HTTPS
E> compose 網路中的服務名稱由 Docker 內建 DNS 解析。
?mc 查詢 up{job="ip-srv"} 得到三筆，其中一筆值為 0，代表？
+ 該 replica 這次沒有被成功 scrape（掛了、網路不通或認證失敗）
- 該 replica 處理了 0 個請求
- Prometheus 本身故障
- 該 replica 的 metric 型別錯誤
E> up 是 Prometheus 自動產生的指標，不是服務自己輸出的。
?mc /metrics 輸出的這行代表什麼：ip_srv_requests_total 42
+ counter 型別的指標，目前累計值是 42
- 每秒 42 個請求
- 42 個 replica
- 錯誤次數為 42
E> 要看速率得用 rate(ip_srv_requests_total[1m])。

@CARD hw3.p_otelimpl | 實作：把 log 與 trace 送到 OTLP collector
A> 兩條管線：NGINX 的 access log 交給 OpenTelemetry Collector「讀檔、拆欄位、加上 service.name、用 client 憑證送出」；平台則直接在程式裡用 OpenTelemetry SDK 產生 log 和 span，透過環境變數設定送去哪裡、用哪張憑證。
B> NGINX：**log_format … escape=json** 輸出 JSON（status 不加引號就是數字），或用一般格式再以 regex 解析；只寫入 access.log 的請求才會被送出（sa-probe 已被 if= 排除）
B> Collector（contrib 版）：**filelog** receiver 讀 /home/judge/hw3/logs/access.log → 解析出 sa.uri、sa.host、sa.method、sa.user_agent、**sa.status（整數）**，**body 保留原始那一行** → resource 加 **service.name=nginx** → **otlphttp** exporter
B> exporter TLS：**cert_file**（client 憑證 + intermediate）、**key_file**、**ca_file**（驗證 collector 的 CA）
B> 平台 SDK 環境變數：**OTEL_SERVICE_NAME=llm-sandbox-platform**、**OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.ta.cs.nycu:4318**、**OTEL_EXPORTER_OTLP_CERTIFICATE**、**OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE**、**OTEL_EXPORTER_OTLP_CLIENT_KEY**
B> OTLP/HTTP 路徑：**/v1/logs**、**/v1/traces**、/v1/metrics；用 **batch** processor / BatchSpanProcessor 減少請求數
X> log_format sajson escape=json '{"uri":"$request_uri","host":"$host","method":"$request_method","ua":"$http_user_agent","status":$status}';
X> # otel collector
X> exporters:
X>   otlphttp:
X>     endpoint: https://otel.ta.cs.nycu:4318
X>     tls: { cert_file: /certs/otel-client.fullchain.crt, key_file: /certs/otel-client.key, ca_file: /certs/ta-root.crt }
?mc nginx 的 log_format 用 escape=json 並讓 "status":$status 不加引號，好處是？
+ 輸出合法 JSON，解析後 status 直接是數字，符合 sa.status 要求的整數型別
- log 檔比較小
- nginx 會自動把 log 送到 OTLP
- 可以不用 access_log 指令
E> escape=json 會把變數中的特殊字元正確跳脫，避免產生不合法的 JSON。
?fill OTLP/HTTP 上傳 trace 的路徑是 https://otel.ta.cs.nycu:4318/v1/＿＿
= traces
E> log 是 /v1/logs，metrics 是 /v1/metrics。
?mc 平台的 OpenTelemetry SDK 要用 client 憑證連 collector，應設定哪兩個環境變數？
+ OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE 與 OTEL_EXPORTER_OTLP_CLIENT_KEY
- OTEL_SERVICE_NAME 與 OTEL_RESOURCE_ATTRIBUTES
- SSL_CERT_FILE 與 REQUESTS_CA_BUNDLE
- OTEL_TRACES_SAMPLER 與 OTEL_LOGS_EXPORTER
E> OTEL_EXPORTER_OTLP_CERTIFICATE 則是用來驗證 collector 的 CA。

@CARD hw3.p_spans | 實作：span 的父子關係與時間
A> 一條 trace 是一次 API 請求的「行程表」。API 請求是起點（root span），途中每個 Docker 呼叫是它的子行程；execution 是背景任務，雖然是 API 請求派出去的（所以是它的子 span），但可以比 API 請求晚很多才結束；tool call 的起訖時間則來自 sallm-cli 事件裡的 time。
B> 每個 API 請求一條 trace：root span 名稱 = **方法 + route 樣板**（POST /api/sandboxes/{id}/executions，**不要**放實際 ID，避免基數爆炸）
B> Docker 呼叫：**CLIENT** span，名稱 **POST /containers/create** 等，parent 是發出呼叫的 span
B> execution：**INTERNAL** span，parent 是 API span，**可以比 parent 晚結束**（背景執行時要把 context 傳到背景工作）
B> tool call：從 tool_call 到相同 **call_id** 的 tool_result，**用事件中的 time 設定 start / end time**
B> 失敗：span status **ERROR**（並記錄例外）；log 帶 trace_id / span_id 對應產生它的 span
?mc root span 名稱為什麼用 /api/sandboxes/{id}/executions，而不是 /api/sandboxes/3f2b…/executions？
+ 用 route 樣板讓同類請求聚合在一起；放實際 ID 會讓名稱數量無限增加
- 實際 ID 是機密
- OpenTelemetry 不允許數字
- 為了讓 trace 比較短
E> 實際 ID 放在 lmsp.sandbox_id attribute。
?mc API 請求很快回應，但 execution 在背景跑了 5 分鐘。execution span 應該？
+ 仍以 API span 為 parent，在 execution 真正結束時才結束
- 跟 API span 一起結束
- 另開一條新的 trace
- 不需要 span
E> 規格：The execution span lasts from start to end and can end after the API request span。
?tf tool call span 的開始與結束時間，應該用 sallm-cli 事件中的 time，而不是平台讀到事件的時間。
=T
E> 這樣 span 的時間才反映 agent 實際呼叫工具的時刻。

@CARD hw3.p_alertimpl | 實作：告警的去重、冷卻與重送
A> 告警系統要拿捏「不漏報也不洗版」：每個符合的事件、每條規則各報一次；dns_burst 這種「流量型」規則要有冷卻時間；送 Alert API 失敗要重試，但不能因此卡住整個平台。
B> 一個事件符合多條規則 → **每條規則各送一個 alert**；JSON 的 **time 用事件發生的時間**（RFC 3339），不是送出的時間
B> dns_burst：每個 sandbox 用**滑動視窗**（例如 deque 存最近 10 秒的查詢時間）；第 21 次送出後進入 **10 秒冷卻**
B> 送出：**POST https://alert.ta.cs.nycu/api/alerts**，**Bearer token**，成功 **201**；失敗（網路錯誤、5xx）用**背景佇列 + 重試**，不要阻塞 proxy 或 DNS
B> token 從 files.ta.cs.nycu 取得後存成 secret，不要寫進 git
X> from collections import deque
X> win = {}           # sandbox_id -> deque of timestamps
X> def on_dns(sid, t):
X>     q = win.setdefault(sid, deque())
X>     q.append(t)
X>     while q and q[0] <= t - 10: q.popleft()
X>     if len(q) > 20 and t >= cooldown.get(sid, 0):
X>         send_alert(sid, 'dns', 'dns_burst', t); cooldown[sid] = t + 10
?mc 為什麼送 Alert API 應該放進背景佇列，而不是在處理 DNS 查詢時同步呼叫？
+ 外部 API 變慢或失敗時，同步呼叫會拖慢甚至卡住 sandbox 的 DNS 與網路
- Alert API 不接受同步請求
- 背景佇列可以讓 alert 變少
- 為了省記憶體
E> 把可能失敗或變慢的外部呼叫和主要的資料路徑分開，是常見的可靠性設計。
?mc alert JSON 中的 time 應該填？
+ 觸發 alert 的事件發生時間
- 送出 alert 的時間
- sandbox 建立時間
- 平台啟動時間
E> 規格：time is the event time in RFC 3339。

@CARD hw3.p_recovery | 實作：「什麼都會自己回來」的檢查清單
A> judge 會關容器、重啟 Docker、重開機。要做到「什麼都會自己回來」，每一層都要有人負責拉起來：systemd 拉 nginx 和 docker，docker 依 restart policy 拉容器，容器靠 volume 找回資料，服務之間靠 healthcheck 與重試等待彼此。
B> host 層：**systemctl enable nginx docker**；/etc/hosts、DNS、信任 CA 都是**持久設定**
B> 容器層：每個服務 **restart: unless-stopped**（或 always）；需要等待的用 **depends_on + condition: service_healthy**
B> 資料層：DB、Forgejo、Keycloak、Prometheus、平台的狀態都在 **volume / bind mount**；目前部署的版本 tag 寫在 **.env**
B> 程式層：連不上依賴時**重試**而不是直接結束；啟動時與資料庫**對帳**（例如 sandbox 狀態）
B> 實測：**docker compose down && docker compose up -d**、**systemctl restart docker**、**reboot** 三種都要測；用 **Ansible** 或腳本讓整套環境可重建
?mc 執行 systemctl restart docker 後，哪個設定讓容器自動回來？
+ 容器的 restart policy（always 或 unless-stopped）
- depends_on
- healthcheck
- docker compose 的 -d 選項
E> unless-stopped 時，若容器在重啟前是手動停止的，則不會自動回來。
?mc 平台啟動時 PostgreSQL 還沒準備好，平台直接 exit 1，之後也沒再起來。最合適的修正組合？
+ 平台內加入連線重試，並在 compose 用 depends_on condition: service_healthy 與 restart policy
- 把平台改成 Type=oneshot
- 拿掉 PostgreSQL 的 TLS
- 把兩個服務合併成一個容器
E> 依賴可能暫時不可用，服務要能自己等待並重試。
?tf 每次修改後只用 docker compose restart 測試，就能保證 down + up 之後也能正常運作。
=F
E> restart 不會重建容器；down + up 會刪除並重建，只有寫在 volume 和設定檔中的東西會留下。

@CARD ext1.imgsize | 縮小 Docker image
A> Image 是一層層疊起來的千層蛋糕，每一層一旦烤好就永遠在裡面，在後面一層「刪掉」前面的東西，蛋糕不會變輕。所以要：選小的底（slim/alpine）、同一層裡裝完就清垃圾、用 multi-stage 只把成品搬進新蛋糕、用 .dockerignore 不要把雜物帶進廚房。
B> 用較小的 **base image**：*-slim、alpine、distroless、scratch
B> **Multi-stage build**：編譯在 builder stage，最後 stage 只 COPY --from 成品
B> **合併 RUN 並在同一層清理**：apt-get install --no-install-recommends … && rm -rf /var/lib/apt/lists/*（在不同層刪除不會變小）
B> **.dockerignore** 排除 .git、node_modules、測試資料等不必要的 build context
B> 只安裝 runtime 需要的套件；移除 build 工具與快取（pip --no-cache-dir）
?sa 如何在維持相同功能狀況下減少 docker build 出來的 Docker image 大小？列出至少三種方式。
S> 2025 期末 Q5
R> ① 使用較小的 base image，例如 debian:trixie-slim、alpine、distroless 取代完整版 image。
R> ② 使用 multi-stage build：在前面的 stage 安裝編譯工具並 build，最後的 stage 只用乾淨的 runtime image 並 COPY --from=builder 需要的執行檔 / 產物，編譯器與原始碼不會留在最終 image。
R> ③ 減少 layer 並在同一個 RUN 中清理：把多個 RUN 合併，安裝後立即刪除套件快取（apt-get install --no-install-recommends … && rm -rf /var/lib/apt/lists/*、pip --no-cache-dir），因為在後面的 layer 刪除檔案不會讓前面 layer 變小。
R> ④ 使用 .dockerignore 排除不需要的檔案（.git、測試資料、node_modules），避免被 COPY 進 image。
R> ⑤ 只安裝必要套件、移除 build-time 依賴。
P> 較小的 base image
P> multi-stage build
P> 同一層 RUN 內清除快取 / 合併 layer
P> .dockerignore 或只裝必要套件
?mc 下列 Dockerfile 寫法，哪個無法讓最終 image 變小？
+ RUN apt-get install -y build-essential 之後，另起一行 RUN apt-get purge -y build-essential
- 在同一個 RUN 中安裝後 rm -rf /var/lib/apt/lists/*
- 改用 debian:trixie-slim
- 用 multi-stage 只複製編譯結果
E> 後面的 layer 刪除，前面 layer 的內容仍在 image 中。

@CARD ext1.multistage | Multi-stage build 的使用時機
A> Multi-stage 像「在工廠做好家具，只把成品搬進新家」：工廠裡的鋸子、刨木屑（編譯器、原始碼、dev 套件）都不會跟進家門。所以只要「建置時需要、執行時不需要」的東西很多，就適合用。
B> 適用：**build-time 依賴在 runtime 不需要**時
B> 例：編譯語言（C/C++、Go、Rust、Java）先編譯，最後只拷貝 binary / jar；前端專案 npm build 後只把靜態檔放進 nginx image
B> 好處：image 更小、攻擊面更小、不洩漏原始碼 / 建置憑證
X> FROM golang:1.23 AS builder
X> WORKDIR /src
X> COPY . .
X> RUN go build -o app
X> FROM debian:trixie-slim
X> COPY --from=builder /src/app /usr/local/bin/app
X> CMD ["app"]
?sa 在何種情況下可以在 docker build 時使用 multi-stage building 技巧？
S> 2025 期末 Q6
R> 當建置（build）過程需要的工具或依賴，在執行（runtime）時並不需要的情況。例如需要編譯器、SDK、dev headers 來編譯程式（C/Go/Rust/Java），或前端需要 Node.js 與 npm 套件來 build 靜態檔，但最後執行只需要編譯出的 binary 或靜態檔。這時可在第一個 stage 安裝工具並 build，最後的 stage 以精簡的 base image 並用 COPY --from=<stage> 只複製產物，最終 image 不含 build 工具與原始碼，更小也更安全。
P> build-time 需要但 runtime 不需要的依賴
P> 舉例（編譯型語言 / 前端 build）並說明只複製產物
?fill 在後面的 stage 從名為 builder 的 stage 複製檔案：COPY --from=＿＿ /src/app /app
= builder
E> AS 命名 stage，COPY --from 引用。

@CARD ext1.secrets | Docker：環境變數 vs secrets
A> 環境變數像「把密碼寫在名牌上」：方便，但任何能看你名牌的人（docker inspect、/proc/<pid>/environ、子程序、log）都看得到。Secret 像「放在只有你能開的保險箱」：以檔案形式掛在 /run/secrets/ 下的 tmpfs，只有被授權的服務拿得到。
B> **環境變數**：-e / --env-file / compose environment:；程式讀 $VAR；簡單通用
B> 風險：**docker inspect** 看得到、**/proc/<pid>/environ**、child process 繼承、可能被印進 log / crash dump；若寫在 Dockerfile **ENV** 會留在 image layer
B> **Secrets**（Swarm / Compose）：以**檔案**掛在 **/run/secrets/<name>**（記憶體 tmpfs），Swarm 中加密儲存與傳輸，只給被授權的 service；不出現在 inspect / 環境中
B> 限制：程式要支援從檔案讀（常見 *_FILE 慣例，如 POSTGRES_PASSWORD_FILE）；需要 Swarm / Compose；Swarm secret 不可變（輪替要建新的）、大小有上限（約 500KB）
?sa 在 Docker 容器中設定機敏資料（例如資料庫密碼）時，可以使用環境變數或 secrets，請從使用方式、安全性以及限制三個方面分析兩者的不同。
S> 2025 期末 Q23
R> 使用方式：環境變數透過 docker run -e、--env-file 或 compose 的 environment: 設定，程式直接讀環境變數；secrets 透過 Docker Swarm 或 Compose 的 secrets: 定義並指派給 service，在容器中以檔案形式出現在 /run/secrets/<name>，程式要去讀檔（很多官方 image 支援 XXX_FILE 變數指定檔案路徑）。
R> 安全性：環境變數是明文存在 container 設定中，docker inspect、/proc/<pid>/environ 都看得到，會被所有子程序繼承，也容易被意外印到 log 或錯誤報告；寫在 Dockerfile ENV 甚至會留在 image layer。Secrets 不會出現在 inspect 與環境變數中，以 tmpfs（記憶體）掛載、不落地，Swarm 中在 Raft log 加密、傳輸加密，只有被授權的 service 能存取。
R> 限制：環境變數幾乎所有程式都支援、最簡單，但不適合高敏感資料；secrets 需要 Swarm 或 Compose 支援（單純 docker run 沒有）、程式必須支援從檔案讀取、Swarm secret 建立後不可修改（要輪替需建新 secret 並更新 service）、大小有上限。
P> 使用方式：env 透過 -e/environment；secret 以檔案 /run/secrets 提供
P> 安全性：env 可被 inspect / proc / log 洩漏；secret 不在環境中、tmpfs、加密、限定 service
P> 限制：secret 需 Swarm/Compose、程式要讀檔、不可變等
?fill Docker secret 在容器內預設以檔案出現在 /run/＿＿/<name>
= secrets
E> /run/secrets/。

@CARD ext1.compose | Docker Compose 網路與服務名稱解析
A> Compose 幫你的專案開一個「私人社區網路」（user-defined bridge），社區裡有一位內建的「管理員」（Docker embedded DNS，127.0.0.11）。你喊「db」，管理員就告訴你 db 那個 container 在社區裡的 IP。
B> Compose 預設為專案建立一個 **user-defined bridge network**（<project>_default）
B> user-defined network 有 **Docker 內建 DNS server（127.0.0.11）**，把 **service 名稱**（以及 container 名稱、alias）解析成 container 的 IP
B> 拿到的是該 container 在**這個 Compose 網路上的內部 IP**（不是 host IP、不是 published port）；scale 多個副本時解析到多個 IP
B> 預設的 docker0 bridge（沒用 Compose 的 docker run）**沒有**這種名稱解析
?sa 在 Docker Compose 預設的 bridge network 中，不同的 service 之間為何可以使用 hostname 連線？使用 hostname 連線時他們會拿到哪個 IP？
S> 2025 期末 Q26
R> Compose 會為專案建立一個 user-defined bridge network，並把每個 service 的 container 接上去、以 service 名稱註冊為網路別名。Docker 在 user-defined network 上提供內建 DNS server（容器內的 127.0.0.11），容器查詢其他 service 的名稱時，由它解析，所以可以直接用 service 名稱當 hostname 連線。
R> 解析得到的是目標 container 在這個 Compose 網路上的內部（私有）IP，例如 172.18.0.x，而不是 host 的 IP 或對外 publish 的 port；若該 service 有多個副本則會回傳多個 container IP。
P> Compose 建立 user-defined bridge，Docker embedded DNS 解析 service 名稱
P> 拿到目標 container 在該網路的內部 IP
?tf 在 Compose 中，web 服務連 db:5432 時，需要先把 db 的 5432 用 -p publish 到 host。
=F
E> 同一個 Compose 網路內直接用內部 IP 與 container port 溝通，不需 publish。

@CARD ext1.nfsiscsi | NFS vs iSCSI
A> NFS 是「共享資料夾」：伺服器管檔案系統，大家用網路來拿「檔案」，可以多人同時存取；iSCSI 是「用網路線接一顆硬碟」：伺服器只提供「一整塊空白的區塊裝置」，client 自己格式化、自己管檔案系統，通常一次只給一台用（否則檔案系統會壞）。
B> **NFS**：**檔案層級（file-level）**共享；檔案系統在 server 端；多個 client 可**同時掛載**存取同一批檔案；權限 / 鎖由 server 處理
B> **iSCSI**：**區塊層級（block-level）**，把 SCSI 指令封裝在 TCP/IP 中；client（initiator）看到的是一顆 **raw 磁碟**（target 的 LUN），自己 mkfs、自己管檔案系統；一般**不可多台同時掛載**一般檔案系統（除非用 cluster FS）
B> 適用：NFS → 多台主機共享家目錄、共用資料夾、web 叢集共用靜態檔；iSCSI → VM 磁碟映像、資料庫儲存、需要區塊裝置 / 開機磁碟、較好的效能
?sa 請比較並說明 2 點 NFS 與 iSCSI 的差異，並分別舉例說明什麼情況適合使用它們。
S> 2025 期末 Q9
R> 差異 1（層級）：NFS 是檔案層級的網路檔案系統，server 管理檔案系統，client 透過網路存取「檔案」；iSCSI 是區塊層級協定，把 SCSI 指令封裝在 TCP/IP 上，client 看到的是一顆原始磁碟（block device），由 client 自己建立與管理檔案系統。
R> 差異 2（共享性）：NFS 天生支援多個 client 同時掛載並存取同一批檔案，鎖與權限由 server 協調；iSCSI 的 LUN 通常只給一台主機使用，多台同時掛載一般檔案系統（ext4 等）會造成資料損毀，除非使用 cluster filesystem。
R> （其他差異：iSCSI 效能較接近本機磁碟、可當開機碟；NFS 設定簡單、可直接在 server 端備份檔案。）
R> 適用情境：NFS 適合多台機器共享家目錄、共用資料夾、web 叢集共享靜態檔案；iSCSI 適合需要專屬區塊裝置的情況，例如 VM 的虛擬磁碟、資料庫的儲存空間、無碟主機的開機磁碟。
P> 檔案層級 vs 區塊層級
P> 多 client 共享 vs 通常單一主機獨占（client 自己管 FS）
P> NFS 適用情境舉例
P> iSCSI 適用情境舉例
?mt 配對 NFS / iSCSI：
> client 看到一顆 raw 磁碟，自己 mkfs :: iSCSI
> 多台主機同時掛載共享檔案 :: NFS
> 檔案系統由 server 管理 :: NFS
> 適合當 VM 的虛擬磁碟 :: iSCSI
E> file-level vs block-level。

@CARD ext1.acme | ACME http-01 challenge
A> 證明「這個網址是我的」：CA 給你一個暗號（token），你把寫著暗號 + 你帳號指紋的紙條貼在自己網站的指定位置（/.well-known/acme-challenge/<token>），CA 從外面連過來看，看到了就相信網站是你在控制。
B> ACME client（如 Certbot）向 CA（Let's Encrypt）下單，CA 給 **token**
B> client 在網站放檔案：**http://<domain>/.well-known/acme-challenge/<token>**，內容為 **key authorization**（token + 帳號公鑰 thumbprint）
B> CA 透過 **HTTP port 80** 對該網域發出請求；內容正確 → 證明控制該網域的 web server → 簽發憑證
B> http-01 **不支援 wildcard（*.example.com）**：它只能驗證「某一個特定 hostname」能被連到，無法證明你控制整個網域底下所有子網域；Let's Encrypt 規定 wildcard 必須用 **dns-01**（在 _acme-challenge.<domain> 放 TXT record，證明控制 DNS zone）
?sa 請簡單說明 ACME http-01 challenge 的核心運作原理。ACME client（例如 Certbot）該如何證明它擁有某個特定網域的控制權？
S> 2025 期末 Q24
R> ACME client 向 CA 申請某網域的憑證時，CA 會發出一個 http-01 challenge，內含隨機 token。Client 要在該網域的 web server 上，把內容為 key authorization（token 加上 ACME 帳號公鑰的 thumbprint）的檔案放在 http://<domain>/.well-known/acme-challenge/<token>，然後通知 CA 可以驗證。
R> CA 從多個網路位置透過 HTTP（port 80）去存取這個 URL，若取得的內容與預期相符，就證明申請者能控制該網域所指向的 web server，因此擁有該網域的控制權，CA 便簽發憑證。
P> CA 發 token；client 放檔案到 /.well-known/acme-challenge/<token>
P> 內容為 key authorization（token + 帳號金鑰 thumbprint）
P> CA 經 HTTP 80 存取驗證，成功即證明控制權
?sa 為什麼 ACME http-01 challenge 沒辦法支援萬用字元憑證（wildcard certificate）？
S> 2025 期末 Q25
R> http-01 是由 CA 對「一個具體的 hostname」發出 HTTP 請求來驗證，只能證明你控制該 hostname 所指向的那台 web server。Wildcard 憑證 *.example.com 涵蓋的是無限多個（甚至尚未存在的）子網域，CA 無法對 * 發出 HTTP 請求，也無法逐一驗證所有子網域；能控制某台 web server 並不代表能控制整個網域。
R> 要證明擁有整個網域的控制權，必須證明能修改該網域的 DNS，因此 ACME（Let's Encrypt）規定 wildcard 憑證只能使用 dns-01 challenge（在 _acme-challenge.example.com 放指定的 TXT record）。
P> http-01 只能驗證特定 hostname 的 web server
P> wildcard 涵蓋無限子網域，無法用 HTTP 驗證，需證明控制整個 DNS zone
P> 必須改用 dns-01
?mc 想申請 *.example.com 的 Let's Encrypt 憑證，必須使用哪種 challenge？
+ dns-01
- http-01
- tls-alpn-01
- 任何一種都可以
E> wildcard 需要 dns-01。

@CARD ext1.oauth | OAuth2 client credentials 與 OIDC discovery
A> Client credentials flow 是「機器對機器的員工證」：沒有使用者在場，服務直接拿自己的帳號密碼（client_id / client_secret）去櫃台（token endpoint）換一張通行證（access token）。OIDC 的 /.well-known/openid-configuration 是「這家認證中心的服務目錄」，client 讀它就知道該去哪個窗口辦事。
B> **Client credentials flow**：**machine-to-machine**，沒有使用者參與；client 以 **client_id + client_secret**（或 private key JWT）直接向 **token endpoint** 送 grant_type=client_credentials，取得 **access token** 去呼叫 API；通常沒有 refresh token
B> **OIDC discovery**：GET **/.well-known/openid-configuration** 回傳 JSON metadata，讓 client 自動設定
B> 可取得：**issuer**、**authorization_endpoint**、**token_endpoint**、**userinfo_endpoint**、**jwks_uri**（驗 ID token 簽章的公鑰）、scopes_supported、response_types_supported、grant_types_supported、id_token_signing_alg_values_supported、end_session_endpoint
?sa 請說明 OpenID Provider 的 /.well-known/openid-configuration 有何作用？並列出三種可以從該端點獲取的資訊。
S> 2025 期末 Q27
R> 這是 OpenID Connect 的 discovery 端點，回傳一份 JSON 格式的 provider metadata，讓 client（Relying Party）不用手動寫死各種 URL 與設定，只要知道 issuer 就能自動探索並設定與該 OpenID Provider 互動所需的資訊。
R> 可取得的資訊例如：issuer（發行者識別）、authorization_endpoint（授權端點）、token_endpoint（換 token 的端點）、userinfo_endpoint（取得使用者資訊）、jwks_uri（驗證 ID token 簽章用的公鑰集合）、scopes_supported、response_types_supported、grant_types_supported、id_token_signing_alg_values_supported。
P> 作用：discovery，提供 metadata 讓 client 自動設定
P> 列出三項正確資訊（如 authorization / token endpoint、jwks_uri、issuer）
?sa 請簡單說明 OAuth2 中的 client credentials flow。
S> 2025 期末 Q28
R> Client credentials flow 用於機器對機器（服務對服務）的授權，沒有終端使用者參與。Client 事先在授權伺服器註冊取得 client_id 與 client_secret；需要存取 API 時，直接向授權伺服器的 token endpoint 發送請求（grant_type=client_credentials，附上 client 認證與要求的 scope），授權伺服器驗證 client 身分後回傳 access token，client 再帶著這個 access token 去呼叫 resource server 的 API。權限代表的是 client 本身而非某位使用者，通常不發 refresh token。
P> machine-to-machine，沒有使用者
P> client_id / secret 直接到 token endpoint 換 access token
P> 用 access token 存取 API
?mt 配對 OIDC metadata 欄位：
> token_endpoint :: 用授權碼或 client 憑證換取 token 的位置
> jwks_uri :: 驗證簽章用的公鑰集合
> authorization_endpoint :: 導向使用者登入 / 授權的位置
> issuer :: Provider 的識別字串
E> 這些都在 /.well-known/openid-configuration 中。

@CARD ext1.tls | TLS 與 CA
A> TLS 握手像「先用掛號信（非對稱加密，慢但不怕被偷看）交換一把保險箱鑰匙，之後就用這把鑰匙（對稱加密，快）傳所有東西」。向 CA 申請憑證時，你交出的是公鑰（裝在 CSR 裡）與身分證明，私鑰永遠只留在自己手上。
B> TLS **建立連線（handshake）** 用 **非對稱加密** / 金鑰交換（RSA、(EC)DHE）與憑證驗證身分 → 協商出 **session key**
B> 之後的資料傳輸用**對稱加密**（AES、ChaCha20），因為快
B> 向 CA 申請憑證要提供：**公鑰**（包在 **CSR 憑證請求檔**中）、**身分證明文件**（OV/EV）；**絕不提供私鑰**
?mc TLS/SSL「建立連線時（handshake）」使用的是哪一種加密方式？
+ 非對稱式加密（交換 / 協商對稱金鑰並驗證身分）
- 對稱式加密
- 未加密
- 以上皆非
S> 2023 期末 Q2
E> 握手階段用非對稱（公鑰）機制，之後的資料傳輸才用協商出的對稱金鑰。
?mc 下列哪一個「不是」向 CA 申請憑證所需提供的資訊？
+ 私鑰
- 公鑰
- 憑證請求檔（CSR）
- 身分（公司、組織）證明文件
S> 2023 期末 Q3
E> 私鑰永遠不離開自己的伺服器；CSR 內含公鑰。

@CARD ext1.http | HTTP/2 與 HTTP/3
A> HTTP/1.1 像「一條單線道，前面的車卡住後面全部等」；HTTP/2 把一條 TCP 連線切成很多「虛擬車道」（multiplexing streams），還把標頭壓縮；但底下的 TCP 掉一個封包，所有車道還是一起等。HTTP/3 改走 QUIC（UDP 上），每條車道獨立，掉包只影響自己那條，而且握手更快。
B> **HTTP/2**：**Multiplexing**（單一 TCP 連線上多個 stream 並行，解決 HTTP 層 head-of-line blocking）、**HPACK header compression**、**binary framing**、server push、stream priority
B> **HTTP/3**：跑在 **QUIC（UDP）** 上 → 消除 **TCP 層的 head-of-line blocking**（stream 獨立）、**TLS 1.3 整合**，握手 1-RTT / **0-RTT**、**connection migration**（以 connection ID 識別，換網路不斷線）
?sa A. 請舉出 1 個 HTTP/2 相較於 HTTP/1.1 的新特色，並說明運作機制。 B. 請舉出 1 個 HTTP/3 相較於 HTTP/2 的新特色，並說明運作機制。
S> 2023 期末 Q15
R> A. Multiplexing：HTTP/1.1 一條連線同時只能處理一個 request/response（後面的要排隊，或開多條連線）；HTTP/2 把訊息切成 binary frame，每個 request/response 屬於一個 stream，多個 stream 的 frame 可在同一條 TCP 連線上交錯傳送，再依 stream ID 重組，解決 HTTP 層的 head-of-line blocking。（亦可答 HPACK 標頭壓縮：用靜態 / 動態表與 Huffman 編碼壓縮重複的 header。）
R> B. 改用 QUIC（基於 UDP）：HTTP/2 雖然多工，但底層 TCP 只要掉一個封包，所有 stream 都要等重傳（TCP head-of-line blocking）；QUIC 在 UDP 上自己實作可靠傳輸，每個 stream 獨立排序與重傳，一個 stream 掉包不影響其他 stream。另外 QUIC 整合 TLS 1.3，握手只需 1-RTT（甚至 0-RTT），並以 connection ID 支援 connection migration（換 Wi-Fi/4G 不斷線）。
P> A. 正確舉出特色（multiplexing / header compression / binary framing / server push）並說明機制
P> B. 正確舉出 HTTP/3 特色（QUIC/UDP、無 TCP HOL、0-RTT、connection migration）並說明機制
?mt 配對：
> HTTP/2 :: 單一 TCP 連線多工 + HPACK
> HTTP/3 :: QUIC over UDP，stream 獨立
> HTTP/1.1 :: 一條連線一次一個 request（或 pipelining 但有 HOL）
E> HTTP/3 解決的是 TCP 層 HOL。

@CARD ext1.vhost | Virtual Host
A> 一棟大樓（一個 IP）住很多家公司（網站）：訪客在門口報上公司名稱（HTTP Host header），管理員就帶他去對的樓層 → name-based；另一種是每家公司有自己的大門（每個網站一個 IP）→ IP-based。IPv4 很貴，所以租屋業者（虛擬主機商）都用 name-based。
B> Web server 看 **HTTP Host header**（HTTP/1.1 必備）決定要回哪個網站 → **name-based virtual host**
B> **Name-based**：多個網域共用**同一個 IP**，以 Host header 區分；HTTPS 時靠 **SNI**（TLS ClientHello 帶 hostname）選憑證
B> **IP-based**：每個網站綁**不同 IP**；不需 Host header，但耗用 IP
B> 網頁代管通常用 **name-based**：IPv4 位址稀少昂貴、管理方便、可在一台機器上放大量網站
?sa A. Web Server 是識別 HTTP header 中的哪項資訊以提供 Name-based Virtual Hosting？ B. 請說明 Name-based Virtual Host 與 IP-based Virtual Host 的差異。 C. 網頁代管服務通常會採用哪一種技術？為什麼？
S> 2023 期末 Q17
R> A. Host header（例如 Host: www.example.com）。
R> B. Name-based：多個網站共用同一個 IP 與 port，web server 依 request 中的 Host header（HTTPS 則依 TLS 的 SNI）判斷要提供哪個網站。IP-based：每個網站綁定不同的 IP 位址，server 依連線進來的目的 IP 決定網站，不需依賴 Host header。
R> C. 通常採用 name-based，因為 IPv4 位址稀少且昂貴，name-based 可以讓大量網站共用一個 IP，節省位址、設定與擴充也較方便；現代瀏覽器都支援 Host header 與 SNI，所以沒有相容性問題。
P> A. Host header
P> B. 共用 IP 依 Host 區分 vs 每站獨立 IP
P> C. name-based，節省 IPv4 位址

@CARD ext2.syslog | syslog：facility.level 與 selector
A> syslog 的每則訊息貼著兩張標籤：「哪個部門」（facility：kern、auth、mail、local0-7…）和「多嚴重」（level：debug < info < notice < warning < err < crit < alert < emerg）。syslog.conf 每行是「挑選條件 → 送去哪」；facility.level 表示「這個等級以上（含）」，.none 表示「排除這個部門」。
B> Level 由低到高：**debug < info < notice < warning < err < crit < alert < emerg**
B> selector **facility.level** = 該 facility **level 以上（含）**的訊息；**\*** 所有 facility；**facility.none** 排除該 facility
B> 一行用 **;** 串多個 selector，逗號 **,** 列多個 facility 共用 level；後面的 selector 可以覆寫前面（如 .none 排除）
B> 動作：檔案路徑、**@loghost** 送到遠端 syslog 主機、**使用者名稱**（寫到該使用者的 terminal）、/dev/console
B> **logger -p facility.level "msg"**：手動送 log 測試設定
M> 「低 (debug) 呦 (info) 你 (notice) 我 (warning) 惹 (err) 錯 (crit) 啊 (alert) 嗯 (emerg)」由輕到重
?ord syslog level 由「最不嚴重」到「最嚴重」排列：
> debug
> info
> notice
> warning
> err
> crit
> alert
> emerg
E> facility.level 選取該等級以上。
?mc 下列哪一個命令列程式可對 syslog 發送日誌訊息，以測試 syslog 設定是否正確？
+ logger
- syslogd

?sa 依下列 /etc/syslog.conf 回答：A. 執行 logger -p local1.warning "log message" 時，log 會出現在何處？ B. 執行 logger -p auth.notice "log message" 時，log 會出現在何處？

QX> *.err;kern,mark.debug;auth.notice        /dev/log/console.log
QX> *.info;kern,user,mark,auth.none          @loghost
QX> *.alert;kern.crit;local0,local1.info     tsaimh

R> A. local1.warning：第 1 行 *.emerg 不符（warning < emerg）；第 2 行 *.err 不符（warning < err），kern/mark/auth 不是 local1；第 3 行 *.info 符合（warning ≥ info），且 local1 不在 .none 排除名單 → 送到遠端主機 @loghost；第 4 行 local1.info 符合（warning ≥ info）→ 寫到使用者 tsaimh 的 terminal（若已登入）。所以出現在 @loghost 與 tsaimh。
R> B. auth.notice：第 1 行不符；第 2 行 auth.notice 符合 → 寫入 /dev/log/console.log；第 3 行 *.info 雖然符合等級，但 auth.none 把 auth 排除 → 不送 @loghost；第 4 行 *.alert 不符（notice < alert），kern.crit、local0/local1 也不符 → 不送 tsaimh。所以只出現在 /dev/log/console.log。
P> A. @loghost 與 tsaimh
P> B. 只有 /dev/log/console.log
P> 正確說明 level 比較與 .none 排除

@CARD ext2.newsyslog | newsyslog（FreeBSD log rotation）
A> newsyslog 是「定期把寫滿的帳本封存、換新本子」的管家：newsyslog.conf 每行寫「哪本帳本、權限、保留幾本舊的、多大要換、什麼時候換、怎麼壓縮」。由 cron 每小時叫它檢查一次。
B> 欄位：**logfilename [owner:group] mode count size when flags**
B> **mode**：新檔權限；**count**：保留幾份舊檔；**size**：超過多少 KB 就輪替（* = 不看大小）；**when**：時間條件（* = 不看時間）

R> 保留：count 為 15，保留 15 份舊的 log（新檔權限 600）。
R> 壓縮：flags 為 J，使用 bzip2 壓縮（產生 .bz2）。

P> 保留 15 份
P> J = bzip2

@CARD ext2.pf | 防火牆：PF / iptables 與 drop vs return
A> drop 是「假裝沒聽到敲門」，對方只能一直等到逾時；return / REJECT 是「隔著門說：沒有人在」，對方立刻知道被拒絕。對 TCP 回 RST，對 UDP 回 ICMP port unreachable。
B> **drop / DROP**：靜默丟棄，不回應；client 等到 **timeout**；不洩漏資訊但連線端等很久
B> **return（PF）/ REJECT（iptables）**：TCP 回 **RST**；UDP 回 **ICMP port unreachable**（destination unreachable）→ client 立即得知失敗
B> PF 與 iptables 都能過濾：ICMP、TCP flags、IPv6（ip6tables）、IP/port；**PF 不能比對 MAC address**（iptables 可用 -m mac）
B> PF table：**{ 140.113.0.0/16, !140.113.235.0/24, 140.113.235.0/26 }** → 以**最長前綴**決定，! 表示排除
?sa 試說明 PF 的 block policy 中 drop 與 return 的差異，請針對 TCP 與 UDP 封包的差異來說明。（iptables 中則為 DROP 和 REJECT）
S> 2023 期末 Q9
R> drop：直接把封包丟掉、不做任何回應。TCP 的 client 送出 SYN 後收不到任何回應，只能不斷重送直到逾時；UDP 的 client 也收不到任何訊息，只能等應用層 timeout。好處是不讓對方知道主機存在，但合法使用者會等很久。
R> return（REJECT）：丟棄封包但主動回覆拒絕。對 TCP 封包回送 TCP RST，對方立即得到 connection refused；對 UDP 封包回送 ICMP（port / destination）unreachable，對方立即知道無法送達。好處是 client 能快速失敗，但會暴露主機存在。
P> drop 靜默丟棄，client 逾時
P> return：TCP 回 RST
P> return：UDP 回 ICMP unreachable
?mc 下列何者無法透過 PF 與 iptables 來過濾？
+ MAC Address
- ICMP
- TCP Flag
- IPv6 Address
S> 2023 期末 Part A Q4
E> PF 無法依 MAC 過濾（以考古題答案為準）。

- 140.113.17.32

@CARD ext2.freebsd | FreeBSD：套件安裝與忘記 root 密碼
A> FreeBSD 裝軟體三條路：pkg 是「買現成的冷凍食品」（預編譯、快）、ports 是「照食譜從頭煮」（從原始碼編譯、可自訂配料）、tarball 是「自己去市場買原料、沒有食譜管理」（手動 configure/make，系統不會幫你記帳）。
B> **pkg**：二進位預編譯套件，pkg install，快速、自動處理依賴，但使用預設編譯選項
B> **ports**：/usr/ports 原始碼建置框架（make install clean），可用 make config **自訂編譯選項**，較花時間；仍由套件資料庫管理
B> **tarball**：手動下載原始碼壓縮檔，./configure && make && make install；**不追蹤依賴、不登記**到套件系統，難以升級與移除
B> 忘記 root 密碼：開機選單選 **single user mode**（boot -s）→ 出現提示按 Enter 用 /bin/sh → **mount -u /**（root 改為可寫）→ **mount -a** → **passwd root** → exit / reboot
?sa FreeBSD 系統上安裝軟體有 pkg、ports 與 tarball 三種方式，請簡述三者的差別。
S> 2023 期中 Q2
R> pkg：安裝官方預先編譯好的 binary package，由 pkg 工具自動下載並處理相依套件，安裝快速、易於升級與移除，但只能使用預設的編譯選項。
R> ports：使用 Ports Collection（/usr/ports）中的 Makefile 從原始碼編譯安裝，會自動下載原始碼、套用 FreeBSD patch、處理相依，可透過 make config 自訂編譯選項，彈性高但編譯耗時；安裝結果仍登記在套件資料庫中。
R> tarball：自行下載軟體原始碼壓縮檔，手動解壓縮、./configure、make、make install；不經過套件系統，不會自動處理相依、不會登記，之後升級或移除都要手動，容易弄亂系統。
P> pkg：預編譯 binary，快、自動依賴、選項固定
P> ports：從原始碼編譯，可自訂選項，慢
P> tarball：手動編譯，不管理依賴與登記
?sa 假設你在一台全新安裝且只有 root 使用者的 FreeBSD 中忘記了 root 密碼。在系統重開機後，請簡述該如何取回控制權並重新登入 root？
S> 2023 期末 Q6
R> ① 重開機，在 FreeBSD boot loader 選單選擇「Single user mode」（或在 loader 提示字元輸入 boot -s）。② 出現 Enter full pathname of shell 時直接按 Enter 使用 /bin/sh，此時不需密碼即以 root 身分進入。③ root 檔案系統預設以唯讀掛載，執行 mount -u /（必要時 fsck -p）讓它可寫，再 mount -a 掛上其他檔案系統。④ 執行 passwd root 設定新密碼。⑤ exit 或 reboot 回到多人模式，以新密碼登入 root。
P> 進入 single user mode（boot -s）
P> mount -u / 讓 root 可寫（mount -a）
P> passwd root 重設後重開機

@CARD ext2.man | man pages：章節與語法
A> man 手冊分章節：1 是一般指令、2 是系統呼叫、3 是 C 函式庫、4 裝置、5 檔案格式、6 遊戲、7 雜項、8 系統管理指令。printf(1) 是 shell 指令，printf(3) 是 C 函式，同名不同章。語法裡的 [ ] 是「可以不寫」，... 是「可以寫很多個」。
B> 章節：**1** 使用者指令、**2** system calls、**3** library functions、**4** 裝置 / 特殊檔、**5** 檔案格式（如 crontab(5)、fstab(5)）、6 遊戲、**7** 雜項（hier(7)）、**8** 系統管理指令（mount(8)）
B> 查特定章節：**man 3 printf**（FreeBSD 也可 man -s 3 printf）；**man -k keyword** / apropos 搜尋
B> SYNOPSIS 語法：**[ ]** 可省略的選項；**...** 可重複多個；底線 / 斜體為要替換的參數

S> 2023 期中 Q4
R> a. 3 代表 man page 的第 3 章節：程式庫函式（C library functions），printf(3) 是 C 語言的 printf 函式，與第 1 章的 printf 指令不同。
R> b. man 3 printf（或 man -s 3 printf）。
R> c. [ ] 表示其中的選項或參數是可選的（可以省略）；... 表示前面的項目可以重複出現多次，例如 [file ...] 代表可以給零個或多個檔案。
P> a. 第 3 章 = library functions
P> b. man 3 printf

@CARD ext2.linuxbsd | Linux vs FreeBSD
A> Linux 是「一個引擎（kernel）+ 各家車廠組裝的車（發行版）」；FreeBSD 是「同一家廠把引擎和車身一起設計製造的整車」。
B> **開發模式**：Linux 只是 kernel，userland（GNU 等）由各發行版組合；FreeBSD 的 kernel 與 base userland 在**同一個 source tree** 一起開發發行
B> **授權**：Linux **GPL**（衍生作品須開源）；FreeBSD **BSD license**（寬鬆，可閉源商用）
B> **init / 服務**：Linux 多為 **systemd**（systemctl）；FreeBSD 用 **rc.d + /etc/rc.conf**（service、sysrc）
B> **套件**：Debian apt；FreeBSD **pkg / ports**，第三方軟體放 **/usr/local**
B> **預設 shell**：Debian 使用者 bash；FreeBSD **sh**（舊版 root 為 csh/tcsh）
B> **防火牆**：Linux netfilter（iptables / nftables）；FreeBSD **pf / ipfw**
B> **檔案系統**：Linux ext4/xfs/btrfs；FreeBSD **UFS / ZFS**
B> **隔離**：Linux namespaces/cgroups containers；FreeBSD **jails**
B> **裝置名稱**：Linux /dev/sda；FreeBSD /dev/ada0、da0
?sa 試舉出三個 Linux 與 FreeBSD 不同之處（需明確指出 Linux 如何、FreeBSD 如何，「名字 / 核心 / 開發者不同」這類答案不計分）。
S> 2023 期中 Q13
R> ① 服務管理：多數 Linux 發行版（如 Debian）用 systemd，以 unit 檔與 systemctl 管理；FreeBSD 用 rc.d 腳本，在 /etc/rc.conf 設定 xxx_enable="YES"，以 service / sysrc 管理。
R> ② 套件管理：Debian 用 apt / dpkg 安裝 .deb；FreeBSD 用 pkg（binary）或 ports（原始碼），第三方軟體安裝在 /usr/local。
R> ③ 系統組成與授權：Linux 只有 kernel，userland 來自 GNU 等不同專案由發行版組合，採 GPL；FreeBSD 的 kernel 與 base system 在同一個 source tree 中一起開發、一起發行，採 BSD license。
R> 其他：防火牆 Linux 用 iptables/nftables，FreeBSD 用 pf/ipfw；檔案系統 ext4 vs UFS/ZFS；container 用 namespaces vs FreeBSD jails；預設 shell bash vs sh/tcsh；磁碟名稱 /dev/sda vs /dev/ada0。
P> 三個具體差異，且每個都明確說明 Linux 與 FreeBSD 各自的做法

> pkg :: apt
E> 考差異題時要說清楚兩邊各怎麼做。

/* ═════════════════════ 1. CONTENT PARSER ═════════════════════
  DSL:  @CH id | title | icon | source       @CARD id | title
        A> analogy  B> bullet  M> mnemonic  X> code line
        ?mc|tf|cmd|fill|ord|mt|sa question     QX> code  S> source  H> hint  E> explanation
        mc: "+ correct" / "- wrong"   tf: =T / =F   cmd/fill: "= answer"
        ord: "> item" (correct order)  mt: "> left :: right"   sa: R> reference line, P> scoring point
*/
function parseDSL(text){
  const chs=[]; let ch=null, card=null, q=null;
  const closeQ=()=>{ if(q&&card){ card.q.push(q); } q=null; };
  for(const raw of text.split('\n')){
    const line=raw.replace(/\r$/,''); const s=line.trim(); if(!s) continue;
    if(s.startsWith('@CH ')){ closeQ(); const p=s.slice(4).split('|').map(x=>x.trim()); ch={id:p[0],t:p[1],icon:p[2]||'📘',src:p[3]||'',cards:[]}; chs.push(ch); card=null; continue; }
    if(s.startsWith('@CARD ')){ closeQ(); const i=s.indexOf('|'); card={id:s.slice(6,i).trim(),t:s.slice(i+1).trim(),b:[],q:[]}; if(ch) ch.cards.push(card); continue; }
    const m=s.match(/^\?(mc|tf|cmd|fill|ord|mt|sa)\s+(.*)$/);
    if(m){ closeQ(); q={k:m[1],q:m[2]}; continue; }
    if(!card) continue;
    if(s.startsWith('QX>')){ if(!q) continue; let t=line.slice(line.indexOf('QX>')+3); if(t[0]===' ') t=t.slice(1); (q.x||(q.x=[])).push(t); continue; }
    if(s.startsWith('X>')){ let t=line.slice(line.indexOf('X>')+2); if(t[0]===' ') t=t.slice(1); (card.x||(card.x=[])).push(t); continue; }
    const tag=s.slice(0,2), rest=s.slice(2).trim();
    if(!q){ if(tag==='A>') card.a=rest; else if(tag==='B>') card.b.push(rest); else if(tag==='M>') card.m=rest; continue; }
    const k=q.k;
    if(tag==='E>') q.e=rest;
    else if(tag==='H>') q.h=rest;
    else if(tag==='S>') q.src=rest;
    else if(tag==='R>') q.a=(q.a?q.a+'\n':'')+rest;
    else if(tag==='P>') (q.p||(q.p=[])).push(rest);
    else if(k==='mc'&&s.startsWith('+ ')){ (q.o||(q.o=[])).push(s.slice(2).trim()); q.a=q.o.length-1; }
    else if(k==='mc'&&s.startsWith('- ')){ (q.o||(q.o=[])).push(s.slice(2).trim()); }
    else if(k==='tf'&&(s==='=T'||s==='=F')) q.a=(s==='=T');
    else if((k==='cmd'||k==='fill')&&s.startsWith('= ')) (q.a||(q.a=[])).push(s.slice(2).trim());
    else if(k==='ord'&&s.startsWith('> ')) (q.o||(q.o=[])).push(s.slice(2).trim());
    else if(k==='mt'&&s.startsWith('> ')){ const t=s.slice(2); const i=t.indexOf('::'); (q.o||(q.o=[])).push([t.slice(0,i).trim(),t.slice(i+2).trim()]); }
  }
  closeQ();
  return chs;
}

/* Merge one in-app account's progress into another (same person, two devices), then retire it. */
async function mergeProfileInto(fromId,toId){
  if(fromId===toId) return;
  if(fromId===PROF.cur){ if(SYNC.unsub){ try{ SYNC.unsub(); }catch(e){} SYNC.unsub=null; } clearTimeout(SYNC.timer); SYNC.dirty=false; SYNC.ref=null; }
  let from=fromId===PROF.cur?normState(S):normState(lsRead(pKey(fromId))), to=normState(lsRead(pKey(toId)));
  if(SYNC.db){
    try{ const a=await SYNC.db.doc(SYNC.base+pDoc(fromId)).get(); if(a.exists) from=normState(mergeState(from,dclone(a.data()))); }catch(e){}
    try{ const b=await SYNC.db.doc(SYNC.base+pDoc(toId)).get(); if(b.exists) to=normState(mergeState(to,dclone(b.data()))); }catch(e){}
  }
  const m=normState(mergeState(to,from)); m.u=Date.now(); lsWrite(pKey(toId),m);
  if(SYNC.db){ try{ await SYNC.db.doc(SYNC.base+pDoc(toId)).set(JSON.parse(JSON.stringify(m))); }catch(e){} }
  const p=PROF.list.find(x=>x.id===fromId); if(p){ p.del=true; p.t=Date.now(); delete p.pin; }
  try{ localStorage.removeItem(pKey(fromId)); }catch(e){}
  if(SYNC.db) SYNC.db.doc(SYNC.base+pDoc(fromId)).delete().catch(()=>{});
  return m;
}
async function initSync(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    SYNC.db=db; SYNC.uid=uid; SYNC.base='data/users/'+uid+'/'; SYNC.metaRef=db.doc(SYNC.base+'meta');
    const [ms,old]=await Promise.all([SYNC.metaRef.get(), PROF.list.length?null:db.doc(SYNC.base+'progress').get()]);
    const md=ms.exists?(dclone(ms.data())||{}):{}; const rl=md.list||[];
    for(const p of rl){ if(!p||!p.id) continue; const i=PROF.list.findIndex(x=>x.id===p.id); if(i<0) PROF.list.push(p); else if((p.t||0)>(PROF.list[i].t||0)) PROF.list[i]=p; }
    if(!PROF.list.length&&old&&old.exists) PROF.list.push({id:'main',name:'我',em:'🐧',t:Date.now()});
    const jn=lsRead('sa-sync'); if(jn&&jn.join){ const ids=new Set(rl.map(p=>p&&p.id));
      for(const lp of PROF.list.filter(p=>!p.del&&!ids.has(p.id))){ const rp=rl.find(p=>p&&!p.del&&p.id!==lp.id&&p.name===lp.name); if(!rp) continue;
        await mergeProfileInto(lp.id,rp.id); if(PROF.cur===lp.id){ PROF.cur=rp.id; S=normState(lsGet()); } SYNC.merged=(SYNC.merged||0)+1; }
      delete jn.join; lsWrite('sa-sync',jn); }
    if(!PROF.cur&&md.cur){ const p=PROF.list.find(x=>x.id===md.cur&&!x.del); if(p&&!p.pin){ PROF.cur=p.id; S=normState(lsGet()); if(!BOOT.done) { VIEW={name:'loading'}; render(); } } }
    lsWrite(LS_PROF,PROF);
    if(JSON.stringify(PROF.list)!==JSON.stringify(rl)||(md.cur||'')!==(PROF.cur||'')) pushMeta();
    if(VIEW.name==='who') render();
    await attachProfile();
    if(SYNC.merged){ setTimeout(()=>toast('已把這台裝置上同名的帳號，和雲端的帳號合併成一個',3200),800); SYNC.merged=0; }
  }catch(e){ SYNC.status='local'; refreshSyncBadge(); }
}
function pushMeta(){ lsWrite(LS_PROF,PROF); if(SYNC.metaRef) SYNC.metaRef.set({list:JSON.parse(JSON.stringify(PROF.list)),cur:PROF.cur||'',u:Date.now()}).catch(()=>{}); }
async function attachProfile(){
  if(SYNC.unsub){ try{ SYNC.unsub(); }catch(e){} SYNC.unsub=null; }
  SYNC.ref=null;
  if(!SYNC.db||!PROF.cur){ refreshSyncBadge(); return; }
  const pid=PROF.cur, ref=SYNC.db.doc(SYNC.base+pDoc(pid));
  SYNC.status='syncing'; refreshSyncBadge();
  try{
    const snap=await ref.get(); if(PROF.cur!==pid) return;
    const remote=snap.exists?dclone(snap.data()):null;
    const qb=JSON.stringify(S.q), xb=S.xp;
    S=normState(mergeState(S,remote)); lsSet(S);
    SYNC.ref=ref; SYNC.status='cloud'; SYNC.last=Date.now();
    if(!remote||JSON.stringify(remote.q||{})!==JSON.stringify(S.q)||remote.xp!==S.xp){ SYNC.dirty=true; flush(); }
    if(JSON.stringify(S.q)!==qb||S.xp!==xb) refreshAfterRemote();
    refreshSyncBadge();
    SYNC.unsub=ref.onSnapshot(sn=>{
      if(PROF.cur!==pid||!sn.exists||sn.metadata.hasPendingWrites) return;
      const r=dclone(sn.data()); if(!r||(r.u||0)<=(S.u||0)) return;
      S=normState(mergeState(S,r)); lsSet(S); refreshAfterRemote();
    },()=>{});
  }catch(e){ SYNC.status='local'; refreshSyncBadge(); }
}
