E> populated 1 表示還有 process，0 表示空了；systemd 用它判斷服務是否已完全結束。
?tf memory.max 的內容是 max，代表該 cgroup 沒有記憶體上限。
=T
E> 值為 max 代表不限制；systemctl edit 設 MemoryMax= 後這裡會變成數字。

@CARD systemd.resource | systemd 資源控制：Weight、Limit、Throttle
A> 三種管法：Weight 是「塞車時才看的優先權」（不忙時大家隨便用）；Hard limit 是「預算上限，超過就處分」（記憶體超過 MemoryMax 直接被 OOM kill）；Throttle 是「接近上限就踩煞車」（超過 MemoryHigh 變慢、回收記憶體，但不會被殺）。
B> **Weight**：只在資源**忙碌、搶用時**才按比例分配；**CPUWeight=、IOWeight=**（預設 **100**）
B> **Hard limit**：**CPUQuota=**（cpu.max）、**MemoryMax=**（memory.max）、**TasksMax=**（pids.max）；超過 MemoryMax → **OOM kill**
B> **Throttle**：超過 **MemoryHigh=**（memory.high）→ **變慢、回收記憶體**，不殺 process
B> 設定方式：**systemctl edit** 寫進 [Service]，或 **systemctl set-property** 直接套用（預設會持久保存）
X> # systemctl edit myapp.service
X> [Service]
X> CPUWeight=200     # cpu.weight
X> CPUQuota=50%      # cpu.max
X> MemoryHigh=800M   # memory.high
X> MemoryMax=1G      # memory.max
X> TasksMax=512      # pids.max
X> $ systemctl set-property myapp.service MemoryMax=500M
?mt 配對 systemd 設定與 cgroup 檔案：
> CPUWeight= :: cpu.weight
> CPUQuota= :: cpu.max
> MemoryMax= :: memory.max
> MemoryHigh= :: memory.high
> TasksMax= :: pids.max
E> 投影片右邊的註解就是對照表。
?mc 服務的記憶體用量超過 MemoryHigh= 但還沒到 MemoryMax=，會發生什麼事？
+ 被 throttle：變慢並回收記憶體，但不會被殺
- 立刻被 OOM kill
- 服務被 systemd 重新啟動
- 沒有任何影響
E> MemoryHigh 是軟性煞車；MemoryMax 才是硬上限，超過會 OOM kill。
?mc 兩個服務 CPUWeight 分別是 200 與 100。系統 CPU 很閒時，哪個說法正確？
+ 兩個服務都可以盡量使用 CPU，weight 只在搶 CPU 時才有作用
- 第一個服務永遠拿到 2/3 的 CPU
- 第二個服務最多只能用 50% CPU
- weight 會換算成固定的 CPUQuota
E> Share only when resource is busy。想要硬上限要用 CPUQuota=。
?cmd 不開編輯器，直接把 myapp.service 的記憶體硬上限設為 500M：
= systemctl set-property myapp.service MemoryMax=500M
= systemctl set-property myapp MemoryMax=500M
E> 加 --runtime 則只在這次開機有效。
?sa 某 Web 服務偶爾記憶體暴衝把整台機器拖垮。請說明如何用 systemd 限制它，並比較 MemoryHigh= 與 MemoryMax= 的差異，以及何時該用 CPUWeight= 而不是 CPUQuota=。
R> 用 systemctl edit web.service 在 [Service] 加入 MemoryHigh=（例如 800M）與 MemoryMax=（例如 1G），或用 systemctl set-property 直接設定；systemd 會寫入該服務 cgroup 的 memory.high / memory.max。
R> MemoryHigh 是 throttle：超過時 kernel 讓 process 變慢並積極回收記憶體，但不會殺掉它；MemoryMax 是硬上限，超過時會觸發 OOM killer 殺掉該 cgroup 內的 process（可搭配 Restart= 讓服務自動重啟）。通常 High 設得比 Max 低一些，先煞車再處分。
R> CPUWeight 是相對權重，只在 CPU 忙碌、多個服務搶用時才按比例分配，閒時不設限，適合「重要服務優先」；CPUQuota 是絕對上限（如 50% = 每週期最多半顆 CPU），即使 CPU 很閒也不能超過，適合防止單一服務吃滿。
P> 用 systemctl edit / set-property 設定 MemoryHigh、MemoryMax
P> MemoryHigh 超過會 throttle、不會被殺
P> MemoryMax 超過會 OOM kill
P> CPUWeight 只在搶資源時生效；CPUQuota 是硬上限

@CARD systemd.systemctl | systemctl 指令總覽
A> systemctl 是跟總管家溝通的遙控器：start/stop 是「現在開/關」，enable/disable 是「開機時要不要自動開」，mask 是「把插頭拔掉並封住插座」，連別人想幫你開都開不了。
B> **status [unit]**：狀態、最近 log、cgroup；**cat unit**：印出 unit 檔與所有 drop-in
B> **start / stop**：立即啟動 / 停止（不影響開機行為）
B> **enable / disable**：依 [Install] 建立 / 移除 symlink（影響開機）；**enable --now** = enable + start
B> **kill**：送訊號給服務的 process（預設 SIGTERM，可用 -s 指定）
B> **mask / unmask**：把 unit 連到 **/dev/null**，讓它**完全無法被啟動**（手動或被依賴都不行）
B> **list-unit-files**、**list-dependencies**；改完 unit 檔後 **daemon-reload**
?mt 配對 systemctl 子指令：
> enable :: 建立 symlink，開機時自動啟動
> start :: 現在立刻啟動，不影響開機設定
> mask :: 連到 /dev/null，任何方式都無法啟動
> daemon-reload :: 修改 unit 檔後重新載入設定
> cat :: 顯示 unit 檔內容與 drop-in
E> enable 和 start 是兩件事，所以常用 enable --now。
?mc 某服務 disable 之後，仍然因為別的服務 Wants= 它而被啟動。要徹底阻止它被啟動，應該用？
+ systemctl mask
- systemctl stop
- systemctl kill
- systemctl daemon-reload
E> disable 只移除 [Install] 建立的 symlink，被依賴時仍會啟動；mask 把它指向 /dev/null。
?cmd 修改了 /etc/systemd/system/myapp.service 之後，讓 systemd 重新讀取 unit 檔：
= systemctl daemon-reload
E> 不 reload 的話 systemctl 會警告 unit file changed on disk。
?cmd 讓 nginx 開機自動啟動，並且現在就啟動（一個指令）：
= systemctl enable --now nginx
= systemctl enable --now nginx.service
= systemctl --now enable nginx
E> --now 會同時 start（disable --now 則同時 stop）。
?cmd 顯示 sshd.service 的 unit 檔內容（含所有 drop-in）：
= systemctl cat sshd
= systemctl cat sshd.service
E> 比直接 cat 檔案好：會告訴你實際生效的是哪些檔案。

@CARD systemd.unitfile | Unit 檔結構：[Unit]、[Service]、[Install]
A> 一份 unit 檔像「員工資料卡」：[Unit] 是基本資料與人際關係（我是誰、在誰之後上班、需要誰）；[Service] 是工作內容（怎麼啟動、掛了怎麼辦）；[Install] 是「被誰錄取」（enable 時掛到哪個 target 底下）。
B> **[Unit]**：通用資訊：Description=、Documentation=、依賴（Wants=、Requires=）、順序（After=、Before=）
B> **[Service]**：服務專屬設定：Type=、ExecStart=、Restart=…；也可用 **systemd.exec(5)** 的選項（User=、Environment=…）
B> **[Install]**：安裝資訊，**只給 enable / disable 用**：WantedBy=、RequiredBy=
B> 沒有 [Install] 的 unit 不能 enable（通常是被別人依賴或由 timer / socket 觸發）
X> [Unit]
X> Description=OpenSSH Daemon
X> After=network.target sshdgenkeys.service
X> Wants=sshdgenkeys.service ssh-access.target
X> [Service]
X> Type=notify-reload
X> ExecStart=/usr/bin/sshd -D
X> KillMode=process
X> Restart=always
X> [Install]
X> WantedBy=multi-user.target
?mt 配對設定與所在區段：
> Description= :: [Unit]
> After= :: [Unit]
> ExecStart= :: [Service]
> Restart= :: [Service]
> WantedBy= :: [Install]
E> [Install] 只有 enable/disable 會讀。
?mc [Install] 區段的用途是？
+ 提供 systemctl enable / disable 安裝 unit 時需要的資訊
- 告訴 apt 如何安裝這個套件
- 設定服務第一次啟動前要執行的指令
- 宣告服務啟動的順序
E> Installation information for the unit, used by enable / disable。
?tf systemd.exec(5) 的選項（例如 User=、Environment=）可以寫在 [Service] 區段。
=T
E> [Service] includes options in systemd.exec。

@CARD systemd.dropin | Drop-in 片段與 systemctl edit
A> 不要直接改「出廠說明書」（/usr/lib 底下的 unit，套件更新會被蓋掉）。改用「便利貼」：systemctl edit 在 /etc/systemd/system/xxx.service.d/override.conf 貼一張，只寫要改的那幾行，其餘沿用原本設定。
B> **systemctl edit [unit]**：建立或編輯 drop-in：**/etc/systemd/system/<unit>.d/override.conf**
B> **--full**：改為編輯整份 unit（複製到 /etc/systemd/system/<unit>）
B> 編輯器中只有兩行註解之間的內容會被存檔；下方會顯示原 unit 內容供參考
B> 用預設編輯器（$SYSTEMD_EDITOR / $EDITOR）；存檔後自動 daemon-reload
B> 清掉清單型設定要先寫空值：例如改 ExecStart 要先 **ExecStart=** 再寫新的 ExecStart=
X> # systemctl edit sshd.service
X> [Service]
X> ExecStart=
X> ExecStart=/usr/bin/sshd -D -o LogLevel=VERBOSE
?mc 為什麼建議用 drop-in 而不是直接修改 /usr/lib/systemd/system/sshd.service？
+ /usr/lib 下的檔案屬於套件，更新時會被覆蓋；drop-in 放在 /etc，只覆寫需要的設定
- drop-in 執行速度比較快
- /usr/lib 下的檔案是唯讀的，root 也無法修改
- systemd 不會讀取 /usr/lib 下的檔案
E> /etc 的設定優先，且不會被 apt 蓋掉。
?fill systemctl edit nginx.service 建立的 drop-in 檔路徑是 /etc/systemd/system/nginx.service.d/＿＿
= override.conf
E> 也可以手動在 .d/ 目錄放任意 *.conf。
?cmd 用編輯器修改 myapp.service 的「完整」unit 檔（不是 drop-in）：
= systemctl edit --full myapp.service
= systemctl edit --full myapp
= systemctl edit myapp.service --full
E> 會在 /etc/systemd/system/ 產生完整副本。
?tf 在 drop-in 想換掉原本的 ExecStart=，直接寫一行新的 ExecStart= 就好，不需要其他處理。
=F
E> 對一般服務，ExecStart= 可累加，必須先寫空的 ExecStart= 清除舊值，否則會報錯（非 oneshot 只能有一個）。

@CARD systemd.path | Unit 搜尋路徑與優先順序
A> systemd 找 unit 就像找文件：先看「你自己桌上」（/etc，管理員設定），再看「部門共用櫃」（/usr/local/lib，本機自裝），最後才看「公司出廠檔案」（/usr/lib，套件提供）。同名時越前面越優先。
B> System unit：**/etc/systemd/system/** → **/usr/local/lib/systemd/system/** → **/usr/lib/systemd/system/**（前者優先）
B> /etc：管理員的設定與 enable 產生的 symlink；/usr/lib：套件安裝的 unit
B> User unit（systemctl --user）：$XDG_CONFIG_DIRS/systemd/user、/etc/systemd/user、$XDG_DATA_HOME/systemd/user（~/.local/share/systemd/user）、/usr/local/lib/systemd/user、/usr/lib/systemd/user
B> 查詢實際使用的檔案：**systemctl cat**、systemctl show -p FragmentPath
?ord 依優先順序（高 → 低）排列 system unit 搜尋路徑：
> /etc/systemd/system/
> /usr/local/lib/systemd/system/
> /usr/lib/systemd/system/
E> /etc 最優先，所以管理員的設定可以蓋過套件預設。
?mc 自己寫的 myapp.service 應該放在哪裡最合適？
+ /etc/systemd/system/myapp.service
- /usr/lib/systemd/system/myapp.service
- /var/lib/systemd/myapp.service
- /run/myapp.service
E> /usr/lib 留給套件管理；管理員自訂放 /etc。
?tf 使用者層級的 unit 可以放在 ~/.local/share/systemd/user/ 底下，用 systemctl --user 管理。
=T
E> 對應 $XDG_DATA_HOME/systemd/user。

@CARD systemd.deps | 依賴：Requires、Wants、BindsTo、Upholds
A> 四種「需要你」的強度：Wants 是「希望你來，不來我也照常上班」；Requires 是「你沒來我就算失敗」；BindsTo 是「你一走我也走」；Upholds 是「你倒了我就把你拉起來」。
B> **Requires=**：列出依賴，**平行啟動**；依賴失敗 → 這個 unit 被標記為 **failed**
B> **Wants=**：較寬鬆；依賴失敗**不會**讓這個 unit failed → **大多數情況建議用 Wants**
B> **BindsTo=**：比 Requires 更嚴格；依賴**掛掉時這個 unit 也會停止**
B> **Upholds=**：比 BindsTo 更積極；依賴掛掉時會**把依賴重新啟動**
B> 依賴 ≠ 順序：只寫 Requires 沒寫 After 時兩者是**同時**啟動的
?mt 配對依賴關係：
> Wants= :: 依賴失敗也不影響自己（建議預設使用）
> Requires= :: 依賴失敗，自己被標記為 failed
> BindsTo= :: 依賴停止或崩潰，自己也跟著停止
> Upholds= :: 依賴崩潰時，自動把依賴重新啟動
E> 強度：Wants < Requires < BindsTo；Upholds 更積極地維持依賴存活。
?mc A.service 寫了 Requires=B.service，但沒有 After=B.service。A 和 B 的啟動順序是？
+ 同時（平行）啟動
- 先 B 再 A
- 先 A 再 B
- 只啟動 A
E> All the dependencies will be executed in parallel；要排順序需要另外寫 After=。
?mc 為什麼投影片建議大多數情況用 Wants= 而不是 Requires=？
+ 依賴失敗時不會連帶讓自己 failed，系統比較有韌性
- Wants= 啟動速度比較快
- Requires= 已被淘汰
- Wants= 會自動加上 After=
E> Wants 是 less restrictive 的版本。
?tf 若 A 有 BindsTo=B，當 B 崩潰時，A 也會被停止。
=T
E> BindsTo 比 Requires 更嚴格：依賴停止或崩潰，自己也一起停。

@CARD systemd.order | 順序：Before= / After= 不是依賴
A> After= 只是「排隊順序」，不是「邀請函」：寫了 After=network.target 不代表會把網路叫起來，只代表如果它也要啟動，就排在它後面。要「叫起來」得用 Wants/Requires，兩者通常搭配使用。
B> **Before=**：這個 unit 要在列出的 unit **之前**啟動
B> **After=**：這個 unit 要在列出的 unit **之後**啟動
B> **它們不是依賴**：只指定啟動順序；要拉起依賴請用 Requires= / Wants= / BindsTo=
B> 常見組合：**Wants=network-online.target + After=network-online.target**（真的等網路可用）
B> 關機時順序**反過來**（先啟動的後停止）
?mc myapp.service 只寫了 After=postgresql.service，沒有任何 Wants/Requires。啟動 myapp 時會？
+ 不會自動啟動 postgresql；若 postgresql 剛好也要啟動，myapp 會排在它之後
- 自動先啟動 postgresql 再啟動 myapp
- 因為缺少依賴而啟動失敗
- 等待 postgresql 被手動啟動
E> These are not dependencies, only startup order is specified。
?tf After= 和 Before= 會讓 systemd 自動啟動列出的 unit。
=F
E> 只控制順序，要搭配 Wants=/Requires=。
?mc HAProxy 的 unit 同時寫了 Wants=network-online.target 與 After=network-online.target，目的是？
+ 拉起 network-online.target，並確保網路可用之後才啟動 HAProxy
- 讓 HAProxy 和網路同時啟動以加快開機
- 網路斷線時自動停止 HAProxy
- 只是重複寫法，效果與只寫一行相同
E> Wants 負責拉起、After 負責排序，兩者缺一不可。

@CARD systemd.defdeps | 預設依賴：DefaultDependencies
A> 每個服務都會被自動加上「入職手續」：要等系統初始化（sysinit、basic）完成才上班，而且一宣布關機（shutdown.target）就收工。只有很早期開機要用的服務才會關掉這個預設。
B> 除非設定 **DefaultDependencies=no**，service 會自動加上：
B> **Requires=sysinit.target**
B> **After=sysinit.target basic.target**
B> **Conflicts=shutdown.target**、**Before=shutdown.target**
B> Conflicts=：兩者不能同時存在 → 關機（啟動 shutdown.target）時會停止這個服務
?mc 為什麼一般服務在關機時會被停止？
+ 預設依賴包含 Conflicts=shutdown.target，啟動 shutdown.target 就會停止它
- 因為 kernel 直接對所有 process 送 SIGKILL
- 因為每個服務都必須寫 ExecStop=
- 因為 multi-user.target 會被刪除
E> 再加上 Before=shutdown.target，保證服務在 shutdown.target 之前停好。
?mt 配對預設依賴：
> Requires= :: sysinit.target
> After= :: sysinit.target basic.target
> Conflicts= :: shutdown.target
> Before= :: shutdown.target
E> 投影片 Systemd default dependencies。
?fill 不想要自動加上預設依賴時，在 [Unit] 寫 DefaultDependencies=＿＿
= no
= false
= 0
E> 只有開機極早期或關機流程中的特殊 unit 才需要關掉預設依賴。

@CARD systemd.install | enable 的原理：.wants/ symlink
A> enable 不會「啟動」任何東西，它只是在 target 的「邀請名單資料夾」（xxx.target.wants/）放一張指向你的 symlink 名片。開機時 target 啟動，就會照名單把你叫起來。
B> 用 **systemctl enable / disable** 安裝與解除安裝 unit
B> enable 依 [Install] 的 **WantedBy=** 在 **/etc/systemd/system/<target>.wants/** 建立 symlink（RequiredBy= 則是 .requires/）
B> WantedBy=multi-user.target → 開機到 multi-user.target 時被 Wants 拉起
B> disable 移除這些 symlink；**unit 檔本身不會被刪**
X> $ sudo systemctl enable sshd.service
X> Created symlink '/etc/systemd/system/multi-user.target.wants/sshd.service'
X>   → '/usr/lib/systemd/system/sshd.service'.
?mc systemctl enable sshd.service 實際做了什麼？
+ 在 /etc/systemd/system/multi-user.target.wants/ 建立指向 unit 檔的 symlink
- 立刻啟動 sshd
- 把 unit 檔複製到 /etc/systemd/system/
- 在 /etc/rc.local 加一行啟動指令
E> 依 WantedBy=multi-user.target 建立 symlink；不會立即啟動。
?fill 某服務 [Install] 寫 WantedBy=multi-user.target，enable 後 symlink 會放在 /etc/systemd/system/＿＿/ 目錄中
= multi-user.target.wants
E> RequiredBy= 會放在 <target>.requires/。
?tf systemctl disable 會刪除 unit 檔。
=F
E> 只移除 symlink。

@CARD systemd.target | Target 與 SysV runlevel
A> Target 是「套餐」：multi-user.target 是「多人文字模式套餐」，graphical.target 是「再加上圖形介面」。開機時 systemd 點 default.target 這份套餐（其實是指向某個套餐的別名），套餐裡的每道菜（unit）就會被端上來。
B> 工作以 unit 組織；**target 是一群 unit 的集合**，用來把系統組到某個狀態
B> target 可以建立在其他 target 之上（graphical → multi-user → basic …）
B> 開機時啟動 **default.target**（通常是 graphical 或 multi-user 的別名）：**systemctl get-default / set-default**
B> runlevel 對照：**0 poweroff**、**1 rescue**（單人模式）、**2/3/4 multi-user**、**5 graphical**、**6 reboot**；另有 **emergency.target**、**network-online.target**
B> 切換到某 target 並停掉不屬於它的 unit：**systemctl isolate**
?mt 配對 SysV runlevel 與 systemd target：
> 0 :: poweroff.target
> 1 :: rescue.target
> 3 :: multi-user.target
> 5 :: graphical.target
> 6 :: reboot.target
E> 2、3、4 都對應 multi-user.target。
?cmd 查詢系統預設開機的 target：
= systemctl get-default
E> default.target 是指向實際 target 的 symlink。
?cmd 把預設開機 target 改成純文字的多使用者模式：
= systemctl set-default multi-user.target
= systemctl set-default multi-user
E> set-default 會改 default.target 這個 symlink 指向的 target。
?mc emergency.target 與 rescue.target 的差別？
+ emergency 只給一個 root shell，幾乎不啟動任何服務、root 可能唯讀；rescue 會掛載本機檔案系統並啟動基本系統
- 兩者完全相同
- rescue 比 emergency 啟動更少服務
- emergency 會啟動網路，rescue 不會
E> emergency 是最精簡的救援環境。

@CARD systemd.hier | Target 階層與 list-dependencies
A> 開機就像蓋大樓：sysinit（打地基）→ basic（水電管線：sockets、slices、timers、paths）→ multi-user（各樓層服務）→ graphical（裝潢門面）。list-dependencies 能把整棟樓的結構圖印出來。
B> **graphical.target** → 顯示管理器（如 sddm.service）＋ **multi-user.target**
B> **multi-user.target** → 各服務（sshd、logind…）＋ **basic.target**、getty.target、remote-fs.target…
B> **basic.target** → **sockets.target、slices.target、sysinit.target、timers.target**、paths.target
B> 查看：**systemctl list-dependencies multi-user.target**（● 啟動中、○ 未啟動）
?ord 由最底層到最上層排列：
> sysinit.target
> basic.target
> multi-user.target
> graphical.target
E> graphical 依賴 multi-user，multi-user 依賴 basic，basic 依賴 sysinit 等。
?cmd 列出 multi-user.target 依賴的所有 unit（樹狀）：
= systemctl list-dependencies multi-user.target
= systemctl list-dependencies multi-user
E> ● 表示啟動中、○ 表示未啟動；加 --reverse 可反查誰依賴它。
?mc timers.target 位於哪個 target 底下？
+ basic.target
- graphical.target
- shutdown.target
- network-online.target
E> multi-user.target ⇒ basic.target ⇒ timers.target。

@CARD systemd.type | Service Type：什麼時候算「啟動完成」
A> Type 決定 systemd 何時把服務標成「已啟動」，好讓排在後面的服務出發：simple 是「人一出門就算」；exec 是「確定上車了才算」；notify 是「到了公司打電話回報 READY 才算」；oneshot 是「事情做完回家才算」。
B> **simple**：主 process **fork() 之後立刻**視為 started（就算 exec 失敗也已經算啟動）
B> **exec**：類似 simple，但等到**執行檔真的被 exec 成功**才算 started
B> **notify / notify-reload**：等服務透過 **sd_notify(3)** 送出 **READY=1** 才算 started；notify-reload 另外支援送 **SIGHUP** 來 reload
B> **oneshot**：**主 process 結束之後**才算完成；常搭配 **RemainAfterExit=yes**（結束後仍顯示 active）
B> 其他：forking（傳統 daemon 自己 fork 到背景）
?mt 配對 Type= 與「started」的時機：
> simple :: fork() 之後立刻
> exec :: 執行檔被 exec 成功之後
> notify :: 服務送出 READY=1 之後
> oneshot :: 主 process 結束之後
E> 投影片 Systemd service type。
?mc 一個只需執行一次的初始化腳本（跑完就結束），Type 最適合設為？
+ oneshot
- simple
- notify
- exec
E> oneshot 要等程式結束才算完成，排在它後面的 unit 才會開始。
?mc 用 Type=simple 時，若 ExecStart= 的執行檔路徑打錯，systemctl start 會？
+ 仍回報成功（fork 後就算 started），之後服務才變成 failed
- 立刻回報失敗
- 卡住直到逾時
- 自動改用 Type=exec
E> 這正是 exec 比 simple 好的地方：exec 失敗時 start 會直接回報錯誤。
?tf Type=notify 的服務必須主動送 READY=1，systemd 才會認為它啟動完成。
=T
E> 透過 sd_notify(3)；sshd 用的是 notify-reload。

@CARD systemd.restart | Restart= 重啟策略
A> Restart= 是「服務掛掉時要不要自動扶起來」的規則。always 是無條件扶；on-failure 是「不正常結束才扶」（最常用）；on-abnormal 不管 exit code 只看是不是被訊號殺、逾時、OOM；on-abort 只在被訊號打死時扶。
B> **no**：都不重啟（預設）
B> **always**：任何結束都重啟（包含正常 exit 0）
B> **on-success**：只有 **clean exit**（exit code 0 或 SuccessExitStatus）才重啟
B> **on-failure**：**非 0 exit code、被訊號殺、逾時、OOM** 都重啟（clean exit 不重啟）
B> **on-abnormal**：**被訊號殺、逾時、OOM**（exit code 非 0 不算）
B> **on-abort**：**只有被未捕捉的訊號殺掉**
B> 相關：RestartSec=（重啟前等多久）、StartLimitBurst= / StartLimitIntervalSec=（短時間重啟太多次就放棄）
?mc 服務以 exit 1 結束。下列哪個 Restart= 設定「不會」重啟它？
+ on-abnormal
- always
- on-failure
- 以上全部都會重啟
E> on-abnormal 只管 unclean signal、timeout、OOM；unclean exit code 不算。
?mc 服務被 OOM killer 殺掉，下列哪個設定不會重啟它？
+ on-abort
- on-failure
- on-abnormal
- always
E> 表格中 OOM 這一列：always、on-failure、on-abnormal 是 ✅，on-abort 與 on-success 是 ❌。
?mt 配對 Restart= 值：
> always :: 任何情況都重啟
> on-success :: 只有正常結束才重啟
> on-failure :: 非 0 exit、被訊號殺、逾時、OOM 都重啟
> on-abort :: 只有被訊號殺才重啟
E> 投影片 Systemd service restart policy 表格。
?fill 一般長駐服務最常用、但正常 exit 0 時不會被重啟的設定是 Restart=＿＿
= on-failure
E> on-failure 涵蓋非 0 exit、被訊號殺、逾時與 OOM，正常結束則不重啟。
?sa 請說明 systemd 的 Restart=on-failure、on-abnormal 與 on-abort 三者在下列四種情況下是否會重啟服務：(1) exit code 0 (2) exit code 1 (3) 被 SIGSEGV 殺掉 (4) 啟動逾時。
R> on-failure：(1) 不重啟 (2) 重啟 (3) 重啟 (4) 重啟。
R> on-abnormal：(1) 不重啟 (2) 不重啟 (3) 重啟 (4) 重啟。
R> on-abort：(1) 不重啟 (2) 不重啟 (3) 重啟（被未捕捉的訊號殺掉）(4) 不重啟。
R> 規律：on-failure 涵蓋所有非正常結束；on-abnormal 不管 exit code，只看訊號、逾時、OOM、watchdog；on-abort 只看訊號。
P> on-failure：exit 1、訊號、逾時都重啟，exit 0 不重啟
P> on-abnormal：只有訊號、逾時重啟
P> on-abort：只有被訊號殺才重啟

@CARD systemd.exec | Exec*= 與逾時
A> 服務的「上下班流程」：ExecStartPre 是上班前打卡準備，ExecStart 是主要工作，ExecStartPost 是開工後的收尾，ExecReload 是「重新讀設定」，ExecStop 是下班。前面加「-」代表「這步失敗沒關係，繼續走」。
B> **ExecStart=**：啟動服務時執行的指令（主 process）
B> **ExecStartPre= / ExecStartPost=**：在 ExecStart 之前 / 之後額外執行；前綴 **「-」** 代表**允許失敗、不影響後續**
B> **ExecReload=**：觸發重新載入設定（systemctl reload）
B> **ExecStop=**：停止服務的指令（沒寫就直接送 KillSignal=，預設 SIGTERM）
B> **TimeoutSec= / TimeoutStartSec= / TimeoutStopSec=**：等待啟動 / 停止的時間
B> 指令要用**絕對路徑**（或在 PATH 中）；不經過 shell，要用管線或 && 得寫 /bin/sh -c '…'
X> ExecStartPre=-/usr/lib/apt/apt-helper wait-online
X> ExecStart=/usr/lib/apt/apt.systemd.daily update
X> ExecReload=/bin/kill -HUP $MAINPID
?mc ExecStartPre=-/usr/bin/foo 中的「-」代表？
+ 這個指令失敗也不影響服務繼續啟動
- 以非 root 身分執行
- 在背景執行
- 只在第一次啟動時執行
E> Can be prefixed with a “-”, allowing this command to fail and not affect the rest。
?mt 配對 Exec 設定：
> ExecStart= :: 主要的啟動指令
> ExecStartPre= :: 主指令之前的準備工作
> ExecReload= :: systemctl reload 時執行
> ExecStop= :: 停止服務時執行
> TimeoutStopSec= :: 停止時最多等多久
E> ExecStartPre/Post 可加「-」允許失敗；沒寫 ExecStop 時預設送 SIGTERM。
?tf ExecStart=echo hi > /tmp/log 會由 shell 處理重導向，把 hi 寫進 /tmp/log。
=F
E> ExecStart 不經過 shell，> 會被當成普通參數；要寫 /bin/sh -c 'echo hi > /tmp/log'。

@CARD systemd.execenv | 執行環境：路徑、使用者、資源、目錄
A> systemd.exec 讓你在 unit 裡「布置員工的工作環境」：在哪間辦公室（WorkingDirectory、RootDirectory）、用誰的身分（User、DynamicUser）、多少資源（Limit*、Nice、CPU 排程）、文件放哪（RuntimeDirectory 等），不用在程式裡自己處理。
B> 路徑：**WorkingDirectory=**（工作目錄，相對於服務的 root）、**RootDirectory=**（服務的根目錄，類似 chroot，相對於 host 的 /）
B> 使用者：**User= / Group=**（**預設 root**）；**DynamicUser=** 啟動時動態配置 UID/GID，範圍 **61184–65519**
B> 資源：**LimitCPU=、LimitFSIZE=…**（soft / hard limit，例如 LimitCPU= 等同 **ulimit -t**）；**Nice=**；**CPUSchedulingPolicy=**（other、batch、idle、fifo、rr）；**CPUSchedulingPriority=**；**CPUAffinity=**（類似 taskset）
B> 目錄：**RuntimeDirectory=** → /run/、**StateDirectory=** → /var/lib/、**CacheDirectory=** → /var/cache/、**LogsDirectory=** → /var/log/、**ConfigurationDirectory=** → /etc/；RuntimeDirectory 預設停止時刪除，**RuntimeDirectoryPreserve=** 可保留
B> 這些目錄由 systemd 自動建立並設定好擁有者（配合 User=/DynamicUser= 很方便）
?mt 配對目錄設定與實際位置：
> RuntimeDirectory= :: /run/
> StateDirectory= :: /var/lib/
> CacheDirectory= :: /var/cache/
> LogsDirectory= :: /var/log/
> ConfigurationDirectory= :: /etc/
E> 投影片 Systemd exec - unit directories。
?mc 沒有設定 User= 的服務，會以哪個身分執行？
+ root
- nobody
- 與執行 systemctl 的使用者相同
- 動態配置的使用者
E> Default is root。所以服務最好明確設定 User= 或 DynamicUser=。
?mc DynamicUser=yes 的效果是？
+ 啟動時動態配置一組 UID/GID（61184–65519），服務停止後釋放
- 每次啟動都用目前登入的使用者
- 讓服務可以切換成任何使用者
- 在 /etc/passwd 永久新增一個使用者
E> 不需要預先 useradd，很適合不需要固定身分的服務。
?fill LimitCPU= 對應的 shell 指令是 ulimit ＿＿
= -t
E> ulimit -t 是 CPU 時間（秒）上限。
?mt 配對資源設定與功能：
> Nice= :: 預設的 nice 值（排程優先權）
> CPUSchedulingPolicy= :: 排程策略 other/batch/idle/fifo/rr
> CPUAffinity= :: 限制可以在哪些 CPU 上執行
> LimitFSIZE= :: 可建立檔案大小的上限
E> CPUAffinity 是 unit 版的 taskset；Nice 是 unit 版的 nice。

@CARD systemd.envio | Environment 與標準輸入輸出
A> Environment= 是在 unit 裡直接寫「便條」給程式；EnvironmentFile= 是「另外附一張設定單」，前面加「-」表示「找不到這張單也沒關係」。StandardOutput= 決定程式說的話要送到 journal、檔案還是丟掉。
B> **Environment=**：設定環境變數；值含空白要加引號：Environment="VAR1=word1 word2" "VAR2=word3"
B> **EnvironmentFile=**：從文字檔讀環境變數；前綴 **「-」** 代表**檔案不存在也可以**
B> **StandardInput=**：fd 0 接到 null、tty、file:path、socket、fd:name…
B> **StandardOutput= / StandardError=**：fd 1、2 接到 **inherit、null、journal、kmsg、file:path、append:path、truncate:path、socket、fd:name**
B> 預設 stdout/stderr 送到 **journal** → 用 journalctl -u 查看
X> EnvironmentFile=-/etc/default/haproxy
X> Environment="CONFIG=/etc/haproxy/haproxy.cfg" "PIDFILE=/run/haproxy.pid"
X> ExecStart=/usr/bin/haproxy -Ws -f $CONFIG -p $PIDFILE
X> StandardOutput=append:/var/log/myapp.log
?mc EnvironmentFile=-/etc/default/haproxy 的「-」代表？
+ 這個檔案不存在時不視為錯誤
- 從環境變數中移除這些設定
- 以唯讀方式讀取
- 只在 reload 時讀取
E> Optionally prefixed with “-”, allowing the file to be absent。
?fill 讓服務的 stdout 以「附加」方式寫到 /var/log/app.log：StandardOutput=＿＿
= append:/var/log/app.log
E> file: 會從頭覆寫，truncate: 每次啟動清空，append: 附加在後面。
?tf 服務的 stdout 預設會被丟棄，所以 journalctl 看不到程式印出的訊息。
=F
E> 預設送進 journal（StandardOutput=journal），用 journalctl -u <unit> 就看得到。

@CARD systemd.journald | systemd-journald
A> journald 是系統的「中央檔案室」：收集 kernel（kmsg）、syslog、各服務的輸出，存成有索引的結構化日誌，可以依服務、開機次數、優先等級快速查。存在 /var/log/journal 才會「永久保存」，存在 /run 的話重開機就沒了。
B> 收集 log 的系統服務：存成**結構化、有索引的 journal**
B> 來源：**kmsg**、**syslog**、**service unit** 的輸出…
B> **持久保存**：**/var/log/journal**；**揮發性**：**/run/log/journal**（**重開機就消失**）
B> Storage=auto（預設）：/var/log/journal 存在才持久保存 → mkdir 後即可持久化（設定在 /etc/systemd/journald.conf）
B> 常用查詢：journalctl **-u** unit、**-b**（本次開機）、**-f**（持續追蹤）、**-p err**、**--since "1 hour ago"**、**-k**（kernel）
?mc journal 存在 /run/log/journal 時有什麼特性？
+ 屬於揮發性儲存，重開機就消失
- 會自動上傳到遠端 syslog
- 只有 root 能寫入，所以永久保存
- 是二進位以外的純文字格式
E> Volatile in /run/log/journal, lost at reboot。
?fill journald 的持久保存位置是＿＿
= /var/log/journal
= /var/log/journal/
E> /run/log/journal 是揮發性的，重開機就消失。
?cmd 持續追蹤 nginx.service 的最新 log：
= journalctl -u nginx -f
= journalctl -fu nginx
= journalctl -u nginx.service -f
= journalctl -f -u nginx
E> -u 指定 unit、-f 持續追蹤（類似 tail -f）。
?cmd 只看「這次開機」中等級為 err 以上的訊息：
= journalctl -b -p err
= journalctl -p err -b
= journalctl -b -p 3
= journalctl -p 3 -b
E> -b 本次開機、-p err（= 3）表示 err 以上的優先等級。

@CARD systemd.timer | systemd.timer：用 systemd 跑週期性工作
A> timer 是「鬧鐘」，service 是「鬧鐘響了要做的事」。X.timer 預設會叫醒同名的 X.service；鬧鐘本身要掛在 timers.target 底下，開機時才會被設定好。比 cron 多了 log、依賴、補跑、隨機延遲等好處。
B> 用 systemd 控制**週期性工作**的方式（cron 的替代品）
B> **X.timer 會觸發 X.service**（可用 Unit= 指定其他 service）
B> 通常裝在 **timers.target** 底下：WantedBy=timers.target；multi-user.target ⇒ basic.target ⇒ timers.target
B> [Timer] 常用：**OnCalendar=**（日曆時間）、**RandomizedDelaySec=**（隨機延遲）、**Persistent=true**（關機錯過的下次開機補跑）；另有 OnBootSec=、OnUnitActiveSec=（相對時間）
B> 要 enable / start 的是 **.timer**，不是 .service；**systemctl list-timers** 看下次執行時間
X> # /lib/systemd/system/apt-daily.timer
X> [Timer]
X> OnCalendar=*-*-* 6,18:00
X> RandomizedDelaySec=12h
X> Persistent=true
X> [Install]
X> WantedBy=timers.target
?mc backup.timer 預設會啟動哪個 unit？
+ backup.service
- backup.target
- timers.service
- 必須在 [Timer] 用 Unit= 指定，否則不會啟動任何東西
E> A timer named X.timer will trigger X.service。
?mc 要讓 backup.timer 生效，正確作法是？
+ systemctl enable --now backup.timer
- systemctl enable --now backup.service
- 把 backup.service 加進 crontab
- systemctl daemon-reload 就會自動生效
E> 啟用的是 timer；service 通常沒有 [Install]，由 timer 觸發。
?mc Persistent=true 的作用是？
+ 機器關機期間錯過的執行時間，開機後會補跑一次
- timer 永遠不會被 disable
- 每次執行後保留 log 不刪
- service 執行完不會結束
E> 類似 anacron 的補跑機制。
?cmd 列出所有 timer 與下次觸發時間：
= systemctl list-timers
= systemctl list-timers --all
E> 會列出 NEXT、LEFT、LAST、PASSED 與對應的 unit；--all 也顯示未啟用的。
?sa 比較 cron 與 systemd timer：請列出 systemd timer 相對 cron 的三個優點，並寫出一個每天 03:00 執行 /usr/local/bin/backup.sh 的 timer 與 service unit。
R> 優點：(1) 執行輸出自動進 journal，可用 journalctl -u backup 查；(2) 可以用 systemd 的依賴與順序（After=network-online.target 等）及資源限制、User= 等執行環境設定；(3) Persistent=true 可補跑關機期間錯過的工作；(4) RandomizedDelaySec 可避免多台機器同時執行；(5) systemctl list-timers 可看下次執行時間，systemd-analyze calendar 可驗證時間格式。
R> backup.service：[Unit] Description=Daily backup；[Service] Type=oneshot、ExecStart=/usr/local/bin/backup.sh
R> backup.timer：[Unit] Description=Run backup daily；[Timer] OnCalendar=*-*-* 03:00:00、Persistent=true；[Install] WantedBy=timers.target
R> 啟用：systemctl daemon-reload；systemctl enable --now backup.timer
P> 至少三個正確優點（journal、依賴、補跑、隨機延遲、list-timers）
P> service 用 Type=oneshot 與 ExecStart
P> timer 用 OnCalendar=*-*-* 03:00 且 WantedBy=timers.target
P> enable 的是 .timer

@CARD systemd.calendar | OnCalendar 時間格式與 systemd-analyze
A> OnCalendar 的格式就是「星期 年-月-日 時:分:秒」，* 是「每一個」，逗號列出多個值。不確定寫得對不對？用 systemd-analyze calendar 讓它幫你算下一次觸發時間。
B> 格式：**weekday year-month-date hour:minute:second**，類似 cron 但順序是由大到小
B> `*-*-* 6:00`：每天 06:00；`*-*-* 6,18:00`：每天 06:00 與 18:00；`Mon *-*-* 00:00:00`：每週一午夜
B> 簡寫：**daily**（= `*-*-* 00:00:00`）、weekly、monthly、hourly
B> **RandomizedDelaySec=**：在觸發時間後隨機延遲，避免多台機器同時執行（例如同時打 apt 鏡像站）
B> **systemd-analyze calendar '…'**：檢查語法並顯示 Normalized form 與 **Next elapse**
X> $ systemd-analyze calendar '*-*-* 00:00:00'
X> Normalized form: *-*-* 00:00:00
X>     Next elapse: Mon 2025-10-27 00:00:00 CST
?mc OnCalendar=*-*-* 6,18:00 代表？
+ 每天 06:00 與 18:00
- 每月 6 日與 18 日
- 每 6 到 18 分鐘
- 每天 6:18
E> 時:分 位置寫 6,18:00。
?cmd 檢查 OnCalendar 字串 'Mon *-*-* 03:00' 的語法並顯示下次觸發時間：
= systemd-analyze calendar 'Mon *-*-* 03:00'
= systemd-analyze calendar "Mon *-*-* 03:00"
E> 輸出 Normalized form 與 Next elapse，可以確認寫法是否如預期。
?mc 公司 500 台機器都用 OnCalendar=daily 跑更新，造成鏡像站每天午夜被打爆。最直接的解法是？
+ 加上 RandomizedDelaySec=，把執行時間隨機分散
- 改成 Persistent=true
- 把 Type 改為 oneshot
- 改用 OnBootSec=
E> RandomizedDelaySec can prevent timers on multiple machines from executing at the same time。
?fill OnCalendar 寫「每天 03:30」：OnCalendar=*-*-* ＿＿
= 03:30
= 3:30
= 03:30:00
= 3:30:00
E> 格式是「年-月-日 時:分:秒」，秒數可省略。

@CARD systemd.template | Unit template：name@.service 與 %i
A> template 是「範本申請表」：wg-quick@.service 只寫一份，wg-quick@wg0、wg-quick@wg1 就能各自啟動一個實例，@ 後面的字（instance name）會被填進 %i。
B> unit 名稱可以帶**一個參數**，稱為 **instance name**
B> 檔名在前綴結尾要有**單一個「@」**：例如 **btrfs-scrub@.service**、**wg-quick@.service**
B> 使用時把參數放在 @ 後面：**systemctl start wg-quick@wg0**
B> unit 檔中用 **%i**（escaped）或 **%I**（unescaped）取得 instance name
B> 常見例子：getty@tty1.service、user@1000.service
X> # wg-quick@.service
X> [Service]
X> Type=oneshot
X> RemainAfterExit=yes
X> ExecStart=/usr/bin/wg-quick up %i
X> ExecStop=/usr/bin/wg-quick down %i
?mc 執行 systemctl start wg-quick@wg0 時，unit 檔中的 %i 會被替換成？
+ wg0
- wg-quick
- wg-quick@wg0.service
- 目前使用者名稱
E> @ 後面的字就是 instance name。
?cmd 讓 WireGuard 介面 wg0 開機自動啟動並立刻啟動（使用 wg-quick 的 template unit）：
= systemctl enable --now wg-quick@wg0
= systemctl enable --now wg-quick@wg0.service
E> HW0 的 WireGuard 就是這樣設定開機自動連線。
?tf template unit 的檔名必須包含一個 @，例如 foo@.service。
=T
E> 例如 wg-quick@.service、getty@.service；使用時寫 wg-quick@wg0。
?mc wg-quick@.service 使用 Type=oneshot 與 RemainAfterExit=yes 的原因是？
+ wg-quick up 執行完就結束，但希望介面建立後 unit 仍顯示 active，stop 時才執行 down
- 讓 wg-quick 在背景長駐
- 讓失敗時自動重試
- 讓多個實例共用同一個 process
E> 沒有 RemainAfterExit 的話，oneshot 跑完就變 inactive，stop 時不會執行 ExecStop。

@CARD systemd.examples | 讀懂真實 unit：sshd、haproxy、apt-daily
A> 讀別人的 unit 就像讀履歷：sshd 的 KillMode=process 讓「停 sshd 時不要把正在連線的 SSH session 一起殺掉」；haproxy 用 SuccessExitStatus=143 告訴 systemd「被 SIGTERM 正常關掉不算失敗」；apt-daily 用 ConditionACPower 讓筆電沒插電時不更新。
B> **sshd**：Type=notify-reload、Restart=always、**KillMode=process**（停止時只殺主 process，已建立的 SSH 連線保留）
B> **haproxy**：EnvironmentFile=-…、多行 ExecReload=、**KillMode=mixed**（SIGTERM 給主 process，最後 SIGKILL 給全部）、**SuccessExitStatus=143**（128+15，被 SIGTERM 結束視為成功）、Type=notify
B> **apt-daily.service**：Type=oneshot、**ConditionACPower=true**（有接電源才執行）、ExecStartPre=-…wait-online
B> **apt-daily.timer**：OnCalendar=*-*-* 6,18:00、RandomizedDelaySec=12h、Persistent=true
B> **$MAINPID**：unit 檔中代表主 process 的 PID（ExecReload=/bin/kill -USR2 $MAINPID）
?mc sshd.service 設定 KillMode=process 的目的？
+ 重啟或停止 sshd 時只殺主 process，不會切斷使用者已經建立的 SSH 連線
- 讓 sshd 只能有一個 process
- 讓 sshd 被 kill 時自動重啟
- 讓每個 SSH 連線都成為獨立的 service
E> 預設 KillMode=control-group 會殺掉整個 cgroup，包括你的登入 session。
?fill haproxy 設定 SuccessExitStatus=143，因為被 SIGTERM（編號 15）結束時 exit status 是 128 + 15 = ＿＿
= 143
E> 被訊號 N 結束的 shell exit status 慣例是 128+N。
?mc ConditionACPower=true 的效果是？
+ 只有在接上外部電源時才啟動這個 unit，否則跳過（不算失敗）
- 斷電時自動關機
- 啟動時需要使用者確認
- 偵測到 UPS 才執行
E> Condition*= 不成立時 unit 會被略過，不會標記為 failed。

@CARD systemd.tools | systemd 家族的其他工具
A> systemd 把很多零散的系統設定變成「XXXd 服務 + XXXctl 遙控器」的組合：要改主機名就找 hostnamectl，時間找 timedatectl，DNS 找 resolvectl，使用者登入找 loginctl。
B> **hostnamectl**（systemd-hostnamed）：主機名稱
B> **timedatectl**（systemd-timedated、systemd-timesyncd）：時間、時區、NTP 校時
B> **localectl**（systemd-localed）：語系與鍵盤配置
B> **loginctl**（systemd-logind）：使用者 session、seat
B> **networkctl**（systemd-networkd）、**resolvectl**（systemd-resolved）：網路與 DNS 名稱解析
B> 其他：**systemd-sysusers**（建立系統帳號）、**bootctl**（systemd-boot）、**machinectl / systemd-nspawn**（輕量容器）
?mt 配對要做的事與工具：
> 修改主機名稱 :: hostnamectl
> 設定時區與 NTP :: timedatectl
> 查詢某網卡用的 DNS 伺服器 :: resolvectl
> 列出登入中的 session :: loginctl
> 設定語系 :: localectl
E> systemd 的工具大多是「XXXd 服務 + XXXctl 指令」的組合。
?cmd 把系統時區設為 Asia/Taipei：
= timedatectl set-timezone Asia/Taipei
E> timedatectl 也能用 set-ntp true 開啟網路校時。
?cmd 把主機名稱改成 sa-vm：
= hostnamectl set-hostname sa-vm
= hostnamectl hostname sa-vm
E> 會寫入 /etc/hostname，不必手動編輯檔案。

@CARD systemd.p_debug | 實作：自己寫的服務起不來怎麼查
A> 服務起不來時按這個順序問：systemd 有讀到最新的檔嗎（daemon-reload）？它說了什麼（status、journalctl）？指令本身能不能跑（手動用同一個使用者執行）？是不是權限、路徑、環境變數不同？
B> 改完檔 → **systemctl daemon-reload** → **systemctl restart x** → **systemctl status x**（看 Active、Main PID、最後幾行 log）
B> 詳細 log：**journalctl -u x -b -e**；看依賴：**systemctl list-dependencies x**
B> 驗證語法：**systemd-analyze verify /etc/systemd/system/x.service**
B> 常見原因：ExecStart 不是**絕對路徑**、用了 shell 語法（| > &&）卻沒包 sh -c、**User=** 沒權限讀檔、環境變數（PATH、HOME）跟互動式 shell 不同、Type 選錯（forking 的程式配 simple 會立刻「結束」）
B> 一直重啟後停住：**start-limit-hit** → 修好後 **systemctl reset-failed x**
X> $ systemd-analyze verify /etc/systemd/system/myapp.service
X> $ sudo -u myapp /opt/myapp/bin/server   # 用服務的身分手動跑跑看
X> $ systemctl reset-failed myapp
?ord 服務改完設定後的檢查順序：
> systemctl daemon-reload
> systemctl restart myapp
> systemctl status myapp
> journalctl -u myapp -b -e
E> 先讓 systemd 讀到新設定，再重啟、看狀態、看詳細 log。
?cmd 檢查 /etc/systemd/system/myapp.service 有沒有語法或設定錯誤：
= systemd-analyze verify /etc/systemd/system/myapp.service
E> 能抓出未知的設定鍵、找不到的執行檔等錯誤。
?mc 服務在短時間內一直崩潰，status 顯示 start request repeated too quickly，修好程式之後還要做什麼才能再啟動？
+ systemctl reset-failed myapp 清除失敗計數，再 start
- 重新開機
- systemctl mask myapp
- 刪掉 unit 檔重寫
E> 觸發 StartLimitBurst 後會進入 start-limit-hit 狀態。
?mc 手動在 shell 執行 ExecStart 的指令都正常，用 systemd 啟動卻說找不到某個指令。最可能的原因？
+ systemd 服務的環境變數（如 PATH）和互動式 shell 不同，不會讀 ~/.bashrc
- systemd 不支援執行 shell script
- 需要先 systemctl enable 才能執行
- 服務必須用 Type=forking
E> 服務環境很乾淨：用絕對路徑或在 Environment= 設 PATH。

@CARD systemd.p_query | 實作：給腳本用的 systemctl 查詢
A> 寫腳本或檢查作業時，不要用眼睛讀 systemctl status 的彩色輸出，而是問「是或不是」的問題：is-active、is-enabled、is-failed，它們用 exit code 回答，最適合放進 if。
B> **systemctl is-active x**：active 回 0；**is-enabled x**：enabled 回 0；**is-failed x**：failed 回 0；加 **-q** 不印字
B> **systemctl --failed**（= list-units --state=failed）：一眼看出哪些 unit 壞掉
B> **systemctl list-unit-files --state=enabled**：哪些會開機自動啟動
B> **systemctl show x -p ActiveState,SubState,MainPID,ExecMainStatus**：取單一屬性（-p 指定、--value 只印值）
B> **systemctl list-units --type=service**：目前載入的服務；**--all** 連 inactive 也列
X> if systemctl is-active -q nginx; then echo up; fi
X> systemctl show sftp_watchd -p MainPID --value
X> systemctl --failed
?cmd 安靜地（不印出文字）檢查 nginx 是否正在執行，只用 exit code 表示結果：
= systemctl is-active -q nginx
= systemctl is-active --quiet nginx
= systemctl -q is-active nginx
= systemctl --quiet is-active nginx
E> 0 代表 active，適合寫在 if 或 && 後面。
?cmd 列出所有處於 failed 狀態的 unit：
= systemctl --failed
= systemctl list-units --failed
= systemctl list-units --state=failed
E> 開機後第一個該跑的檢查指令。
?mc 想在腳本裡取得 myapp.service 的主 process PID（只要數字），最合適的是？
+ systemctl show myapp -p MainPID --value
- systemctl status myapp | grep PID
- pidof systemctl
- cat /run/myapp.pid
E> show 輸出 key=value，--value 只留下值；status 的格式是給人看的，不適合解析。

@CARD systemd.p_analyze | 實作：systemd-analyze 開機與安全分析
A> systemd-analyze 是 systemd 的「健檢報告」：開機哪一段最慢（blame、critical-chain）、時間格式寫對沒（calendar）、unit 寫對沒（verify）、服務有多少攻擊面（security）。
B> **systemd-analyze**：總開機時間（firmware、loader、kernel、userspace）
B> **systemd-analyze blame**：各 unit 啟動花多久（由慢到快）
B> **systemd-analyze critical-chain [unit]**：卡住開機的那條關鍵路徑
B> **systemd-analyze verify 檔案**、**calendar '…'**、**timespan '1h30m'**
B> **systemd-analyze security [unit]**：依沙箱設定給服務打「暴露分數」
?mt 配對 systemd-analyze 子指令：
> blame :: 列出每個 unit 啟動花費的時間
> critical-chain :: 顯示決定開機時間的關鍵依賴鏈
> verify :: 檢查 unit 檔錯誤
> calendar :: 驗證 OnCalendar 時間格式
> security :: 評估服務的沙箱與暴露程度
E> blame 只看單一 unit 的耗時；真正拖慢開機的要看 critical-chain（平行啟動時慢的不一定擋路）。
?mc 開機變慢時，為什麼 critical-chain 比 blame 更能找出真正的瓶頸？
+ unit 大多平行啟動，耗時長的 unit 不一定擋住其他人；critical-chain 只顯示真正位在等待路徑上的 unit
- blame 只顯示 kernel 的時間
- critical-chain 會自動修正問題
- blame 不包含 service
E> 例如 apt-daily 花 30 秒但沒人等它，就不影響登入時間。
?cmd 列出各 unit 開機時啟動花費的時間：
= systemd-analyze blame
E> 由耗時最長的排到最短。

@CARD systemd.p_socket | 實作：Socket 與 Path activation
A> socket activation 是「先派總機接電話，有人打來才叫醒員工」：systemd 先替服務佔住 port，有連線時才啟動服務。所以 port 是寫在 .socket 裡，而不是服務自己的設定檔，這點在改 SSH port 時特別容易踩雷。
B> **foo.socket** 監聽（ListenStream=22），有連線時啟動 **foo.service**；開機快、服務可以晚點起來
B> **ssh.socket**：有些發行版（如 Ubuntu 新版）用它啟動 sshd，此時**監聽的 port 由 ssh.socket 的 ListenStream 決定**，sshd_config 的 Port 可能不是唯一依據
B> 檢查：**systemctl status ssh.socket ssh.service**、**ss -tlnp** 看是誰在聽（systemd 或 sshd）
B> **foo.path**：監看檔案或目錄（PathChanged=、PathExists=、DirectoryNotEmpty=），條件成立就啟動 foo.service
B> 投影片的 list-dependencies 也看得到 **.path**（systemd-ask-password-wall.path）、**.mount**（tmp.mount）、**.slice** 等其他 unit 類型
X> # 監看 /srv/inbox，有新檔就跑處理程式
X> # inbox.path
X> [Path]
X> PathChanged=/srv/inbox
X> [Install]
X> WantedBy=multi-user.target
?mc 把 sshd_config 改成 Port 22 並 reload，但 ss -tlnp 顯示 2222 仍被 systemd 監聽。最可能的原因？
+ 系統使用 ssh.socket 做 socket activation，監聽的 port 寫在 ssh.socket 的 ListenStream=
- sshd_config 語法錯誤
- 需要重開機
- 2222 是 Docker 佔用的
E> HW2 要求只聽 22：除了 sshd_config，也要檢查 ssh.socket 與 sshd_config.d/。
?mt 配對 unit 類型：
> .socket :: 有連線時才啟動對應的 service
> .path :: 監看的檔案或目錄變動時啟動 service
> .mount :: 由 systemd 管理的掛載點
> .timer :: 定時啟動 service
E> Linux 上每種 unit 類型都由副檔名區分，常見的還有 .slice、.scope、.target、.device。
?tf ss -tlnp 顯示某個 port 的 process 是 systemd，代表那個 port 可能是 socket activation 由 systemd 代為監聽。
=T
E> 有連線進來時 systemd 才把 socket 交給真正的服務。

@CARD systemd.p_mount | 實作：fstab 也是 systemd unit
A> 開機時 systemd 會把 /etc/fstab 每一行「翻譯」成一個 .mount unit（由 fstab generator 產生）。所以改完 fstab 要 daemon-reload，否則 systemd 還拿著舊版翻譯；而 fstab 某行壞掉，開機就可能卡進 emergency mode。
B> **systemd-fstab-generator** 把 fstab 轉成 .mount unit：/mnt/hw2/sftp → **mnt-hw2-sftp.mount**（路徑的 / 變成 -）
B> 改 fstab 後：**systemctl daemon-reload**，再 **mount -a** 測試；**findmnt --verify** 檢查語法
B> 掛載失敗（裝置不存在）預設會讓開機進 **emergency mode**；非必要的磁碟加 **nofail**
B> 服務需要某個掛載點存在：**RequiresMountsFor=/mnt/hw2/sftp**（自動加上 Requires + After 對應的 .mount）
B> 其他選項：**x-systemd.automount**（第一次存取才掛）、x-systemd.device-timeout=
X> systemctl status mnt-hw2-sftp.mount
X> findmnt --verify
X> # sftp_watchd.service
X> [Unit]
X> RequiresMountsFor=/mnt/hw2/sftp
?fill /mnt/hw2/pool1 對應的 systemd mount unit 名稱是 ＿＿.mount
= mnt-hw2-pool1
E> 開頭的 / 省略，其餘的 / 換成 -（含特殊字元時用 systemd-escape -p 轉換）。
?mc 監看 /mnt/hw2/sftp 的 sftp_watchd 在開機時比掛載更早啟動、結果監看到空目錄。最正確的修法？
+ 在 [Unit] 加 RequiresMountsFor=/mnt/hw2/sftp
- 在 ExecStartPre 加 sleep 30
- 改用 Type=oneshot
- 在 crontab 用 @reboot 啟動
E> RequiresMountsFor 會自動加上對應 .mount 的依賴與順序。
?mc 在 fstab 加了一個 USB 硬碟的掛載，但開機時沒插 USB，系統直接進 emergency mode。應該怎麼調整？
+ 在該行選項加 nofail
- 把 pass 欄位改成 2
- 改成 x-systemd.automount 以外的任何選項都沒用，只能刪掉
- 把它移到 /etc/rc.local
E> nofail：掛不上也不影響開機；常與 x-systemd.device-timeout= 搭配。
?cmd 檢查 /etc/fstab 的語法與設定是否有問題：
= findmnt --verify
= sudo findmnt --verify
E> 加 --verbose 會顯示每一行的檢查結果。

@CARD systemd.p_kill | 實作：停止服務時發生什麼事（KillMode）
A> systemctl stop 的流程像「下班廣播」：先執行 ExecStop（如果有），再對 process 送 KillSignal（預設 SIGTERM）請它收拾；等 TimeoutStopSec（預設 90 秒）還沒走，就送 SIGKILL 強制清場。KillMode 決定廣播給「誰」。
B> 停止流程：**ExecStop=** → 送 **KillSignal=**（預設 **SIGTERM**）→ 等 **TimeoutStopSec=**（預設 90s）→ 仍在就送 **SIGKILL**（SendSIGKILL=yes）
B> **KillMode=control-group**（預設）：cgroup 裡**所有** process 都收到訊號
B> **KillMode=mixed**：SIGTERM 只給主 process，最後的 SIGKILL 給整個 cgroup
B> **KillMode=process**：只殺主 process（sshd 用它保留既有連線）；**none**：不建議
B> 手動送訊號：**systemctl kill -s HUP x**（也可 --kill-whom=main）
X> systemctl kill -s SIGHUP nginx
X> systemctl show nginx -p KillMode,KillSignal,TimeoutStopUSec
?ord 預設情況下 systemctl stop 的順序：
> 執行 ExecStop=（若有設定）
> 對 cgroup 內 process 送 SIGTERM
> 等待 TimeoutStopSec
> 仍未結束則送 SIGKILL
E> 這也是 trap TERM 能做清理的原因：先收到的是 SIGTERM。
?mt 配對 KillMode：
> control-group :: 預設，cgroup 內所有 process 都收到訊號
> mixed :: SIGTERM 給主 process，SIGKILL 給全部
> process :: 只對主 process 送訊號
E> none 不會殺任何 process，留下的 process 容易失控，不建議使用。
?cmd 對 nginx.service 的 process 送 SIGHUP（讓它重新讀設定）：
= systemctl kill -s HUP nginx
= systemctl kill -s SIGHUP nginx
= systemctl kill --signal=HUP nginx
= systemctl kill --signal=SIGHUP nginx
= systemctl kill -s HUP nginx.service
E> 一般重新讀設定用 systemctl reload 更好（會執行 ExecReload）。

@CARD systemd.p_foreground | 實作：daemon 要跑在前景（-D、-f、-n）
A> 傳統 daemon 會「自己 fork 到背景再讓爸爸離開」，systemd 要猜哪個才是主 process，很麻煩。現代作法是叫 daemon「別躲到背景」（前景模式），讓 systemd 直接當它的爸爸，最乾淨。投影片 cgroup 樹裡的 sshd -D、cron -f、rsyslogd -n 都是前景模式。
B> 前景旗標：**sshd -D**、**cron -f**、**rsyslogd -n**、nginx 的 daemon off;、dbus-daemon --nofork
B> 前景執行 + **Type=simple / exec / notify**：主 process 就是 ExecStart 啟動的那一個，最好管理
B> 傳統背景 daemon：**Type=forking** + **PIDFile=**（systemd 讀 PID 檔判斷主 process）
B> 自己寫的服務（例如 sftp_watchd）**不要自己 daemonize**（不要 &、nohup、setsid），直接在前景跑，輸出到 stdout/stderr 就會進 journal
B> 輸出被 buffer：Python 用 **python3 -u** 或 PYTHONUNBUFFERED=1，否則 journalctl 可能很久才看到 log
?mc 自己寫的 bash daemon 在腳本最後用 while 迴圈 & 丟到背景，搭配 Type=simple。會發生什麼？
+ 腳本的主 process 立刻結束，systemd 認為服務已停止並清掉整個 cgroup（迴圈也被殺）
- 一切正常
- systemd 會自動改成 Type=forking
- 迴圈會變成 PID 1 的子行程繼續跑
E> 在 systemd 底下不要自己 daemonize，直接前景執行。
?mc Python 寫的服務用 print() 輸出 log，但 journalctl -u 很久都看不到。最可能的原因？
+ stdout 不是 tty 時 Python 會 buffer 輸出，要用 python3 -u、flush=True 或 PYTHONUNBUFFERED=1
- journald 只收 stderr
- 要先 systemctl enable 才有 log
- print 不會寫到 stdout
E> 同理，C 程式可能要 setvbuf 或 fflush。
?mt 配對前景執行的旗標：
> sshd :: -D
> cron :: -f
> rsyslogd :: -n
E> 投影片 CGroup 樹中可以看到這些參數。

@CARD systemd.p_user | 實作：User units 與 linger
A> 每個登入的使用者也有一個自己的小 systemd（user@UID.service），可以用 systemctl --user 管自己的服務，不需要 root。但使用者登出後它會跟著關掉，除非開啟 linger（「人走了也幫他留燈」）。
B> 使用者自己的服務：**systemctl --user start/enable x**，unit 放 **~/.config/systemd/user/**
B> 每位登入使用者有 **user@UID.service**，cgroup 在 user.slice/user-UID.slice
B> 登出後 user manager 會停止 → 要開機就跑、登出也不停：**loginctl enable-linger 使用者**
B> 查看 log：**journalctl --user -u x**
?cmd 讓使用者 alice 的 user units 在她沒有登入時也能執行（開機即啟動）：
= loginctl enable-linger alice
= sudo loginctl enable-linger alice
E> linger 狀態存在 /var/lib/systemd/linger/。
?mc 一般使用者想讓自己的服務開機自動啟動、不需要 root，該怎麼做？
+ 寫在 ~/.config/systemd/user/ 並 systemctl --user enable，再由管理員開啟 loginctl enable-linger
- 寫進 /etc/systemd/system 再 enable
- 放進 /etc/rc.local
- 一般使用者無法做到
E> User unit 的搜尋路徑包含 ~/.config/systemd/user（$XDG_CONFIG_HOME）。

@CARD systemd.p_run | 實作：systemd-run 與暫時性 unit
A> systemd-run 是「臨時工」：不用寫 unit 檔，直接把一個指令包成暫時的 service 或 scope，順便套上資源限制。很適合拿來實驗 cgroups：例如讓一個吃記憶體的程式在 100M 的籠子裡跑，看它被 OOM kill。
B> **systemd-run 指令**：建立暫時的 .service 在背景執行（名稱如 run-u123.service）
B> **--scope**：在目前終端機前景執行，但放進新的 .scope cgroup
B> **-p 屬性=值**：套用資源限制，例如 **-p MemoryMax=100M**、**-p CPUQuota=20%**
B> **--on-calendar=… / --on-active=5m**：建立暫時 timer（一次性排程，類似 at）
B> **--user**：以使用者的 manager 執行
X> sudo systemd-run --scope -p MemoryMax=100M -p CPUQuota=20% stress --vm 1 --vm-bytes 200M
X> sudo systemd-run --on-active=10m /usr/local/bin/backup.sh
?cmd 在新的 scope 中以最多 100M 記憶體的限制執行 ./memhog：
= systemd-run --scope -p MemoryMax=100M ./memhog
= sudo systemd-run --scope -p MemoryMax=100M ./memhog
= systemd-run -p MemoryMax=100M --scope ./memhog
E> 超過 100M 就會在該 scope 內觸發 OOM kill，不影響其他程式。
?mc systemd-run --on-active=10m backup.sh 的效果最接近哪個傳統工具？
+ at（一次性延後執行）
- cron
- nice
- nohup
E> 它建立一個暫時的 timer，10 分鐘後觸發一次。

@CARD systemd.p_harden | 實作：服務沙箱化（Hardening）
A> 給服務「最小的房間」：只能寫它需要的資料夾、看不到別人的 /home、/tmp 是自己獨立的、不能透過 setuid 偷升權限。就算服務被攻破，攻擊者能碰到的東西也很少。systemd-analyze security 會幫你打分數。
B> **NoNewPrivileges=yes**：不能透過 setuid / file capabilities 提升權限
B> **PrivateTmp=yes**：服務有自己獨立的 /tmp、/var/tmp
B> **ProtectSystem=strict**：整個檔案系統唯讀，只開放 **ReadWritePaths=** 列出的路徑；full 只保護 /usr、/boot、/etc
B> **ProtectHome=yes**：看不到 /home、/root、/run/user
B> **CapabilityBoundingSet=**、**AmbientCapabilities=CAP_NET_BIND_SERVICE**（非 root 綁 80 port）、**User=** / **DynamicUser=**
B> 評分：**systemd-analyze security 服務**（數字越低越安全）
X> [Service]
X> User=app
X> NoNewPrivileges=yes
X> PrivateTmp=yes
X> ProtectSystem=strict
X> ReadWritePaths=/var/lib/app
X> ProtectHome=yes
?mt 配對 hardening 選項：
> NoNewPrivileges=yes :: 禁止透過 setuid 提升權限
> PrivateTmp=yes :: 服務擁有獨立的 /tmp
> ProtectSystem=strict :: 整個檔案系統唯讀（除了 ReadWritePaths）
> ProtectHome=yes :: 看不到使用者家目錄
> AmbientCapabilities=CAP_NET_BIND_SERVICE :: 非 root 也能綁定 1024 以下的 port
E> 這些選項由 systemd 透過 namespace、mount 與 capability 實作，不需要改程式碼。
?mc 服務設定了 PrivateTmp=yes。另一個程式在 /tmp/foo 放了檔案，服務讀得到嗎？
+ 讀不到，服務看到的是自己專屬的 /tmp
- 讀得到，PrivateTmp 只影響寫入
- 只有 root 讀得到
- 要看檔案權限
E> 這也是「服務寫到 /tmp 的檔案，自己在 shell 找不到」的常見原因。
?tf ProtectSystem=strict 時，服務若要寫入 /var/lib/app，必須用 ReadWritePaths= 或 StateDirectory= 開放。
=T
E> StateDirectory=app 會自動建立並開放 /var/lib/app。

@CARD systemd.p_journal2 | 實作：journal 的空間、格式與欄位過濾
A> journal 會越長越大，要會「量體重、減肥」：--disk-usage 看用量、--vacuum 刪舊的。它是結構化的，每筆都有欄位（_PID、_SYSTEMD_UNIT、SYSLOG_IDENTIFIER），可以用欄位精準過濾，輸出也能變成 JSON。
B> 用量：**journalctl --disk-usage**；清理：**--vacuum-size=200M**、**--vacuum-time=2weeks**；上限設定：journald.conf 的 **SystemMaxUse=**
B> 持久化：**Storage=persistent**（或建立 /var/log/journal）後 **systemctl restart systemd-journald**
B> 欄位過濾：**journalctl _PID=1234**、**_SYSTEMD_UNIT=ssh.service**、**SYSLOG_IDENTIFIER=internal-sftp**（= **-t internal-sftp**）、**_UID=1000**
B> 時間：**--since "2026-11-16 10:00" --until "1 hour ago"**；看上次開機：**-b -1**；列出開機紀錄：**--list-boots**
B> 輸出格式：**-o json-pretty**、**-o cat**（只印訊息）、**-o verbose**（看全部欄位）；**-n 50**、**--no-pager**
B> journald 也可轉給 rsyslog（**ForwardToSyslog=** 或 rsyslog 的 imjournal）
X> journalctl --disk-usage
X> sudo journalctl --vacuum-time=7d
X> journalctl -t internal-sftp -o verbose -n 1
X> journalctl -b -1 -p warning
?cmd 把 journal 刪到只剩最近兩週的紀錄：
= journalctl --vacuum-time=2weeks
= sudo journalctl --vacuum-time=2weeks
= journalctl --vacuum-time=14d
= sudo journalctl --vacuum-time=14d
= journalctl --vacuum-time=2w
E> 也可以用 --vacuum-size= 依大小清理。
?mc journalctl -t internal-sftp 是依哪個欄位過濾？
+ SYSLOG_IDENTIFIER（程式送 syslog 時的識別字）
- _SYSTEMD_UNIT
- _PID
- PRIORITY
E> HW2 的 sftp log 就是靠這個欄位分出 internal-sftp 與 sftp-server。
?cmd 查看「上一次」開機的 journal 紀錄：
= journalctl -b -1
= journalctl --boot=-1
= journalctl --boot -1
E> 先用 --list-boots 看有幾次開機紀錄（需持久化才會跨開機保存）。
?cmd 查看目前 journal 佔用的磁碟空間：
= journalctl --disk-usage
= sudo journalctl --disk-usage
E> --vacuum-* 只會刪已封存的 journal 檔，正在寫入的不會被刪。

@CARD systemd.p_cgdebug | 實作：用 cgroup 檔案查資源問題
A> 服務被殺了卻不知道為什麼？去 cgroup 的「事件簿」翻：memory.events 記錄撞到上限幾次、被 OOM kill 幾次。cgroup.controllers 告訴你這層有哪些控制器可用，subtree_control 決定子層能不能用。
B> **cgroup.controllers**：這個 cgroup **可用**的 controller（cpu io memory pids…）
B> **cgroup.subtree_control**：開放給**子 cgroup**的 controller（寫 +memory 啟用）
B> **memory.current**：目前用量；**memory.events**：**high**（超過 MemoryHigh 次數）、**max**、**oom**、**oom_kill** 計數
B> **memory.stat**、**cpu.stat**（usage_usec、**nr_throttled**、throttled_usec → CPUQuota 造成的節流）、**pids.current / pids.max**
B> 被 OOM kill 的證據也會出現在 **journalctl -k**（kernel log：Out of memory: Killed process …）與 systemctl status（Result: oom-kill）
X> cat /sys/fs/cgroup/system.slice/myapp.service/memory.events
X> cat /sys/fs/cgroup/system.slice/myapp.service/cpu.stat
X> journalctl -k | grep -i 'out of memory'
?mc 懷疑 myapp.service 被 MemoryMax 限制而遭 OOM kill，該看 cgroup 的哪個檔案？
+ memory.events 的 oom_kill 計數
- cgroup.procs
- cpu.max
- cgroup.subtree_control
E> oom_kill 大於 0 表示該 cgroup 內有 process 被 OOM killer 殺過。
?mc 服務設定 CPUQuota=20% 後變很慢，想確認是不是被節流，可以看？
+ cpu.stat 中的 nr_throttled 與 throttled_usec
- memory.current
- cgroup.events 的 populated
- pids.max
E> 次數持續增加就代表一直撞到 CPU 配額。
?mt 配對 cgroup 檔案：
> cgroup.controllers :: 這層可用的 controller
> cgroup.subtree_control :: 開放給子 cgroup 的 controller
> memory.events :: 撞上限與 OOM kill 的次數
> pids.current :: 目前的 process 數
E> 投影片 cgroups v2 interface 的延伸。

@CARD systemd.p_timer2 | 實作：timer 的各種時間與測試方法
A> 除了「日曆鬧鐘」（OnCalendar），timer 還有「計時器」：開機後幾分鐘（OnBootSec）、上次跑完後隔多久（OnUnitActiveSec）。測試時別傻等，直接 systemctl start 對應的 service 看會不會成功，再看 list-timers 確認下次時間。
B> 單調時間（相對）：**OnBootSec=5min**、**OnStartupSec=**、**OnActiveSec=**、**OnUnitActiveSec=1h**（上次啟動後隔多久）、**OnUnitInactiveSec=**
B> **AccuracySec=**：觸發時間的誤差容許（預設 1 分鐘，為了合併喚醒省電）；需要精準時設 1s
B> 測試：**systemctl start x.service** 先確認工作本身正確 → **systemctl list-timers x.timer** 看 NEXT
B> timer 觸發的 service 一般**沒有 [Install]**，不需要 enable service
B> 與 cron 對照：cron 的 log 在 syslog；timer 的 log 在 **journalctl -u x.service**
X> [Timer]
X> OnBootSec=5min
X> OnUnitActiveSec=1h
X> AccuracySec=1s
?mt 配對 timer 設定：
> OnCalendar= :: 依日曆時間觸發
> OnBootSec= :: 開機後經過多久觸發
> OnUnitActiveSec= :: 該 service 上次啟動後經過多久再觸發
> AccuracySec= :: 觸發時間允許的誤差
E> OnCalendar 是「牆上的時鐘」，On*Sec 是「碼錶」，兩者可以同時寫在一個 timer 裡。
?mc 每小時要執行一次清理，但不在乎是整點，只要「開機 5 分鐘後開始、之後每隔一小時」。最適合的設定是？
+ OnBootSec=5min 搭配 OnUnitActiveSec=1h
- OnCalendar=hourly 搭配 Persistent=true
- OnCalendar=*-*-* 05:00
- RandomizedDelaySec=1h
E> 單調時間計時器不受時鐘調整影響。
?mc timer 設定 OnCalendar=*-*-* 10:00:00，log 卻顯示 10:00:42 才執行。原因？
+ AccuracySec 預設 1 分鐘，systemd 會在容許範圍內合併喚醒
- 系統時間錯誤
- service 啟動很慢
- RandomizedDelaySec 預設 42 秒
E> 需要精準到秒就設 AccuracySec=1s。

<script type="text/plain" class="sa-src" data-ch="fs">
@CH fs | 檔案系統與權限 | 📁 | 10_FileSystem.pdf

@CARD fs.lsl | 讀懂 ls -l
A> ls -l 的一行就是檔案的「身分證」：類型 + 權限、連結數、擁有者、群組、大小、修改時間、名字。
B> drwx--x--x 7 tsaimh dcs 1024 Sep 22 17:25 public_html
B> **d**：檔案類型；**rwx--x--x**：存取權限（user / group / other）
B> **7**：連結數（link count）
B> **tsaimh**：擁有者；**dcs**：群組
B> **1024**：大小；**Sep 22 17:25**：最後修改時間；最後是檔名
?mc 在 -rw-r--r-- 2 amy staff 512 Oct 1 a.txt 中，2 代表？
+ hard link 數（指向同一個 inode 的名稱數）
- 檔案版本
- 擁有者的 UID
- 區塊數
E> 兩個檔名共用一個 inode。

@CARD fs.arch | 檔案系統架構與四大元件
A> 應用程式不直接碰硬碟，而是透過 system call 請 kernel 幫忙；kernel 再透過 VFS（統一的櫃台）轉給各種檔案系統（ext4、msdos、proc…）和驅動程式。
B> Application ↔（system call）↔ Kernel ↔（driver）↔ Hardware
B> Kernel 中：**Virtual File System (VFS)** → 各檔案系統（ext2、msdos、proc…）→ buffer cache → device drivers
B> 檔案系統四大元件：**Namespace**（命名與階層，如目錄）、**API**（操作的 system calls）、**Security model**（權限）、**Implementation**（對應到實體磁碟的程式碼）
B> cp file1 file2 的 system call 序列：open 輸入 → create 輸出 → 迴圈 read / write 直到 EOF → close
B> 檔案系統裡不只有檔案：目錄、裝置檔、process 資訊（/proc）、IPC、shared memory → 統一用 open、read、write、close、seek、ioctl、fcntl 存取
?mt 配對檔案系統四大元件：
> Namespace :: 命名與階層結構（目錄）
> API :: 操作節點的 system calls
> Security model :: 保護、隱藏與分享（權限）
> Implementation :: 把邏輯模型對應到磁碟的程式碼
E> 這四個是 filesystem 的基本目的。

@CARD fs.path | Pathname
A> 絕對路徑是「從國家開始寫的完整地址」（從 / 開始）；相對路徑是「從你現在站的地方開始指路」。
B> **絕對路徑**：從 / 開始，例 /net/dcs/93/9317807/test/haha.c
B> **相對路徑**：從目前目錄開始，例 test/haha.c
B> 限制（投影片）：單一元件 ≤ **255** 字元；單一絕對路徑 ≤ **1023** 字元
?fill 單一路徑元件（一個檔名）最長＿＿個字元
= 255
E> 絕對路徑上限為 1023（FreeBSD）。

@CARD fs.hier | 目錄階層 hier(7)
A> 檔案樹像一棟大樓的樓層配置：/bin /sbin 是「必備工具間」、/etc 是「設定與管理辦公室」、/var 是「會一直變動的倉庫」（log、mail、spool）、/tmp 是「臨時置物區」、/usr/local 是「自己加裝的設備」、/dev 是「設備的門牌」、/proc 是「process 的即時看板」。
B> **/bin & /sbin**：單人/多人模式都必需的使用者工具與系統程式
B> **/usr**：使用者工具與應用；/usr/bin、/usr/sbin；**/usr/lib** 函式庫；**/usr/include** 標頭檔；/usr/libexec 被其他程式執行的 daemon 與工具
B> **/usr/local**：本地安裝的執行檔、函式庫等；**/usr/local/etc** 模仿 /etc
B> **/etc**：系統設定檔與腳本
B> **/dev**：裝置檔；**/proc**：執行中 process 的映像
B> **/var**：log、暫存、spool 等變動資料；/var/log、/var/mail、/var/spool、/var/db
B> **/tmp**：重開機後不保證保留；另有 /var/tmp
B> **/mnt**：暫時掛載點；/lib 共享函式庫；/libexec 關鍵系統工具
?mt 配對目錄與內容：
> /etc :: 系統設定檔
> /var/log :: 系統 log 檔
> /usr/local :: 本地另外安裝的軟體
> /dev :: 裝置檔
> /tmp :: 不保證跨重開機保留的暫存檔
E> hier(7) 有完整說明。
?mc FreeBSD 上用 pkg 安裝的第三方軟體，設定檔通常放在？
+ /usr/local/etc
- /etc
- /var/etc
- /opt/etc
E> /usr/local/etc 是 /usr/local 版的 /etc。

@CARD fs.mount | mount 與 umount
A> mount 是「把一個新的儲物櫃接到大樓的某個門口」：之後走進那個門（mount point）看到的就是新櫃子的內容，原本門後的東西暫時被擋住看不到（但沒消失）。有人正在櫃子裡（cd 在裡面或開著檔案）時，你沒辦法把櫃子拆走（busy）。
B> **mount**：把新檔案系統的 root 對應到現有檔案樹的掛載點；例 mount /dev/ad2s1e /home2
B> 掛載點**原本的內容會暫時看不到**
B> 可掛載：磁碟分割、網路檔案伺服器、記憶體磁碟、kernel 元件（/proc）
B> **umount { node | device }**；busy 時（有人 cwd 在裡面或有開啟的檔案）會失敗
B> **umount -f** 強制；用 **lsof**（Linux / FreeBSD）或 **fstat**（FreeBSD）找出誰在用
?mc umount /home 失敗並顯示 target is busy，最可能原因是？
+ 有 process 的工作目錄在 /home 裡，或開著 /home 下的檔案
- /home 沒有寫入權限
- /etc/fstab 沒有 /home
- 磁碟已滿
E> 用 lsof / fuser / fstat 找出是誰。
?tf 把新的檔案系統 mount 到一個非空目錄上，原本目錄內的檔案會被刪除。
=F
E> 只是暫時被遮住，umount 之後就會再出現。
?cmd 列出開啟中的檔案以找出是誰讓 /home 忙碌（Linux）：
= lsof /home
= lsof +D /home
= fuser -m /home
= fuser -vm /home
E> lsof = list open files。

@CARD fs.fstab | /etc/fstab 與 UUID
A> /etc/fstab 是「開機時的自動掛載清單」。用 /dev/sdb 指定磁碟像用「排隊號碼」叫人，今天第二個到的人明天可能變第三個；用 UUID 像用「身分證號」叫人，不管排第幾都找得到同一個。
B> 開機時自動檢查並掛載：**Device  Mountpoint  FStype  Options  Dump  Pass#**
B> Pass：fsck 順序（root 為 1、其他 2、不檢查 0）；Dump：是否給 dump 備份
B> 建議用 **UUID=…**（或 LABEL=）指定裝置，查詢用 **blkid** / lsblk -f
X> # Device      Mountpoint FStype Options Dump Pass#
X> /dev/ad0s1a  /          ufs    rw      1    1
X> /dev/ad0s1b  none       swap   sw      0    0
X> UUID=0ed6…   /home/ray  btrfs  subvol=/home/@ray 0 0
?sa 在 /etc/fstab 中，我們偏向使用 UUID 來指定硬碟，而非使用 /dev/sdX，請解釋原因。
S> 2025 期末 Q4
R> /dev/sdX 是 kernel 依「偵測到的順序」動態分配的名稱，並不固定：新增或移除硬碟、插入 USB 碟、更換插槽 / 控制器、驅動載入順序不同、甚至每次開機的偵測時序差異，都可能讓原本的 /dev/sdb 變成 /dev/sdc。若 fstab 寫 /dev/sdX，就可能掛錯磁碟（資料寫到錯的地方）或找不到裝置導致開機失敗（進入 emergency mode）。
R> UUID 是建立檔案系統（mkfs）時產生、寫在檔案系統 metadata 中的唯一識別碼，不隨裝置名稱或順序改變，所以能穩定地找到同一個檔案系統。可用 blkid 或 lsblk -f 查詢。
P> /dev/sdX 依偵測順序分配，會因增減磁碟等原因改變
P> 可能掛錯或找不到而開機失敗
P> UUID 是檔案系統唯一且固定的識別碼
?cmd 查詢各個區塊裝置的檔案系統 UUID：
= blkid
= lsblk -f
= lsblk -o NAME,UUID
E> blkid 或 lsblk -f。
?mc fstab 第 6 欄（pass）為 0 代表？
+ 開機時不執行 fsck 檢查
- 第一個檢查
- 不掛載
- 唯讀掛載
E> root 通常 1，其他 2，不檢查 0。

@CARD fs.types | 檔案類型
A> ls -l 第一個字元是「物種」：- 一般檔案、d 目錄、l 捷徑（symlink）、b 區塊裝置（磁碟，一次一大塊）、c 字元裝置（終端，一個一個字）、s socket（本機的電話）、p 具名管線（排隊的輸送帶）。
B> **-** regular file、**d** directory、**l** symbolic link
B> **b** block device、**c** character device
B> **s** UNIX domain socket、**p** named pipe (FIFO)
B> **file** 指令判斷檔案內容類型（ASCII text、directory、ELF executable…）
?mt 配對 ls -l 首字元：
> b :: Block device file
> c :: Character device file
> s :: UNIX domain socket
> p :: Named pipe
> l :: Symbolic link
E> - 一般檔案、d 目錄。
?cmd 判斷 /bin/sh 是什麼類型的檔案：
= file /bin/sh
E> file 依內容判斷。

@CARD fs.ipc | Socket、Pipe 與 Named Pipe
A> pipe 是只有親戚（parent/child）才拿得到的輸送帶；named pipe（FIFO）把輸送帶掛上門牌，誰都能從門牌找到它；UNIX domain socket 是本機內的電話專線，用檔案路徑而不是 port 號碼來撥號。
B> **UNIX domain socket**：socket() 建立，只在本機，透過**檔案系統物件**而非網路 port 存取
B> **Pipe**：兩個 process 間 FIFO 溝通（通常 parent fork 前建立，fd[0] 讀、fd[1] 寫）
B> **Named pipe**：**mkfifo [-m mode] name**；不相關的 process 也能用
X> $ mkfifo pipe
X> $ du >> pipe        # 一個 process 寫
X> $ sort -n pipe      # 另一個 process 讀
?cmd 建立一個名為 mypipe 的 named pipe：
= mkfifo mypipe
E> ls -l 會看到類型 p。
?mc UNIX domain socket 和 TCP socket 的主要差異？
+ UNIX socket 只在本機，以檔案系統路徑定址，而非 IP:port
- UNIX socket 只能單向傳輸
- UNIX socket 需要網路卡
- UNIX socket 比較慢
E> 例：/run/docker.sock。

@CARD fs.inode | inode 與分割區結構
A> inode 是檔案的「戶口名簿」：記錄擁有者、權限、時間戳記、大小、資料放在哪些區塊（直接、單/雙/三層間接指標），但**沒有檔名**。檔名寫在目錄裡：目錄只是一張「檔名 → inode 號碼」的對照表。
B> **inode** 記錄：mode、owners、timestamps、size、link count、資料區塊指標（**direct、single / double / triple indirect**）
B> **ls -i** 看 inode 號碼
B> 分割區四部分：**boot block**（開機程式）、**super block**（檔案系統狀態：大小、block size、root 目錄 inode…）、**inode list**、**data blocks**
B> 使用者用檔名思考；**Unix 用 inode 思考**
B> **目錄**的內容 = 一筆筆 (inode 號碼, 檔名)；包含 . 與 ..
?tf 檔案的名稱存在它的 inode 裡。
=F
E> 檔名存在目錄的資料區塊（檔名 → inode 號碼）；inode 不含檔名，所以才能有多個 hard link。
?mt 配對分割區元件：
> Boot block :: 載入作業系統的開機程式
> Super block :: 檔案系統整體狀態（大小、block size…）
> Inode list :: 所有 inode 的陣列
> Data blocks :: 檔案的實際內容
E> UFS 經典結構。
?cmd 列出目前目錄檔案及其 inode 號碼：
= ls -i
= ls -li
= ls -il
E> -i 顯示 inode。

@CARD fs.link | Hard link vs Symbolic link
A> Hard link 是「同一個人多一個名字」：兩個名字指向同一份戶口（inode），刪掉一個名字，人還在，直到所有名字都刪光。Symbolic link 是「寫著地址的便條紙」：它記的是路徑，原本的人搬走（刪除）就變成死連結；如果有新的人搬進同一個地址，便條紙就指向新人。
B> **Hard link**：多個檔名指向**同一個 inode**；**必須在同一個檔案系統（partition）**；ln ori hard
B> **Symbolic link**：一個檔案，內容是**另一個路徑名**；ln -s ori soft；像 Windows 捷徑
B> 刪除原檔：hard link 仍可讀（inode link count 還 > 0）；symlink 變成 dangling（壞掉）
B> 再建立同名新檔：symlink **指向新檔**（因為它記的是路徑）；hard link 仍是**舊內容**
B> symlink 可跨檔案系統、可指向目錄；hard link 一般不能指向目錄
?sa 請問下列兩個 cat 指令的輸出為何？
QX> $ echo "start" > myfile
QX> $ ln -s myfile link1
QX> $ ln myfile link2
QX> $ rm myfile
QX> $ echo "end" > myfile
QX> $ cat link2
QX> $ cat link1
S> 2025 期末 Q19
R> cat link2 輸出 start；cat link1 輸出 end。
R> link2 是 hard link，和原本的 myfile 指向同一個 inode；rm myfile 只刪除了一個名稱，inode 仍被 link2 引用，所以內容 start 還在。之後 echo "end" > myfile 建立的是全新的 inode。
R> link1 是 symbolic link，只記錄路徑 "myfile"；cat 時會去解析這個路徑，找到的是新建的 myfile，所以輸出 end。
P> link2 → start（hard link 指向舊 inode）
P> link1 → end（symlink 依路徑找到新檔）
?sa 試說明 symbolic link 和 hard link 的差異。
S> 2023 期末 Q8
R> Hard link：在目錄中新增一個名稱指向「同一個 inode」，與原檔完全平等，inode 的 link count 加一；必須在同一個檔案系統內，通常不能對目錄建立；刪除其中一個名稱，資料仍在，直到 link count 歸零才真正釋放。
R> Symbolic link：是一個獨立的特殊檔案（有自己的 inode），內容存的是目標的路徑名稱；可以跨檔案系統、可以指向目錄；原檔刪除或搬移後就會失效（dangling），若同路徑出現新檔則會指向新檔。ls -l 中類型為 l。
P> hard link 共用同一個 inode；symlink 存路徑
P> hard link 不能跨檔案系統 / 目錄；symlink 可以
P> 原檔刪除：hard link 仍可用，symlink 失效
?mc 建立 hard link 時，下列哪個限制正確？
+ 原檔和連結必須在同一個檔案系統
- 只能對目錄建立
- 原檔必須是可執行檔
- 只有 root 能建立
E> 因為 inode 號碼只在同一個檔案系統內有意義。
?cmd 為 /etc/nginx/sites-available/site 建立名為 /etc/nginx/sites-enabled/site 的 symbolic link：
= ln -s /etc/nginx/sites-available/site /etc/nginx/sites-enabled/site
E> ln -s 目標 連結名。

@CARD fs.mode | 權限 rwx 與 chmod
A> 九個權限位元分三組：擁有者（u）、群組（g）、其他人（o）；r=4、w=2、x=1 加起來就是一位數字。chmod 有兩種語法：符號法（u+x、go-w）像「微調」，數字法（755）像「整組重設」。
B> **rwx r-x r-x**：user / group / other
B> 數字：**r=4、w=2、x=1** → 755 = rwxr-xr-x、644 = rw-r--r--、600 = rw-------
B> 符號：chmod **u+x** test.sh、chmod **go-w** .tcshrc、chmod u+w,g-w hehe haha
B> 遞迴：chmod **-R** 755 public_html/

E> 6=rw-、4=r--、0=---。

= chmod go-rwx secret.txt
= chmod go= secret.txt
= chmod g-rwx,o-rwx secret.txt

@CARD fs.dirperm | 目錄權限與「刪除檔案」
A> 目錄是一本「名冊」：r 是能讀名冊（ls 列出檔名）、w 是能在名冊上新增 / 劃掉名字（建立、刪除、改名）、x 是能「進入並通過」這個目錄（cd、存取裡面的檔案）。所以**能不能刪一個檔案，看的是目錄的 w+x，不是檔案本身的權限**。
B> 目錄 **r**：列出內容（ls）；**x**：進入 / 通過（cd、存取其中檔案）；**w**（需搭配 x）：建立、刪除、改名
B> 最小權限表：cd → 目錄 x；ls → 目錄 r；ls -s *.c → 目錄 rx；cat file → 檔案 r + 目錄 x；cat >> file → 檔案 w + 目錄 x；執行 binary → 檔案 x + 目錄 x；執行 script → 檔案 **rx** + 目錄 x；**rm file → 目錄 wx**（檔案本身不需要權限）
B> 只有 x 沒有 r：可以 cd 進去、可以存取「知道名字」的檔案，但無法 ls（HW2 的 private/hidden 就是這樣設計）
?mt 配對動作與「最少」需要的權限：
> cd /home/test :: 目錄 x
> ls /home/test :: 目錄 r
> rm /home/test/f :: 目錄 w 與 x
> 執行 shell script :: 檔案 r 與 x，目錄 x
> cat /home/test/f :: 檔案 r，目錄 x
E> script 要讀才能被直譯器執行，所以要 rx；binary 只要 x。
?tf 要刪除一個檔案，必須對該檔案本身有 w 權限。
=F
E> 刪除是修改「目錄」的內容，需要目錄的 w+x（加上 sticky 的額外限制）。
?mc 目錄權限為 --x（只有 x），使用者可以做什麼？
+ cd 進去並存取已知名稱的檔案，但無法 ls 列出內容
- ls 列出內容但無法 cd
- 建立新檔案
- 什麼都不能做
E> HW2 private/ 的「能 cd、不能 ls、能 get 知道名字的 treasure」就是這個原理。

@CARD fs.special | setuid、setgid、sticky bit
A> 三個特殊位元：setuid 是「借擁有者的身分做事」（passwd）；setgid 在目錄上是「在這裡出生的檔案，自動入籍這個群組」；sticky 在目錄上是「公共置物區，只准動自己的東西」（/tmp），只有檔案擁有者、目錄擁有者、root 能刪/改名。
B> **setuid（4000）**：在**檔案**上，執行時 EUID = 檔案擁有者；例 passwd、chsh、crontab；顯示為 user 的 **s**
B> **setgid（2000）**：在檔案上 EGID = 檔案群組；在**目錄**上，**新建的檔案繼承目錄的群組**；顯示為 group 的 **s**
B> **sticky（1000）**：在**目錄**上，除非你是**檔案擁有者、目錄擁有者或 root**，否則不能刪除或改名其中的檔案；顯示為 other 的 **t**（/tmp = 1777 drwxrwxrwt）
B> 大寫 S / T：對應的 x 位元沒開
X> 4755 -rwsr-xr-x    2755 -rwxr-sr-x
X> 2775 drwxrwsr-x    1777 drwxrwxrwt
?sa 請說明下列 /tmp 資料夾權限中的 t 所代表的意義與作用。
QX> drwxrwxrwt  38 root  wheel  42 Nov  4 22:20 /tmp
S> 2023 期末 Q11
R> t 是 sticky bit（數字 1000，/tmp 為 1777）。設在目錄上時，雖然所有人都有 rwx、都能在 /tmp 建立檔案，但只有「該檔案的擁有者」、「目錄的擁有者」或 root 才能刪除或重新命名其中的檔案。作用是讓 /tmp 這種公共可寫目錄中，使用者不能刪除或改名別人的檔案。t 為小寫代表 other 的 x 也有開。
P> t = sticky bit
P> 只有檔案擁有者 / 目錄擁有者 / root 可刪除或改名
P> 防止公共目錄中互刪檔案
?fill 想讓一個目錄成為 rwxrwsr-x（新檔案自動繼承群組），數字權限為＿＿
= 2775
E> setgid 2000 + 775。
?mt 配對數字與權限字串：
> 4755 :: -rwsr-xr-x
> 1777 :: drwxrwxrwt
> 2755 :: -rwxr-sr-x
> 711 :: rwx--x--x
E> 4 setuid、2 setgid、1 sticky。

@CARD fs.sftpcase | 情境：sticky + setgid 目錄的刪除題
A> 判斷能不能刪，照順序問三個問題：① 對「所在目錄」有沒有 w+x？② 那個目錄有沒有 sticky？有的話我是不是檔案或目錄的擁有者？③ 是 rmdir 的話，目錄是不是空的？，檔案自己的 400、000 權限完全不重要。
B> /sftp 為 **drwxrwsr-t sysadm sftp**：setgid（新檔群組 = sftp）+ sticky
B> sysadm 是 /sftp 的**擁有者**，在 sticky 目錄下仍可刪除他人檔案
B> **rmdir** 只能刪除**空目錄**
B> 子目錄 chmod 770 → 沒有 sticky；群組成員有 w+x 就能刪除其中檔案
?sa 參考下列資訊回答：a. Q1 的刪除會成功嗎？為什麼？ b. Q2 會成功嗎？為什麼？ c. Q3 會成功嗎？為什麼？
QX> $ groups sysadm    → sysadm : sysadm sftp
QX> $ groups sftp-user → sftp-user : sftp-user sftp
QX> $ ls -ld /sftp/    → drwxrwsr-t sysadm sftp /sftp/
QX> $ sftp sftp-user@myws   (工作目錄 /sftp)
QX> sftp> put file_1 .
QX> sftp> mkdir dir_2
QX> sftp> put file_2 dir_2/
QX> sftp> chmod 400 file_1
QX> sftp> chmod 770 dir_2
QX> sftp> chmod 400 dir_2/file_2
QX> $ sftp sysadm@myws      (工作目錄 /sftp)
QX> sftp> rm file_1          # (Q1)
QX> sftp> rmdir dir_2        # (Q2)
QX> sftp> rm dir_2/file_2    # (Q3)
S> 2025 期末 Q18
R> a. Q1 成功。刪除檔案看的是所在目錄 /sftp 的權限：sysadm 是 /sftp 的擁有者，有 rwx；/sftp 雖有 sticky bit（只有檔案擁有者、目錄擁有者或 root 能刪），但 sysadm 正是目錄擁有者，所以可以刪除 sftp-user 的 file_1。file_1 本身的 400 權限不影響刪除。
R> b. Q2 失敗。rmdir 只能刪除空目錄，而 dir_2 裡面還有 file_2（權限上 sysadm 是 /sftp 擁有者，sticky 不會擋他，但目錄非空）。
R> c. Q3 成功。刪除 dir_2/file_2 需要 dir_2 的 w+x：/sftp 有 setgid，所以 dir_2 的群組是 sftp，chmod 770 後群組有 rwx；sysadm 屬於 sftp 群組，因此有 w+x，且 dir_2 沒有 sticky bit，所以能刪除。file_2 的 400 權限不影響。
P> Q1 成功：目錄擁有者 + sticky 規則允許
P> Q2 失敗：目錄不是空的
P> Q3 成功：setgid 使群組為 sftp，770 給群組 wx，無 sticky
P> 理解刪除取決於目錄權限而非檔案權限

@CARD fs.umask | umask
A> umask 是「預設會被拿掉的權限」：檔案從 666、目錄從 777 出發，把 umask 有的位元「遮掉」。注意不是減法，是遮罩（AND NOT）：umask 033 時檔案是 644，不是 633。
B> shell built-in；決定**新建**檔案/目錄的預設權限
B> 新權限 = **full & ~umask**；**檔案 full = 666**、**目錄 full = 777**
B> 022 → 檔案 rw-r--r--、目錄 rwxr-xr-x
B> 033 → 檔案 rw-r--r--、目錄 rwxr--r--
B> 066 → 檔案 rw-------、目錄 rwx--x--x
B> 277 → 檔案 r--------、目錄 r-x------
B> 反推：umask = 想移除的位元（目錄可直接 777 − 目標）
?sa A. 若希望建立的目錄其屬性為 d --- r-- r-x，umask 需設定為何？ B. 若希望建立的檔案其屬性為 - r-- --- rw-，且目錄的 user/group/other 都具有 x 權限，umask 需設定為何？
S> 2023 期末 Q13
R> A. 目標目錄權限 --- r-- r-x = 045。目錄從 777 出發，需要遮掉的位元 = 777 − 045 = 732，所以 umask 732。
R> B. 目標檔案權限 r-- --- rw- = 406。檔案從 666 出發：user 要拿掉 w（2）、group 要拿掉 rw（6）、other 不拿（0），所以 umask 的 rw 部分為 260；又要求目錄的 u/g/o 都有 x，因此 umask 不能含任何 x（1）位元。umask = 260。驗證：檔案 666 & ~260 = 406（r-----rw-）；目錄 777 & ~260 = 517（r-x--xrwx），三者都有 x。
P> A. 732
P> B. 260
P> 說明以 666 / 777 為基準並遮罩
?fill umask 為 027 時，新建「檔案」的權限數字是＿＿
= 640
E> 666 & ~027 → rw- r-- --- = 640。
?fill umask 為 027 時，新建「目錄」的權限數字是＿＿
= 750
E> 777 & ~027 = 750。
?fill umask 為 033 時，新建檔案的權限數字是＿＿（注意不是減法）
= 644
E> 666 的 other=6（rw-）遮掉 3（-wx）只剩 r-- = 4，不是 6−3=3。

@CARD fs.chown | chown 與 chgrp
A> chown 是「過戶」（換擁有者，通常要 root），user:group 一次換兩個，:group 只換群組（等同 chgrp）。
B> **chown**(8)：改擁有者；**chgrp**(1)：改群組
B> chown -R tsaimh /home/tsaimh；chown -R **tsaimh:dcs** …；chown -R **:dcs** …；chgrp -R dcs …
B> 把檔案送給別人（改擁有者）一般需要 root
?cmd 遞迴把 /srv/web 的擁有者設為 www、群組設為 www-data：
= chown -R www:www-data /srv/web
E> user:group。
?cmd 只把 report.txt 的群組改成 staff（用 chgrp）：
= chgrp staff report.txt
E> 也可以 chown :staff report.txt。

@CARD fs.chflags | FreeBSD chflags（附錄）
A> chflags 是 FreeBSD 的「封條」：schg（系統不可變）連 root 都不能改（在高 securelevel 下連拆封條都不行）；uappnd 是「只能在後面加字的日記本」。
B> **schg** system immutable（root only）；**sunlnk** system undeletable；**sappnd** system append-only
B> **uappnd** user append-only；**uunlnk** user undeletable（root 與 user 都可設）
B> **ls -ol** 顯示 flags
B> 例：設 uappend 後 ls > file 失敗（Operation not permitted），ls >> file 可以
?mc 對檔案設了 uappnd flag 後，下列哪個操作會成功？
+ ls -al >> file
- ls -al > file
- rm file
- 用編輯器修改中間內容
E> append-only 只能附加。

@CARD fs.journal | Journaling、CoW 與 Extended Attributes
A> Journaling 像「先記帳再搬貨」：當機後看帳本就知道哪些做完、哪些要回滾，不用盤點整個倉庫（fsck 很快）。CoW 像「改作業時不在原稿上塗改，而是寫在新紙上再換掉」，沒改的部分共用同一張紙 → 快照幾乎不花空間。
B> **Journaling**：先把操作寫入 journal，再非同步 commit；當機後：完整 commit → 略過；部分 → rollback 或 commit；未 commit → 忽略或 commit
B> 好處：縮短 **fsck** 時間、減少不一致；例：**ext3、ext4、xfs、btrfs**
B> **CoW (Copy on Write)**：複製但未修改的資料指向同一個實體位址
B> CoW 優點：省空間、**低成本 snapshot**；缺點：可能不一致（reference count）、檔案「實際」使用空間不直觀；例：ZFS deduplication
B> **Extended attributes**：key-value 的 metadata，存在 inode，不由檔案系統解讀（mime_type、checksum、security attributes）
?mc Journaling filesystem 的主要好處？
+ 當機後只需檢查 journal，大幅縮短 fsck 時間並降低不一致
- 讓檔案永遠不會損壞
- 自動備份所有檔案
- 讓讀取速度加倍
E> 它是一致性的保證機制，不是備份。
?mt 配對：
> Journaling :: 先寫 log 再 commit，當機後依 log 修復
> Copy on Write :: 未修改的資料共用同一份實體區塊
> Extended attributes :: 存在 inode 的 key-value metadata
E> btrfs 同時是 CoW 也有 journal 特性（log tree）。

@CARD fs.p_namei | 實作：一路檢查路徑上每一層的權限
A> 存取一個檔案像「穿過一串房門」：要到 /mnt/hw2/sftp/public/a.txt，每一層目錄都要讓你通過（x），最後那扇門才看檔案本身的權限。Permission denied 常常不是檔案的問題，而是路上某一扇門沒開。namei -l 會把整條走廊每扇門的鎖都列給你看。
B> **namei -l /完整/路徑**：逐層列出擁有者、群組與權限
B> 目錄的權限意義：**r** 列出內容、**w** 新增 / 刪除 / 改名其中的項目（還需要 x）、**x** 進入與通過
B> **stat 檔案**：完整的權限（八進位）、擁有者、inode、三種時間；`stat -c '%a %U:%G %n' 檔案` 精簡版
B> 判斷權限的順序：是擁有者就**只看** user 位元；否則屬於該群組就**只看** group 位元；都不是才看 other。所以擁有者權限比 other 小時，擁有者反而做不到
B> 驗證用 `sudo -u 某人 指令` 實測，比腦內推演可靠
X> namei -l /mnt/hw2/sftp/private/hidden/treasure
X> stat -c '%a %U:%G %n' /mnt/hw2/sftp /mnt/hw2/sftp/*
?cmd 逐層列出 /mnt/hw2/sftp/public 這條路徑上每個元件的擁有者與權限：
= namei -l /mnt/hw2/sftp/public
= namei -om /mnt/hw2/sftp/public
E> chroot、SFTP、web server 的權限問題都用它查。
?mc 檔案權限是 `---r--r--`、擁有者是 alice，alice 能不能讀這個檔？
+ 不能；alice 是擁有者，只看 user 位元（---），不會再往下看 group / other
- 能，因為 other 有 r
- 能，因為擁有者永遠可以讀
- 要看 alice 有沒有在群組裡
E> 符合哪一類就只用那一類的位元。（擁有者可以 chmod 改回來）
?cmd 用 stat 只印出 /mnt/hw2/sftp 的八進位權限：
= stat -c %a /mnt/hw2/sftp
= stat -c '%a' /mnt/hw2/sftp
= stat --format=%a /mnt/hw2/sftp
E> %a 八進位權限、%A 是 rwx 字串。

@CARD fs.p_acl | 實作：ACL：權限位元不夠用的時候
A> 傳統權限只有「擁有者、一個群組、其他人」三格，現實需求常常塞不下：例如「這個人只能讀、那群人可以寫、其他人什麼都不行」。ACL 是在三格之外「額外貼的個人通行證」。ls -l 權限尾巴出現 + 號，就代表這個檔案有 ACL。
B> 查看：**getfacl 檔案**；設定：**setfacl -m u:anonymous:rx 目錄**、**setfacl -m g:sftpusers:rwx 目錄**；移除：**setfacl -x u:anonymous**、全部清除 **setfacl -b**
B> **預設 ACL**（只能設在目錄上）：`setfacl -d -m u:anonymous:rx 目錄`，之後在裡面**新建**的檔案與目錄會自動繼承
B> **mask** 是 ACL 的上限：具名使用者、具名群組與擁有群組的權限都會被 mask 截斷；`chmod g=...` 在有 ACL 的檔案上改的其實是 mask
B> **-R** 遞迴套用到既有的檔案；預設 ACL 只影響之後新建的
B> 有預設 ACL 的目錄裡，新檔權限由預設 ACL 決定，不再套用一般的 umask
X> setfacl -m u:anonymous:rx /mnt/hw2/sftp/public
X> setfacl -d -m u:anonymous:rx /mnt/hw2/sftp/public
X> getfacl /mnt/hw2/sftp/public
?cmd 讓使用者 anonymous 對目錄 public 擁有 r-x 權限（使用 ACL，不改原本的擁有者與群組）：
= setfacl -m u:anonymous:rx public
= setfacl -m user:anonymous:rx public
= setfacl -m u:anonymous:r-x public
E> -m = modify。
?mc 對目錄設定 `setfacl -d -m g:team:rwx dir` 之後，下列何者正確？
+ 之後在 dir 裡新建的檔案與目錄會自動帶有 team 的 ACL；已經存在的不受影響
- dir 裡現有的所有檔案立刻都套用
- 只有 dir 本身得到 team 的權限
- 會取代 dir 原本的擁有群組
E> -d 是 default ACL；要處理既有檔案得再加 -R 套用一般 ACL。
?mc `ls -l` 顯示 `drwxrwx---+`，最後那個 + 代表？
+ 這個檔案或目錄有額外的 ACL
- 有 sticky bit
- 有 setgid
- 檔案正在被使用
E> 用 getfacl 看詳細內容。

@CARD fs.p_fstab | 實作：fstab 改完先驗證再重開機
A> fstab 寫錯，下次開機就掉進 emergency mode。所以改完之後要「先在不重開機的情況下演習一次」：讓 systemd 重新讀取、用 mount -a 實際掛一遍、用 findmnt --verify 檢查格式。都通過了才重開機。
B> 欄位：**裝置 掛載點 類型 選項 dump pass**；裝置用 **UUID=** 或 **LABEL=**，或固定不變的 /dev/mapper/VG-LV 名稱
B> 改完：**systemctl daemon-reload**（systemd 會把 fstab 轉成 .mount unit）→ **mount -a**（把還沒掛的都掛上，錯誤當場顯示）→ **findmnt --verify**
B> 非開機必要的掛載加 **nofail**，掛失敗也不會卡住開機
B> 巢狀掛載點要注意順序：/mnt/hw2 要先掛，/mnt/hw2/sftp 才掛得上（systemd 會依路徑自動排序）
B> 確認實際掛了什麼：**findmnt /mnt/hw2**、**findmnt -s**（列出 fstab 中的設定）
X> UUID=xxxx-xxxx  /mnt/new-part  ext4  defaults  0  2
X> /dev/mapper/SA2026vg-SARaid10  /mnt/hw2       btrfs  subvol=root  0  0
X> /dev/mapper/SA2026vg-SARaid10  /mnt/hw2/sftp  btrfs  subvol=sftp  0  0
X> sudo systemctl daemon-reload && sudo mount -a && sudo findmnt --verify
?ord 修改 /etc/fstab 之後，安全的驗證順序：
> systemctl daemon-reload
> mount -a
> findmnt --verify
> reboot 並確認掛載都還在
E> 前三步任何一步出錯，都先修好再重開機。
?cmd 掛載 /etc/fstab 中所有尚未掛載的檔案系統（用來測試 fstab）：
= mount -a
= sudo mount -a
E> 已經掛著的不會重掛；新加的那幾行若有錯會立刻顯示。
?mc 在 /etc/fstab 中加入 nofail 選項的效果？
+ 該裝置掛載失敗時不會讓開機失敗或進入 emergency mode
- 該裝置永遠不會被掛載
- 掛載後不允許寫入
- 開機時跳過 fsck
E> 適合外接碟或非必要的資料碟。

@CARD fs.p_chmodlab | 實作：特殊位元組合的設定與檢查
A> setgid、sticky 這些位元平常看不到，一組合起來就決定了共享目錄的規則。用八進位要多寫第四位數：4 = setuid、2 = setgid、1 = sticky，加起來放在最前面。
B> 八進位：**chmod 3775 dir** = setgid（2）+ sticky（1）+ rwxrwxr-x；**chmod 1777 /tmp** 就是 sticky
B> 符號寫法：**chmod g+s dir**（setgid）、**chmod +t dir**（sticky）、**chmod o-rwx 檔案**
B> ls -l 的顯示：執行位置出現 **s / t** 代表該位元與 x 都有；大寫 **S / T** 代表有特殊位元但**沒有 x**（通常是設錯了）
B> setgid 目錄：裡面新建的檔案與子目錄自動屬於該目錄的群組，子目錄也會繼承 setgid
B> 改目錄樹的擁有者：`chown -R sysadm:sftpusers public`；只改目錄不動檔案：`find public -type d -exec chmod 2775 {} +`
?fill 讓目錄同時擁有 setgid 與 sticky，且權限為 rwxrwxr-x，八進位寫成 chmod ＿＿ dir
= 3775
E> 2（setgid）+ 1（sticky）= 3。
?mc `ls -ld dir` 顯示 `drwxrwsr-T`，其中最後的大寫 T 代表？
+ 有 sticky bit，但 other 沒有 x 權限
- 有 sticky bit，且 other 有 x
- 沒有 sticky bit
- 有 setuid
E> 小寫 t = sticky + x，大寫 T = sticky 但沒有 x。
?cmd 用符號模式，把 public 目錄加上 sticky bit：
= chmod +t public
= chmod o+t public
= chmod a+t public
E> sticky：目錄內的檔案只有擁有者、目錄擁有者或 root 可以刪除或改名。
