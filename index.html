B> GPT 通常保留一個 **protective MBR**；有 MBR signature **不代表**是 BIOS 開機
B> 實際判斷用 lsblk 與分割 metadata
?fill MBR 中 boot code 佔＿＿bytes
= 446
E> 446 + 64 + 2 = 512。
?fill MBR 的 signature 位於 offset 510、511，值為 55 ＿＿（十六進位）
= aa
= AA
E> 55 AA。
?mc MBR 最多可以直接記錄幾個 partition entry？
+ 4
- 8
- 16
- 128
E> 64 bytes ÷ 16 bytes = 4 個 primary partition；GPT 預設可到 128 個。

@CARD boot.grubbios | GRUB 2 的 BIOS 開機路徑
A> BIOS 只會讀很小的一段（boot.img），它的唯一工作就是「去叫 core.img」；core.img 比較大，會載入模組、找到 GRUB 設定，最後顯示選單、載入 kernel + initramfs。
B> BIOS → 讀取磁碟的初始開機碼
B> **boot.img** → 把控制權交給 core.img
B> **core.img** → 載入 modules、找到 GRUB 設定
B> **GRUB menu** → 選 kernel，載入 kernel + initramfs
B> BIOS + GPT 時，GRUB 通常需要 **BIOS Boot Partition** 放 core.img（和 ESP 是不同的東西）
?ord GRUB 2 在 BIOS 模式下的執行順序：
> BIOS 讀取磁碟最前面的開機碼
> GRUB boot.img
> GRUB core.img（載入模組、找設定）
> GRUB menu 載入 kernel 與 initramfs
E> boot.img 很小，只負責跳到 core.img。

@CARD boot.files | Debian 開機相關檔案
A> /boot 是「行李箱」：vmlinuz 是主角 kernel、initrd.img 是幫主角先打開門鎖（掛載 root）的小幫手，兩者版本要成對。grub.cfg 是印好的菜單（自動生成，不要手改）；/etc/default/grub 才是你寫菜單需求的地方。
B> **/boot/vmlinuz-<ver>**：Linux kernel image
B> **/boot/initrd.img-<ver>**：early user-space image（initramfs）
B> **/boot/grub/grub.cfg**：**自動產生**的 GRUB 選單設定
B> **/etc/default/grub**：管理員的 GRUB 設定
B> **/etc/grub.d/**：產生選單用的腳本
B> kernel 與 initramfs 版本要一致；保留一個已知可用的 kernel 以便救援
?mt 配對檔案與用途：
> /boot/vmlinuz-<ver> :: Linux kernel image
> /boot/initrd.img-<ver> :: early user-space image
> /boot/grub/grub.cfg :: 自動產生的 GRUB 選單
> /etc/default/grub :: 管理員修改的 GRUB 設定
E> 想改 GRUB 設定改 /etc/default/grub，再 update-grub。

@CARD boot.grubcfg | GRUB 設定與 update-grub
A> 改菜單的正確方式：在「需求單」/etc/default/grub 寫好，叫印刷廠 update-grub 重印 grub.cfg。直接在印好的菜單上塗改，下次重印就不見了。grub-install 則是「重新安裝整台點菜機」，不是改菜單。
B> 編輯 **/etc/default/grub** 與 /etc/grub.d/（例：GRUB_TIMEOUT=5、GRUB_CMDLINE_LINUX_DEFAULT="quiet"）
B> **sudo update-grub** 重新產生 /boot/grub/grub.cfg
B> **不要**為了持久變更去編輯產生出來的 grub.cfg
B> kernel 參數不是 systemd service 設定
B> **update-grub 重新產生選單**；**grub-install 安裝 loader 程式碼**，只用在確認過的開機路徑
?cmd 修改 /etc/default/grub 後，重新產生 GRUB 選單：
= update-grub
= grub-mkconfig -o /boot/grub/grub.cfg
E> Debian 用 update-grub（底層是 grub-mkconfig）。
?mc 想讓 GRUB 選單等待 10 秒，正確做法是？
+ 改 /etc/default/grub 的 GRUB_TIMEOUT=10，再執行 update-grub
- 直接修改 /boot/grub/grub.cfg
- 執行 grub-install
- 修改 /etc/systemd/system.conf
E> grub.cfg 會被重新產生覆蓋。

@CARD boot.uefi | Debian UEFI 開機
A> Secure Boot 像「層層驗證身分」：firmware 只信任有簽章的 shim，shim 再驗證 GRUB，GRUB 再載入 kernel 和 initramfs。
B> Firmware 從 **ESP** 選 EFI loader
B> **Secure Boot**：**shim** 驗證下一個 loader；GRUB 載入 kernel 與 initramfs
B> amd64 上 EFI/debian 通常有 **shimx64.efi** 與 **grubx64.efi**
B> **/boot/efi** 是 Debian 慣用的 ESP 掛載點
B> 檢查：lsblk -f、findmnt /boot/efi、**efibootmgr -v**（列出 firmware 開機項目）
?cmd 列出 UEFI firmware 中的開機項目（詳細）：
= efibootmgr -v
= efibootmgr
E> efibootmgr 管理 UEFI NVRAM 開機項目與 BootOrder。
?fill Debian 慣用把 ESP 掛載在 /boot/＿＿
= efi
E> /boot/efi。

@CARD boot.multiboot | 多重開機與修復
A> 修開機像修車：先確認車型（BIOS 還是 UEFI、磁碟配置、root 在哪、有沒有加密），再檢查零件（EFI 項目、ESP 檔案），先試另一把備用鑰匙（舊 kernel），最後才拆引擎（重裝 loader）。
B> 先確認：**BIOS 或 UEFI**、磁碟配置、root filesystem、加密
B> 檢查 EFI 項目與 ESP 檔案，或 BIOS GRUB embedding 區
B> 重裝 loader 前，先在 GRUB 選單試**已知可用的 kernel**
B> 用 Debian installer **rescue mode** 或 live media 修復；掛上實際的 root、/boot、ESP
B> 更新選單（update-grub）**不能**修好所有 loader 故障
?sa Koji 使用 Linux 和 Windows dual boot 一段時間。某次 Windows 強制更新後，他每次開機都在黑畫面後直接進入 UEFI 設定介面，看不到 boot manager 也沒有 emergency shell。請推斷 Windows 更新時可能做了什麼，並提出合理解釋。
S> 2025 期末 Q14
R> 推斷：Windows 更新時改動了 UEFI 開機設定，例如刪除或覆寫了 NVRAM 中 Linux（debian / shim / GRUB）的開機項目、修改 BootOrder，或覆寫 / 清掉 ESP 上的 EFI/debian（shimx64.efi、grubx64.efi）或 fallback 的 EFI/Boot/bootx64.efi，甚至重建 / 重新格式化了 ESP。
R> 解釋：UEFI firmware 開機時要依 NVRAM 的開機項目到 ESP 載入 .efi 程式；如果項目不存在或指向的檔案不見，firmware 找不到任何有效的 boot loader，就只能停在 UEFI 設定介面。因為 GRUB 根本沒被載入，所以不會出現 boot manager 選單，也到不了 kernel / emergency shell（那是更後面的階段）。
R> 修復：用 live / rescue media 開機，掛上 root 與 ESP，以 efibootmgr 重建開機項目或 grub-install 重新安裝 loader。
P> Windows 更改 / 刪除了 UEFI 開機項目（NVRAM BootOrder）或覆寫 ESP 上的 loader
P> firmware 找不到可執行的 EFI loader，所以進入 UEFI 設定
P> GRUB 未載入 → 沒有選單、也沒有 emergency shell（失敗在 firmware 層）

@CARD boot.initramfs | Kernel 與 initramfs
A> initramfs 是「先遣部隊」：真正的 root filesystem 可能被鎖在加密箱（LUKS）、或藏在 LVM 倉庫裡，kernel 自己打不開；所以先派一個小小的臨時檔案系統，裡面帶好驅動和工具，把 root 解鎖、組裝、掛好，再把棒子交給 systemd (PID 1)。
B> **vmlinuz**：初始化 kernel 與內建驅動
B> **initrd.img（initramfs）**：準備儲存裝置並**掛載真正的 root filesystem**
B> early user space 可以：載入驅動、**解鎖加密儲存（LUKS）**、**啟用 LVM**
B> root handoff 之後，**systemd 以 PID 1 執行**
B> initramfs-tools（update-initramfs）與 dracut 的設定不同；重建前先確認產生器
B> 雞生蛋問題：kernel modules 放在 /lib/modules（在 root fs 上），若掛 root 需要的驅動不在 kernel 裡，就**必須放進 initramfs**
?mc 為什麼 root filesystem 在 LVM 或 LUKS 加密磁碟上時，需要 initramfs？
+ 掛載 root 前需要先載入驅動 / 解鎖 / 啟用 LV，而這些工具和模組不能放在還沒掛載的 root 上
- 因為 GRUB 不能讀取 LVM
- 因為 systemd 需要 initramfs 才能啟動服務
- 因為 initramfs 存放使用者家目錄
E> early user space 負責解鎖與啟用 LVM，再掛載真正的 root。
?sa LVVM 是一個運作原理類似 LVM 的 kernel device-mapper framework。若系統的 rootfs 在 LVVM partition 上，相比於直接在一般 GPT partition 上，需要額外做哪些設定？LVVM driver 需要在哪個 booting stage 被載入？為什麼？
S> 2025 期末 Q16
R> 額外設定：① 把 LVVM 的 kernel module 與使用者空間工具（啟用 volume 的指令）加入 initramfs，並在 initramfs 中於掛載 root 前啟用 LVVM volume（類似 LVM 的 vgchange -ay），之後重建 initramfs（update-initramfs -u）；② kernel command line 的 root= 指向 LVVM 的 device mapper 路徑（如 /dev/mapper/...），/etc/fstab 也要對應；③ boot loader 可能無法讀取 LVVM，所以 /boot（kernel 與 initramfs）通常要放在一般 partition 上（UEFI 的 ESP 也要是一般 FAT partition）。
R> 載入階段：必須在 kernel 掛載 root filesystem 之前，也就是 initramfs（early user space）階段，或直接編進 kernel。原因：一般 kernel module 存放在 root filesystem 的 /lib/modules，但 root 本身就在 LVVM 上，沒有 driver 就無法掛載 root，形成雞生蛋問題；所以 driver 必須由 initramfs 提供（或 built-in），等到 systemd（PID 1）才載入就太晚了。
P> initramfs 需包含 LVVM driver 與工具並啟用 volume，重建 initramfs
P> root= / fstab 指向 LVVM 裝置；/boot 放在一般 partition
P> 在 initramfs（掛 root 之前）載入
P> 原因：modules 在 root fs 上，雞生蛋問題
?cmd 在 Debian（initramfs-tools）重建目前 kernel 的 initramfs：
= update-initramfs -u
= update-initramfs -u -k $(uname -r)
= update-initramfs -u -k all
E> -u 更新、-k 指定 kernel 版本。

@CARD boot.modules | 裝置與 Kernel Modules
A> kernel module 像「可插拔的工具卡」：lsmod 看插了哪些、modinfo 看說明書、modprobe 會連同依賴的卡一起插。開機時 root 磁碟需要的卡，必須在 kernel 或 initramfs 裡就準備好。
B> modules 通常在 **/lib/modules/<kernel-version>**；**uname -r** 看版本
B> **lsmod** 列出已載入模組；**modinfo** 顯示模組資訊
B> **modprobe** 會解析並載入相依模組
B> root 儲存裝置的驅動必須在 **kernel 或 initramfs** 中
B> 不要卸載使用中的驅動；**journalctl -k -b** 看本次開機 kernel 訊息
B> 持久設定：**modprobe.d** 控制模組選項；**modules-load.d** 要求開機靜態載入（多數裝置會自動載入）
?mt 配對指令與用途：
> lsmod :: 列出已載入的模組
> modinfo :: 顯示模組資訊
> modprobe :: 載入模組（含相依模組）
> uname -r :: 顯示目前 kernel 版本
E> modprobe 比 insmod 聰明，會處理相依。
?mc 想讓某個 kernel module 每次開機都固定載入，應設定在？
+ /etc/modules-load.d/
- /etc/modprobe.d/
- /etc/default/grub
- /boot/grub/grub.cfg
E> modprobe.d 是設定模組「選項」；modules-load.d 是要求載入。

@CARD boot.pid1 | PID 1 與 kernel threads
A> PID 1 是「這棟大樓的總管」：所有 user-space 服務都由它啟動、它負責看顧；父母先走的孤兒 process 也由它收養。kernel threads（如 kthreadd）則是 kernel 自己的工作人員。
B> Debian：PID 1 是 **systemd**；kernel tasks 如 **kthreadd**
B> FreeBSD：PID 1 是 **init**
B> PID 1 啟動 / 監管 user space，並**處理 orphaned processes**
B> kernel task 名稱與 PID 會因版本改變 → 理解 PID 1 的角色，而不是死背 PID 列表
X> ps -p 1 -o pid,comm
?cmd 查看 PID 1 是什麼程式（顯示 pid 與指令名稱）：
= ps -p 1 -o pid,comm
= ps -o pid,comm -p 1
E> -p 選 PID、-o 選欄位。

@CARD boot.unitfiles | systemd Unit 檔位置與修改
A> 套件給的 unit 是「原廠說明書」（/usr/lib），不要直接塗改；你的修改寫在「便利貼」drop-in（/etc），systemctl edit 會幫你建便利貼。改完要叫 systemd 重讀（daemon-reload）。
B> **/usr/lib/systemd/system/**：套件提供的 units
B> **/etc/systemd/system/**：本地 units 與管理員覆寫（優先）
B> **/run/systemd/system/**：runtime unit 設定
B> **systemctl cat ssh.service**：顯示 unit 與 drop-in 檔
B> **systemctl edit ssh.service**：建立本地 drop-in 覆寫
B> 手動編輯 unit 後要 **systemctl daemon-reload**，再視情況 restart / reload；**不要直接改 vendor unit**
?mt 配對位置：
> /usr/lib/systemd/system/ :: 套件提供的 unit
> /etc/systemd/system/ :: 管理員自訂與覆寫
> /run/systemd/system/ :: runtime 設定
E> /etc 的優先權高於 /usr/lib。
?cmd 手動編輯了 /etc/systemd/system/myapp.service 後，讓 systemd 重新讀取 unit 定義：
= systemctl daemon-reload
E> 之後再 systemctl restart myapp.service。
?cmd 用 drop-in 方式覆寫 ssh.service 的設定（不改原廠檔）：
= systemctl edit ssh.service
= systemctl edit ssh
E> 會在 /etc/systemd/system/ssh.service.d/ 建立 override.conf。

@CARD boot.systemctl | systemctl：start vs enable
A> start 是「現在開燈」，enable 是「設定每天回家自動開燈」。兩件事獨立：開了燈不代表明天會自動開；設定了自動開燈也不會讓現在的燈亮，除非加 --now。
B> **start** 改變 **runtime** 狀態（現在跑起來）
B> **enable** 設定**開機時**（或透過依賴）啟動的策略
B> **enable --now** = enable + start
B> **daemon-reload** 重讀 unit 定義
B> 檢查：systemctl status、**is-enabled**、**get-default**（預設 target）
B> SSH：Debian 的 openssh-server 提供 **ssh.service**；重載前先 **sshd -t** 檢查設定語法；改 SSH 時保留一個現有連線直到新連線成功
?cmd 立刻啟動 ssh.service 並設定開機自動啟動（一個指令）：
= systemctl enable --now ssh.service
= systemctl enable --now ssh
= systemctl --now enable ssh.service
E> --now 同時 start。
?tf systemctl start nginx 之後，nginx 下次開機也會自動啟動。
=F
E> start 只影響現在；要 enable 才會開機啟動。
?cmd 在重新載入 sshd 前，檢查 SSH 設定檔語法：
= sshd -t
= /usr/sbin/sshd -t
E> -t = test mode。
?cmd 查詢系統預設開機 target：
= systemctl get-default
E> set-default 可設定。

@CARD boot.units | Unit 類型與依賴
A> Unit 是 systemd 的「樂高積木」種類：service（服務）、socket（有人敲門才叫醒服務）、mount（掛載點）、timer（鬧鐘）、target（集合點，像「全員到齊」的群組）。依賴分兩種：Requires/Wants 是「我需要誰」，After/Before 是「誰先誰後」，兩者是不同的事。
B> **service**：執行或監管服務（ssh.service）
B> **socket**：由 socket 觸發啟動服務（app.socket）
B> **mount**：代表檔案系統掛載（home.mount）
B> **timer**：排程啟動（backup.timer）
B> **target**：一組 units 的群組與同步點（multi-user.target）
B> **After= / Before=** 只控制**順序**；**Requires= / Wants=** 表示**依賴關係**
B> Wants = 弱依賴（對方失敗我照樣啟動）；Requires = 強依賴
?tf 在 unit 中寫 After=network.target，就代表啟動本服務時會順便把 network.target 拉起來。
=F
E> After 只管順序，不會拉起依賴；拉起要 Wants= 或 Requires=。
?mt 配對 unit 類型：
> .timer :: 排程啟動另一個 unit
> .socket :: 有連線進來時啟動服務
> .target :: 一組 units 的群組 / 同步點
> .mount :: 代表一個掛載點
E> service 是最常見的類型。
?mc 哪個 unit 設定只表示「啟動順序」，不表示依賴？
+ After=
- Requires=
- Wants=
- BindsTo=
E> Before/After 是 ordering；Wants/Requires 是 dependency。

@CARD boot.targets | Targets 與傳統 Runlevel
A> 傳統 runlevel 像「大樓的營業模式編號」；systemd 改成「有名字的集合（target）」，而且是依賴關係組成，不是一級一級往上爬的數字。
B> 0 → **poweroff.target**
B> 1 → **rescue.target**（維護、rescue shell）
B> 2, 3, 4 → **multi-user.target**（非圖形多人）
B> 5 → **graphical.target**（圖形登入）
B> 6 → **reboot.target**
B> runlevel 在各 SysV 發行版意義不同；systemd target 是**依賴群組**，不是數字步驟
?mt 配對 runlevel 與 target：
> 0 :: poweroff.target
> 1 :: rescue.target
> 3 :: multi-user.target
> 5 :: graphical.target
> 6 :: reboot.target
E> 2、3、4 都對應 multi-user.target。

@CARD boot.deps | 宣告依賴：Wants / WantedBy / list-dependencies
A> 讓 A 依賴 B 有兩種寫法：在 A 的 [Unit] 寫「我要 B」（Wants=B），或在 B 的 [Install] 寫「我被 A 需要」（WantedBy=A），enable 時 systemd 會在 A.wants/ 目錄建一個 symlink。
B> **[Unit] Wants= / Requires=**：在「需要別人」的 unit 中宣告
B> **[Install] WantedBy= / RequiredBy=**：在「被需要」的 unit 中宣告；**systemctl enable** 時在 <target>.wants/ 或 .requires/ 建立 symlink
B> 也可以直接在 /etc/systemd/system/<unit>.wants/ 建 symlink
B> 順序另外用 **Before= / After=**（例：sddm.service 寫 Before=graphical.target 或 graphical.target 寫 After=）
B> **systemctl list-dependencies graphical.target**：以樹狀列出依賴
X> graphical.target
X> ● ├─sddm.service（display-manager.service）
X> ● └─multi-user.target
X> ●   ├─ssh.service …
X> ●   └─basic.target
X> ●     ├─sockets.target …
X> ●     └─sysinit.target …
?sa SDDM 的 systemd service 應在 graphical.target ready 之前先啟動。試問在 shell 輸入 systemctl list-dependencies graphical.target 會有什麼輸出？（至少列出 sddm.service、multi-user.target、basic.target）在 systemd unit 裡，有多種方式可以宣告這種 dependency，列出兩種（需列出在哪個 section 的哪個 property）。
S> 2025 期末 Q12
R> 輸出是樹狀結構，例如：
R> graphical.target
R> ├─sddm.service（或 display-manager.service）
R> └─multi-user.target
R>   ├─（其他服務，如 ssh.service…）
R>   └─basic.target
R>     ├─sockets.target / paths.target / timers.target …
R>     └─sysinit.target …
R> 宣告方式：① 在 sddm.service 的 [Install] section 寫 WantedBy=graphical.target（或 RequiredBy=），systemctl enable 時會在 graphical.target.wants/ 建立 symlink；② 在 graphical.target 的 [Unit] section 寫 Wants=sddm.service（或 Requires=，實際上 Debian 是 Wants=display-manager.service 再以 alias 指到 sddm.service）。順序部分可在 sddm.service 的 [Unit] 寫 Before=graphical.target。
P> 樹狀輸出：graphical.target 下有 sddm.service 與 multi-user.target，multi-user.target 下有 basic.target
P> [Install] WantedBy=graphical.target
P> [Unit] Wants=/Requires=sddm.service（寫在 graphical.target）
?mc 在 myapp.service 的 [Install] 寫 WantedBy=multi-user.target，執行 systemctl enable myapp 時實際做了什麼？
+ 在 multi-user.target.wants/ 目錄建立指向 myapp.service 的 symlink
- 立刻啟動 myapp.service
- 把 myapp.service 複製到 /usr/lib/systemd/system/
- 修改 multi-user.target 檔案內容
E> enable 就是依 [Install] 建 symlink。

@CARD boot.defdeps | 預設依賴：Conflicts=shutdown.target
A> 一般服務都被 systemd 自動貼上兩張貼紙：「關機（shutdown.target）來了我就要停」（Conflicts=）以及「關機要等我先停好」（Before=）。只有少數必須撐到最後的特殊 unit 會撕掉貼紙（DefaultDependencies=no）。
B> **Conflicts=shutdown.target**：shutdown.target 被啟動時，這個 unit 會被**停止**（兩者不能同時存在）
B> **Before=shutdown.target**：確保這個 unit 在 shutdown.target 達成**之前**停止完成（關機時的順序）
B> 一般 service unit 在 **DefaultDependencies=yes**（預設）時會**自動**加上這兩個屬性
B> 要撐到關機很後面的 unit（或早期開機 unit）會設 **DefaultDependencies=no**
?sa 在 systemd unit 裡，Conflicts=shutdown.target 以及 Before=shutdown.target 的作用為何？什麼樣的 systemd unit 會有這些 properties？
S> 2025 期末 Q11
R> Conflicts=shutdown.target：表示此 unit 與 shutdown.target 互斥，當系統要關機而啟動 shutdown.target 時，systemd 會先把此 unit 停止。
R> Before=shutdown.target：設定順序，shutdown.target 要等此 unit 停止完成之後才算達成，確保服務在關機流程繼續前被乾淨地停掉（關機時能依序 stop）。
R> 擁有這些屬性的：幾乎所有一般的 service（及 socket、timer 等）unit，只要 DefaultDependencies=yes（預設值），systemd 就會自動幫它們加上這兩個依賴；例如 ssh.service、cron.service 等一般長駐服務。設了 DefaultDependencies=no 的特殊 unit（早期開機或需撐到關機最後的 unit）則沒有。
P> Conflicts：關機啟動 shutdown.target 時此 unit 被停止
P> Before：在 shutdown.target 之前完成停止（順序）
P> 一般 service（DefaultDependencies=yes 自動加入）

@CARD boot.timerinst | Template unit 與沒有 [Install] 的 unit
A> 沒有 [Install] 的 unit 像「沒有自己大門鑰匙的房客」：它不能被 enable，但別人可以把它叫醒，例如鬧鐘（timer）、別的 unit 的依賴、socket、或 udev 事件。xxx@.service 是「範本」，@ 後面填參數就變成一個實例。
B> 沒有 [Install] section → 無法 systemctl enable，但仍可被：**timer**、其他 unit 的 **Wants/Requires**、**socket / path** activation、udev 等觸發
B> **Template unit**：name@.service；實例 name@參數.service；%i、%f 等 specifier 代入參數（%f = 解碼成路徑）
B> **Timer**：xxx.timer 預設啟動同名的 xxx.service；例 btrfs-scrub@.timer（OnCalendar=monthly）
B> 啟用 timer：systemctl enable --now btrfs-scrub@-.timer（- 代表 /）
?sa btrfs-scrub@.service 沒有 [Install] section。試問這個 systemd unit 在不手動下 systemctl start 的情況下該如何被啟動？
QX> [Unit]
QX> Description=Btrfs scrub on %f
QX> ConditionPathIsMountPoint=%f
QX> RequiresMountsFor=%f
QX> [Service]
QX> Nice=19
QX> IOSchedulingClass=idle
QX> KillSignal=SIGINT
QX> ExecStart=/usr/bin/btrfs scrub start -B %f
S> 2025 期末 Q13
R> 它是 template unit，需要由其他 unit 觸發。最典型的是搭配同名的 timer：btrfs-scrub@.timer（內含 [Timer] OnCalendar=monthly 之類的排程，以及 [Install] WantedBy=timers.target），對某個掛載點 enable 該 timer 的實例，例如 systemctl enable --now btrfs-scrub@-.timer（- 表示 /，%f 會被還原成路徑），時間到時 timer 就會啟動對應的 btrfs-scrub@-.service。
R> 其他方式：被其他 unit 以 Wants=/Requires= 拉起（依賴觸發），或由 socket/path activation 等機制啟動。
P> 由 timer（btrfs-scrub@.timer）定期啟動
P> enable 的是 timer 的實例，%f / 實例名代表掛載點
P> 也可被其他 unit 依賴（Wants/Requires）拉起
?mt 配對 systemd 名詞：
> backup.timer :: 時間到時啟動 backup.service
> getty@tty1.service :: template unit 的一個實例
> %i :: template 實例名稱
> OnCalendar= :: timer 的日曆時間設定
E> timer 預設啟動同名的 service。

@CARD boot.frameworks | 其他啟動框架（比較）
A> 不同系統有不同的「總管」：Debian 用 systemd（units + systemctl）、老 Linux 用 SysV（/etc/init.d 腳本 + rcN.d 裡的 S/K 連結）、FreeBSD 用 rc（/etc/rc.conf + service + sysrc）。
B> **Debian systemd**：units、drop-ins、systemctl
B> **Legacy SysV**：/etc/init.d 與 /etc/rcN.d；以 **S（start）/ K（kill）** 開頭、有序號的 link
B> **FreeBSD**：/etc/rc.conf、rcorder、service、sysrc
B> FreeBSD 的 rc 設定與 boot0/boot1/boot2 不是 Debian 的設定或開機階段
?mt 配對系統與服務管理方式：
> Debian（systemd） :: systemctl 與 unit 檔
> 傳統 SysV :: /etc/init.d 腳本與 rcN.d 的 S/K 連結
> FreeBSD :: /etc/rc.conf、service、sysrc
E> 考 Linux vs FreeBSD 差異時很好用。

@CARD boot.login | 登入流程與 fork/exec
A> fork 是「影分身」（多一個新 PID 的自己）、exec 是「變身」（PID 不變，但整個人換成另一個程式）。shell 執行 ls：先影分身，分身再變身成 ls。
B> ① init / service manager 啟動 **getty**
B> ② **login** 檢查帳號與認證政策
B> ③ login **exec** 設定的 login shell
B> ④ shell 執行外部指令：通常 **fork** 出 child，child 再 **exec** 程式
B> **fork 產生新 process / 新 PID；exec 替換 process image 但保留 PID**
B> SSH 有自己的 session 路徑
?ord console 登入的流程：
> service manager 啟動 getty
> login 檢查帳號與認證
> login exec 使用者的 login shell
> shell fork 子程序，子程序 exec 外部指令
E> exec 不會產生新 PID。
?tf exec 會建立一個新的 PID。
=F
E> fork 產生新 PID；exec 保留 PID、替換程式。

@CARD boot.rescue | Rescue 與 Emergency 模式
A> rescue.target 是「維修模式」：保留基本服務和掛載，像醫院急診室有基本設備；emergency.target 是「加護病房最小配置」：幾乎什麼都沒啟動，root 甚至是唯讀。如果連這都不行，就拿救護車（installer rescue / live USB）從外面救。
B> **rescue.target**：維修 shell，有基本服務與掛載；網路**不保證**
B> **emergency.target**：最小 shell，更少 units 與 mounts；**root 可能唯讀**
B> **Installer rescue**：從外部媒體修復，要先掛載/解鎖正確的 root
B> 進入：GRUB 選單按 **e** → 在 linux 那行加 **systemd.unit=rescue.target**（或 emergency.target）→ **Ctrl+X 或 F10** 開機（只影響這次開機）
B> 執行中系統：**sudo systemctl rescue**（會中斷服務與連線，**不要透過 SSH 做**）
B> 認證：rescue/emergency 常用 **sulogin** 要 root 密碼；有些 Debian 安裝鎖了 root（root locked）→ 可能無法用一般 rescue 登入 → 先準備 installer rescue 媒體
?fill 在 GRUB 編輯畫面，於 linux 那行加上 systemd.unit=＿＿.target 可進入維修模式（有基本服務）
= rescue
E> emergency.target 更精簡。
?mc rescue.target 與 emergency.target 的差異何者正確？
+ emergency 更精簡，root filesystem 可能是唯讀
- rescue 一定有網路
- emergency 會啟動所有服務
- 兩者完全一樣
E> rescue 有基本服務與掛載；emergency 最少。
?ord 從 GRUB 暫時進入 rescue 模式的步驟：
> 在 GRUB 選單選到項目按 e
> 在 linux 開頭的那行最後加上 systemd.unit=rescue.target
> 按 Ctrl+X（或 F10）以修改後的設定開機
E> 這是暫時修改，不會寫入 /etc/default/grub。
?tf 透過 SSH 連線執行 systemctl rescue 是安全的，連線會保留。
=F
E> rescue 會停止服務與連線；要在 console 上做。

@CARD boot.fsrescue | 維護模式下的檔案系統
A> 在急診室先看病歷（findmnt、lsblk）再動刀；remount,rw 只是「把病床從唯讀變可寫」，不是治療（修復）。修檔案系統要在「沒掛載」的狀態下用對的工具。
B> 先讀錯誤訊息、檢查掛載：**findmnt /**、**lsblk -f**
B> 安全時才讓 root 可寫：**mount -o remount,rw /**
B> **remount 不是修復**；不要對**已掛載**的 root 執行修復
B> ext4 在**未掛載**狀態下修（通常用 rescue media）；XFS、Btrfs 有自己的工具
B> 沒有萬用的 fsck
?cmd 在 emergency shell 中，把唯讀的 root filesystem 重新掛載為可寫：
= mount -o remount,rw /
= mount -o rw,remount /
E> remount 只改掛載選項，不是修復。
?tf 可以直接對已掛載、正在使用的 root filesystem 執行 fsck 修復。
=F
E> 修復要在未掛載狀態，通常從 rescue media 開機進行。

@CARD boot.diag | 開機失敗：定位是哪一層
A> 看症狀找層級：連選單都沒有 → firmware/loader；選單有但找不到 kernel → loader 路徑；kernel 掛不上 root → 驅動/加密/LVM；服務起不來 → systemd units；登不進去 → 帳號/認證。
B> 沒有 firmware / loader 選單 → 開機順序、偵測到的儲存、EFI 項目或開機碼
B> loader 找不到 kernel → loader 路徑、已安裝的 kernel、檔案系統存取
B> kernel 無法掛載 root → root 裝置、**驅動、加密、pool/filesystem**
B> 服務啟動失敗 → units、drop-ins、依賴、journal
B> 登入失敗 → 帳號、認證、shell、SSH 政策
B> 先記錄**第一個有意義的錯誤**與**最後成功的階段**
B> Log：**systemctl --failed**、journalctl **-b**（本次開機）、**-k**（kernel）、**-u** unit、**-p warning**、**-b -1**（上次開機，需保留 journal）
?mt 配對症狀與優先檢查：
> 開機直接進 UEFI 設定、沒有 GRUB 選單 :: EFI 開機項目 / boot loader
> 看到 GRUB 但說找不到 kernel :: loader 路徑與 kernel 檔
> kernel panic：無法掛載 root fs :: 驅動、加密、LVM、root= 參數
> 開機完成但 nginx 沒起來 :: systemd unit 與 journal
E> 判斷「最後成功」的階段就知道壞在哪層。
?cmd 列出所有啟動失敗的 systemd units：
= systemctl --failed
= systemctl list-units --failed
E> 接著用 journalctl -u <unit> 看細節。
?cmd 查看「上一次開機」的 journal 記錄：
= journalctl -b -1
E> -b 0 或 -b 是本次；-b -1 是上次（需要持久保存 journal）。
?cmd 查看本次開機中 ssh.service 的 log：
= journalctl -b -u ssh.service
= journalctl -u ssh.service -b
= journalctl -b -u ssh
= journalctl -u ssh -b
E> -b 本次開機，-u 指定 unit。

@CARD boot.shutdown | 有序關機與關機指令
A> 有序關機像打烊：先通知客人、各部門收工（停服務）、把帳本寫好（flush、unmount）、最後關燈或關電源。halt 是「停止營業但電燈沒關」、poweroff 是「關掉總電源」、reboot 是「打烊後重新開店」。
B> 通知使用者 → 停止服務、終止剩餘 process → flush 寫入、unmount → halt / poweroff / reboot
B> **sync 不能取代**有序關機
B> **Halt**：停止執行，**電源可能仍開著**（systemctl halt）
B> **Poweroff**：停止並要求斷電（systemctl poweroff）
B> **Reboot**：停止並重啟（systemctl reboot）
B> **shutdown -r +10 "Maintenance"**：10 分鐘後重開；**now** 立即；**shutdown -c** 取消
B> Debian systemd 的 **shutdown -h** 通常是 poweroff；**FreeBSD shutdown -h 是 halt、-p 是 poweroff**
B> 關機卡住（服務掛住）與 halt 了但沒斷電（ACPI/firmware/hypervisor）要分開調查
?cmd 排程 10 分鐘後重開機，並廣播訊息 Maintenance：
= shutdown -r +10 "Maintenance"
= shutdown -r +10 Maintenance
= shutdown -r +10 'Maintenance'
E> +10 = 十分鐘後。
?cmd 取消已排程的 shutdown：
= shutdown -c
E> -c = cancel。
?mt 配對 FreeBSD shutdown 選項：
> shutdown -p now :: 立即關機並斷電 (poweroff)
> shutdown -r now :: 立即重新開機
> shutdown -h now :: 立即 halt（停止但可能不斷電）
E> 在 Debian systemd 上 -h 通常會 poweroff，兩平台不同。
?mc halt 與 poweroff 的差別？
+ halt 停止系統執行但電源可能仍開著；poweroff 會要求斷電
- 兩者完全相同
- halt 會重新開機
- poweroff 不會停止服務
E> 指令語意在不同系統間有差，讀本機 man page。

@CARD boot.disaster | dd 誤寫磁碟開頭：MBR vs GPT
A> MBR 把分割表寫在「唯一一張」紙條上，撕掉就沒了；GPT 在磁碟開頭和結尾各放一份（主表 + 備份），開頭被毀還能用尾巴那份救回來。
B> GPT 佈局：LBA 0 = protective MBR、LBA 1 = **primary GPT header**、LBA 2-33 = partition entries；磁碟**最後**還有 **backup GPT header + entries**
B> dd 從 /dev/sda 開頭寫掉 40KB：MBR（boot code + 分割表）或 GPT 主 header 與主分割表都會被毀；partition 通常從 1MiB 開始，所以 filesystem 本身可能完好
B> 執行中的系統：kernel 已在記憶體中讀好分割表，可能還能跑；**重開機才是問題**
B> **MBR**：boot code 與唯一一份分割表都沒了 → BIOS 無法開機、kernel 找不到 partition；只能靠事先備份（sfdisk -d）或 testdisk 掃描重建
B> **GPT**：主表毀，但可用磁碟尾端的**備份 GPT** 恢復（gdisk / sgdisk），部分 UEFI firmware 也會自動用備份 → 災難復原容易得多
?sa 培根要用 dd 清空 USB（/dev/sdc），卻打成 rootfs 所在的 /dev/sda，按 Ctrl+C 時已有 10 個 block（40KB）被清掉。假設 root filesystem 與 system files 沒被清掉，這台工作站還有辦法重開機嗎？為什麼？在這種情況下 MBR 與 GPT 在災難復原的考量上有什麼差別？
S> 2025 期末 Q15
R> 磁碟開頭 40KB 存放的是分割資訊與開機資料：MBR 的 boot code 與 partition table（sector 0），或 GPT 的 protective MBR、primary GPT header（LBA 1）與 partition entry array（LBA 2-33，約 16KB）。這些都被清掉了。
R> 目前系統因為 kernel 已在記憶體中載入分割表，可能還能繼續執行，但「直接重開機」很可能無法開機：BIOS/MBR 情況下 boot code 不見，firmware 無法開機；即使能載入 loader，也讀不到分割表找不到 root / ESP。所以應在重開機前先修復分割表。
R> MBR vs GPT：MBR 只有一份分割表、沒有備份，被覆蓋後只能靠事先的備份（sfdisk -d）或用 testdisk 等工具掃描磁碟猜回分割位置，風險高。GPT 在磁碟最後有 backup GPT header 與 partition entries，可以用 gdisk / sgdisk 從備份重建主表（部分 UEFI firmware 也能自動使用備份），災難復原容易很多；之後再重建 protective MBR 或重新 grub-install / 確認 ESP。
P> 被清掉的是 MBR / GPT header 與分割表（+ BIOS boot code）
P> 重開機會失敗（找不到 boot code / 分割資訊），執行中系統暫時可運作
P> MBR 無備份，只能事前備份或掃描重建
P> GPT 有磁碟尾端的 backup header / table 可復原
?fill GPT 的備份 header 與 partition entries 存放在磁碟的＿＿（開頭/結尾）
= 結尾
= 尾端
= 最後
= 末端
E> 主表在開頭，備份在結尾。

@CARD boot.p_journal | 實作：journalctl 常用查法
A> journal 是整台機器的「行車紀錄器」，所有服務的輸出都錄在裡面。重點是學會快轉：只看某個服務、只看這次開機、只看錯誤、只看最近十分鐘。
B> **-u 服務**：某個 unit；**-t 名稱**：依 syslog identifier（程式自稱的名字）；**-k**：kernel 訊息（等同 dmesg）
B> **-b**：這次開機；**-b -1**：上一次開機（查「為什麼上次開不起來」）
B> **-e** 跳到最後、**-f** 持續追蹤、**-n 50** 最後 50 行、**-x** 附加說明、**--no-pager** 不進 less（接 pipe 時用）
B> **-p err**：只看 err 以上的等級；**--since "10 min ago"**、**--since today**
B> 可以組合：`journalctl -u ssh -b -p warning --no-pager`
X> journalctl -u sftp_watchd -f
X> journalctl -b -1 -p err --no-pager
X> journalctl -t internal-sftp -t sftp-server --since "5 min ago"
?cmd 持續追蹤（follow）sftp_watchd 這個 service 的 log：
= journalctl -u sftp_watchd -f
= journalctl -fu sftp_watchd
= journalctl -f -u sftp_watchd
= journalctl -u sftp_watchd.service -f
E> -u 選 unit，-f 像 tail -f。
?cmd 只看「上一次開機」期間、等級為 err 以上的 log：
= journalctl -b -1 -p err
= journalctl -p err -b -1
E> -b 0 是這次、-b -1 是上一次。
?mt 配對 journalctl 選項：
> -u ssh :: 只看 ssh 這個 unit
> -t sudo :: 依 syslog identifier 過濾
> -k :: 只看 kernel 訊息
> -p err :: 只看 err 以上等級
E> -u 是 systemd unit 名稱，-t 是程式寫 log 時自報的名字，兩者不同。

@CARD boot.p_status | 實作：服務起不來怎麼查
A> 服務啟動失敗時，systemctl status 是「病歷首頁」：Loaded 那行告訴你 unit 檔在哪、有沒有 enable；Active 那行告訴你死因的代號；最下面附上最後幾行 log。看不夠再去 journalctl 翻完整病歷。
B> **systemctl status X**：看 Loaded（路徑、enabled / disabled）、Active（active / failed / activating）、Main PID、最後幾行 log
B> **systemctl --failed** 列出所有失敗的 unit；**systemctl cat X** 看實際生效的 unit 檔（含 drop-in）
B> 改過 unit 檔一定要 **systemctl daemon-reload**，不然 systemd 用的還是舊版
B> 常見死因：**status=203/EXEC**（ExecStart 的檔案不存在、沒有執行權限、或 shebang 錯）、**status=217/USER**（User= 指定的帳號不存在）、**status=200/CHDIR**（WorkingDirectory 不存在）
B> 一直重啟被擋下（start request repeated too quickly）：修好後 **systemctl reset-failed X** 再 start
B> 寫完先驗證：**systemd-analyze verify 檔案.service**
X> systemctl status sftp_watchd --no-pager
X> systemctl cat sftp_watchd
X> journalctl -u sftp_watchd -e
X> systemd-analyze verify /etc/systemd/system/sftp_watchd.service
?mc service 啟動失敗，status 顯示 `Main process exited, code=exited, status=203/EXEC`。最可能的原因？
+ ExecStart 指定的程式不存在、沒有執行權限，或 shebang 有誤
- User= 指定的帳號不存在
- 服務被 SIGKILL 終止
- 記憶體不足
E> 203 是 systemd 連 exec 都做不到。217 才是 USER 問題。
?mc 修改了 /etc/systemd/system/foo.service 之後直接 `systemctl restart foo`，結果行為沒變，還出現警告。漏了哪一步？
+ systemctl daemon-reload
- systemctl enable foo
- systemctl isolate default.target
- reboot
E> systemd 把 unit 檔讀進記憶體，改檔後要叫它重新讀。
?cmd 列出目前所有處於 failed 狀態的 unit：
= systemctl --failed
= systemctl list-units --failed
= systemctl list-units --state=failed
E> 開機後第一件事可以先看這個。
?cmd 顯示 ssh.service 實際生效的 unit 檔內容（包含 drop-in 覆寫）：
= systemctl cat ssh
= systemctl cat ssh.service
E> 比自己去 /lib/systemd/system 找更可靠。

@CARD boot.p_unit | 實作：寫一個可靠的 service unit
A> systemd 是「會幫你顧小孩的保母」：你只要寫一個一直在前景跑的程式，背景化、重啟、收 log、關機時叫它停，全部交給保母。最常見的錯就是自己在腳本裡加 & 或 nohup 把程式丟到背景，保母以為小孩不見了。
B> **Type=simple**（預設）：ExecStart 的程式要**留在前景**一直跑，不要自己 fork 到背景
B> **ExecStart 必須是絕對路徑**；指令裡要用 pipe 或變數展開得包一層 `/bin/sh -c '...'`
B> **Restart=on-failure** 加 **RestartSec=2**：異常結束自動重啟
B> 程式的 stdout / stderr 自動進 journal（journalctl -u 看得到）；Python 等有輸出緩衝的語言要關掉緩衝（`python3 -u` 或 `Environment=PYTHONUNBUFFERED=1`），不然 log 會延遲很久才出現
B> **After=** 只管順序、**Wants= / Requires=** 才是依賴；需要某掛載點先就緒：**RequiresMountsFor=/mnt/hw2/sftp**
B> **[Install] WantedBy=multi-user.target** 才能 enable；放在 **/etc/systemd/system/**
X> [Unit]
X> Description=SFTP upload watcher
X> RequiresMountsFor=/mnt/hw2/sftp
X> [Service]
X> Type=simple
X> ExecStart=/usr/local/bin/sftp_watchd
X> Restart=on-failure
X> RestartSec=2
X> [Install]
X> WantedBy=multi-user.target
?mc 把一個 shell script 做成 Type=simple 的 service，腳本最後一行寫成 `main_loop &` 就結束。會發生什麼事？
+ 主程序馬上結束，systemd 認為服務已停止（並依設定清掉殘留的背景程序）
- 服務正常運作，只是 PID 不同
- systemd 會自動改用 Type=forking
- 開機時會卡住
E> Type=simple 要求 ExecStart 啟動的那個程序就是服務本身，必須留在前景。
?mc Python 寫的 daemon 用 print 輸出訊息，但 `journalctl -u` 很久才看到 log，或停止服務時才一次出現。原因？
+ stdout 不是終端機時會被整塊緩衝；要用 -u 或 PYTHONUNBUFFERED 關閉緩衝
- journald 每小時才寫入一次
- 沒有設定 SyslogIdentifier
- 沒有 enable 服務
E> 也可以在 print 加 flush=True。
?fill 希望 service 在 /mnt/hw2/sftp 這個掛載點就緒之後才啟動，可以在 [Unit] 寫 ＿＿=/mnt/hw2/sftp
= RequiresMountsFor
E> systemd 會自動加上對應 .mount unit 的 Requires 與 After。
?tf unit 檔的 ExecStart= 可以直接寫 `sftp_watchd`，systemd 會用 PATH 幫忙找。
=F
E> 傳統上必須寫絕對路徑；請一律寫完整路徑，最不會出錯。

@CARD boot.p_grubedit | 實作：在 GRUB 選單臨時改開機參數
A> GRUB 選單是開機路上的「最後一個收費站」，你可以在這裡臨時改這一趟的行程：按 e 編輯那一筆的指令，改完按 Ctrl+X 開機。改的東西只對這一次有效，不會寫回硬碟，所以很適合拿來救援與實驗。
B> 選單上按 **e** 編輯、**c** 進入 GRUB 指令列；編輯畫面按 **Ctrl+X 或 F10** 用改過的內容開機
B> 找到 **linux** 開頭那行，在行尾加參數：**systemd.unit=rescue.target**（救援模式）、**systemd.unit=multi-user.target**（強制進多人模式）、**init=/bin/bash**（連 systemd 都不跑，直接拿到 root shell）
B> 用 init=/bin/bash 進去時 root 是唯讀的：先 `mount -o remount,rw /` 才能改檔
B> 開機後確認這次用了哪些參數：**cat /proc/cmdline**
B> 想永久修改：編輯 **/etc/default/grub** 的 GRUB_CMDLINE_LINUX，再 **update-grub**
B> 缺 initramfs 或 root= 寫錯的典型畫面：**Kernel panic: VFS: Unable to mount root fs on unknown-block(0,0)**
?mc 開機時在 GRUB 選單按 e，於 linux 那行尾端加上 systemd.unit=multi-user.target 後開機。這個修改？
+ 只對這一次開機有效，下次重開機就恢復原狀
- 會永久寫入 /boot/grub/grub.cfg
- 會永久寫入 /etc/default/grub
- 會改變 systemctl get-default 的結果
E> 要永久改就 set-default，或修改 /etc/default/grub 後 update-grub。
?cmd 開機後，查看 kernel 這次開機實際收到的命令列參數：
= cat /proc/cmdline
E> 懷疑 GRUB 設定被人加了奇怪的參數時，先看這裡。
?mc 用 init=/bin/bash 開機拿到 shell 後，想改 /etc/shadow 卻顯示 Read-only file system。應該先？
+ mount -o remount,rw /
- fsck -y /
- chmod 666 /etc/shadow
- systemctl daemon-reload
E> kernel 預設以唯讀掛載 root，正常開機時是後續流程把它 remount 成可寫。
?mc 開機出現 `VFS: Unable to mount root fs on unknown-block(0,0)`，最可能的原因是？
+ 沒有載入 initramfs（檔案不在 /boot 或 GRUB 設定沒有 initrd 那行），kernel 找不到 root 裝置
- 使用者密碼過期
- /etc/fstab 的 swap 設定錯誤
- 預設 target 被設成 rescue
E> root 在 LVM / LUKS 上時，沒有 initramfs 裡的驅動與工具就掛不起來。

@CARD boot.p_chroot | 實作：Live 環境加 chroot 救援
A> 系統開不起來時，就「開另一台車把壞車拖進維修廠」：用 Live ISO 開機，把壞掉系統的 root 掛到 /mnt，再 chroot 進去。此時你下的指令（update-initramfs、update-grub、passwd）改的都是壞掉的那套系統。
B> 層層打開：有 LUKS 先 **cryptsetup open**、有 LVM 再 **vgchange -ay**，然後才 mount
B> 掛載順序：root 到 /mnt → /boot 到 /mnt/boot → ESP 到 /mnt/boot/efi
B> chroot 之前把虛擬檔案系統 bind 進去：**/dev、/proc、/sys、/run**，不然裡面的工具找不到裝置
B> `chroot /mnt` 之後就像在原系統裡一樣修：把 initramfs 放回 /boot、`update-initramfs -u -k all`、`update-grub`
B> 修完 exit，`umount -R /mnt` 再重開機
B> 用 `lsblk -f` 先認清哪個分割區是什麼，不要憑印象下指令
X> cryptsetup open /dev/sda3 cryptroot
X> vgchange -ay
X> mount /dev/mapper/debian--vg-root /mnt
X> mount /dev/sda2 /mnt/boot && mount /dev/sda1 /mnt/boot/efi
X> for d in dev proc sys run; do mount --bind /$d /mnt/$d; done
X> chroot /mnt /bin/bash
?ord 用 Live ISO 救援一台「LUKS 上疊 LVM」的系統，正確順序是：
> cryptsetup open 解開加密分割區
> vgchange -ay 啟用 volume group
> mount root LV 到 /mnt，再掛 /boot 與 ESP
> bind mount /dev /proc /sys /run 到 /mnt 底下
> chroot /mnt 後進行修復
E> 由外層往內層一層一層打開，結束時反過來收。
?mc chroot 之前為什麼要把 /dev、/proc、/sys bind mount 進去？
+ update-initramfs、update-grub 等工具需要透過它們看到實際的裝置與 kernel 資訊
- 為了讓 chroot 之後有網路
- 為了避免 root 被掛成唯讀
- 為了讓 chroot 不需要 root 權限
E> 沒有它們，grub 找不到磁碟、initramfs 工具也認不出 root 裝置。
?cmd 啟用系統上所有 LVM volume group（讓 LV 出現在 /dev/mapper）：
= vgchange -ay
= vgchange -a y
E> 在救援環境裡，LV 預設不一定會自動啟用。

@CARD boot.p_initramfs | 實作：initramfs 的檢查與重建
A> initramfs 是「kernel 的隨身工具包」：裡面裝著解鎖 LUKS、啟動 LVM、掛載 root 需要的驅動與工具。每個 kernel 版本配一包，檔名上的版本號要對得上；工具包內容過期（例如改了 crypttab）就要重新打包。
B> 檔案成對：**/boot/vmlinuz-版本** 與 **/boot/initrd.img-版本**；目前跑的版本用 **uname -r** 查，已安裝的版本看 `ls /lib/modules`
B> **update-initramfs -u**：更新目前版本；**-u -k all**：全部版本；**-c -k 版本**：為某版本新建
B> **lsinitramfs /boot/initrd.img-版本 | less**：看裡面包了什麼（查有沒有 cryptsetup、lvm）
B> 改了 **/etc/crypttab**、/etc/fstab 的 root、或要在開機早期載入的 module 之後，都要 update-initramfs -u
B> initramfs 檔案被搬走時：搬回 /boot（檔名版本要與 vmlinuz 一致），再 update-grub 讓選單重新產生 initrd 那一行
X> uname -r
X> ls -l /boot/vmlinuz-* /boot/initrd.img-*
X> lsinitramfs /boot/initrd.img-$(uname -r) | grep -E 'cryptsetup|lvm'
X> update-initramfs -u -k all && update-grub
?cmd 為系統上所有已安裝的 kernel 版本更新 initramfs：
= update-initramfs -u -k all
= update-initramfs -k all -u
E> 只寫 -u 則只更新最新的那一個版本。
?mc /boot 裡有 vmlinuz-6.1.0-25-amd64，卻沒有對應的 initrd.img。把檔案放回 /boot 之後，還應該做什麼讓 GRUB 選單使用它？
+ 執行 update-grub 重新產生 grub.cfg
- 執行 depmod -a
- 執行 systemctl daemon-reload
- 執行 mkfs
E> grub.cfg 是掃描 /boot 之後產生的；當初掃不到 initrd，選單裡就沒有 initrd 那一行。
?cmd 列出 /boot/initrd.img-6.1.0-25-amd64 這個 initramfs 裡面包含的檔案：
= lsinitramfs /boot/initrd.img-6.1.0-25-amd64
E> 可以接 grep 確認 cryptsetup、lvm 等工具有沒有被包進去。

@CARD boot.p_luks | 實作：LUKS 與 cryptsetup
A> LUKS 加密碟像「有 8 個鑰匙孔的保險箱」：真正加密資料的 master key 只有一把，但每個鑰匙孔（key slot）可以各設一組密碼，任何一組都開得了。所以換密碼不必重新加密整顆碟，只是換掉某個鑰匙孔。
B> 堆疊順序（由下而上）：分割區 → **LUKS** → /dev/mapper/名稱 → LVM PV → LV → 檔案系統；`lsblk` 的 TYPE 欄會顯示 **crypt**
B> 看標頭與 key slot：**cryptsetup luksDump 裝置**
B> 換密碼：**cryptsetup luksChangeKey 裝置**（先問舊的再問新的）；加一組：**luksAddKey**；移除：**luksRemoveKey**
B> 開 / 關：**cryptsetup open 裝置 名稱**、**cryptsetup close 名稱**
B> 開機時自動解鎖的對照表：**/etc/crypttab**（名稱、來源裝置、金鑰檔或 none、選項），改完要 update-initramfs -u
B> 換完密碼務必重開機實測；最好先 luksAddKey 加新的、確認能用，再刪舊的
X> lsblk -o NAME,TYPE,FSTYPE,MOUNTPOINT
X> cryptsetup luksDump /dev/sda3 | grep -i slot
X> cryptsetup luksChangeKey /dev/sda3
X> cat /etc/crypttab      # sda3_crypt UUID=... none luks
?mc 為什麼更改 LUKS 密碼幾乎瞬間完成，不需要把整顆磁碟重新加密？
+ 密碼只用來保護 key slot 裡的 master key；資料是用 master key 加密的，master key 沒變
- 因為 LUKS 其實沒有加密資料
- 因為新密碼要等到下次開機才生效
- 因為只加密了檔案名稱
E> 這也是為什麼可以同時存在多組密碼。
?mt 配對 cryptsetup 子指令：
> luksDump :: 顯示 LUKS 標頭與 key slot 資訊
> luksChangeKey :: 把某組舊密碼換成新密碼
> luksAddKey :: 在空的 key slot 新增一組密碼
> open :: 解鎖並建立 /dev/mapper 下的裝置
E> 加與換都需要先提供一組現有的有效密碼。
?ord 一個典型加密系統的儲存堆疊，由最底層到最上層：
> 磁碟分割區（/dev/sda3）
> LUKS 加密層（/dev/mapper/sda3_crypt）
> LVM（PV → VG → LV）
> 檔案系統（ext4）
E> 所以開機要先解鎖 LUKS，才看得到裡面的 LVM。
?fill 記錄「開機時要解鎖哪些加密裝置」的設定檔是 /etc/＿＿
= crypttab
E> 格式：名稱、來源裝置、金鑰檔（none 表示詢問密碼）、選項。

@CARD boot.p_target | 實作：卡在 rescue / emergency 怎麼出來
A> 每次開機都掉進 rescue，像「車子每次發動都自動開進維修廠」。原因只有幾種：預設目的地被設成維修廠（default target）、有人在開機參數寫死了目的地、或是路上真的壞了（fstab 掛不起來會掉進 emergency）。先分辨是哪一種。
B> 查預設：**systemctl get-default**；改回來：**systemctl set-default multi-user.target**（其實是改 /etc/systemd/system/default.target 這個 symlink）
B> 不重開機直接切換：**systemctl isolate multi-user.target**，或 **systemctl default**
B> 預設值正常卻還是進 rescue：看 **/proc/cmdline** 有沒有 systemd.unit=rescue.target 或 single，源頭在 /etc/default/grub，改完 update-grub
B> **emergency** 模式通常是 fstab 某一行掛載失敗：`journalctl -xb` 找原因，非必要的掛載加 **nofail**
B> rescue 與 emergency 的差別：rescue 會掛載本機檔案系統並啟動基本服務；emergency 只有唯讀的 root 和一個 shell
X> systemctl get-default
X> ls -l /etc/systemd/system/default.target
X> cat /proc/cmdline
X> systemctl set-default multi-user.target && systemctl isolate multi-user.target
?cmd 查詢系統目前的預設開機 target：
= systemctl get-default
E> 結果應該是 multi-user.target 或 graphical.target。
?mc `systemctl get-default` 顯示 multi-user.target，但每次開機仍然進入 rescue mode。接下來最該檢查什麼？
+ cat /proc/cmdline，看 kernel 參數有沒有指定 systemd.unit=rescue.target
- /etc/passwd 的 root shell
- /etc/hostname
- 記憶體大小
E> kernel 命令列的 systemd.unit= 會蓋過 default.target，源頭通常在 /etc/default/grub。
?cmd 不重開機，立刻從 rescue 切換到 multi-user.target：
= systemctl isolate multi-user.target
= systemctl default
E> isolate 會啟動目標 target 需要的 unit，並停掉不屬於它的。
?mc 在 /etc/fstab 新增一行掛載，但裝置路徑打錯了。下次開機最可能的結果？
+ 等待逾時後進入 emergency mode
- 系統忽略那一行，正常開機
- GRUB 選單消失
- kernel panic
E> 沒有 nofail 的掛載被視為必要，失敗就會掉進 emergency。
</script>
<script type="text/plain" class="sa-src" data-ch="user">
@CH user | 使用者管理 | 👤 | 07_User_Management.pdf

@CARD user.id | UID、GID 與 Supplementary Groups
A> Kernel 不認名字只認號碼：alice 只是暱稱，系統裡真正的身分證號是 UID 1001。UID 0 是「萬能鑰匙」，不管叫什麼名字，只要號碼是 0 就是超級使用者。
B> 檔案擁有者與 process credentials 用的是**數字 ID**
B> 每個帳號有一個 **primary group**，並可屬於多個 **supplementary groups**
B> **UID 0 = superuser**，不論 login name 是什麼
B> 不要把 UID 0 給其他一般帳號
X> $ id alice
X> uid=1001(alice) gid=1001(alice) groups=1001(alice),2000(lab)
?tf 把一個帳號命名為 admin 但 UID 設為 0，它就擁有 root 的權限。
=T
E> 權限看 UID，不看名字。
?mc id alice 輸出 uid=1001(alice) gid=1001(alice) groups=1001(alice),2000(lab)，alice 的 primary group 是？
+ alice (1001)
- lab (2000)
- 兩個都是
- root
E> gid= 顯示的是 primary group；groups= 列出全部。

@CARD user.types | 帳號類型
A> 一般使用者是「員工」、service/system user 是「每台機器各配一個的專屬機器人」（權限最小、不能登入）、directory user 是「總公司人事系統管理的員工」（LDAP 等）。
B> **Regular user**：真人、互動式登入，有自己的身分與家目錄
B> **Service / system user**：跑一個 daemon，權限受限、登入受限 → 每個服務用專屬身分
B> **Directory user**：集中管理，透過 **NSS** / 目錄服務解析
B> daemon、bin、sys、nobody 等歷史名稱在不同平台角色不同
?mc 為一個新的 web 服務設定執行身分，最佳做法是？
+ 建立專屬的 system user，限制其登入與權限
- 直接用 root 執行
- 用 nobody 跑所有服務
- 用管理員自己的帳號執行
E> 每個服務專屬身分，最小權限。

@CARD user.passwd | /etc/passwd 七個欄位
A> /etc/passwd 是「公開的通訊錄」（所有人可讀），七欄：名字:密碼標記:UID:GID:備註:家:shell。密碼本身不在這，只放一個 x 代表「去看保險箱 /etc/shadow」。
B> 格式：**name:password-marker:uid:gid:gecos:home:shell**
B> **x** 表示密碼在受保護的 shadow 紀錄中（Debian /etc/shadow）
B> **GECOS**：描述資訊（全名等）
B> **gid 欄位**是 **primary group**（只能一個）
B> **getent passwd alice** 會包含目錄帳號；本機 /etc/passwd 不一定列出所有使用者
X> alice:x:1001:1001:Alice Example:/home/alice:/bin/bash
?fill /etc/passwd 一行有＿＿個欄位
= 7
= 七
E> name:x:uid:gid:gecos:home:shell。
?mc root:x:0:0:root:/root:/bin/bash 中，第 6 欄 /root 代表？
+ 家目錄
- login shell
- GECOS
- 密碼
E> 第 6 欄 home、第 7 欄 shell。
?cmd 查詢 alice 的帳號紀錄（包含透過 NSS/目錄服務解析的帳號）：
= getent passwd alice
E> getent 走 NSS，不只看本機檔案。

@CARD user.shadow | Shadow 密碼與雜湊格式
A> 為什麼要 shadow？/etc/passwd 必須讓每個人都能讀（程式要把 UID 轉成名字），如果雜湊放在那裡，任何人都能拿回家慢慢暴力破解。所以把雜湊搬進只有 root 能讀的「保險箱」/etc/shadow。$6$ 這種前綴是「保險箱的鎖型號」。
B> Debian：**/etc/shadow**；FreeBSD：**/etc/master.passwd** 與資料庫（pwd.db / spwd.db）
B> 存的是 **salted password hash**，不是可還原的加密密碼
B> 用帳號工具（passwd、adduser、usermod、vipw）保持紀錄一致
B> 雜湊前綴：**$1$ = MD5**（舊、不安全）、**$2…$ = bcrypt**、**$5$ = SHA-256**、**$6$ = SHA-512 crypt**、**$y$ = yescrypt**（現代 Debian）
B> shadow 欄位：1-2 名稱與 hash、3-6 上次修改日 / 最短 / 最長 / 警告天數、7-9 inactive 天數 / 帳號到期日 / 保留
B> **密碼到期**要求改密碼；**帳號到期**會依政策阻擋存取
?sa A. 使用者可以屬於多個 group，在 /etc/passwd 中設定 group 與寫在 /etc/group 有何差異？ B. 何謂 shadow passwd？為何現在大多數系統都採用？ C. 如何從 /etc/master.passwd（或 /etc/shadow）判斷使用者的密碼使用哪種 hash function？（例：root:$6$gW9y$NtFj3pni:0:0:root:/root:/bin/sh）
S> 2023 期末 Q12
R> A. /etc/passwd 的 GID 欄位是使用者的 primary group（只能有一個，建立檔案時預設的群組）；/etc/group 每行最後的成員清單列的是 supplementary（附加）群組成員，一個使用者可以出現在多個群組中。
R> B. shadow passwd 是把密碼 hash（與密碼期限資訊）從所有人都可讀的 /etc/passwd 移到只有 root 可讀的 /etc/shadow（FreeBSD 為 /etc/master.passwd），/etc/passwd 的密碼欄只留 x 或 *。因為 /etc/passwd 必須公開讓程式查 UID↔名稱，若 hash 放在裡面任何人都能拿去離線暴力破解，所以分開存放更安全。
R> C. 看密碼欄位 $id$salt$hash 的前綴 id：$1$ 是 MD5、$2a$/$2b$ 是 bcrypt、$5$ 是 SHA-256、$6$ 是 SHA-512、$y$ 是 yescrypt。例子中 $6$ 表示 SHA-512（salt 為 gW9y）。
P> A. passwd 的 GID 是 primary group；/etc/group 列 supplementary 成員
P> B. hash 移到 root 才能讀的檔案，防止離線破解
P> C. 由 $id$ 前綴判斷，$6$ = SHA-512
?mt 配對 hash 前綴：
> $1$ :: MD5（舊式，不適合新密碼）
> $6$ :: SHA-512 crypt
> $y$ :: yescrypt
> $2b$ :: bcrypt
E> 格式 $id$salt$hash。
?tf /etc/shadow 中存的是用 root 金鑰加密、可以解密還原的密碼。
=F
E> 是加鹽的單向 hash，無法還原。
?cmd 查看 alice 的密碼與帳號期限資訊（不顯示 hash）：
= chage -l alice
E> chage 管理 aging。

@CARD user.gecos | GECOS 與 Login Shell
A> chfn 改「名片」（finger 資訊），chsh 改「預設搭乘的交通工具」（login shell）。換 shell 前先確認它在 /etc/shells 這張「合法交通工具清單」上。
B> **chfn**：修改 GECOS（全名、聯絡資訊）
B> **chsh -s /bin/sh**：修改 login shell；先查 **/etc/shells**
B> login shell 是**設定值**，不一定是目前正在執行的 shell
B> **nologin** 阻擋一般 shell 登入，但不代表擋住所有認證路徑（如 SFTP 另有設定）
?cmd 把自己的 login shell 改成 /bin/sh：
= chsh -s /bin/sh
E> 先 cat /etc/shells 確認路徑合法。
?sa a. 下列指令已把 shell 從 tcsh 改成 sh，但印 $SHELL 仍是 tcsh，為什麼？ b. 要怎麼知道目前的 shell 是什麼？
QX> $ echo $SHELL
QX> /bin/tcsh
QX> $ sh
QX> $ echo $SHELL
QX> /bin/tcsh
S> 2023 期中 Q11
R> a. 執行 sh 只是在 tcsh 底下開了一個 sh 子行程，並沒有改變帳號設定。$SHELL 是登入時根據 /etc/passwd 設定的 login shell 所設的環境變數，sh 從父行程繼承了這個環境變數，且 sh 不會去改它，所以仍是 /bin/tcsh。
R> b. 用 echo $0（顯示目前 shell 程式名稱），或 ps -p $$（查看目前 shell PID 對應的程式），也可用 ps 看 process 樹。
P> a. $SHELL 是 login shell 的環境變數，由父行程繼承，不會因執行 sh 而改變
P> b. echo $0 或 ps -p $$
?cmd 顯示目前正在執行的 shell 是哪個程式（用 ps 與 $$）：
= ps -p $$
= ps -p $$ -o comm
= ps -o comm -p $$
E> $$ 是目前 shell 的 PID。

@CARD user.group | /etc/group 與群組成員
A> /etc/group 的最後一欄是「社團的附加成員名單」；你的 primary group 寫在 /etc/passwd，所以不一定會出現在這份名單上。加入新社團後，已經在場的你（現有 process）不會自動拿到新社員證，要重新登入。
B> 格式：**name:password-marker:gid:members**（如 lab:x:2000:alice,bob）
B> members 列的是 **supplementary** 成員；primary group 來自帳號紀錄，可能不會列在這
B> **既有的 process 保留舊的 credentials** → 在**新的 login session** 測試群組
B> FreeBSD **wheel** 群組與預設 su 政策有關；Linux 的 su/sudo 規則由 PAM 與 sudoers 決定
?tf 把 alice 加入 docker 群組後，alice 目前已開著的 shell 立刻就有 docker 群組權限。
=F
E> 現有 process 保留舊 credentials，要重新登入（或 newgrp）。

@CARD user.nsspam | NSS 與 PAM
A> NSS 是「查名冊的人」（這個帳號是誰？從檔案、LDAP 哪裡查）；PAM 是「門口保全」，分好幾關：auth（你是本人嗎）、account（帳號能用嗎、過期了嗎）、session（登入後幫你準備環境，例如套用 limits）。
B> **NSS**：解析使用者與群組 → **/etc/nsswitch.conf**
B> **PAM auth / account**：驗證身分與帳號政策 → **/etc/pam.d/**
B> **PAM session**：設定登入 session（服務專屬的 PAM stack）
B> **getent** 顯示透過 NSS 解析到的身分
B> 有 passwd 紀錄 ≠ 所有登入方式都允許
?mt 配對：
> NSS :: 查詢使用者 / 群組（/etc/nsswitch.conf）
> PAM auth :: 驗證使用者身分（密碼等）
> PAM account :: 帳號限制（到期、是否允許）
> PAM session :: 設定登入 session（如 limits）
E> 身分查詢、認證、帳號限制、session 設定是不同工作。

@CARD user.limits | 資源限制 limits
A> soft limit 是「平常的額度」，使用者可以自己往上調，但不能超過 hard limit 這個「天花板」。PAM 的 limits 只管「登入的人」，systemd 服務要在 unit 裡另外設 LimitNOFILE=。
B> 設定於 **/etc/security/limits.d/**（如 @lab soft nofile 1024、@lab hard nofile 4096）
B> **pam_limits** 在 PAM session stack 包含它時套用
B> **soft** 可被提高到 **hard** 為止
B> 查看：**ulimit -Sn**（soft）、**ulimit -Hn**（hard）開檔數
B> systemd 服務：用 **LimitNOFILE=** 等 unit 資源設定；PAM 限制**不會**自動套用到服務
?tf 在 /etc/security/limits.d/ 設定的限制，也會自動套用到 systemd 啟動的 service。
=F
E> 服務不經 PAM login session，要在 unit 用 LimitNOFILE= 等設定。
?cmd 查看目前 shell 可開啟檔案數的 hard limit：
= ulimit -Hn
= ulimit -n -H
E> -H hard、-S soft、-n nofile。

@CARD user.create | 建立帳號：adduser / useradd
A> adduser 是 Debian 的「親切櫃台」，會互動式問你問題、自動建家目錄與 skeleton；useradd 是「後台表單」，參數要自己填清楚（例如 -m 才建家目錄）。兩條路選一條就好，不是兩個步驟。
B> 流程：選唯一名稱與群組 → 用工具建立紀錄、家目錄、skeleton → 設定初始認證 → 套用配額、到期、權限政策 → **驗證**身分、家目錄擁有者、shell、實際登入
B> Debian：**adduser alice**（互動）、**addgroup lab**、**adduser alice lab**（加入附加群組）
B> 低階：**useradd -m -s /bin/bash alice** + **passwd alice**；預設由 /etc/default/useradd、/etc/login.defs 影響
B> 不要把每個新帳號都加進 sudo
?cmd 用 useradd 建立 alice，同時建立家目錄並指定 shell 為 /bin/bash：
= useradd -m -s /bin/bash alice
= useradd -s /bin/bash -m alice
E> -m 建家目錄、-s 指定 shell。
?cmd 在 Debian 上用 adduser 把既有使用者 alice 加入 lab 群組：
= adduser alice lab
E> adduser <user> <group>。
?tf useradd 和 adduser 是建立帳號的兩個必要步驟，要依序都執行。
=F
E> 擇一即可，是兩條不同的建立路徑。

@CARD user.usermod | 附加群組：-aG 陷阱
A> usermod -G 是「重寫社團名單」，會把你原本參加的社團全部退掉；加了 -a（append）才是「再多參加一個」。
B> **usermod -aG lab alice**：**附加** supplementary group
B> **-G 不加 -a** 會**取代**整個附加群組清單！
B> Debian 替代：adduser alice lab
B> **id alice** 看帳號資料庫；在 session 中執行 **id** 看該 process 的 credentials → 新登入後驗證
?cmd 把 alice 加入 docker 群組（保留原本的其他群組）：
= usermod -aG docker alice
= usermod -a -G docker alice
= usermod -G docker -a alice
E> 一定要有 -a。
?mc alice 原本在 lab、video 群組，執行 usermod -G docker alice 後，她的附加群組是？
+ 只剩 docker
- lab、video、docker
- lab、video
- 指令錯誤，沒有變化
E> 沒有 -a 就是取代。

@CARD user.home | 家目錄、skeleton、密碼與配額
A> /etc/skel 是「新生入學禮包」：建帳號時複製一份到新家目錄。之後改禮包，不會影響已經入學的學生。Quota 的 soft limit 是「超過會收到警告並有寬限期」，hard limit 是「絕對不能再多」；block 限制容量、inode 限制檔案數量。
B> **/etc/skel**：建立新使用者時複製到家目錄的範本；之後修改**不會**更新既有家目錄
B> /home/<user>：一般本機使用者家目錄；.profile、.bashrc 等啟動檔
B> 驗證家目錄擁有者、群組、權限；遞迴 chown 前先理解範圍
B> **passwd alice** 設密碼
B> 配額：需要檔案系統支援與設定；**edquota -u alice**、**quota -u alice**
B> **soft** 有寬限期；**hard** 直接阻擋；**block** 與 **inode** 限制不同資源
?mt 配對 quota 概念：
> soft limit :: 超過後有寬限期（grace period）
> hard limit :: 絕對上限，直接阻擋配置
> block limit :: 限制使用的容量
> inode limit :: 限制檔案（物件）數量
E> 兩組維度：soft/hard × block/inode。
?tf 修改 /etc/skel 中的 .bashrc，所有既有使用者的 .bashrc 都會跟著更新。
=F
E> skel 只在建立帳號時被複製。

@CARD user.lock | 鎖定密碼與撤銷存取
A> passwd -l 只是「把密碼這道門鎖起來」，但對方可能還有別的鑰匙：SSH key、已經登入的 session、排程工作、token… 撤銷存取要每一道門都檢查。
B> **passwd -l alice**：鎖定**密碼**認證；**passwd -S alice** 看狀態；**passwd -u** 解鎖
B> 鎖密碼**不會**自動撤銷 **SSH keys** 或終止**現有 session**
B> 要檢查：帳號到期、keys、tokens、目錄政策、cron 工作、active sessions
B> 用帳號工具，**不要**手動註解掉 passwd / shadow 的行
?mc 對 alice 執行 passwd -l alice 後，下列哪件事「仍然可能」發生？
+ alice 用已設定好的 SSH key 登入
- alice 用密碼登入
- alice 用 su - alice 輸入密碼切換
- 以上都不可能
E> 鎖密碼不影響公鑰認證，也不會踢掉現有 session。
?cmd 鎖定 alice 的密碼認證：
= passwd -l alice
= usermod -L alice
E> -l = lock。

@CARD user.remove | 帳號離職與刪除
A> 員工離職：先收回所有鑰匙（撤銷存取）、備份他的資料、盤點他負責的東西（cron、郵件、檔案），最後才把名字從名冊刪掉。刪了帳號，他留在各處的檔案還在，只是擁有者變成「一個沒人認領的號碼」，若這個號碼之後給新人，新人就會「繼承」那些檔案。
B> 盤點：擁有的檔案、mail、cron、keys、processes、外部憑證
B> 先**確認備份、撤銷存取**，再刪除本機紀錄
B> **deluser alice**：預設**保留家目錄**；**deluser --remove-home alice** 需核准
B> 低階：**userdel alice**（-r 刪家目錄）
B> 刪帳號**不會刪掉它所有檔案**；UID 重新使用前，要先處理以舊 UID 擁有的檔案
?mc 刪除帳號後，若該 UID 被分配給新使用者，最大的風險是？
+ 新使用者會擁有舊帳號遺留在系統各處的檔案
- 新使用者無法登入
- 系統無法開機
- 新使用者的密碼會和舊使用者相同
E> 檔案以數字 UID 記錄擁有者。
?cmd 在 Debian 上刪除帳號 alice，並一併刪除其家目錄：
= deluser --remove-home alice
= userdel -r alice
E> deluser 預設保留家目錄。

@CARD user.root | Superuser 的權限與邊界
A> root 是「大樓萬能鑰匙」：檔案、process、裝置、系統設定都能動。平常用自己的名牌上班，需要時才短暫借用萬能鑰匙。
B> UID 0 可以：改網路設定、關機、改檔案擁有者、調整資源限制、綁定 1024 以下的 port、掛載檔案系統、載入 kernel module、修改其他使用者密碼…
B> Linux **capabilities** 與 **namespace** 可以切分或限制 root 權力；FreeBSD jails、securelevel 也能限制
B> 實務：日常用具名帳號，特定管理工作時才提權
?sa 試舉三個需要 root 權限才能執行的任務。
S> 2023 期中 Q6
R> ① 新增 / 刪除使用者或修改其他人的密碼（寫入 /etc/passwd、/etc/shadow）。
R> ② 把檔案擁有者改成其他使用者（chown），或修改不屬於自己的系統檔（如 /etc 下的設定）。
R> ③ 讓服務綁定 1024 以下的 privileged port（如 80、22）。
R> 其他：mount / umount 檔案系統、關機 / 重開機、修改網路設定（ip addr add）、載入 kernel module、把 process 的 nice 值調低（提高優先權）、安裝系統套件、修改系統時間。
P> 舉出三個合理且確實需要 root 的任務
?mc 一般使用者想要做下列何事時「需要」root 權限？
+ 把自己 process 的 nice 值從 0 調成 -5
- 把自己 process 的 nice 值從 0 調成 10
- 在自己家目錄建立檔案
- 用 ssh 連到別台主機
E> 降低 nice（提高優先權）需要特權。

@CARD user.sshroot | Root 登入與 SSH 政策
A> PermitRootLogin no 是「大門不准萬能鑰匙直接進來」；prohibit-password 是「萬能鑰匙可以進，但只能刷卡（公鑰），不能報密碼」。關門前先確認你自己的名牌能進來並且能借到萬能鑰匙，不然會把自己鎖在外面。
B> Root 的 console 存取與 SSH 存取是**不同的政策**
B> **PermitRootLogin no**：禁止 root 直接 SSH 登入
B> **prohibit-password**：仍允許非密碼方式（如公鑰）
B> 限制 root 前，先確認具名管理員能登入並提權
B> 改設定後 **sshd -t** 檢查語法；Include 與 **Match** 區塊會影響實際政策；保留現有連線並測試新連線
?mc sshd_config 中 PermitRootLogin prohibit-password 代表？
+ root 不能用密碼 SSH 登入，但可用公鑰等非密碼方式
- root 完全不能 SSH 登入
- root 只能用密碼登入
- 所有使用者都不能用密碼登入
E> no 才是完全禁止。

@CARD user.su | su、su -、sudo
A> su 是「借穿別人的制服，但口袋裡還是你自己的東西」（保留大部分環境）；su - 是「完全換成那個人的身分，連口袋都換」（login 環境）；sudo 是「拿著自己的工作證，在允許清單內代為辦一件事」。
B> **su alice**：切換身分，保留大部分環境（依 PAM/平台政策認證）
B> **su - alice**：以**目標使用者的 login 環境**啟動 shell
B> **sudo command**：依 **sudoers** 政策以另一身分執行授權的操作
B> **sudo -u user command**：指定目標身分
B> 環境變數的處理依實作與設定而定，不要假設
B> su 要輸入**目標**使用者的密碼；sudo 輸入**自己**的密碼
?sa Unix 系統下一般帳號取得 root 權限主要是透過 su 與 sudo。a. 相較於 su 指令，試舉三個 sudo 的好處。 b. 編輯 sudoers 檔案應透過什麼指令？
S> 2023 期中 Q8
R> a. ① 不需要把 root 密碼告訴其他管理員，使用者輸入自己的密碼即可，人員異動也不用改 root 密碼；② 權限可以細分，sudoers 能限定誰在哪台主機、以誰的身分、可以執行哪些指令（最小權限）；③ 每次執行都會記錄 log（誰、何時、做了什麼），方便稽核追蹤；④ 只提權單一指令、有 timestamp 逾時，不會長時間停留在 root shell，降低誤操作風險。
R> b. 用 visudo（會鎖定檔案並在儲存前檢查語法，避免把 sudoers 改壞），Debian 也可放在 /etc/sudoers.d/ 並以 visudo -c 檢查。
P> 不需共享 root 密碼
P> 可細分權限（指令、主機、身分）
P> 有 log 可稽核 / 單一指令提權
P> b. visudo
?mt 配對指令：
> su - alice :: 以 alice 的 login 環境開 shell
> sudo -u nobody id :: 以 nobody 身分執行 id
> sudo -l :: 列出自己可用的 sudo 權限
> visudo :: 安全地編輯 sudoers
E> sudo -l 用來檢查有效權限。
?tf 使用 sudo 時要輸入的是 root 的密碼。
=F
E> 預設輸入自己的密碼；su 才需要目標帳號的密碼。

@CARD user.visudo | visudo 與 sudoers 語法
A> sudoers 每條規則回答四個問題：「誰」可以在「哪台主機」上，「以誰的身分」執行「什麼指令」。visudo 是編輯它唯一的安全方式：它會先上鎖、存檔前檢查文法，避免一個錯字讓所有人都不能 sudo。
B> **visudo** 鎖定檔案並在安裝前檢查語法；**visudo -c** 檢查
B> Debian：**/etc/sudoers** + 引入的 **/etc/sudoers.d/**
B> **sudo -l** 檢視有效權限；sudo 會記錄 log
B> 語法：**user host = (runas) command**
B> 群組前加 **%**：%lab ALL = (root) /usr/bin/id -u
B> 只寫指令不寫參數 → 允許**任意參數**
X> alice ALL = (root) /usr/bin/id -u
X> %sudo ALL=(ALL:ALL) ALL
?mt 解讀 alice ALL = (root) /usr/bin/id -u：
> alice :: 誰可以使用 sudo
> ALL（第一個） :: 適用的主機
> (root) :: 以哪個身分執行
> /usr/bin/id -u :: 允許的指令與參數
E> user host = (runas) command。
?fill sudoers 中要指定「群組」lab，名稱前要加＿＿
= %
E> %lab。
?cmd 檢查 sudoers 語法是否正確（不進入編輯）：
= visudo -c
E> -c = check。

@CARD user.alias | sudoers Aliases 與白名單
A> Alias 是「幫一群東西取個團名」：User_Alias 是一群人、Runas_Alias 是一群可變成的身分、Cmnd_Alias 是一組指令。允許清單（allowlist）要「只開需要的門」，而不是「全開再關掉幾扇」。
B> **User_Alias**、**Runas_Alias**、**Host_Alias**、**Cmnd_Alias**
B> 窄的 allowlist 比「給 ALL 再扣掉幾個程式」容易審查
B> 測試**允許**與**被拒絕**的呼叫
X> User_Alias LAB_TA = alice, bob
X> Runas_Alias REPORT = nobody
X> Cmnd_Alias WHOAMI = /usr/bin/id -u
X> LAB_TA ALL = (REPORT) WHOAMI
?mc 上例中，bob 可以執行哪個指令？
QX> User_Alias LAB_TA = alice, bob
QX> Runas_Alias REPORT = nobody
QX> Cmnd_Alias WHOAMI = /usr/bin/id -u
QX> LAB_TA ALL = (REPORT) WHOAMI
+ sudo -u nobody /usr/bin/id -u
- sudo /usr/bin/id -u（以 root 執行）
- sudo -u nobody /bin/sh
- sudo -u root /usr/bin/id -u
E> 只能以 nobody 身分執行 /usr/bin/id -u。

@CARD user.escape | 指令限制的逃脫路徑
A> 給某人「只能用 vim 編輯檔案」的 sudo 權限，就像給他「只能用萬能鑰匙開儲藏室」，但儲藏室裡有一扇通往全大樓的暗門（vim 的 :!sh）。編輯器、pager、直譯器都可能開出 shell。
B> 編輯器、pager（less）、直譯器、某些工具可以**啟動其他指令**
B> 被允許的程式可能提供寫檔或選項，導致比預期更多的權限
B> 對已有 ALL 權限的帳號，**拒絕幾個 shell 路徑沒有用**
B> 檢查參數、可寫的執行檔、設定檔、程式完整行為
B> 複雜操作：用審查過、**root 擁有、行為固定**的 helper，嚴格限制輸入
?mc 為什麼「允許 alice 以 root 執行 /usr/bin/vim」很危險？
+ vim 可以用 :!sh 開出 root shell，等於給了完整 root 權限
- vim 會刪除 /etc/sudoers
- vim 不能被 sudo 執行
- vim 會讓系統變慢
E> 編輯器、pager、直譯器都是常見的逃脫路徑。

@CARD user.nopasswd | NOPASSWD 與管理群組
A> NOPASSWD 只是「刷卡進門不用再輸密碼」，不會讓權限變小。NOPASSWD: ALL 等於「一張不用驗證的萬能卡」，自動化很方便但風險很大。
B> **NOPASSWD** 只是對該規則跳過密碼提示，**不會減少**授予的權限
B> **NOPASSWD: ALL** 等於無人值守的廣泛管理權限
B> Debian 常見：**%sudo ALL=(ALL:ALL) ALL**；要同時審查群組成員與規則
X> alice ALL=(root) NOPASSWD: /usr/bin/id -u
?tf 在 sudoers 規則加上 NOPASSWD，會讓該規則授予的權限變小，比較安全。
=F
E> 只是不問密碼，權限一樣大。
?cmd 寫一條 sudoers 規則：讓 sudo 群組的成員可以不輸入密碼執行任何指令（HW 常要求）：
= %sudo ALL=(ALL:ALL) NOPASSWD: ALL
= %sudo ALL=(ALL:ALL) NOPASSWD:ALL
= %sudo ALL=(ALL) NOPASSWD: ALL
= %sudo ALL=(ALL) NOPASSWD:ALL
E> 方便但等同無人看管的 root，只在作業環境使用。

@CARD user.p_check | 實作：確認帳號與群組的真實狀態
A> 帳號的資料散在好幾本帳冊（passwd、shadow、group），還可能來自 LDAP。與其去翻檔案，不如直接問系統「它現在怎麼看這個人」：id 給你身分證、getent 給你帳冊上那一行。
B> **id 使用者**：UID、主要群組、所有附加群組；**groups 使用者**：只列群組
B> **getent passwd 名稱** / **getent group 名稱**：透過 NSS 查，結果與系統實際看到的一致
B> 群組變更**不會影響已登入的 session**：要重新登入，或 `newgrp 群組` 開一個新 shell；所以「usermod -aG 之後還是沒權限」先重新登入再測
B> 以別人的身分測試權限：**sudo -u sftp-u1 ls /mnt/hw2/sftp/public**、**sudo -u anonymous touch x**
B> 查密碼狀態：**passwd -S 使用者**（L 鎖定、P 有密碼、NP 無密碼）；**chage -l** 看到期設定
X> id sftp-u1
X> getent group sftpusers
X> sudo -u sftp-u1 touch /mnt/hw2/sftp/public/t && echo "can write"
?cmd 以 sftp-u1 的身分執行 `ls /mnt/hw2/sftp/private`，測試他能不能列出內容：
= sudo -u sftp-u1 ls /mnt/hw2/sftp/private
E> 驗證權限設計時，用 sudo -u 模擬各個角色最快。
?mc 執行 `usermod -aG docker alice` 後，alice 在原本的 SSH 視窗執行 docker 還是 permission denied。最可能的原因？
+ 群組成員資格在登入時決定，alice 需要重新登入（或 newgrp）
- -aG 寫錯，應該用 -G
- docker 群組不存在
- 需要重新開機
E> 用 id 看目前 session 的群組，就會發現 docker 不在裡面。
?cmd 透過 NSS 查詢 sysadm 這個帳號在 passwd 資料庫中的那一行：
= getent passwd sysadm
E> 若帳號來自 LDAP 等外部來源，直接 cat /etc/passwd 會找不到，getent 才會。

@CARD user.p_sftpacct | 實作：只能 SFTP 的帳號怎麼建
A> SFTP 專用帳號像「只能進倉庫領貨、不能進辦公室的廠商」：帳號要存在、要能用金鑰認證，但登入後只能做檔案傳輸。擋 shell 的主力是 sshd 的 ForceCommand internal-sftp；login shell 設成 nologin 是第二道保險。
B> 建立：`useradd -m -s /usr/sbin/nologin sftp-u1`（-m 建家目錄，-s 指定 shell）；改既有帳號：`usermod -s /usr/sbin/nologin 名稱`
B> 用共同群組管理權限：`groupadd sftpusers`、`usermod -aG sftpusers sftp-u1`
B> 金鑰：每個帳號的 **~/.ssh/authorized_keys**（題目要求與 judge 相同的公鑰，可以複製 judge 的那份），然後把擁有者與權限設對：`chown -R 使用者: ~使用者/.ssh`、700 / 600
B> 家目錄不在 chroot 裡也沒關係：sshd 在 chroot **之前**就讀取 authorized_keys
B> 帳號沒有設密碼時，shadow 裡是 `!`（鎖定）；用 nologin + 金鑰的帳號可以不設密碼
X> groupadd sftpusers
X> for u in sftp-u1 sftp-u2 anonymous; do
X>   useradd -m -s /usr/sbin/nologin "$u"
X>   install -d -m 700 -o "$u" -g "$u" /home/$u/.ssh
X>   install -m 600 -o "$u" -g "$u" /home/judge/.ssh/authorized_keys /home/$u/.ssh/
X> done
X> usermod -aG sftpusers sftp-u1; usermod -aG sftpusers sftp-u2
?cmd 建立帳號 sftp-u1，同時建立家目錄，並把 login shell 設成 /usr/sbin/nologin：
= useradd -m -s /usr/sbin/nologin sftp-u1
= useradd -s /usr/sbin/nologin -m sftp-u1
E> Debian 也可用 adduser，但 useradd 的選項比較好寫進腳本。
?mc 帳號的 login shell 是 /usr/sbin/nologin，sshd 對它設了 ForceCommand internal-sftp。它能不能用 sftp 登入？
+ 可以；internal-sftp 在 sshd 內部執行，不需要使用者的 shell
- 不行，nologin 會拒絕所有登入
- 只有密碼登入可以，金鑰不行
- 要把 nologin 加進 /etc/shells 才行
E> 若用外部的 sftp-server 而不是 internal-sftp，就會需要能執行的 shell。
?tf sshd 讀取 authorized_keys 的時機在 chroot 之前，所以 SFTP 使用者的家目錄可以在 chroot 範圍之外。
=T
E> 認證先完成，通過之後才 chroot 進指定目錄。

@CARD user.p_sudo | 實作：sudoers 安全修改與排錯
A> sudoers 寫錯一個字，可能整台機器都沒人能 sudo，所以一定要經過 visudo 這個「會先檢查文法的編輯器」。規則是由上往下讀、**最後一條符合的規則勝出**，這解釋了大部分「明明寫了 NOPASSWD 卻還是問密碼」的問題。
B> 編輯：**visudo**（主檔）、**visudo -f /etc/sudoers.d/judge**（附加檔）；只檢查：**visudo -c**
B> /etc/sudoers.d/ 內的檔名**不能有 . 或以 ~ 結尾**，否則會被略過；權限應為 0440
B> 範例：`judge ALL=(ALL:ALL) NOPASSWD: ALL`；群組前加 %：`%sudo ALL=(ALL:ALL) ALL`
B> **最後符合的規則生效**：使用者若同時在 sudo 群組，而 %sudo 那行排在你的 NOPASSWD 之後，就會又要密碼 → 把自己的規則放在後面（@includedir 在主檔最後，所以 sudoers.d 通常會贏）
B> 查某人最後到底有哪些權限：**sudo -l -U 使用者**
X> echo 'judge ALL=(ALL:ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/judge
X> sudo chmod 0440 /etc/sudoers.d/judge
X> sudo visudo -c
X> sudo -l -U judge
?cmd 檢查 sudoers 主檔與所有 include 檔案的語法是否正確：
= visudo -c
= sudo visudo -c
E> 用 tee 或 echo 直接寫入 sudoers.d 之後，一定要跑這行。
?mc 在 /etc/sudoers.d/ 建立了 judge.conf 寫入 NOPASSWD 規則，但完全沒有生效。原因最可能是？
+ 檔名含有 .，被 sudo 略過
- 需要重新開機
- 要先 systemctl restart sudo
- NOPASSWD 只能寫在主檔
E> sudoers.d 內含 . 或以 ~ 結尾的檔名都會被忽略（避免讀到 .bak、.swp）。
?mc 同時符合兩條 sudoers 規則（一條要密碼、一條 NOPASSWD）時，以哪一條為準？
+ 檔案中較後面（最後符合）的那一條
- 較前面的那一條
- 比較寬鬆的那一條
- 比較嚴格的那一條
E> sudoers 是「last match wins」。
?cmd 列出 judge 這個使用者可以透過 sudo 執行哪些指令：
= sudo -l -U judge
= sudo -U judge -l
E> 不加 -U 則是查目前使用者自己。
</script>
<script type="text/plain" class="sa-src" data-ch="proc">
@CH proc | Process 控制 | ⚙️ | 08_Controlling_Process.pdf

@CARD proc.basic | Program、Process、PID、Thread
A> Program 是「食譜」（存在硬碟的檔案）；process 是「正在照食譜做菜的廚師」（有自己的工作台與狀態）；同一本食譜可以有好幾位廚師同時做（啟動兩次 = 兩個 process）；thread 是同一位廚師的好幾隻手。
B> **Program**：存成檔案的可執行碼（/usr/bin/sleep）
B> **Process**：正在執行的程式，有自己的 context（sleep 300）
B> **PID**：PID namespace 中的識別碼（$$ 是目前 shell、$! 是最近背景 job）
B> **Thread**：process 內的執行路徑（Linux 上叫 TID / LWP）
B> 同一個執行檔啟動兩次 → 兩個不同的 process
?mt 配對：
> /usr/bin/sleep :: Program
> 正在執行的 sleep 300 :: Process
> $$ 的值 :: 目前 shell 的 PID
> LWP / TID :: Thread
E> 程式是靜態檔案，process 是動態執行實體。

@CARD proc.context | Process 執行環境
A> 每位廚師的工作台上有：自己的記憶體空間（code、data、heap、stack）、身分證（credentials）、排班表（scheduling）、接好的水管（open file descriptors：檔案、socket、pipe）、所在位置（working directory）、交代事項（environment）、對各種暗號的反應（signal settings）。
B> **虛擬位址空間**：code、data、heap、stack mappings
B> kernel 紀錄：credentials、scheduling 狀態、資源使用
B> **open file descriptors**：連到檔案、socket、pipe
B> 工作目錄、環境變數、signal 設定會影響執行
B> 觀察只是**快照**，值可能在你看的同時改變
?tf process 的工作目錄與環境變數也屬於它的執行 context。
=T
E> 這也是為什麼 child 會繼承這些設定的副本。

@CARD proc.cred | PID、PPID 與 Credentials
A> Real UID 是「你本人是誰」，Effective UID 是「你現在拿著誰的通行證辦事」。平常兩者相同；執行 setuid 程式時，effective 會暫時變成檔案擁有者。
B> **PID / PPID**：process ID / 目前 parent 的 ID
B> **RUID / EUID**：real / effective user ID
B> **RGID / EGID**：real / effective group ID
B> supplementary groups 也用於存取檢查
B> **NI**：nice 值
B> PID 會循環、會被重複使用 → 送 signal 前再確認一次目標
?mc 存取檢查（能不能開某個檔案）主要依據 process 的哪個 UID？
+ Effective UID (EUID)
- Real UID (RUID)
- PPID
- Saved TTY
E> 這就是 setuid 程式能做事的原因。

@CARD proc.fork | fork、exec、exit、wait
A> fork 是「影分身之術」，多一個新 PID 的複製人；exec 是「變身」，PID 不變但整個人換成另一個程式；exit 是「交出成績單後離場」；wait 是「爸媽領回成績單（收屍）」。
B> **fork()**：建立 child，**新 PID**，複製 process context
B> **execve()**：**替換**程式 image，**保留 PID**
B> **exit() / _exit()**：結束並讓 exit status 可被取得
B> **wait() / waitpid()**：收集 child 狀態，**reap** 已結束的 child
B> fork 後 parent 與 child 並行，輸出順序不固定（交錯）
?mt 配對系統呼叫：
> fork() :: 建立新 process（新 PID）
> execve() :: 替換程式內容，保留 PID
> wait() :: 回收 child 的結束狀態
> exit() :: 結束並留下 exit status
E> shell 執行外部指令 = fork + exec + wait。
?mc fork() 成功後，在 child process 中 fork() 的回傳值是？
+ 0
- child 的 PID
- parent 的 PID
- -1
E> parent 拿到 child 的 PID，child 拿到 0，失敗為 -1（課程範例程式的 if 分支）。

@CARD proc.zombie | Zombie、Orphan、Stopped
A> Zombie 是「已經下班但打卡單還沒被主管收走的員工」，人早就走了，只剩一張紙，所以你對他喊 KILL 也沒用，要去處理那個不收打卡單的主管（parent）。Orphan 是「主管先離職的員工」，會被大老闆（PID 1 / subreaper）接收。
B> **Zombie (Z)**：child 已結束、parent 還沒 reap → 調查 parent 與它的 wait 邏輯
B> **Orphan**：parent 先結束 → Linux 交給 **subreaper** 或 namespace 的 init（PID 1）
B> **Stopped (T)**：被 stop signal 暫停 → continue signal（SIGCONT）可恢復
B> **對 zombie 送 KILL 沒用**：它已經結束了
?mc 系統上有一堆 Z 狀態的 process，最正確的處理方向是？
+ 檢查它們的 parent process 為何沒有 wait() 回收（必要時處理 parent）
- 對每個 zombie 送 SIGKILL
- 重新開機是唯一方法
- 對它們送 SIGCONT
E> zombie 已死，KILL 無效；parent 結束後 zombie 會被 PID 1 收養並回收。
?tf parent 先結束的 process 會被 PID 1（或 subreaper）收養。
=T
E> 這就是 orphan 的處理方式。

@CARD proc.suid | Effective ID 與 set-user-ID
A> passwd 程式是 root 擁有、而且有 setuid（rws 的 s）：一般人執行時，暫時拿到 root 的通行證（EUID=0），所以能改只有 root 能寫的 /etc/shadow，但 passwd 程式本身會限制你只能改自己的密碼。
B> 存取檢查依 **effective credentials**
B> **set-user-ID 執行檔**在 exec 時把 EUID 改成**檔案擁有者**
B> 例：-rwsr-xr-x root /usr/bin/passwd → 能更新 /etc/shadow（-rw-r----- root shadow）
B> **nosuid** 掛載選項、**no_new_privs**、tracing 會抑制這個轉換
?mc 一般使用者能用 passwd 改自己的密碼（寫入只有 root 能寫的 /etc/shadow），是因為？
+ /usr/bin/passwd 有 setuid bit 且屬於 root，執行時 EUID 變成 root
- /etc/shadow 其實所有人都能寫
- passwd 會要求 root 密碼
- 使用者被加進 shadow 群組
E> -rwsr-xr-x 中的 s 就是 setuid。
?tf 檔案系統以 nosuid 選項掛載時，上面的 setuid 程式不會提升 EUID。
=T
E> nosuid 會抑制 set-user-ID 轉換。

@CARD proc.states | Linux Process 狀態
A> R 在跑（或排隊等跑）、S 在睡覺（叫得醒）、D 在深度睡眠（通常在等 I/O，叫不醒）、T 被定格、Z 殭屍、I 閒置的 kernel thread。
B> **R**：running 或 runnable
B> **S**：可中斷睡眠（interruptible sleep）
B> **D**：不可中斷睡眠，常在**等 I/O**
B> **T / t**：被 job control 停止 / 被 debugger 停止
B> **Z**：已結束等待 reap
B> **I**：idle kernel thread
B> D 狀態**不證明**磁碟壞了 → 看 wait channel、kernel 訊息、儲存路徑
?mt 配對狀態碼：
> R :: Running / runnable
> S :: 可中斷睡眠
> D :: 不可中斷睡眠（常等 I/O）
> T :: 被停止
> Z :: Zombie
E> ps 的 STAT 欄第一個字元就是狀態。

@CARD proc.ps | ps 與欄位解讀
A> ps 是「拍一張 process 的合照」。ps aux 是 BSD 風格（沒有 dash）；ps -eo 是自己挑要哪些欄位。STAT 後面的小字是附註：s 是 session leader、+ 是前景、l 是多執行緒。
B> **ps auxww**：BSD 風格（不加 dash），全部 process、寬輸出
B> **ps -eo user,pid,ppid,stat,ni,pcpu,pmem,args --sort=-pcpu**：自選欄位、依 CPU 排序
B> **ps -o pid,ppid,stat,etime,time,args -p $$**
B> **%CPU**：CPU 時間 ÷ 存活時間；**TIME** 累積 CPU 時間；**ELAPSED** 經過的實際時間
B> **VSZ** 虛擬大小、**RSS** 常駐記憶體（KiB）；共享頁面可能被算進多個 RSS
B> **STAT** 狀態加旗標（s、+、l）；**ARGS** 可能含敏感資料
B> **PSS**（Proportional Set Size）：共享頁面依共用的 process 數**平均分攤**後的記憶體，加總起來比 RSS 更接近真實用量：**ps -o vsz,rss,pss,cmd**
?cmd 列出所有 process 的 pid、ppid、stat、ni 與完整指令（ps -eo 寫法）：
= ps -eo pid,ppid,stat,ni,args
= ps -eo pid,ppid,stat,ni,cmd
= ps -eo pid,ppid,stat,ni,command
E> -e 全部，-o 自選欄位。
?mc ps aux 中沒有 dash 是因為？
+ 它使用 BSD 風格的選項
- 打錯字，正確是 ps -aux
- 只有 FreeBSD 能用
- 它代表 GNU 長選項
E> Debian procps-ng 同時支援 BSD 與 UNIX 風格。
?mt 配對 ps 欄位：
> RSS :: 實際常駐在記憶體的大小
> VSZ :: 虛擬位址空間大小
> TIME :: 累積使用的 CPU 時間
> ELAPSED :: 啟動至今經過的時間
E> VSZ 包含 mappings 與保留空間，通常比 RSS 大。
?mc 10 個 process 共用同一個 4 MiB 的函式庫。為什麼把它們的 RSS 加起來會高估總記憶體用量，PSS 又如何改善？
+ RSS 讓每個 process 都算一次完整的 4 MiB；PSS 把共享頁面平均分攤，每個只算 0.4 MiB
- RSS 不含共享函式庫，PSS 才含
- PSS 只計算 swap 中的頁面
- 兩者一樣，只是單位不同
E> 投影片：Shared pages can appear in several RSS totals。

@CARD proc.top | top、htop、load average
A> load average 不是 CPU 百分比，而是「排隊的人數平均」，包含正在用 CPU 的、等 CPU 的、以及卡在 I/O（D 狀態）的人。4 核心機器 load 4 代表剛好滿。
B> top 按鍵：**P** CPU 排序、**M** 記憶體、**T** CPU 時間、**1** 每顆 CPU、**H** 執行緒、**u** 篩選使用者、**c** 完整指令、**h** 說明、**q** 離開
B> **top -p PID** 監看指定 process；**top -b -n 1** 印一次批次快照
B> 多執行緒 process 可以**超過 100% CPU**
B> **load average**：runnable + uninterruptible sleep 任務數的平均（1、5、15 分鐘），要和 CPU 數比較
B> **htop**：互動式篩選、排序、樹狀；**free -h** 記憶體摘要、**vmstat 1** 每秒取樣
?mt 配對 top 按鍵：
> P :: 依 CPU 使用率排序
> M :: 依記憶體排序
> 1 :: 顯示每顆 CPU
> q :: 離開
E> h 可看本機版本的說明。
?tf load average 3.0 代表 CPU 使用率是 300%。
=F
E> load 是任務數平均，不是百分比；要與 CPU 核心數比較。
?cmd 用 top 印出「一次」批次模式的快照（適合存成檔案）：
= top -b -n 1
= top -bn1
= top -n 1 -b
E> -b batch、-n 次數。

@CARD proc.sigsrc | Signal 來源與處置方式
A> Signal 是「敲門暗號」，可能來自 terminal（Ctrl-C）、shell（Ctrl-Z）、別的 process（kill）、或 kernel（程式做了非法記憶體存取 → SEGV）。收到後 process 可以：照預設動作、自訂處理、或假裝沒聽到（ignore）。
B> Terminal driver：**Ctrl-C** 對前景 process group 送 **INT**
B> Shell job control：**Ctrl-Z** 送 **TSTP**
B> 其他 process：**kill**（受權限檢查）
B> Kernel：同步錯誤產生 **SEGV**、**FPE**
B> Disposition：**handler**（自訂處理）、**ignore**、**default action**
?mt 配對來源與訊號：
> Ctrl-C :: SIGINT
> Ctrl-Z :: SIGTSTP
> 非法記憶體存取 :: SIGSEGV
> 除以零 :: SIGFPE
E> SEGV 與 FPE 由 kernel 產生。

@CARD proc.sigtable | Signal 編號表與 block / ignore
A> Ignore 是「直接丟掉這封信」；block 是「先放信箱、等我解除封鎖再讀」（pending）。同一種標準訊號不會排隊，連按門鈴十下，門內只會知道「有人按過」。KILL 和 STOP 是警察破門，不能擋。
B> 1 **HUP**、2 **INT**、3 **QUIT**、9 **KILL**、10 BUS、11 **SEGV**、15 **TERM**、17/18 **CONT**、19 **STOP**、20 **TSTP**（Linux x86）
B> **Ignore**：丟棄；**Block**：延後送達直到 mask 允許（pending）
B> 標準訊號**不會排隊**累積
B> **KILL 與 STOP 不能被 catch、block、ignore**
B> 編號可能因平台/架構不同 → 用 **kill -l** 與**名稱**
?fill SIGKILL 的編號是＿＿
= 9
E> kill -9 = kill -KILL。
?fill SIGTERM 的編號是＿＿
= 15
E> kill 不指定訊號時預設送 TERM (15)。
?mc 對於 blocked 的訊號，下列何者正確？
+ 它會保持 pending，直到 signal mask 解除後才送達
- 它會被永久丟棄
- 它會被轉成 SIGKILL
- 它會立刻終止 process
E> ignore 才是丟棄。

@CARD proc.termkill | SIGTERM vs SIGKILL
A> SIGTERM 是「主管說：請你收拾好東西下班」，員工可以存檔、關檔、刪暫存再走，甚至可以假裝沒聽到；SIGKILL 是「直接斷電把人拖走」，由 kernel 強制執行，沒機會收拾，可能留下壞掉的檔案、殘留的 lock、子程序。
B> **SIGTERM (15)**：禮貌的終止請求；程式**可以 catch**，執行清理（存資料、關連線、刪暫存檔）後結束，也可以忽略
B> **SIGKILL (9)**：kernel 直接終止；**不能 catch / block / ignore**；沒有清理機會 → 資料可能不一致、殘留暫存檔 / lock
B> 正確順序：先 TERM，等一下，不行才 KILL
?sa 請簡述 SIGTERM 及 SIGKILL 的差別。
S> 2025 期末 Q3
R> SIGTERM（15）是「請求」程式終止的訊號，可以被程式 catch 並自訂處理，程式有機會做清理（儲存資料、關閉檔案與連線、刪除暫存檔）後優雅結束，也可以選擇忽略。kill 預設送的就是 SIGTERM。
R> SIGKILL（9）由 kernel 直接強制終止 process，不能被 catch、block 或 ignore，程式沒有任何清理的機會，可能留下不一致的資料或殘留檔案。應先用 SIGTERM，無效時才用 SIGKILL。
P> SIGTERM 可被 catch / ignore，程式可清理後結束
P> SIGKILL 無法 catch / block / ignore，kernel 立即終止，無法清理
?tf kill PID 不指定訊號時，預設送出的是 SIGKILL。
=F
E> 預設是 SIGTERM。

@CARD proc.htopcase | 情境：CPU 被某 process 吃滿
A> 處理「吵鬧的室友」：先請他小聲一點（renice），不影響他做事；不行再請他離開（SIGTERM），讓他收拾行李；真的不走才強制驅離（SIGKILL）。由溫和到強硬。
B> 選項：① kill 送 SIGKILL ② nice/renice 調高 niceness ③ kill 送 SIGTERM
B> 合理順序：**② → ③ → ①**（由破壞性最小到最大）
B> renice：process 仍在執行，只是讓出 CPU；TERM：讓它清理後結束；KILL：最後手段
?sa 你是系上工作站的管理員，用 htop 發現一個 process 異常占用超過 90% 的 CPU。你有三種方法：❶ kill 送 SIGKILL ❷ nice / renice 調整 niceness ❸ kill 送 SIGTERM。A. 說明 SIGKILL 與 SIGTERM 的差異與對程式的影響。B. 三種方法合理的使用順序為何？為什麼？
S> 2023 期末 Q16
R> A. SIGTERM 可被程式攔截，程式能執行清理後正常結束，也可選擇忽略；SIGKILL 由 kernel 強制終止，無法攔截或忽略，程式沒機會清理，可能造成資料損毀或留下暫存檔 / lock。
R> B. 順序 ❷ → ❸ → ❶。先 renice 提高 niceness，讓它不再搶占其他使用者的 CPU，但程式仍能繼續完成工作（也許它是合法的長時間運算），影響最小；若確定要停止它，先送 SIGTERM 讓它有機會優雅結束與清理；若 SIGTERM 無效（被忽略或卡住），最後才用 SIGKILL 強制終止。
P> A. TERM 可攔截可清理；KILL 不可攔截、無法清理
P> B. 順序 2 → 3 → 1
P> B. 理由：由破壞性小到大，先降低影響、再優雅結束、最後強制
?ord 依「破壞性由小到大」排列處理方式：
> renice 提高 niceness
> kill -TERM PID
> kill -KILL PID
E> 先不中斷工作，再優雅停止，最後強制。

@CARD proc.jobs | Job Control 與 kill
A> 先記下號碼（$!）、確認是本人（ps）、再敲門（kill -TERM）、最後確認他真的走了（wait / ps）。PID 會被重複使用，所以送訊號前要再確認一次。
B> **jobs -l**、**bg %1**、**fg %1**；一個 job 可以包含一條 pipeline 的多個 process
B> 啟動後**立刻**用 **pid=$!** 記下 PID
B> 送訊號前用 **ps -o pid,ppid,stat,args -p "$pid"** 確認
B> **kill -TERM "$pid"** 讓程式有機會執行 handler
B> **wait "$pid"** 等待並取得狀態，確認結束
X> $ sleep 300 &
X> $ pid=$!
X> $ ps -o pid,ppid,stat,args -p "$pid"
X> $ kill -TERM "$pid"
X> $ wait "$pid"
?cmd 對 PID 存在變數 pid 的 process 送出 SIGTERM（用名稱）：
= kill -TERM "$pid"
= kill -TERM $pid
= kill -s TERM "$pid"
= kill -s TERM $pid
= kill -SIGTERM "$pid"
= kill -SIGTERM $pid
E> 用名稱比數字可攜。
?cmd 列出所有訊號名稱：
= kill -l
E> 不同平台編號可能不同。

@CARD proc.nice | Niceness（nice 值）
A> nice 值是「謙讓度」：越 nice（數字越大）越願意把 CPU 讓給別人，所以優先權越低。範圍 -20（最不謙讓、最優先）到 19（最謙讓）。一般人只能變得更謙讓（調高），想插隊（調低）要 root。
B> 範圍 **-20 到 19**；**NI 越高 → 排程權重越低**（優先權越低）
B> child 在 fork 時**繼承** nice 值
B> 一般使用者通常可以**提高** NI（對自己的 process）
B> **降低** NI（提高優先權）通常需要**特權**（root 或資源額度）
B> niceness 只改變**競爭 CPU 的權重**，**不是**固定的 CPU 百分比上限
M> 越 nice 越讓人 → 數字大 = 優先低
?mc 哪個 nice 值的優先權最高？
+ -20
- 0
- 19
- 20
E> 數字越小越「不 nice」，越優先。
?tf 一般使用者可以把自己 process 的 nice 值從 10 調回 0。
=F
E> 降低 nice（提高優先權）通常需要 root 權限，即使是自己的 process。
?tf 把 process 的 nice 設成 19，就能保證它最多只用 5% 的 CPU。
=F
E> niceness 只影響權重，沒有其他人競爭時仍可用滿 CPU。

@CARD proc.renice | nice 與 renice 指令
A> nice 是「出生時就設定謙讓度」（啟動新程式時，以相對值調整）；renice 是「對已經在跑的人重新設定」（Debian 範例用 --priority 設絕對值）。超出範圍會被夾到 19。
B> **nice -n 10 COMMAND**：以 +10（相對於繼承值）啟動
B> **renice --priority 15 --pid PID**：設成**絕對值** 15（傳統寫法 renice -n 15 -p PID）
B> 超過 19 會被限制在 19
B> 每次修改後用 **ps -o pid,ni,pri,comm -p PID** 確認
?cmd 以 nice 值 +10 啟動 ./backup.sh：
= nice -n 10 ./backup.sh
= nice -10 ./backup.sh
E> -n 指定調整量。
?cmd 把 PID 1234 的 nice 值設為 15（使用課程的 renice 長選項寫法）：
= renice --priority 15 --pid 1234
= renice -n 15 -p 1234
= renice 15 -p 1234
= renice --priority 15 -p 1234
E> renice 可以作用在已執行的 process。
?sa 由於運算資源分配的需求，你要調整三個 process 的優先度：proc1 最高、proc2 其次、proc3 最低。請描述具體操作步驟，包括使用的指令和可能需要的權限。
S> 2023 期末 Q10
R> ① 先找出 PID：ps -eo pid,ni,comm | grep proc 或 pgrep proc1 等。
R> ② 用 renice 調整 nice 值（數字越小優先權越高）：sudo renice -n -10 -p <PID_proc1>（設為負值，需要 root 權限）；proc2 維持 0 或 renice -n 0 -p <PID_proc2>；renice -n 19 -p <PID_proc3>（提高 nice 值，一般使用者對自己的 process 就可以做）。若是還沒啟動，可直接用 nice -n 19 ./proc3 啟動。
R> ③ 用 ps -o pid,ni,comm -p <PID> 或 top 確認 NI 欄位。
R> 權限：降低 nice 值（提高優先權，尤其設為負數）需要 root / sudo；提高 nice 值一般使用者可對自己的 process 執行；調整他人的 process 需要 root。
P> 用 ps / pgrep 找 PID
P> 用 renice（或 nice）設定，proc1 < proc2 < proc3 的 nice 值
P> 降低 nice（負值）需要 root；提高可由擁有者執行
P> 用 ps / top 確認結果

@CARD proc.taskset | CPU Affinity：taskset
A> CPU affinity 是「指定座位」：規定這個人只能坐在 3 號、7-11 號座位上。它只是限制能坐哪裡，不會幫你保留座位，也不會讓一個人變成兩個人（不會產生平行化）。
B> 限制 task **可以在哪些 CPU 上執行**；**不保留** CPU，也**不產生平行**
B> **taskset -pc $$**：查詢目前 shell 允許的 CPU
B> **taskset -c 5 sleep 300**：以指定 CPU 啟動
B> **taskset -pc LIST PID**：改變現有 task；**taskset -apc LIST PID** 套用到所有 threads
X> $ taskset -c "3,7-11" sleep 300 &
X> $ taskset -pc "$!"
X> pid 1598321's current affinity list: 3,7-11
?cmd 讓已在執行的 PID 4321 只能在 CPU 0 和 1 上執行：
= taskset -pc 0,1 4321
= taskset -pc 0-1 4321
= taskset -cp 0,1 4321
= taskset -cp 0-1 4321
E> -p 作用在現有 PID，-c 用 CPU 清單格式。
?tf 用 taskset 把程式綁到 CPU 3，就保證其他程式不會使用 CPU 3。
=F
E> affinity 只限制此 task 能跑哪，不會保留 CPU。

@CARD proc.forkbomb | Fork Bomb 與 TasksMax
A> Fork bomb 像「每個人都會立刻分裂成兩個」的細胞，瞬間塞滿整棟樓（task 數上限），連你要叫警衛（開一個新 shell 執行 killall）都擠不進來。解法：讓自己的 shell 直接「變身」成 killall（exec），不用多生一個人；事先用 cgroup 的 TasksMax 限制人數。
B> 無限制的 child 建立會**耗盡 task slots** 等資源，連救援指令都可能無法建立 process
B> 經典 bash fork bomb：**:(){ :|:& };:**（定義名為 : 的函式，呼叫自己兩次並放到背景）
B> 處理：**killall -KILL bombName**；沒有資源 fork 時：**exec killall -KILL bombName**（shell 變成 killall，不需新 process）
B> killall **不是 atomic**，殺的同時可能又產生新的 → 執行多次
B> 預防：**cgroup task limit**；systemd **TasksMax=**（計算 tasks，包含 threads，限制整個 unit 的 cgroup 與子孫）
X> systemd-run --user --unit=process-lab -p TasksMax=32 /usr/bin/sleep 300
X> systemctl --user show process-lab.service -p TasksCurrent -p TasksMax
?mc 系統被 fork bomb 塞滿、無法再 fork 新 process 時，為什麼要用 exec killall -KILL bomb？
+ exec 讓目前的 shell 直接被替換成 killall，不需要建立新的 process
- exec 會讓 killall 以 root 執行
- exec 會讓 killall 變成 atomic
- exec 可以讓 shell 自動重開
E> exec 保留 PID 替換程式；代價是 shell 不會回來。
?mc systemd 中用來限制一個 unit（含其子孫）最多能有多少 tasks 的屬性是？
+ TasksMax=
- LimitNOFILE=
- Nice=
- CPUAffinity=
E> TasksMax 計算的是 tasks（包含 threads）。
?tf killall 是 atomic 操作，一次就能保證殺光所有 fork bomb 的 process。
=F
E> 不是 atomic，殺的同時可能又有新的產生，要重複執行。

@CARD proc.p_find | 實作：找出 process 與它在做什麼
A> 找 process 像「點名」：pgrep 用名字點、ps 列出整班、pstree 看家族關係、/proc/PID/ 是每個人的檔案夾，裡面有他的指令列、工作目錄和開著的檔案。
B> **pgrep -a 名稱**：列出 PID 與完整指令列；**pgrep -f 字串**：比對整個指令列（腳本被 bash 執行時，名字是 bash，要用 -f）
B> **ps -ef --forest** 或 **pstree -p**：看 parent / child 關係（找出誰生出了那個 process）
B> **ps -o pid,ppid,user,stat,etime,cmd -p PID**：自訂欄位，etime 是已執行多久
B> **/proc/PID/cmdline**、**/proc/PID/cwd**（目前工作目錄）、**/proc/PID/fd/**（開著哪些檔案）
B> **pkill -f 字串**：依指令列送訊號；先用 pgrep 確認比對到誰，再 pkill，避免誤殺
X> pgrep -af sftp_watchd
X> pstree -p $(pgrep -o sshd)
X> ls -l /proc/$(pgrep -o -f sftp_watchd)/fd
?mc sftp_watchd 是 bash 腳本，`pgrep sftp_watchd` 卻什麼都找不到。應該改用？
+ pgrep -f sftp_watchd，比對完整的指令列
- pgrep -u sftp_watchd
- ps aux | grep -v sftp_watchd
- kill -0 sftp_watchd
E> 腳本的 process 名稱常是 bash，腳本路徑只出現在參數中。
?cmd 以樹狀方式顯示所有 process，並附上 PID：
= pstree -p
= ps -ef --forest
= ps axf
E> 追查「誰生出了這個 process」時很好用。
?mc 想知道某個 process 目前開啟了哪些檔案，可以查看？
+ /proc/PID/fd/ 目錄（或 lsof -p PID）
- /proc/PID/status
- /etc/PID
- /var/run/PID
E> fd 底下每個 symlink 都指向一個開著的檔案、socket 或 pipe。

@CARD proc.p_busy | 實作：target is busy 與誰占著檔案
A> 想卸下一個掛載點，系統卻說 target is busy，代表還有人「站在房間裡」：可能是某個 shell 的工作目錄在裡面、某個程式開著裡面的檔案，最常見的是你自己的 shell 就 cd 在裡面。
B> **fuser -vm /mnt/點**：列出使用這個掛載點的 process（-v 詳細、-m 整個檔案系統）
B> **lsof +f -- /mnt/點**，或 `lsof | grep /mnt/點`；**lsof -i :22** 查誰在用 22 port
B> 處理順序：自己先 `cd /` 離開、停掉相關服務（例如 sftp_watchd 的 inotify 監看）、確認沒人了再 umount
B> 不得已時：**umount -l**（lazy，先從目錄樹拆掉，等沒人使用才真正釋放）；**fuser -km** 會直接殺掉使用者，小心
X> sudo fuser -vm /mnt/hw2
X> sudo lsof +f -- /mnt/hw2
X> sudo systemctl stop sftp_watchd && sudo umount /mnt/hw2/sftp
?cmd 列出所有正在使用 /mnt/hw2 這個檔案系統的 process，並顯示詳細資訊：
= fuser -vm /mnt/hw2
= fuser -mv /mnt/hw2
= sudo fuser -vm /mnt/hw2
E> 輸出會標示使用方式，例如 c 代表那是它的工作目錄。
?mc `umount /mnt/data` 顯示 target is busy，fuser 看到的唯一使用者是你目前的 bash。最簡單的解法？
+ 先 cd 到掛載點外面（例如 cd /），再 umount
- 重新開機
- umount -f
- 刪掉 /mnt/data 目錄
E> shell 的工作目錄在裡面，就算是在「使用」那個檔案系統。

@CARD proc.p_daemon | 實作：daemon 的正確寫法
A> daemon 是「沒有人看著也要一直值班的工人」。在 systemd 的時代，你不用自己做傳統的 double fork 背景化，只要寫好三件事：一個不會自己結束的主迴圈、收到 SIGTERM 時好好收工、把訊息印到 stdout / stderr 給 journal。
B> 主迴圈留在前景：inotifywait -m 的 pipe 迴圈、或 `while true; do ...; sleep 1; done`
B> 優雅結束：`trap 'echo stopping; exit 0' TERM INT`；systemctl stop 預設送 **SIGTERM**，等一段時間（預設 90 秒）沒結束才送 SIGKILL
B> 腳本的子程序（例如 inotifywait）也要一起收：systemd 預設 **KillMode=control-group** 會對整個 cgroup 送訊號，所以交給 systemd 管就不怕殘留
B> 訊息直接 echo，journal 會自動加上時間與服務名稱；不需要自己寫 log 檔（除非規格要求）
B> 測試：`systemctl start` → `status` → 製造事件 → `journalctl -u` 看輸出 → `stop` 後確認 `pgrep -f` 沒有殘留
X> #!/bin/bash
X> trap 'echo "sftp_watchd stopping"; exit 0' TERM INT
X> echo "sftp_watchd started"
X> inotifywait -m -r -e close_write -e moved_to --format '%w%f' "$ROOT" |
X> while read -r f; do check "$f"; done
?mc `systemctl stop myd` 預設會對服務送出什麼訊號？
+ SIGTERM，逾時仍未結束才送 SIGKILL
- 直接 SIGKILL
- SIGHUP
- SIGINT
E> 可以用 KillSignal= 與 TimeoutStopSec= 調整。
?tf 交給 systemd 管理的 daemon，仍然必須自己 fork 到背景並寫 PID 檔，否則 systemctl start 會卡住。
=F
E> Type=simple 的服務就是要留在前景；自己背景化反而會讓 systemd 以為服務已結束。
?fill 讓 bash 腳本收到 SIGTERM 時印出訊息並以 0 結束：trap 'echo bye; exit 0' ＿＿
= TERM
= SIGTERM
= 15
E> trap 可以接多個訊號名稱，例如 TERM INT。
</script>
<script type="text/plain" class="sa-src" data-ch="cron">
@CH cron | 週期性工作 cron / at / periodic | ⏰ | 09_Periodic_Processes.pdf

@CARD cron.daemon | cron daemon 與 crontab 位置
A> cron 是「永不睡覺的鬧鐘管家」：它讀每個人的鬧鐘表（crontab），時間一到就幫你執行指令。每個人最多一張自己的表，檔名就是你的帳號名。
B> **cron daemon** 負責週期性執行：讀設定檔，準時執行指令
B> 設定檔叫 **crontab**（cron table）；每個使用者**最多一個**，**以登入名稱命名**，用 crontab(1) 編輯
B> 使用者 crontab 位置：**FreeBSD /var/cron/tabs**、**Debian /var/spool/cron/crontabs**、Red Hat /var/spool/cron
B> 系統 crontab：**/etc/crontab**
B> 相關 man：cron(8)、crontab(1)、crontab(5)
?mt 配對系統與使用者 crontab 目錄：
> FreeBSD :: /var/cron/tabs
> Debian :: /var/spool/cron/crontabs
> Red Hat :: /var/spool/cron
E> 系統層都是 /etc/crontab。
?tf 一個使用者可以擁有多個自己的 crontab 檔案。
=F
E> 每個使用者最多一個，以登入名稱命名。

@CARD cron.format | crontab 格式：分 時 日 月 週
A> 五個欄位口訣「分時日月週」（像寫日期從小到大，最後補星期幾）。* 是「每個」、- 是「從…到…」、, 是「這幾個」、/ 是「每隔幾個」。星期 0 是星期日。
B> 格式：**minute hour day month weekday command**
B> minute **0-59**、hour **0-23**、day **1-31**、month **1-12**、weekday **0-6（0 = 星期日；Linux 7 也是週日）**
B> **\*** 全部、**-** 範圍、**,** 列舉、**/** 間隔（1-59/2 = 1,3,5…59）
B> 空行與行首空白忽略；# 開頭是註解；可設 name = value 環境變數（LOGNAME、SHELL、PATH、HOME、**MAILTO**）
B> ⚠ 如果 day 和 weekday 都有指定（非 *），**符合任一個**就執行
X> # minute hour day month weekday command
X> 33 7 * * * /usr/local/bin/rsync -al --delete /home/ backup:/raid/home/
M> 分時日月週（0 是禮拜天）
?mt 配對 crontab 時間表示：
> 45 10 * * 1-5 :: 週一到週五 10:45
> */3 * * * * :: 每 3 分鐘
> 0 0 14 2 * :: 2 月 14 日午夜
> 5 0-6 * * * :: 0 點到 6 點的每個第 5 分
> 30 15 5 * * :: 每月 5 日 15:30
E> 欄位順序：分 時 日 月 週。
?fill 每週日凌晨 3:15 執行，時間欄位寫成＿＿
= 15 3 * * 0
= 15 3 * * 7
= 15 3 * * sun
E> 分=15、時=3、週=0（星期日）。
?fill 每天早上 8 點到下午 6 點之間每整點執行，時間欄位寫成＿＿
= 0 8-18 * * *
E> 分=0、時=8-18。
?mc 0,30 * 13 * 5 代表什麼時候執行？
+ 每月 13 日以及每個星期五，每小時的 0 分與 30 分
- 只有「13 號剛好是星期五」那天，每半小時
- 每週五 13:00 與 13:30
- 每月 13 日 5 點
E> day 與 weekday 都指定時是「或」的關係。
?fill 1-59/2 在分鐘欄位代表 1, 3, 5 …，最後一個是＿＿
= 59
E> 從 1 開始每隔 2。

@CARD cron.special | 特殊時間字串 @reboot 等
A> 懶人簡寫：@reboot 開機時一次、@hourly 每小時整點、@daily（= @midnight）每天午夜、@weekly 每週日午夜、@monthly 每月 1 日午夜、@yearly（= @annually）每年 1/1 午夜。
B> **@reboot**：開機時執行一次
B> **@yearly / @annually** = 0 0 1 1 *
B> **@monthly** = 0 0 1 * *
B> **@weekly** = 0 0 * * 0
B> **@daily / @midnight** = 0 0 * * *
B> **@hourly** = 0 * * * *
B> （投影片另列 @every_minute、@every_second，屬於特定實作）
?mt 配對特殊字串與五欄格式：
> @hourly :: 0 * * * *
> @daily :: 0 0 * * *
> @weekly :: 0 0 * * 0
> @monthly :: 0 0 1 * *
> @yearly :: 0 0 1 1 *
E> @midnight 同 @daily、@annually 同 @yearly。
?mc 想讓腳本在每次開機時執行一次，crontab 可寫？
+ @reboot /path/to/script.sh
- @boot /path/to/script.sh
- 0 0 * * * /path/to/script.sh
- @startup /path/to/script.sh
E> @reboot。

@CARD cron.cmd | crontab 指令
A> crontab -e 是「打開我的鬧鐘表來改」、-l 是「念出來給我聽」、-r 是「整張撕掉」（小心！和 -e 只差一個鍵）、crontab file 是「用這張新表取代舊的」。
B> **crontab -e [-u user]**：用編輯器編輯（某使用者的）crontab
B> **crontab -l**：列出內容
B> **crontab -r**：**刪除**目前的 crontab
B> **crontab filename**：把檔案安裝成你的 crontab
?cmd 編輯自己的 crontab：
= crontab -e
E> -e edit。
?cmd 以 root 身分列出使用者 alice 的 crontab：
= crontab -l -u alice
= crontab -u alice -l
E> -u 指定使用者。
?mc crontab -r 會做什麼？
+ 刪除目前使用者的整個 crontab
- 重新載入 crontab
- 只刪除最後一行
- 還原上一版 crontab
E> -r remove，而且通常不會確認！

@CARD cron.allow | cron.allow / cron.deny 與 log
A> allow 是「白名單：只有名單上的人能用」；deny 是「黑名單：名單上的人不能用」。預設所有人都能有自己的 crontab。
B> 預設**所有使用者**都可以有 crontab
B> **allow 檔**：只有列出的使用者可以用 crontab
B> **deny 檔**：列出的使用者不能用
B> FreeBSD：/var/cron/{allow,deny}，log 由 syslogd
B> Debian / Red Hat：**/etc/cron.{allow,deny}**，log /var/log/cron
?tf cron.allow 存在時，只有列在其中的使用者可以使用 crontab。
=T
E> allow 是白名單。

@CARD cron.system | 系統 crontab：/etc/crontab
A> 系統 crontab 比個人的多一欄「以誰的身分執行」（who）。Linux 用 run-parts 執行 /etc/cron.daily 等目錄裡的所有腳本；如果有 anacron（筆電用，不假設一直開機）就交給它。
B> /etc/crontab 格式多一欄 **user**：minute hour mday month wday **who** command
B> FreeBSD：*/5 … root **/usr/libexec/atrun**、0 * … root **newsyslog**、1 3 * * * root **periodic daily**、15 4 * * 6 root **periodic weekly**、30 5 1 * * root **periodic monthly**
B> Linux：17 * * * * root cd / && **run-parts --report /etc/cron.hourly**；daily / weekly / monthly 若有 anacron 則交給 anacron
B> **anacron**：給筆電用，不假設系統一直開機的週期排程
X> 25 6 * * * root test -x /usr/sbin/anacron || { cd / && run-parts --report /etc/cron.daily; }
?mc /etc/crontab 和使用者 crontab 格式上的主要差異？
+ /etc/crontab 多了一欄指定要以哪個使用者執行
- /etc/crontab 沒有分鐘欄位
- /etc/crontab 只能用 @daily 這類字串
- 完全相同
E> 系統 crontab 有 who 欄位。
?mc 筆電常常關機，想確保每日工作「錯過了也會補做」，適合用？
+ anacron
- at
- @reboot
- run-parts
E> anacron 不假設系統持續運作。

@CARD cron.periodic | FreeBSD periodic
A> periodic 是 FreeBSD 的「定期保養套餐」：/etc/periodic/daily、weekly、monthly、security 目錄裡放好編號的保養腳本，由 cron 定時叫 periodic 去執行整個目錄。檔名前面的數字決定順序；是否真正動作由 periodic.conf 的 YES 開關控制。
B> **periodic(8)**：執行 /etc/periodic 下的週期系統功能（daily、weekly、monthly、security）
B> 第三方/自訂：**/usr/local/etc/periodic**
B> 設定：**/etc/periodic.conf**（覆寫 /etc/defaults/periodic.conf），如 daily_clean_tmps_enable="YES"
B> **執行順序依檔名**（數字前綴，如 100.clean-disks）
B> 目錄下**所有腳本都會被執行**（不像 rc.conf 需要 YES 才跑），腳本內再依 periodic.conf 決定要不要做事
B> **由 crontab 驅動**（/etc/crontab 的 periodic daily 等行）
?mc FreeBSD 的 periodic 是被什麼觸發執行的？
+ cron（/etc/crontab 中的 periodic daily/weekly/monthly）
- systemd timer
- atd
- rc.conf
E> periodic 本身不是 daemon。
?tf periodic 目錄下的腳本執行順序由檔名的數字前綴決定。
=T
E> 例如 100.clean-disks 先於 200.backup-passwd。

@CARD cron.at | at：一次性延後執行
A> cron 是「每天都響的鬧鐘」，at 是「只響一次的便利貼提醒」。atq 看還有哪些便利貼、atrm 撕掉一張。
B> **at**：在指定時間執行指令（一次性）；at [-q queue] [-f file] [-mldbv] time，或 -t [[CC]YY]MMDDhhmm[.SS]
B> **atq**：查看 job 佇列；**atrm**：移除 job
B> 權限：FreeBSD **/var/at/at.{allow,deny}**、Linux **/etc/at.{allow,deny}**
B> 預設：**FreeBSD 只有 root** 能用 at；**Linux 預設每個使用者**都能用
B> 驅動：**FreeBSD 由 cron 每 5 分鐘呼叫 /usr/libexec/atrun**；**Linux 由 atd.service** 驅動（systemctl status atd）
B> 指令預設用 /bin/sh 執行
?sa 試說明 periodic 以及 at 分別與 cron 的關係，以及 periodic 和 at 之間的差異。
S> 2023 期末 Q7
R> 與 cron 的關係：FreeBSD 的 periodic 由 cron 驅動，/etc/crontab 中有 periodic daily / weekly / monthly 的排程，cron 時間到就呼叫 periodic 去執行對應目錄的腳本。at 在 FreeBSD 也依賴 cron：/etc/crontab 每 5 分鐘執行 /usr/libexec/atrun 檢查並執行到期的 at job（Linux 則改由 atd daemon 負責）。
R> 差異：periodic 是「週期性、重複執行」的系統維護框架，執行 /etc/periodic/{daily,weekly,monthly,security} 中依編號排序的一組腳本，行為由 /etc/periodic.conf 控制；at 是「一次性」的延後執行，使用者指定某個時間執行一次指令，執行完就從佇列移除（可用 atq / atrm 管理）。
P> periodic 由 cron 定期呼叫
P> at 由 cron 每 5 分鐘跑 atrun（FreeBSD）/ Linux 為 atd
P> periodic 週期性系統維護腳本 vs at 一次性使用者指令
?cmd 列出目前的 at job 佇列：
= atq
= at -l
E> atrm <job> 刪除。
?cmd 刪除編號 23 的 at job：
= atrm 23
= at -r 23
= at -d 23
E> atrm 後接 job 編號。
?mt 配對：at 在不同系統由誰驅動
> FreeBSD :: cron 每 5 分鐘執行 /usr/libexec/atrun
> Linux :: atd.service daemon
E> 所以在 Linux 上 at 沒反應時，要檢查 atd 是否 active。
?tf 在 FreeBSD 預設設定下，一般使用者就可以使用 at 指令。
=F
E> FreeBSD 預設只有 root；Linux 預設每個人都可以。

@CARD cron.p_debug | 實作：cron 工作沒跑怎麼查
A> 手動執行好好的腳本，放進 cron 就不動，這是 SA 最經典的謎題。答案幾乎都是「cron 的環境跟你的 shell 不一樣」：PATH 很短、沒有讀你的 .bashrc、工作目錄是家目錄、% 是特殊字元。
B> 看 cron 有沒有觸發：**journalctl -u cron**（Debian 的服務名是 cron）或 `grep CRON /var/log/syslog`
B> cron 的 **PATH 只有 /usr/bin:/bin**：指令寫絕對路徑，或在 crontab 開頭設定 PATH=
B> 把輸出存下來才看得到錯誤：`... >> /tmp/job.log 2>&1`（沒有 MTA 時，cron 想寄給你的錯誤信就消失了）
B> crontab 裡的 **% 會被當成換行**：`date +%F` 要寫成 `date +\%F`
B> 系統 crontab（/etc/crontab、/etc/cron.d/）**多一個使用者欄位**；/etc/cron.d/ 的檔名不能含 .
B> 先用 `* * * * *` 每分鐘跑一次驗證，成功後再改成真正的時間
X> PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
X> */5 * * * * /usr/local/bin/SnApper snapshot pool1 >> /var/log/snap.log 2>&1
X> 0 3 * * * tar czf /backup/etc-$(date +\%F).tgz /etc
?mc 腳本在終端機執行正常，放進 crontab 後顯示 command not found。最可能的原因？
+ cron 的 PATH 很短，腳本用到的指令所在目錄不在裡面
- crontab 不支援 shell script
- cron 只能以 root 身分執行
- 時間格式寫錯
E> 在 crontab 設 PATH，或腳本中一律使用絕對路徑。
?mc crontab 中寫 `0 1 * * * tar czf /b/$(date +%F).tgz /etc`，結果一直失敗。問題在？
+ crontab 裡的 % 會被轉成換行，需要寫成 \%
- $( ) 在 crontab 中不能用
- tar 不能用相對路徑
- 0 1 代表每分鐘
E> 第一個 % 之後的內容會變成指令的 stdin。
?cmd （Debian）查看 cron 這個 service 的 log：
= journalctl -u cron
= journalctl -u cron.service
E> 可以看到每次觸發時執行的指令（CMD）。

@CARD cron.p_timer | 實作：systemd timer（cron 的替代品）
A> systemd timer 是「附在 service 上的鬧鐘」：.timer 決定什麼時候響，同名的 .service 決定響了要做什麼。比 cron 多的好處是：log 自動進 journal、錯過的工作開機後可以補跑、可以用 systemctl 查下次何時觸發。
B> 兩個檔：**backup.service**（Type=oneshot，做事）與 **backup.timer**（[Timer] 設時間，[Install] WantedBy=timers.target）
B> 時間：**OnCalendar=daily**、`OnCalendar=*-*-* 03:00:00`、`OnCalendar=Mon *-*-* 09:00`；相對時間：**OnBootSec=5min**、**OnUnitActiveSec=1h**
B> **Persistent=true**：關機時錯過的那次，開機後補跑
B> 啟用的是 timer 而不是 service：**systemctl enable --now backup.timer**
B> **systemctl list-timers** 看所有 timer 與下次觸發時間；**systemd-analyze calendar '表達式'** 驗證時間寫得對不對
X> # /etc/systemd/system/snap.timer
X> [Timer]
X> OnCalendar=*-*-* 03:00:00
X> Persistent=true
X> [Install]
X> WantedBy=timers.target
?cmd 列出系統所有 timer，以及它們下次與上次觸發的時間：
= systemctl list-timers
= systemctl list-timers --all
E> --all 會連同未啟用的也列出來。
?mc 寫好 snap.timer 與 snap.service 之後，要讓它開機自動生效，應該 enable 哪一個？
+ snap.timer
- snap.service
- 兩個都要
- 都不用，放進目錄就生效
E> timer 觸發同名的 service，service 本身通常沒有 [Install]。
?fill 希望 timer 在關機期間錯過的觸發，開機後補跑一次，要在 [Timer] 加上 ＿＿=true
= Persistent
E> 類似 anacron 的行為。
</script>
<script type="text/plain" class="sa-src" data-ch="systemd">
@CH systemd | systemd 深入：cgroups、unit、service、timer | 🧩 | systemd.pdf

@CARD systemd.intro | systemd 是什麼
A> systemd 是系統的「總管家」：開機時是 PID 1，負責把所有服務按照依賴關係排好、一起啟動；還兼管主機名、時間、語系、登入、網路、DNS 等雜事。它用 cgroups 幫每個服務「分房間」，所以永遠知道哪個 process 屬於哪個服務。
B> **system and service manager**：Debian 8 (jessie) 起的預設 init system
B> **Transactional、dependency-based** 的服務控制邏輯：依依賴關係決定要啟動哪些 unit
B> 相容 **SysV / LSB init scripts**，可取代 sysvinit
B> 用 Linux **control groups (cgroups)** 追蹤 process：服務 fork 出的子孫都在同一個 cgroup，不會「跑丟」
B> 另附 logging daemon（journald）與工具：hostname、time/date、locale、user sessions、system accounts、runtime directories、網路設定、名稱解析、網路校時
?mc systemd 用什麼機制追蹤「某個服務產生的所有 process」？
+ Linux control groups（cgroups）
- PID 檔案（/var/run/*.pid）
- 每個 process 的 PPID 鏈
- /etc/inittab
E> 投影片：Keeps track of processes using Linux control groups。process 就算 double fork 脫離父子關係，仍留在同一個 cgroup。
?tf systemd 可以執行傳統的 SysV init script。
=T
E> Supports SysV and LSB init scripts and works as a replacement for sysvinit。
?mc 下列哪一項「不是」投影片列出的 systemd 附帶功能？
+ 編譯 kernel module
- 設定 hostname
- 管理 user sessions
- 網路校時（time synchronization）
E> 列出的有 hostname、time/date、locale、user sessions、system accounts、runtime directories、網路設定、名稱解析、網路校時。

@CARD systemd.cgroup | Control Groups v2
A> cgroup 像公司的「部門樹」：process 是員工，被分到不同部門（cgroup）；資源（CPU、記憶體、I/O、PID 數）是部門預算，沿著樹往下分配。規定只有「最底層的小組」可以放員工，中層部門只管預算。
B> 用**階層**方式組織 process，並沿階層**分配系統資源**：CPU、Memory、I/O、PID
B> systemctl status 的 **CGroup:** 樹：init.scope（PID 1）、**system.slice**（各 .service）、**user.slice**（使用者 session）
B> **.slice**：分組用的中間節點；**.service / .scope**：真正放 process 的葉節點
B> **No internal process rule**：process 只能放在**葉節點** cgroup（啟用 controller 的非 root cgroup 不能同時有 process 和子 cgroup）
B> 查看工具：**systemd-cgls**（樹狀）、**systemd-cgtop**（即時資源用量）
X> $ systemctl status            # 最下面有整棵 CGroup 樹
X> $ cat /proc/self/cgroup
X> 0::/user.slice/user-1000.slice/session-3.scope
?mt 配對 cgroup 單位類型：
> .slice :: 分組用的中間節點，本身不放 process
> .service :: systemd 啟動的服務，放它的 process
> .scope :: 外部建立的一群 process（如使用者登入 session）
> init.scope :: PID 1 所在的位置
E> slice 分層、service/scope 放 process（no internal process rule）。
?mc cgroups v2 的 no internal process rule 指的是？
+ process 只能放在葉節點 cgroup，中間節點只負責分配資源
- 一個 process 不能同時屬於兩個 user
- root cgroup 不能有任何 process
- 每個 cgroup 只能有一個 process
E> 所以 systemd 才把 process 放在 .service/.scope，而 .slice 只做分組。
?cmd 即時查看各 cgroup（服務）的 CPU、記憶體用量排行：
= systemd-cgtop
E> 類似 top，但以 cgroup 為單位。
?tf cat /proc/self/cgroup 可以看出目前 shell 屬於哪個 cgroup。
=T
E> cgroup v2 只有一行 0::/路徑。

@CARD systemd.cgfs | cgroups v2 檔案介面
A> cgroup 被做成一個「檔案櫃」：/sys/fs/cgroup 底下每個資料夾就是一個 cgroup，打開檔案就能看成員名單（cgroup.procs）和預算上限（memory.max、cpu.max）。寫檔案就等於改規則。
B> 以**檔案系統**呈現：**/sys/fs/cgroup**，**一個 cgroup 一個目錄**
B> **cgroup.procs**：這個 cgroup 裡的 PID 清單
B> **cgroup.events**：**populated 0/1**（底下是否還有 process）、frozen
B> **cgroup.subtree_control**：開放給子 cgroup 使用的 controller
B> controller 檔案：cpu.max、cpu.weight、memory.current、memory.max、pids.current、pids.max；值 **max** 代表不限制
X> $ cd /sys/fs/cgroup/system.slice/cron.service
X> $ cat cgroup.procs      # 1153
X> $ cat memory.max        # max
?mc 想知道 cron.service 目前有哪些 PID，應讀哪個檔案？
+ /sys/fs/cgroup/system.slice/cron.service/cgroup.procs
- /proc/cron.service/status
- /sys/fs/cgroup/cron/tasks.list
- /etc/systemd/system/cron.service
E> 每個 cgroup 一個目錄，cgroup.procs 列出 PID。
?fill cgroup.events 中顯示底下是否還有 process 的欄位是＿＿
= populated
