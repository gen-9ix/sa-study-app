<script type="text/plain" class="sa-src" data-ch="lvm">
@CH lvm | LVM 邏輯磁碟管理 | 🧱 | LVM.pdf

@CARD lvm.what | LVM 是什麼
A> LVM 像「把好幾個存錢筒倒進同一個大池子，再依需要分裝成任意大小的瓶子」：硬碟 / 分割區（存錢筒）→ 合成一個儲存池 → 切出可以隨時放大縮小的「虛擬分割區」。檔案系統只看到瓶子，不用管底下是幾顆硬碟。
B> **Device mapper** 框架（/dev/mapper/），為 Linux kernel 提供邏輯磁碟管理
B> 把磁碟 / 分割區變成**儲存池**，位於**硬碟與檔案系統之間**
B> 多顆磁碟當成一顆大磁碟用；提供「虛擬分割區」
B> **容易調整大小**，不必在意分割區的前後位置
B> 何時用：多顆磁碟、未來要擴充、不想管分割順序、不確定各掛載點需要多大（單顆磁碟也有用）
?mc 下列哪個不是使用 LVM 的好處？
+ 自動備份資料，snapshot 可以取代備份
- 可以把多顆磁碟合成一個儲存池
- 可以線上擴大邏輯磁碟
- 不必在意分割區的前後順序
E> LVM snapshot 不是備份（Not backup!）。

@CARD lvm.arch | PV → VG → LV 三層架構
A> 三層樂高：PV（實體積木：磁碟或分割區）→ VG（把積木倒進同一個箱子）→ LV（從箱子裡拿積木蓋出你要的房間）。由下往上建，由上往下拆。
B> **PV (Physical Volume)**：最底層儲存（磁碟、分割區、軟體 RAID /dev/mdX）；pvcreate 會寫入 LVM header
B> **VG (Volume Group)**：由一或多個 PV 組成的儲存池
B> **LV (Logical Volume)**：在 VG 裡切出的虛擬分割區，在上面建檔案系統
B> LV 路徑：**/dev/<VG>/<LV>** 或 **/dev/mapper/<VG>-<LV>**（名稱中的 - 會變成 --）
M> 「P 物、V 群、L 邏」，由下而上 P → V → L
?ord LVM 由下（硬體）到上（檔案系統）的層次：
> 實體磁碟 / 分割區
> Physical Volume (PV)
> Volume Group (VG)
> Logical Volume (LV)
> 檔案系統（ext4、btrfs…）
E> 建立順序也是如此。
?fill VG 名為 data-vg、LV 名為 data_vol，在 /dev/mapper 下的路徑是 /dev/mapper/＿＿
= data--vg-data_vol
E> VG 與 LV 之間用一個 -，名稱本身的 - 會被跳脫成 --（df 輸出可見 data--vg-data_vol）。
?fill VG 為 primary_vg、LV 為 home_lv，另一個路徑寫法是 /dev/＿＿
= primary_vg/home_lv
E> /dev/<VG>/<LV>。

@CARD lvm.cmds | 建立 PV / VG / LV 指令
A> 指令名稱很好猜：pv / vg / lv + create / extend / reduce / remove / display / s（簡表）。
B> **pvcreate /dev/sdb1 /dev/sdb2 …**
B> **vgcreate <VG> <PV…>**；**vgextend <VG> <PV>** 加 PV 進現有 VG
B> **lvcreate -l 100%FREE <VG> -n <LV>**（-l 小寫：以 extent 數或百分比）
B> **lvcreate -L 50G <VG> -n <LV>**（-L 大寫：以容量）
B> 查看：**pvs / vgs / lvs**（簡表）、**pvdisplay / vgdisplay / lvdisplay**（詳細，含 PE 大小與數量）
?cmd 把 /dev/sdb 初始化成 LVM 的 PV：
= pvcreate /dev/sdb
E> 會寫入 LVM header。
?cmd 用 /dev/sdb 建立名為 data-vg 的 VG：
= vgcreate data-vg /dev/sdb
E> vgcreate <名稱> <PV>。
?cmd 在 data-vg 中建立名為 data_vol、使用全部剩餘空間的 LV：
= lvcreate -l 100%FREE -n data_vol data-vg
= lvcreate -l 100%FREE data-vg -n data_vol
= lvcreate -n data_vol -l 100%FREE data-vg
E> -l（小寫）可用百分比。
?cmd 在 primary_vg 中建立 50G、名為 data_lv 的 LV：
= lvcreate -L 50G -n data_lv primary_vg
= lvcreate -L 50G primary_vg -n data_lv
= lvcreate -n data_lv -L 50G primary_vg
E> -L（大寫）指定容量。
?mt 配對 lvcreate 選項：
> -L 50G :: 以容量指定大小
> -l 100%FREE :: 以 extent 數或百分比指定
> -n :: LV 名稱
E> 大 L = Large size；小 l = little extents。

@CARD lvm.pe | PE 與 LE
A> PE 是 LVM 的「最小積木塊」（預設 4MB）：LV 就是由一塊一塊 PE 拼起來的。LE 是在 LV 這一層看到的同一塊積木，大小和 PE 一樣。
B> **PE (Physical Extent)**：PV 中可分配給 LV 的**最小連續單位**，預設 **4MB**
B> PE 從 VG 分配給 LV；PV 大小須是 PE 的倍數
B> **LE (Logical Extent)**：LV 層級的單位，**大小與 PE 相同**
B> pvdisplay、vgdisplay 顯示 PE 大小與數量；lvdisplay 顯示 LE 數
?fill LVM 預設的 PE 大小是＿＿MB
= 4
E> 可在 vgcreate -s 改。
?tf LE 的大小和 PE 相同。
=T
E> LE 對應到 PE。

@CARD lvm.thin | Thin Provisioning
A> Thin provisioning 像「信用卡額度」：你可以答應每台 VM 100GB（virtual size 是上限），但實際上用多少才從池子裡扣多少（on-demand）。適合 VM 主機，但要監控池子別被刷爆。
B> **依需求分配**（on-demand allocation），適合 VM host
B> **Thin Pool**：由兩個隱藏 LV 組成（**metadata 與 data**）；lvcreate --type thin-pool -n <pool> -L <Size> <VG>
B> **Thin LV**：住在 thin pool 中；lvcreate --type thin -n <LV> **-V <VirtualSize>** --thinpool <pool> <VG>
B> Virtual size 是 thin LV 的**上限**
?mc Thin LV 的 -V（virtual size）代表？
+ 該 thin LV 的容量上限，實際空間依使用量從 thin pool 分配
- 立即從 VG 保留的空間
- thin pool 的 metadata 大小
- snapshot 的大小
E> 這就是 over-provisioning 的基礎。
?tf Thin pool 由 metadata 與 data 兩個隱藏的元件 LV 組成。
=T
E> 投影片重點。

@CARD lvm.snap | LVM Snapshot 與 rollback
A> LVM snapshot 像「拍照當下貼一張透明片」：一開始什麼都不複製，只有原 LV 的資料要被改時，才把舊資料先抄到透明片上（CoW）。透明片要事先指定大小，抄滿了 snapshot 就壞掉。它不是備份，原本的磁碟壞了，透明片也救不回來。
B> **CoW snapshot**：建立快（只複製指標）、省空間；**不是備份**
B> **lvcreate -L <SIZE> --snapshot --name <snap> <target LV>**；snapshot 本身也是 LV
B> 大小通常設為目標 LV 的 **20-30%**
B> Rollback：**先 umount 目標 LV**，再 **lvconvert --merge <snapshot>**
?cmd 對 /dev/vg0/home 建立一個 5G、名為 home_snap 的 snapshot：
= lvcreate -L 5G --snapshot --name home_snap /dev/vg0/home
= lvcreate -L 5G -s -n home_snap /dev/vg0/home
= lvcreate --snapshot -L 5G --name home_snap /dev/vg0/home
= lvcreate -s -L 5G -n home_snap /dev/vg0/home
E> --snapshot 可簡寫 -s。
?cmd 把 snapshot vg0/home_snap 合併回原 LV（rollback）：
= lvconvert --merge vg0/home_snap
= lvconvert --merge /dev/vg0/home_snap
E> 要先 umount 原 LV。
?tf LVM snapshot 可以取代備份。
=F
E> 它和原 LV 共用底層資料；磁碟損壞時一起消失。

@CARD lvm.steps | 用 LVM 新增一顆資料碟
A> 蓋房子由地基往上：準備磁碟 → pvcreate → vgcreate → lvcreate → mkfs → mount，最後寫進 fstab 讓它重開機後還在。
B> ① 準備磁碟（lsblk 確認）② **pvcreate** ③ **vgcreate**（新 VG，把 rootfs 與資料分開）④ **lvcreate** ⑤ **mkfs.ext4 / mkfs.btrfs** ⑥ **mount**
B> ⑦ 編輯 **/etc/fstab**（建議用 UUID）確保重開機後仍掛載
B> 若要放到 /home 等已有資料的位置：先把原資料複製到新 LV（暫時掛在別處 cp -a），再掛到 /home
X> pvcreate /dev/sdb
X> vgcreate data-vg /dev/sdb
X> lvcreate -l 100%FREE -n data_vol data-vg
X> mkfs.btrfs /dev/data-vg/data_vol
X> mkdir /data && mount /dev/data-vg/data_vol /data
?ord 用新硬碟 /dev/sdb 建立一個 LVM 管理的 ext4 並掛在 /data：
> pvcreate /dev/sdb
> vgcreate data-vg /dev/sdb
> lvcreate -l 100%FREE -n data data-vg
> mkfs.ext4 /dev/data-vg/data
> mount /dev/data-vg/data /data
> 把 UUID 寫進 /etc/fstab
E> 由下往上建立。
?sa 你有一台 Linux 伺服器，最近多插了一顆硬碟 (/dev/sdb)。你希望擁有一個 mount 在 /home 的 ext4 filesystem，並使用 LVM 管理，且要在重開機後保持 mount。請完整寫出達成此目標的步驟。
S> 2025 期末 Q20
R> 1. lsblk 確認新硬碟為 /dev/sdb（必要時用 fdisk 建一個 Linux LVM 類型的分割區）。
R> 2. pvcreate /dev/sdb，建立 PV。
R> 3. vgcreate home-vg /dev/sdb，建立 VG。
R> 4. lvcreate -l 100%FREE -n home home-vg，建立 LV。
R> 5. mkfs.ext4 /dev/home-vg/home，建立 ext4。
R> 6.（若 /home 已有資料）mount /dev/home-vg/home /mnt，cp -a /home/. /mnt/，umount /mnt。
R> 7. mount /dev/home-vg/home /home。
R> 8. 用 blkid 取得 UUID，在 /etc/fstab 加入 UUID=<uuid> /home ext4 defaults 0 2，並以 mount -a（或 findmnt --verify）確認，重開機後仍會自動掛載。
P> pvcreate → vgcreate → lvcreate
P> mkfs.ext4
P> mount 到 /home（並處理既有資料）
P> 寫入 /etc/fstab（UUID）以持久化

@CARD lvm.extend | 擴充 rootfs 空間
A> 房子要加蓋：先確認土地真的變大了（rescan）、在空地上劃新分割區（fdisk）、做成 PV、併入現有的 VG、把 LV 拉大，最後別忘了把「室內裝潢」（檔案系統）也撐大（resize2fs），不然房子大了、房間還是一樣小。
B> 情境：磁碟還有空間沒用到，原分割區已使用 LVM
B> ① VM 改大磁碟後若沒反應：**echo 1 > /sys/block/<disk>/device/rescan**
B> ② **fdisk** 建新分割區（n 新增、t 改類型為 Linux LVM、p 檢查、**w 寫入**）
B> ③ **pvcreate** 新分割區 ④ **vgextend** 加入現有 VG
B> ⑤ **lvextend** 擴大 LV ⑥ **resize2fs <device>**（ext4，可線上擴大）
B> 或 **lvextend --resizefs** 一步完成 ⑤⑥
?ord 擴充已使用 LVM 的 rootfs 的步驟：
> 讓 kernel 重新掃描磁碟大小（rescan）
> fdisk 建立新分割區（類型 Linux LVM）並 w 寫入
> pvcreate 新分割區
> vgextend 把新 PV 加入現有 VG
> lvextend 擴大 root LV
> resize2fs 擴大 ext4 檔案系統
E> 最後一步常被忘記：LV 變大但 df 看到的大小不變。
?cmd 把 /dev/sda4 加入既有的 VG trixws-vg：
= vgextend trixws-vg /dev/sda4
E> vgextend <VG> <PV>。
?cmd 擴大 ext4 檔案系統以填滿已擴充的 LV /dev/trixws-vg/root：
= resize2fs /dev/trixws-vg/root
= resize2fs /dev/mapper/trixws--vg-root
E> ext4 支援線上擴大。
?cmd 把 /dev/vg0/root 增加 10G，並同時調整檔案系統大小：
= lvextend -L +10G --resizefs /dev/vg0/root
= lvextend --resizefs -L +10G /dev/vg0/root
= lvextend -r -L +10G /dev/vg0/root
= lvextend -L +10G -r /dev/vg0/root
E> --resizefs（-r）會呼叫對應的 fs resize 工具。
?mt 配對 fdisk 指令：
> n :: 新增分割區
> t :: 改變分割區類型
> p :: 印出分割表
> w :: 寫入並離開
> q :: 不儲存離開
E> 在 w 之前都只改在記憶體中。
?tf lvextend 擴大 LV 之後，df 顯示的檔案系統容量就會自動跟著變大。
=F
E> 還要 resize2fs（或用 lvextend --resizefs）。

@CARD lvm.remove | 移除磁碟（縮小）
A> 拆房子要從屋頂往下：先把室內（檔案系統）縮小 → 再把房間（LV）縮小 → 把那塊地從社區除名（vgreduce）→ 拆掉地基標記（pvremove）→ 最後才搬走磁碟。順序反了就會切到還有資料的地方。
B> ① **縮小檔案系統**（如 btrfs filesystem resize -2g /data/；ext4 用 resize2fs，需離線縮小）
B> ② **lvreduce / lvresize** 縮小 LV
B> ③ **vgreduce <VG> <PV>** 把 PV 移出 VG
B> ④ **pvremove <PV>** 清除 LVM 標籤
B> ⑤ 拔除磁碟
B> 確保已使用空間 < 保留的 PV 大小；操作前**先備份**
?ord 從 LVM 中移除一個 PV 的順序：
> 縮小檔案系統
> lvreduce 縮小 LV
> vgreduce 把 PV 移出 VG
> pvremove 清除 PV 標籤
> 實體移除磁碟
E> 和建立相反：由上往下拆。
?cmd 把 /dev/sda2 從 VG data-vg 中移除：
= vgreduce data-vg /dev/sda2
E> 之後 pvremove /dev/sda2。
?mc 縮小一個 ext4 LV 時，下列哪個順序正確？
+ 先縮小檔案系統，再縮小 LV
- 先縮小 LV，再縮小檔案系統
- 只要縮小 LV，檔案系統會自動配合
- 兩者順序無所謂
E> 先縮 LV 會把還有資料的區域切掉。

@CARD lvm.hw2 | HW2：shrink root、LVM RAID10
A> HW2-1 的地基工程：把 root LV 縮到 15G 騰出空間做新 LV；再加新磁碟做 4 個 PV 組成 SA2026vg，切出 RAID10 的 LV 給 Btrfs 用。
B> 把 debian-vg-root **縮小到 15G**（先縮 ext4 再縮 LV；root 線上不能縮 ext4 → 需在 rescue/live 環境）
B> 用剩餘空間建 LV **new-part**，格式化 ext4，掛到 /mnt/new-part（寫入 fstab）
B> 加磁碟 → **4 個 PV** → VG **SA2026vg** → LV **SARaid10**（**--type raid10**）
B> 在 /dev/mapper/SA2026vg-SARaid10 上 mkfs.btrfs，Label **SAHW2**
X> lvcreate --type raid10 -m 1 -i 2 -l 100%FREE -n SARaid10 SA2026vg
X> mkfs.btrfs -L SAHW2 /dev/mapper/SA2026vg-SARaid10
?mc ext4 的 root LV 要縮小時，為什麼通常要在 rescue / live 環境進行？
+ ext4 不支援線上縮小，必須在 umount 狀態下 resize2fs
- 因為 lvreduce 只能在 live 環境執行
- 因為縮小會刪除 /boot
- 因為 root LV 不能被 LVM 管理
E> ext4 可線上擴大，但縮小必須離線。
?cmd 在 /dev/mapper/SA2026vg-SARaid10 上建立 Label 為 SAHW2 的 Btrfs：
= mkfs.btrfs -L SAHW2 /dev/mapper/SA2026vg-SARaid10
= mkfs.btrfs /dev/mapper/SA2026vg-SARaid10 -L SAHW2
E> -L 設定 label。

@CARD lvm.p_status | 實作：LVM 現況與 RAID 同步檢查
A> 動 LVM 之前先看三層的現況：pvs 看「有哪些原料磚」、vgs 看「池子還剩多少」、lvs 看「切出了哪些區塊」。RAID 的 LV 建好後會在背景同步，同步進度也在 lvs 裡看。
B> 簡表：**pvs**、**vgs**（VFree 是剩餘空間）、**lvs**；詳細：**pvdisplay / vgdisplay / lvdisplay**
B> RAID 細節：**lvs -a -o name,segtype,devices,sync_percent SA2026vg**，-a 會顯示 _rimage_ 與 _rmeta_ 等內部 LV
B> 名稱對照：VG `debian-vg` 的 LV `root` 在 **/dev/debian-vg/root**，也就是 **/dev/mapper/debian--vg-root**（名字裡的 - 在 mapper 中會變成 --）
B> 新磁碟或新分割區偵測不到時：`lsblk` 確認；VM 熱插拔後可以 `echo '- - -' > /sys/class/scsi_host/host0/scan`；確認後 **pvscan**
B> 舊磁碟上殘留其他簽章導致 pvcreate 拒絕：先 **wipefs -a 裝置**（會清掉簽章，確認是新碟再做）
X> pvs; vgs; lvs
X> lvs -a -o name,segtype,devices,sync_percent SA2026vg
X> ls -l /dev/mapper/
?cmd 列出 SA2026vg 中所有 LV（包含 RAID 內部的 image 與 metadata LV），並顯示類型、所在裝置與同步進度：
= lvs -a -o name,segtype,devices,sync_percent SA2026vg
= lvs -a -o name,segtype,devices,sync_percent
E> segtype 應該顯示 raid10。
?mc VG 名稱是 debian-vg、LV 名稱是 root，它在 /dev/mapper 底下的名字是？
+ debian--vg-root
- debian-vg-root
- debian_vg_root
- root
E> mapper 用單一 - 分隔 VG 與 LV，所以名稱本身的 - 要寫成 --。
?cmd 用最精簡的表格顯示所有 VG 的大小與剩餘空間：
= vgs
= sudo vgs
E> pvs、vgs、lvs 是日常最常用的三個。

@CARD lvm.p_part | 實作：把一顆新磁碟切成多個 PV
A> 規格要「4 個 PV」，但沒有規定要 4 顆磁碟。你可以加 4 顆虛擬磁碟，也可以加 1 顆再切成 4 個分割區，每個分割區各做一個 PV。切分割區就像在一塊蛋糕上畫線，parted 可以一行指令畫完。
B> 確認新磁碟名稱：**lsblk**（通常是 /dev/sdb；**千萬確認不是系統碟 sda**）
B> 一次切好：`parted -s /dev/sdb mklabel gpt mkpart p1 0% 25% mkpart p2 25% 50% mkpart p3 50% 75% mkpart p4 75% 100%`
B> 互動式工具：**fdisk**（n 新增、p 列出、w 寫入）或 **cfdisk**；GPT 也可以用 **sgdisk**
B> 切完：`partprobe /dev/sdb` 讓 kernel 重新讀取，再 `lsblk` 確認出現 sdb1 到 sdb4
B> **pvcreate /dev/sdb1 /dev/sdb2 /dev/sdb3 /dev/sdb4**，再 **vgcreate SA2026vg** 加上這四個
B> 想一想：4 個 PV 都在同一顆實體碟上，RAID10 的鏡像就保護不了「整顆碟壞掉」，只是滿足作業的結構要求
X> lsblk
X> sudo parted -s /dev/sdb mklabel gpt mkpart p1 0% 25% mkpart p2 25% 50% mkpart p3 50% 75% mkpart p4 75% 100%
X> sudo pvcreate /dev/sdb{1..4}
X> sudo vgcreate SA2026vg /dev/sdb{1..4}
?cmd 把 /dev/sdb1 到 /dev/sdb4 四個分割區組成名為 SA2026vg 的 VG（可以用 brace expansion）：
= vgcreate SA2026vg /dev/sdb1 /dev/sdb2 /dev/sdb3 /dev/sdb4
= vgcreate SA2026vg /dev/sdb{1..4}
= vgcreate SA2026vg /dev/sdb[1-4]
E> 若還沒 pvcreate，vgcreate 也會自動幫你初始化。
?tf 在同一顆實體磁碟的 4 個分割區上做 LVM RAID10，可以在這顆磁碟整個故障時保住資料。
=F
E> 所有鏡像都在同一顆碟上，那顆碟壞了全部一起消失。
?mc 用 parted 切完分割區後，lsblk 還看不到 sdb1 等新分割區。最適合的下一步是？
+ 執行 partprobe /dev/sdb，讓 kernel 重新讀取分割表
- 重新執行 mkfs
- 執行 vgchange -ay
- 執行 update-grub
E> 分割表寫入磁碟了，但 kernel 還沒有重新載入。

@CARD lvm.p_shrink | 實作：安全縮小 ext4 的 LV
A> 縮小 LV 像「把一大箱東西換到小箱子」：一定要先把東西（檔案系統）壓縮到比小箱子還小，再換箱子（lvreduce），最後讓東西重新撐滿箱子。順序反過來，等於直接把箱子切掉一角，裡面的資料就毀了。
B> ext4 **不能在掛載中縮小**，root 檔案系統要在 rescue / Live 環境中、未掛載的狀態下操作
B> 手動三步：**e2fsck -f** → **resize2fs 裝置 14G**（比目標小一點）→ **lvreduce -L 15G** → **resize2fs 裝置**（不帶大小 = 撐滿 LV）
B> 一步到位：**lvreduce -r -L 15G /dev/debian-vg/root**（-r 會自動先 fsck 與縮小檔案系統），最不容易出錯
B> 縮完後剩下的空間：`lvcreate -l 100%FREE -n new-part debian-vg` → `mkfs.ext4` → 掛載並寫進 fstab
B> 動手前備份（VM 先做快照），縮完 `lvs` 確認大小、重開機確認能正常進系統
X> e2fsck -f /dev/debian-vg/root
X> lvreduce -r -L 15G /dev/debian-vg/root
X> lvcreate -l 100%FREE -n new-part debian-vg
X> mkfs.ext4 /dev/debian-vg/new-part
?ord 手動把 ext4 的 LV 從 20G 縮到 15G 的正確順序：
> 在未掛載的狀態下 e2fsck -f
> resize2fs 把檔案系統縮到比 15G 小
> lvreduce -L 15G 縮小 LV
> resize2fs 不指定大小，讓檔案系統撐滿 LV
E> 先縮內容，再縮容器；擴大時則相反：先擴容器，再擴內容。
?cmd 把 /dev/debian-vg/root 縮小到 15G，並讓 LVM 自動一併處理檔案系統：
= lvreduce -r -L 15G /dev/debian-vg/root
= lvreduce -L 15G -r /dev/debian-vg/root
= lvreduce --resizefs -L 15G /dev/debian-vg/root
E> -r = --resizefs，會呼叫 fsadm 先縮檔案系統。
?cmd 用 debian-vg 中剩下的全部空間建立名為 new-part 的 LV：
= lvcreate -l 100%FREE -n new-part debian-vg
= lvcreate -n new-part -l 100%FREE debian-vg
E> 小寫 -l 是以 extent 或百分比指定，大寫 -L 是以大小指定。
</script>
<script type="text/plain" class="sa-src" data-ch="btrfs">
@CH btrfs | Btrfs | 🌳 | BTRFS.pdf

@CARD btrfs.intro | Btrfs 是什麼
A> Btrfs（B-tree FS）是「瑞士刀檔案系統」：內建 CoW、快照、像 LVM 的磁碟管理和軟體 RAID、會自我檢查的 checksum、透明壓縮、秒速複製（reflink）。ext4 是可靠的基本款；ZFS 也很強但比較吃記憶體。
B> 現代 **CoW** 檔案系統，著重容錯、修復、易於管理
B> **Snapshots**：不需完整複製檔案
B> **內建 volume management**，支援軟體 RAID 0、RAID 1 等
B> **Self-healing**：data 與 metadata 都有 **checksum**，自動偵測靜默資料損壞
B> **透明壓縮**：mount -o compress=zstd /dev/sdx /mnt
B> **Reflink**：快速有效率的檔案複製：cp --reflink=always source target
B> 對比：ext4 最常見但只有基本功能；ZFS 功能多但記憶體用量較高
?mt 配對 Btrfs 功能與說明：
> Checksum :: 偵測靜默資料損壞（self-healing）
> Reflink :: 共用資料區塊的快速複製
> compress=zstd :: 透明壓縮
> Snapshot :: 不完整複製檔案的時間點副本
E> 這些都建立在 CoW 之上。
?cmd 以 zstd 透明壓縮掛載 /dev/sdx 到 /mnt：
= mount -o compress=zstd /dev/sdx /mnt
E> compress 是 mount option。
?cmd 用 reflink 方式複製 big.img 為 copy.img：
= cp --reflink=always big.img copy.img
E> 共用區塊，只有修改時才複製。

@CARD btrfs.subvol | Subvolume
A> Subvolume 像「一個檔案系統裡的獨立小國」：有自己的目錄樹和 inode 編號空間，可以各自掛載、各自拍快照。每個 Btrfs 都有一個 ID 5 的「頂層國家」（top-level），預設 mount 的就是它。
B> 擁有**獨立目錄階層與 inode 編號空間**的部分檔案系統
B> 每個 Btrfs 有 **top-level subvolume，ID = 5**，路徑為 /；預設掛載時就是掛它
B> 其他 subvolume 都在 top-level 底下
B> 命名慣例：以 **@** 開頭，**@** 對應 /、**@www** 對應 /var/www
B> **btrfs subvolume create <path>**、**btrfs subvolume list <mnt>**
?fill Btrfs top-level subvolume 的 ID 是＿＿
= 5
E> 也是 HW2 的「root volume」。
?cmd 在 /mnt/home 底下建立 subvolume @ray：
= btrfs subvolume create /mnt/home/@ray
= btrfs sub create /mnt/home/@ray
E> btrfs subvolume create。
?cmd 列出掛載於 /mnt 的 Btrfs 中所有 subvolume（表格格式）：
= btrfs subvolume list -t /mnt
= btrfs subvolume list /mnt
= btrfs sub list -t /mnt
E> -t 以表格顯示；-p 顯示 parent、-a 顯示所有。

@CARD btrfs.layout | Nested vs Flat layout
A> Nested 像「俄羅斯娃娃」：子 subvolume 放在父 subvolume 裡，掛載父的時候子的自動跟著出現（也繼承掛載選項），刪父要先刪子。Flat 像「並排的抽屜」：全部直接放在 top-level 底下，每個都要自己掛，但可以各自用不同選項。HW2 要求 flat。
B> **Nested**：subvolume 建在另一個 subvolume 裡；刪 parent 前要先刪所有 children；children 隨 parent 掛載而出現，**套用 parent 的 mount options**
B> **Flat**：所有 subvolume 都是 **top-level 的直接子節點**；每個都要**手動掛載**（fstab），可**各自設定不同選項**
B> Flat 的 fstab：UUID=… / btrfs **subvol=@**,defaults,autodefrag 0 0；/home btrfs **subvol=@home**,noatime …
B> HW2：所有 subvolume（root、sftp、pool1、pool2）直接在 root volume（ID 5）底下，**不可 nested**；另建目錄 snapshot/sftp、snapshot/pool1、snapshot/pool2
?mt 配對 layout 特性：
> Nested :: 子 subvolume 隨父掛載，並繼承父的掛載選項
> Flat :: 每個 subvolume 各自在 fstab 掛載，可用不同選項
E> Flat layout 的 subvolume 都在 top-level 下。
?tf 在 nested layout 中，可以直接刪除還有子 subvolume 的父 subvolume。
=F
E> 必須先刪除所有 children。

@CARD btrfs.snapshot | Btrfs Snapshot
A> Btrfs snapshot 就是「一個和原本 subvolume 共用資料的新 subvolume」（CoW），建立瞬間完成。可寫的 snapshot 和原本的 subvolume 根本沒有差別，它們是平等的雙胞胎。-r 讓它變成唯讀的「照片」。
B> snapshot = **與另一個 subvolume 共享 data 與 metadata 的 subvolume**（CoW）
B> **不是遞迴的**：不包含裡面巢狀的 subvolume
B> **-r** 建立唯讀 snapshot
B> 可寫 snapshot 與原 subvolume **沒有差別**
B> **btrfs subvolume snapshot [-r] <source> <destination>**
?cmd 為 /mnt/home/@ray 建立唯讀 snapshot 到 /mnt/snapshots/@homeray-1：
= btrfs subvolume snapshot -r /mnt/home/@ray /mnt/snapshots/@homeray-1
= btrfs sub snapshot -r /mnt/home/@ray /mnt/snapshots/@homeray-1
E> -r 唯讀；HW2 SnApper 建立的 snapshot 也要唯讀。
?tf Btrfs snapshot 會遞迴地包含原 subvolume 底下的巢狀 subvolume。
=F
E> snapshot 不是遞迴的，巢狀 subvolume 在 snapshot 中只是一個空目錄。

@CARD btrfs.vslvm | LVM snapshot vs Btrfs snapshot
A> 兩者都是 CoW，但 LVM snapshot 是「預先租一個固定大小的倉庫存舊資料」，而且每多一個 snapshot，寫入就要多抄一份；Btrfs 是檔案系統本身就懂 CoW，不用預先指定大小，多個 snapshot 也不太影響效能和空間。
B> 共同：**Copy on Write**
B> **LVM**：建立時**要指定 snapshot LV 大小**；同一個 LV 的多個 snapshot 都要被寫入 → 寫入變慢、略浪費空間
B> **Btrfs**：**不需要指定大小**；多個 snapshot（reflink）不浪費效能與空間
?mc 下列哪個是 LVM snapshot 有、而 Btrfs snapshot 沒有的限制？
+ 建立時必須預先指定 snapshot 的大小
- 使用 copy on write
- 可以建立唯讀 snapshot
- 可以用來 rollback
E> Btrfs snapshot 不用指定大小。

@CARD btrfs.rollback | Snapshot Rollback
A> Btrfs 沒有「一鍵還原」按鈕。常見做法：把舊照片（唯讀 snapshot）再拍一張「可寫的副本」，然後把這個副本掛到原本的位置（或改名替換掉舊的 subvolume）。原來的照片還留著，可以再還原一次。
B> Btrfs **沒有內建 rollback 指令**，官方文件也沒有明確程序
B> 方法一：掛載 snapshot，把檔案**複製**回目的地
B> 方法二：**對 snapshot 再做一個可寫的 snapshot**，再把它**掛載**到原位置（或 mv 改名取代原 subvolume、更新 fstab 的 subvol=）
X> btrfs subvolume snapshot /mnt/snapshots/@homeray-1762502638 /mnt/home/@ray_new
X> mount -o subvol=/home/@ray_new /dev/sdb /home/ray
B> HW2 SnApper rollback 要求：rollback 後 **snapshot 仍存在**、subvolume **可寫**、重新掛載後狀態**持續**
?sa 目前已有一個 Btrfs 的 snapshot subvolume，請問要如何 rollback？
S> 2025 期末 Q21
R> Btrfs 沒有內建 rollback 指令，常見作法：
R> ① 以該 snapshot 建立一個新的可寫 snapshot：btrfs subvolume snapshot <snapshot> <新 subvolume>（snapshot 本身若為唯讀，這樣也能保留它）。
R> ② umount 原本的 subvolume，將原 subvolume 改名或刪除（btrfs subvolume delete），把新 subvolume 改成原本的名稱 / 位置（mv），或直接修改 mount 的 subvol= 指向新 subvolume（記得同步更新 /etc/fstab）。
R> ③ 重新掛載：mount -o subvol=<新 subvolume> <device> <mountpoint>。
R> 另一種較簡單但慢的方式是掛載 snapshot 後，把檔案複製回原 subvolume。
P> 對 snapshot 再建立可寫 snapshot
P> 以新 subvolume 取代原 subvolume（改名 / 改 subvol= / fstab）並重新掛載
?cmd 以 subvolume /home/@ray_new 掛載 /dev/sdb 到 /home/ray：
= mount -o subvol=/home/@ray_new /dev/sdb /home/ray
= mount -o subvol=home/@ray_new /dev/sdb /home/ray
E> subvol= 是 Btrfs 的 mount option。

@CARD btrfs.mountopt | Btrfs mount options
A> 掛載選項是「進門時的規矩」：subvol= 指定進哪個房間、compress= 進門就自動壓縮、noatime 不記錄每次讀取的時間（少寫很多次）、autodefrag 自動整理碎片。
B> **subvol=<path>** / **subvolid=<id>**：掛載特定 subvolume
B> **compress=zstd**（或 lzo、zlib）/ compress-force
B> **noatime**：不更新存取時間，減少寫入
B> **autodefrag**：自動重組小量隨機寫入的檔案
B> 其他：ssd、discard、space_cache=v2、nodatacow、ro / rw、defaults
?sa 請問 Btrfs mount option 可以設什麼？至少寫出兩個。
S> 2025 期末 Q22
R> 例如：subvol=@home（或 subvolid=）指定要掛載的 subvolume；compress=zstd 啟用透明壓縮；noatime 不更新 access time；autodefrag 自動重組；其他如 ssd、discard、space_cache=v2、nodatacow、ro。
P> 寫出兩個正確的 Btrfs mount option（如 subvol=、compress=、noatime、autodefrag）
?mt 配對 mount option：
> subvol=@home :: 指定掛載哪個 subvolume
> compress=zstd :: 寫入時透明壓縮
> noatime :: 讀取時不更新 access time
> autodefrag :: 自動重組碎片
E> fstab 範例中這幾個都有出現。

@CARD btrfs.migrate | 實戰：把 home 遷移到 Btrfs
A> 搬家流程：裝工具 → 準備新房（區塊裝置）→ 裝潢（mkfs.btrfs）→ 先掛到暫時地址、隔出房間（subvolume）→ 搬家具（cp -a）→ 把新房掛到正式地址 → 寫進 fstab → 拍一張照片（snapshot）備用。
B> ① apt install **btrfs-progs** ② 新增區塊裝置（分割區 / 磁碟 / LV）③ **mkfs.btrfs** ④ 掛到暫時位置並建立 subvolume（/mnt/home/@USER）⑤ **cp -a /home/USER/. /mnt/home/@USER/** ⑥ **mount -o subvol=/home/@USER** 到 /home/USER ⑦ 寫入 fstab（UUID）⑧ 建立 snapshot 到 /mnt/snapshots/
B> **btrfs filesystem show**：顯示 Btrfs 結構（label、uuid、裝置）
X> echo "UUID=0ed693ae-… /home/ray btrfs subvol=/home/@ray 0 0" >> /etc/fstab
X> btrfs subvolume snapshot /mnt/home/@ray /mnt/snapshots/@homeray-$(date +%s)
?ord 把 /home/ray 遷移到新的 Btrfs 的順序：
> mkfs.btrfs 新的區塊裝置
> 掛到 /mnt 並 btrfs subvolume create /mnt/home/@ray
> cp -a /home/ray/. /mnt/home/@ray/
> mount -o subvol=/home/@ray 裝置 /home/ray
> 把 UUID 與 subvol= 寫入 /etc/fstab
E> cp -a 保留權限、擁有者與時間戳。
?cmd 顯示系統上的 Btrfs 檔案系統資訊（label、UUID、裝置）：
= btrfs filesystem show
= btrfs fi show
E> 也可用 blkid 查 UUID。
?mc 為什麼搬移家目錄時要用 cp -a？
+ 保留擁有者、權限、時間戳與 symlink 等屬性（archive 模式）
- 因為 -a 會比較快
- 因為 -a 會自動建立 subvolume
- 因為 -a 會壓縮資料
E> -a = -dR --preserve=all。

@CARD btrfs.scrub | btrfs scrub
A> scrub 是 Btrfs 的「定期健康檢查」：線上讀過所有資料與 metadata，用 checksum 找出壞掉的區塊，如果有 RAID 的備份副本就自動修好。
B> **線上**檔案系統檢查工具：讀取所有 data 與 metadata
B> 用 **checksum** 與 RAID 的**重複副本**找出並**修復**損壞資料
B> btrfs scrub start -B <mountpoint>（-B 前景執行直到完成）
B> 通常由 **btrfs-scrub@.timer** 每月定期執行
?mc btrfs scrub 能修復損壞資料的前提是？
+ 有 RAID 等重複副本，可用正確的副本取代壞掉的
- 只要有 checksum 就能修復任何資料
- 必須先 umount 檔案系統
- 必須有 LVM snapshot
E> 沒有副本時只能偵測不能修復。

@CARD btrfs.p_top | 實作：掛載 top-level（subvolid=5）來管理
A> 平常你只掛載各個 subvolume（root 掛在 /mnt/hw2、pool1 掛在 /mnt/hw2/pool1），看不到「整棟樓的大廳」。要建立新的 subvolume、放 snapshot、做 rollback，都得另外把 top-level（ID 5）掛到某個地方，從大廳往各房間操作。
B> 掛載大廳：`mkdir -p /mnt/root5 && mount -o subvolid=5 /dev/mapper/SA2026vg-SARaid10 /mnt/root5`
B> 在大廳建立 subvolume 與目錄：`btrfs subvolume create /mnt/root5/pool1`、`mkdir -p /mnt/root5/snapshot/pool1`
B> 同一個檔案系統可以同時被掛載在多個地方，不衝突；腳本裡可以臨時掛、用完 umount
B> 確認結構：**btrfs subvolume list /mnt/root5**，每個 subvolume 的 top level 都應該是 5（不能有巢狀）
B> 其他狀態：**btrfs filesystem show**（裝置與 label）、**btrfs filesystem usage /mnt/hw2**（空間用量，比 df 準）
X> mount -o subvolid=5 /dev/mapper/SA2026vg-SARaid10 /mnt/root5
X> for s in root sftp pool1 pool2; do btrfs subvolume create /mnt/root5/$s; done
X> mkdir -p /mnt/root5/snapshot/{sftp,pool1,pool2}
X> btrfs subvolume list /mnt/root5
?cmd 把 /dev/mapper/SA2026vg-SARaid10 的 top-level volume（ID 5）掛載到 /mnt/root5：
= mount -o subvolid=5 /dev/mapper/SA2026vg-SARaid10 /mnt/root5
= mount -o subvol=/ /dev/mapper/SA2026vg-SARaid10 /mnt/root5
= mount /dev/mapper/SA2026vg-SARaid10 /mnt/root5 -o subvolid=5
E> 預設（沒有設 default subvolume 時）直接 mount 也會掛到 ID 5，但寫清楚比較保險。
?mc 名叫 root 的 subvolume 與 root volume 有什麼差別？
+ root volume 是 ID 5 的頂層；root 只是一個建立在頂層底下、名字叫 root 的普通 subvolume
- 兩者是同一個東西
- root subvolume 的 ID 一定是 5
- root volume 是 / 掛載點
E> 作業特別提醒的陷阱，名字一樣但層級不同。
?cmd 顯示 /mnt/hw2 所在 Btrfs 檔案系統的詳細空間用量（包含 metadata 與 RAID 配置）：
= btrfs filesystem usage /mnt/hw2
= btrfs fi usage /mnt/hw2
= btrfs filesystem df /mnt/hw2
E> CoW 與快照讓 df 的數字不太準，要看 btrfs 自己的統計。

@CARD btrfs.p_ids | 實作：取得 subvolume ID 與快照資訊
A> 寫快照管理腳本時，你會一直需要回答三個問題：這個快照的 ID 是多少？它是哪個 subvolume 的快照？它是什麼時候拍的？答案都在 btrfs subvolume list 與 show 的輸出裡，關鍵在怎麼把需要的欄位切出來。
B> **btrfs subvolume list 掛載點**：每行 `ID 551 gen 671 top level 5 path snapshot/pool1/@20251003-163650`，ID 在第 2 欄、path 在最後一欄
B> 選項：**-s** 只列 snapshot、**-r** 只列唯讀、**-o** 只列該路徑底下的、**-p -a -t** 是作業範例用的表格格式
B> **btrfs subvolume show 路徑**：顯示 Subvolume ID、Creation time、Flags（readonly）等
B> 唯讀屬性：**btrfs property get 路徑 ro**；設定：`btrfs property set 路徑 ro true / false`
B> 建立快照後要取得新 ID：對新路徑 `btrfs subvolume show` 取 Subvolume ID 那一行，或在 list 中用路徑比對
X> btrfs subvolume list /mnt/root5 | awk '$NF ~ /^snapshot\// {print $2, $NF}'
X> btrfs subvolume show /mnt/root5/snapshot/pool1/@20251003-163650 | awk '/Subvolume ID/ {print $3}'
X> btrfs property get /mnt/root5/snapshot/pool1/@20251003-163650 ro
?mc `btrfs subvolume list /mnt/root5` 的一行輸出為 `ID 551 gen 671 top level 5 path snapshot/pool1/@20251003-163650`。用 awk 要取出 ID，應該印哪一欄？
+ $2
- $1
- $3
- $NF
E> $1 是字串 ID，$2 才是數字；$NF 是路徑。
?cmd 查看 /mnt/root5/snapshot/pool1/@x 這個 subvolume 是否為唯讀：
= btrfs property get /mnt/root5/snapshot/pool1/@x ro
= btrfs property get -ts /mnt/root5/snapshot/pool1/@x ro
E> 輸出 ro=true 代表唯讀。
?fill btrfs subvolume list 只列出 snapshot（不含一般 subvolume）的選項是 ＿
= -s
E> 要注意 -s 判斷的是「是否為快照」，而 SnApper 管理的範圍是 snapshot/ 目錄底下的那些。

@CARD btrfs.p_rollback | 實作：rollback 的實際步驟與陷阱
A> Btrfs 的 rollback 不是「把舊照片倒回去」，而是「用舊照片翻拍一張新的、可寫的，放到原本的位置」，舊的 subvolume 移走或刪掉，原本的照片保持不動。最大的陷阱：subvolume 被換掉之後 ID 會變，所以 fstab 必須用名字（subvol=pool1）掛載，不能用 subvolid。
B> 步驟：① 掛載 top-level ② **umount 該 subvolume 的掛載點**（掛載中的 subvolume 不能刪）③ 舊的改名或 `btrfs subvolume delete` ④ `btrfs subvolume snapshot 快照 /mnt/root5/pool1`（**不加 -r**，所以是可寫的）⑤ 重新 `mount /mnt/hw2/pool1`
B> 規格要求：rollback 後**快照仍在**、subvolume **可寫**、umount 再 mount 後狀態仍然是 rollback 後的樣子
B> fstab 若寫 **subvolid=**，換掉 subvolume 後 ID 不同，重開機會掛不到或掛到錯的 → 一律用 **subvol=名稱**
B> 要回溯到的 subvolume 名稱可以從快照路徑推回來：`snapshot/pool1/@...` 的第二段就是 pool1
B> 有 process 在使用該掛載點時 umount 會失敗（target is busy），先處理掉
X> umount /mnt/hw2/pool1
X> btrfs subvolume delete /mnt/root5/pool1
X> btrfs subvolume snapshot /mnt/root5/snapshot/pool1/@20251003-194529 /mnt/root5/pool1
X> mount /mnt/hw2/pool1          # 依 fstab 的 subvol=pool1 重新掛上
?ord Btrfs rollback pool1 到某個快照的步驟：
> 掛載 top-level（subvolid=5）
> umount /mnt/hw2/pool1
> 刪除（或改名）目前的 pool1 subvolume
> 從快照建立一個可寫的 snapshot，命名為 pool1
> 依 fstab 重新掛載 /mnt/hw2/pool1
E> 原本的唯讀快照從頭到尾沒被動過，所以 rollback 後它仍然存在。
?mc fstab 用 `subvolid=257` 掛載 pool1，rollback 之後重開機，pool1 的掛載出了問題。原因？
+ rollback 後新的 pool1 是另一個 subvolume，ID 已經不是 257
- Btrfs 不支援 subvolid 選項
- rollback 會把檔案系統變成唯讀
- 快照的 ID 也會跟著改變
E> 用 subvol=pool1 依名稱掛載，就不受 ID 改變影響。
?tf rollback 時用 `btrfs subvolume snapshot -r 快照 /mnt/root5/pool1` 建立新的 pool1 即可滿足「rollback 後可寫」的要求。
=F
E> -r 會建立唯讀快照，rollback 後的 subvolume 必須可寫，所以不能加 -r。
</script>
<script type="text/plain" class="sa-src" data-ch="docker">
@CH docker | Docker 基礎 | 🐳 | Docker_Basic.pdf

@CARD docker.container | Container 是什麼
A> Container 像「同一棟大樓裡用隔板隔出來的獨立套房」：大家共用同一套地基與水電（同一個 kernel），但每間有自己的門牌、網路、家具（用 namespace 隔離）。Container image 是「裝修好的樣品屋藍圖」，裡面已經放好軟體需要的一切。
B> **Container**：擁有隔離資源的子系統
B> **Container image**：輕量、獨立的套件，包含執行軟體所需的一切
B> 在 Linux 上以 **namespaces** 實作：隔離 **process、network stack、file system** 等
B> **Docker**：把應用與相依套件打包成可攜容器的平台；最普及的 container engine
B> 其他 runtime：**Podman、Singularity** 等
?mc Linux container 主要靠哪個 kernel 機制隔離 process、網路與檔案系統？
+ namespaces
- 虛擬化 hypervisor
- chroot only
- SELinux
E> 投影片：this technology is implemented through the use of Linux namespaces（資源限制則另靠 cgroups）。

@CARD docker.vsvm | Container vs VM
A> VM 是「蓋一棟獨立的房子」（自己的地基 = 自己的 OS kernel），最安全但又重又慢；container 是「大樓裡的套房」，共用地基所以輕又快、方便複製，但隔離沒有獨棟那麼徹底。
B> **VM**：完全獨立的環境，**包含 OS（自己的 kernel）**
B> **Container**：**共用 host kernel** → 更快、更輕量
B> **VM 比較安全**（隔離較強）
B> **Container 比較好重複使用**
?mt 比較 Container 與 VM：
> 共用 host 的 kernel :: Container
> 有自己完整的 OS :: VM
> 隔離較強、較安全 :: VM
> 啟動快、輕量 :: Container
E> 共用 kernel 是 container 輕量的原因，也是隔離較弱的原因。
?tf 在 Linux host 上執行的 container，擁有自己獨立的 kernel。
=F
E> container 共用 host kernel；VM 才有自己的 kernel。

@CARD docker.runtime | Docker、containerd 與 runc
A> 一層層的外包：docker（CLI，你下指令的櫃台）→ containerd（管理 container 生命週期的經理，用 shim 追蹤狀態）→ runc（真正動手的低階工人，照 OCI 規格直接呼叫 kernel）。
B> **docker** 本身其實是 CLI，使用名為 **containerd** 的 container runtime
B> **containerd** 管理 container 生命週期，透過 **OCI** 用 **runc** 操作 container；用 **shim** 追蹤 runc container 狀態
B> **OCI**（Open Container Initiative）：container 規格
B> **runc**：低階 runtime，直接利用 kernel
?ord 由上層到下層排列：
> docker CLI
> containerd
> runc
> Linux kernel（namespaces）
E> containerd 透過 shim 追蹤 runc 啟動的 container。
?mt 配對元件：
> containerd :: 管理 container 生命週期的 runtime
> runc :: 依 OCI 規格直接建立 container 的低階 runtime
> OCI :: container 的開放規格
> shim :: 讓 containerd 追蹤 runc container 狀態
E> 投影片 Docker, Containerd & Runc。

@CARD docker.install | 安裝 Docker 與 docker 群組
A> 加入 docker 群組等於「拿到 Docker 的萬能鑰匙」，不用 sudo 就能操作 container；但能控制 Docker daemon 實質上接近 root 權限，要謹慎給。
B> 安裝腳本：curl -fsSL https://get.docker.com -o get-docker.sh；sudo sh ./get-docker.sh
B> 啟用並啟動：**sudo systemctl enable docker**、**sudo systemctl start docker**
B> 免 sudo 使用：sudo groupadd docker；**sudo usermod -aG docker $USER**（重新登入後生效）
B> docker -v 確認版本
?cmd 把目前使用者加入 docker 群組（保留原本群組）：
= usermod -aG docker $USER
= usermod -aG docker "$USER"
= usermod -a -G docker $USER
E> 記得 -a；重新登入才生效。

@CARD docker.pull | docker pull、image 與 tag
A> Image 像「樂高套組」：由很多層（layer）疊成；tag 是套組的「版本與口味」，trixie 是標準版、trixie-slim 是輕量版、alpine 是迷你版。
B> 啟動 container 前先要有 image：**docker pull <image>:[<tag>]**
B> 來源：**Docker Hub**；其他 registry（如 AWS ECR）在名稱前加 <registry_address>/<repository_name>
B> tag 表示版本與屬性：debian **trixie** / **trixie-slim**（較輕量）；python **3.13-bookworm**（基於 Debian Bookworm）、**3.13.5-alpine3.22**（基於 Alpine）
B> image 由**多個 layer** 組成
?cmd 下載 Debian Trixie 的 image：
= docker pull debian:trixie
E> 格式 image:tag。
?mc python:3.13-bookworm 這個 tag 表示？
+ Python 3.13，以 Debian Bookworm 為基底
- Python 3.13 的 bookworm 版開發者
- Debian 3.13 加上 Python
- 只能在 Bookworm host 上執行
E> tag 描述版本與基底。
?tf Container image 是由多個 layer 組成的。
=T
E> 每個 Dockerfile 指令通常產生一層。

@CARD docker.run | docker run 常用選項
A> docker run 是「照藍圖蓋一間套房並入住」。-it 是「我要進去跟它互動」、-d 是「蓋好讓它自己運作」、--name 是「掛門牌」、--rm 是「退房自動拆除」、-v 是「接一條外部的儲物管線」、-p 是「在大樓外牆開一扇對應到套房的門」。
B> **docker run <image>**
B> **-it**：interactive + 開 tty（常一起用）
B> **-d**：detach 到背景
B> **--name <name>**：container 名稱
B> **--rm**：container 停止後自動刪除
B> **-v <host path / volume>:<container path>**：volume 掛載
B> **-p <host port>:<container port>**：port forwarding
?cmd 在背景執行 nginx image，命名為 web，並把 host 的 8080 對應到 container 的 80：
= docker run -d --name web -p 8080:80 nginx
= docker run -d -p 8080:80 --name web nginx
= docker run --name web -d -p 8080:80 nginx
= docker run --name web -p 8080:80 -d nginx
= docker run -p 8080:80 -d --name web nginx
= docker run -p 8080:80 --name web -d nginx
E> -p host:container。
?cmd 互動式啟動一個 debian:trixie 的 bash，離開後自動刪除 container：
= docker run -it --rm debian:trixie bash
= docker run --rm -it debian:trixie bash
= docker run -it --rm debian:trixie /bin/bash
= docker run --rm -it debian:trixie /bin/bash
E> -it 互動、--rm 停止即刪。
?mc -p 8080:80 中，8080 是？
+ host 的 port
- container 內的 port
- container ID
- volume 大小
E> host:container。

@CARD docker.volume | Volumes：Named volume 與 Bind mount
A> Container 是「旅館房間」，退房（刪除）東西就清空；volume 是「旅館外的私人倉庫」，資料不跟著房間消失。Named volume 是旅館幫你管的倉庫（放在 /var/lib/docker/volumes）；bind mount 是直接把你家的某個資料夾接進房間。
B> **Volume**：持久儲存機制，資料獨立於 container 生命週期，container 刪除後資料仍在
B> **Named volume**：給名字，放在 **/var/lib/docker/volumes**；docker run -v my_vol:/data debian:trixie
B> **Bind mount**：把 host 上的**特定路徑**綁進 container；docker run -v ./data:/data debian:trixie
?mt 配對：
> -v my_vol:/data :: Named volume（Docker 管理，位於 /var/lib/docker/volumes）
> -v ./data:/data :: Bind mount（host 的特定路徑）
E> 寫路徑（含 / 或 ./）就是 bind mount。
?tf container 被刪除後，存在 named volume 中的資料也會一起消失。
=F
E> volume 的資料獨立於 container 生命週期。

@CARD docker.exec | docker exec、logs、ps 與其他
A> 管理套房的日常：exec 是「敲門進去做事」、logs 是「看監視器紀錄」（-f 持續看）、ps 是「看哪些房間有人住」（-a 包含已退房的）、stop / restart / rm 是「關燈 / 重開 / 拆掉」。
B> **docker exec <container> <command>**，常用 -it 開 shell（bash 或 sh）
B> **docker logs <container>**；**-f** 持續追蹤
B> **docker ps**：列出執行中 container；**-a** 包含已停止的
B> **docker stop / restart / rm <name>**
?cmd 進入正在執行、名為 web 的 container 開一個互動式 sh：
= docker exec -it web sh
= docker exec -it web /bin/sh
E> exec 在已存在的 container 裡執行指令。
?cmd 持續追蹤 container web 的 log：
= docker logs -f web
= docker logs web -f
E> -f follow。
?cmd 列出所有 container，包含已停止的：
= docker ps -a
= docker container ls -a
E> 沒加 -a 只顯示執行中的。
?mt 配對 Docker 指令：
> docker run :: 從 image 建立並啟動 container
> docker exec :: 在執行中的 container 裡執行指令
> docker rm :: 刪除 container
> docker pull :: 下載 image
E> docker rmi 才是刪除 image。

@CARD docker.p_debug | 實作：container 出問題怎麼查
A> container 是「封在玻璃箱裡的小系統」，出問題時要學會四種觀察方式：從外面看它的狀態（ps）、聽它說話（logs）、讀它的規格表（inspect）、伸手進去看（exec）。
B> **docker ps -a**：包含已停止的；STATUS 的 `Exited (1)`、`Restarting` 都是線索
B> **docker logs -f --tail 50 容器**：container 主程序的 stdout / stderr
B> **docker inspect 容器**：完整設定（掛載、網路、環境變數、重啟次數）；取單一欄位：`docker inspect -f '{{.State.ExitCode}}' 容器`
B> **docker exec -it 容器 sh**：進去看檔案、測網路（很多 image 沒有 bash，用 sh）
B> port 對外不通：檢查 `-p 主機port:容器port` 有沒有寫反；服務在容器內若只聽 **127.0.0.1**，從外面一定連不到，要聽 **0.0.0.0**
B> 空間：**docker system df** 看用量、**docker system prune** 清掉沒在用的資源
X> docker ps -a
X> docker logs -f --tail 50 web
X> docker inspect -f '{{.State.ExitCode}} {{.RestartCount}}' web
X> docker exec -it web sh
?cmd 持續追蹤容器 web 的 log，並且只從最後 50 行開始：
= docker logs -f --tail 50 web
= docker logs --tail 50 -f web
= docker logs -f -n 50 web
E> 和 tail -f 很像。
?mc `docker run -p 8080:80 myapp` 啟動後，主機 curl localhost:8080 一直被拒絕；容器內 curl localhost:80 正常。最可能的原因？
+ 容器內的服務只聽 127.0.0.1，要改成聽 0.0.0.0
- -p 的參數應該寫成 80:8080
- 需要 --privileged
- 主機沒有安裝 curl
E> 容器內的 127.0.0.1 是容器自己的 loopback，外部轉進來的連線到不了。
?cmd 進入正在執行的容器 web，開一個互動式的 sh：
= docker exec -it web sh
= docker exec -it web /bin/sh
= docker exec -ti web sh
E> -i 保持 stdin、-t 配置終端機。
</script>
<script type="text/plain" class="sa-src" data-ch="docker2">
@CH docker2 | Docker 進階：Dockerfile、網路、Compose | 🐋 | Docker_Advanced.pdf

@CARD docker2.dockerfile | Dockerfile 常用指令
A> Dockerfile 是「蓋 image 的食譜」：FROM 是買哪一款半成品，RUN 是加工步驟，COPY 把自家食材放進去，WORKDIR 是在哪個工作台做事，ENV 是貼在容器裡的便條，CMD / ENTRYPOINT 是「上桌時要怎麼吃」。
B> 別人做好的 image 常常不夠用（要多裝套件、特定設定）→ 用 **Dockerfile** 自己 build image
B> **FROM <image>**：基底 image
B> **RUN <command>**：在 build 時於容器中執行指令（每個 RUN 產生一層 layer）
B> **COPY <host path> <container path>**：把 host 的檔案或目錄複製進 image
B> **WORKDIR <path>**：之後指令的工作目錄（容器裡的 pwd）
B> **CMD [...]**：預設啟動指令；**ENTRYPOINT [...]**：容器的主要指令；**ENV <key>=<value>**：容器內的環境變數
X> FROM python:3.13-bookworm
X> RUN apt-get update
X> RUN apt-get install -y curl vim git build-essential net-tools
X> COPY . .
X> RUN pip install --no-cache-dir -r requirements.txt
X> CMD ["python", "main.py"]
?mt 配對 Dockerfile 指令：
> FROM :: 指定基底 image
> RUN :: build 時執行指令並產生新 layer
> COPY :: 把 host 檔案複製進 image
> WORKDIR :: 設定之後指令的工作目錄
> ENV :: 設定容器內的環境變數
E> 投影片 Common instructions。
?mc RUN 和 CMD 的差別？
+ RUN 在 build image 時執行；CMD 是容器啟動時預設執行的指令
- RUN 在容器啟動時執行；CMD 在 build 時執行
- 兩者完全相同，只是寫法不同
- CMD 只能出現在 FROM 之前
E> RUN 的結果會存進 layer；CMD 只是記錄「啟動時要做什麼」。
?tf Dockerfile 中每一個 RUN 指令都會產生一層新的 layer。
=T
E> 所以合併 RUN 可以減少 layer。

@CARD docker2.build | docker build 與 .dockerignore
A> docker build 會把整個資料夾（build context）打包送給 Docker daemon 去煮。.dockerignore 是「不要放進鍋子的東西清單」：node_modules、build 快取、.git 這些不該進 image 的都寫進去，image 會小很多、也比較安全。
B> 用法：**docker build <Dockerfile 所在目錄>**（通常是 docker build .）
B> **-t <name>[:<tag>]**：指定 image 名稱與 tag；**-f** 指定 Dockerfile 路徑
B> 傳給 docker build 的目錄稱為 **build context**，COPY 只能複製 context 內的檔案
B> **COPY . .** 容易把不需要的東西（node_modules、build cache）複製進去
B> **.dockerignore**：排除這些檔案 → **減少 image 大小**（也避免把 .env、金鑰包進 image）
X> $ docker build -t myapp:1.0 .
X> $ cat .dockerignore
X> node_modules
X> .git
X> build/
X> .env
?cmd 用目前目錄的 Dockerfile 建立名為 myapp、tag 為 1.0 的 image：
= docker build -t myapp:1.0 .
= docker build . -t myapp:1.0
= docker build --tag myapp:1.0 .
E> 最後的 . 是 build context。
?mc .dockerignore 的主要作用是？
+ 讓 COPY 不會把不需要的檔案複製進 image，縮小 image
- 讓 docker 忽略 Dockerfile 中的某些指令
- 指定哪些 container 不要自動重啟
- 列出 docker pull 時要略過的 layer
E> 投影片：prevent you from copying these files to container and reduce the size of image。
?tf Dockerfile 中的 COPY 可以複製 build context 以外的檔案，例如 COPY ../common /app/common。
=F
E> 只能存取 context 內的檔案；要用上層目錄就得把 context 設成上層（compose 的 build.context）。

@CARD docker2.entrypoint | CMD vs ENTRYPOINT
A> ENTRYPOINT 是「這台機器的固定用途」（例如永遠是 echo），CMD 是「預設的參數」（預設說 Hello world!）。docker run 後面接的東西會換掉 CMD，但換不掉 ENTRYPOINT，除非用 --entrypoint 硬改。
B> 兩者都定義容器**啟動時要做什麼**
B> **CMD**：提供「預設」指令，**可以被 docker run <command> 覆寫**
B> **ENTRYPOINT**：**不能**被 docker run <command> 覆寫（比較像強制執行），但可用 **docker run --entrypoint** 覆寫
B> 兩者都有時：**CMD 變成 ENTRYPOINT 的參數**（ENTRYPOINT ["echo"] + CMD ["Hello world!"] → echo Hello world!）
B> 常見寫法：寫 entrypoint.sh 做初始化，**ENTRYPOINT ["./entrypoint.sh"]**，腳本最後用 exec "$@" 執行 CMD
B> 用 JSON 陣列（exec form）時不經過 shell，程式是 PID 1、能直接收到 SIGTERM
X> ENTRYPOINT ["echo"]
X> CMD ["Hello world!"]
X> $ docker run img            # Hello world!
X> $ docker run img bye        # bye   （覆寫 CMD）
?mc image 中有 ENTRYPOINT ["echo"] 與 CMD ["Hello world!"]，執行 docker run img hi 會輸出？
+ hi
- Hello world!
- echo hi
- Hello world! hi
E> docker run 後面的參數取代 CMD，再交給 ENTRYPOINT：echo hi。
?mt 配對：
> CMD :: 預設指令，docker run <command> 可覆寫
> ENTRYPOINT :: 主要指令，需 --entrypoint 才能覆寫
> 兩者都有 :: CMD 成為 ENTRYPOINT 的參數
E> 投影片 CMD vs. ENTRYPOINT。
?cmd 不管 image 的 ENTRYPOINT，改用 bash 進入 myimg 的互動式容器：
= docker run -it --entrypoint bash myimg
= docker run --rm -it --entrypoint bash myimg
= docker run -it --entrypoint /bin/bash myimg
= docker run --rm -it --entrypoint /bin/bash myimg
E> debug 自訂 image 時很常用。
?tf ENTRYPOINT 可以被 docker run <command> 直接覆寫。
=F
E> docker run 後面的參數只會取代 CMD；要換 ENTRYPOINT 得用 --entrypoint。

@CARD docker2.arg | Build args：ARG 與 --build-arg
A> ARG 是「下單時才填的選項」（例如要哪個版本），只在煮的過程（build）中有用；ENV 是「貼在成品上的標籤」，容器跑起來後還看得到。
B> build 時可以傳參數給 Dockerfile：Dockerfile 寫 **ARG MY_VAR**，build 時 **docker build --build-arg MY_VAR=hello**
B> 在 Dockerfile 中用 **${MY_VAR}** 取用
B> **ARG 只在 build 階段存在**；容器執行時要用的變數用 **ENV**
B> 不要用 ARG 傳密碼：會留在 image 的 history 中
X> ARG MY_VAR
X> RUN echo ${MY_VAR} > /tmp/my_file
X> $ docker build --build-arg MY_VAR=hello -t demo .
?cmd build 目前目錄時把 build arg VERSION 設為 1.2.3：
= docker build --build-arg VERSION=1.2.3 .
= docker build . --build-arg VERSION=1.2.3
E> Dockerfile 裡要先宣告 ARG VERSION，才能用 ${VERSION} 取用。
?mc ARG 與 ENV 的差別？
+ ARG 只在 build 時可用；ENV 會保留在 image 中，容器執行時也看得到
- ARG 在容器執行時可用；ENV 只在 build 時可用
- 兩者完全相同
- ARG 只能是數字
E> 容器裡的程式要讀的設定用 ENV（或 docker run -e）。
?tf 用 ARG 傳入的 API token 不會出現在 image 的任何地方，所以很安全。
=F
E> 可能留在 docker history 或 layer 中；秘密應在執行時以 secrets / 環境變數傳入。

@CARD docker2.cache | Layer cache 與指令順序
A> build cache 像「存檔點」：某一行和它用到的檔案沒變，就直接讀檔不重做。但只要某一行變了，它之後的所有存檔點都作廢。所以要把「很少變又很花時間」的步驟（裝套件）放前面，「常常變」的（複製程式碼）放後面。
B> Dockerfile 與相關檔案沒變 → 已建好的 layer 會被**快取**，rebuild 只重做有變動的層
B> **某一層改變 → 它之後的所有層都要重做**
B> 問題：先 **COPY . .** 再 **RUN pip install** → 只要改任何程式碼，pip install 也要重跑
B> 解法：**先只 COPY requirements.txt → RUN pip install → 再 COPY . .**
B> 原則：**耗時的指令放在常變動的指令之前**；同理 Node.js 先複製 package.json 再 npm install、C++ 先複製 conanfile.txt 再 conan install
X> COPY requirements.txt .
X> RUN pip install -r requirements.txt
X> COPY . .
X> CMD ["python", "main.py"]
?ord 排出「改程式碼時不用重跑 pip install」的 Dockerfile 順序：
> FROM python:3.13-slim-bookworm
> COPY requirements.txt .
> RUN pip install -r requirements.txt
> COPY . .
> CMD ["python", "main.py"]
E> requirements.txt 沒變，pip install 那層就能沿用快取。
?mc Dockerfile 是 COPY . . 然後 RUN pip install -r requirements.txt。只修改 main.py 後重新 build，會發生什麼？
+ COPY . . 那層失效，之後的 pip install 也要重跑
- 只有 main.py 被重新複製，pip install 用快取
- 全部從 FROM 開始重做
- 什麼都不會重做，因為 requirements.txt 沒變
E> 投影片 Utilize Cache to Save Build Time。
?tf 某一層 layer 改變後，它之後的 layer 仍然可以全部使用快取。
=F
E> if a layer is modified, the layers after it require re-build。
?sa 某 Node.js 專案的 Dockerfile 為：FROM node:22 / WORKDIR /app / COPY . . / RUN npm install / CMD ["node","server.js"]。開發時每次改一行程式就要等 npm install 幾分鐘。請說明原因並改寫 Dockerfile。
R> 原因：Docker 以 layer 為單位快取，COPY . . 會複製所有原始碼，只要任何檔案變動該層就失效，其後的 RUN npm install 也必須重做，即使相依套件（package.json）根本沒變。
R> 改寫：FROM node:22 / WORKDIR /app / COPY package.json package-lock.json ./ / RUN npm install（或 npm ci）/ COPY . . / CMD ["node","server.js"]。
R> 這樣只有 package.json 或 lock 檔改變時才重跑 npm install；改程式碼只會讓最後的 COPY . . 失效。另外應在 .dockerignore 排除 node_modules，避免把 host 的 node_modules 複製進去蓋掉。
P> 指出 layer cache：某層變動後其後各層都要重做
P> 先只 COPY package.json（與 lock 檔）再 npm install
P> 最後才 COPY . .
P> （加分）.dockerignore 排除 node_modules

@CARD docker2.size | 縮小 image：層數、slim、alpine
A> 縮小 image 四招：不帶多餘行李（.dockerignore）、把多次打包合成一次（合併 RUN）、選輕量的底座（slim / alpine）、分成「工廠」與「成品」兩階段（multi-stage）。
B> TL;DR：**不要複製不必要的檔案**（.dockerignore）、**減少 layer 數**、**用 slim 或 Alpine image**、**multi-stage build**
B> 合併 RUN：RUN apt update && apt install -y vim tmux git python3（**注意：可能讓快取更容易失效**）
B> python image 大小：**3.13.5-bookworm 366.1 MB**、**3.13.5-slim-bookworm 43.43 MB**、**3.13.5-alpine3.22 16.07 MB**
B> slim 會少一些套件 → 可能有相容問題：Debian slim **沒裝 iproute2**；Alpine 用 **musl libc** 而不是 glibc
B> 另一個常用技巧：同一個 RUN 裡清掉 apt 快取（rm -rf /var/lib/apt/lists/*），分開寫的話舊層仍保留那些檔案
?mc 為什麼「RUN apt-get install … 」和「RUN rm -rf /var/lib/apt/lists/*」分成兩行寫，image 並不會變小？
+ 前一層已經把檔案存進 layer，後一層刪除只是加上「刪除標記」，舊層仍在 image 中
- 因為 rm 在 build 時不會執行
- 因為 /var/lib/apt/lists 是 volume
- 因為 Docker 會自動還原被刪除的檔案
E> 要在同一個 RUN 中安裝並清理，才不會留在任何一層。
?mc 改用 Alpine 為基底的 image，可能遇到什麼相容性問題？
+ Alpine 使用 musl libc 而非 glibc，部分依賴 glibc 的程式或 wheel 無法直接執行
- Alpine 沒有 shell
- Alpine 不能執行 Python
- Alpine image 無法使用 COPY 指令
E> 投影片：Alpine-based image uses MUSL libs, instead of common glibc。
?tf 合併多個 RUN 指令可以減少 layer 數，但可能讓 build cache 更容易失效。
=T
E> 合在一起的 RUN 中任何一部分改變，整層都要重做。
?mt 配對 python image 與大小（投影片數據）：
> 3.13.5-bookworm :: 366.1 MB
> 3.13.5-slim-bookworm :: 43.43 MB
> 3.13.5-alpine3.22 :: 16.07 MB
E> slim 比完整版小很多，但會少一些套件；alpine 最小，但用 musl libc。

@CARD docker2.multistage | Multi-stage build
A> 編譯程式需要一整間「工廠」（gcc、cmake、各種 -dev 套件），但跑程式只需要「成品」加上少數零件。multi-stage 就是在第一個 stage 蓋工廠做出成品，第二個 stage 只把成品搬到乾淨的小房間，工廠整個丟掉。
B> 情境：C++ 專案在 image 裡裝編譯工具與函式庫、make 出 binary → 結果用 **1GB 的容器跑一個 binary**
B> 執行時其實只需要 **glibc 與 SSL library**
B> 第一個 stage：**FROM … AS builder**，安裝編譯工具並編譯
B> 第二個 stage：乾淨的 FROM，只安裝執行期需要的套件，**COPY --from=builder** 把成品複製過來
B> 最終 image 只包含最後一個 stage 的內容
X> FROM debian:trixie-slim AS builder
X> RUN apt update && apt install -y libssl-dev cmake make gcc ...
X> COPY . .
X> RUN cmake -S . -B build && make -C build -j8
X> FROM debian:trixie-slim
X> RUN apt update && apt install -y libssl-dev
X> COPY --from=builder /app/build/bin/my_app ./my_app
X> CMD ["./my_app"]
?fill 從名為 builder 的 stage 複製檔案：COPY ＿＿ /app/build/bin/my_app ./my_app
= --from=builder
E> --from 可以指定 stage 名稱（AS builder）或其他 image。
?mc multi-stage build 為什麼能縮小 image？
+ 最終 image 只包含最後一個 stage，編譯工具與中間產物留在 builder stage 中不會被帶走
- 它會自動壓縮所有 layer
- 它會刪除所有 RUN 指令
- 它讓多個 container 共用一個 image
E> All we need is merely glibc and the SSL library。
?tf multi-stage build 的最終 image 會包含所有 stage 中安裝的套件。
=F
E> 只有最後一個 stage 的內容會留在最終 image，builder 的編譯工具不會被帶走。

@CARD docker2.netdriver | Docker network：veth、bridge 與 docker0
A> 每個容器有自己的網路空間（namespace），像一間間關起門的房間。veth pair 是一條「兩頭都有插頭的網路線」，一頭插在容器裡（eth0），一頭插在 host 的虛擬交換器 docker0（bridge）上。容器就這樣透過 docker0 互相溝通、再經 NAT 出去。
B> Docker 提供多種 **network driver**；課程重點：**bridge（預設）** 與 **host**
B> **veth**：成對出現的虛擬介面，兩端可以在**不同 namespace** → 跨 namespace 通訊，像一條網路線
B> **bridge**：虛擬介面，像**輕量的虛擬 switch / hub**，可轉送接在上面的介面的封包
B> bridge driver 用 **Linux bridge + veth** 把容器的 network namespace 接到 eth0
B> 容器內：eth0@if69，**172.17.0.2/16**；host：**docker0 172.17.0.1/16**，另一端 veth…@if2 的 **master docker0**
X> # 容器內
X> 2: eth0@if69: ... inet 172.17.0.2/16
X> # host
X> 9: docker0: ... inet 172.17.0.1/16
X> 69: veth7308954@if2: ... master docker0
?mc 預設 bridge 網路下，容器的 eth0 與 host 是怎麼連起來的？
+ 透過一對 veth：一端在容器 namespace 當 eth0，另一端接在 host 的 docker0 bridge 上
- 容器直接使用 host 的 eth0
- 透過 VPN tunnel
- 透過 /var/run/docker.sock
E> 投影片 Docker Network Drivers - Bridge。
?fill 預設 bridge 網路中，host 上 docker0 介面的 IP 通常是 172.17.0.＿＿/16
= 1
E> 它也是容器的 default gateway。
?tf veth 介面總是成對出現，兩端可以位於不同的 network namespace。
=T
E> 可以想成一條網路線的兩端，容器網路就是靠它跨 namespace 連到 host。

@CARD docker2.bridge | 自訂 bridge 網路
A> 預設所有容器都接在同一台 docker0 交換器上，彼此都能連。想讓某些容器自成一區，就建一台新的交換器（docker network create），只把那幾個容器接上去；新交換器還附送「用名字找人」的內建 DNS。
B> 沒有額外設定的容器：使用 **bridge driver**、接到預設 bridge **docker0** → **容器之間可以互相通訊**
B> 不想互通？**docker network create --driver bridge my_bridge** 建立新的 bridge
B> 新 bridge 在 host 上是 **br-<network id>** 介面（例如 172.18.0.1/16），可用 **ip link**、**docker network ls** 查看
B> **docker run --network my_bridge debian bash**：讓容器接到新 bridge
B> 自訂 bridge 有內建 DNS：容器可以用**容器名稱**互相解析（預設 docker0 沒有）
X> $ docker network create --driver bridge my_bridge
X> $ docker network ls
X> NETWORK ID     NAME        DRIVER    SCOPE
X> 30ed72de30c7   my_bridge   bridge    local
X> 295b421f0b83   bridge      bridge    local
X> $ docker run --network my_bridge debian bash
?cmd 建立一個名為 backend、使用 bridge driver 的 Docker 網路：
= docker network create --driver bridge backend
= docker network create -d bridge backend
= docker network create backend
E> bridge 是預設 driver，所以 --driver bridge 可省略。
?cmd 執行一個 debian 容器並接到 my_bridge 網路（互動式 bash）：
= docker run -it --network my_bridge debian bash
= docker run --rm -it --network my_bridge debian bash
= docker run -it --net my_bridge debian bash
E> --network 和 --net 都可以；--rm 讓容器結束後自動刪除。
?mc host 上出現 br-30ed72de30c7 這個介面，代表？
+ 一個自訂的 Docker bridge 網路（network ID 開頭 30ed72de30c7）
- 一個故障的 veth
- Docker 的預設 bridge
- WireGuard 介面
E> 預設 bridge 叫 docker0，自訂的叫 br-<id>。

@CARD docker2.host | host、none、macvlan、ipvlan driver
A> host driver 是「拆掉房間的牆」：容器直接用 host 的網路，沒有隔離，port 也跟 host 搶。none 是「只有一面鏡子的房間」（只有 loopback）。macvlan 讓容器像一台真的實體機有自己的 MAC；ipvlan 則是共用 MAC、各自有 IP。
B> **host**：容器直接綁 host 的 eth0，**沒有網路 stack 隔離**；容器看到的網路與 host 相同
B> host 模式下 **host 用掉的 port 容器不能用，反之亦然**；-p 對 host 模式沒有意義
B> **none**：只有 **loopback** 介面的 network namespace
B> **macvlan**：給容器**自己獨立的 MAC address**，在網路上看起來像實體裝置
B> **ipvlan**：容器**共用一個 MAC address**，但各自有 IP
?mt 配對 network driver：
> bridge :: 預設；Linux bridge + veth，容器間可互通
> host :: 共用 host 網路，沒有隔離
> none :: 只有 loopback
> macvlan :: 每個容器有自己的 MAC
> ipvlan :: 共用 MAC、各自有 IP
E> 課程重點是 bridge 與 host；none、macvlan、ipvlan 是補充（FYR）。
?mc 用 --network host 執行一個監聽 80 port 的 nginx 容器，而 host 上已經有服務佔用 80，會怎樣？
+ 容器的 nginx 綁定 80 失敗，因為兩者共用同一個網路 stack
- Docker 會自動把容器改到 8080
- 兩者都可以同時監聽 80
- host 的服務會被停止
E> A port used by the host cannot be used by a container at the same time。
?cmd 執行一個完全沒有對外網路（只有 loopback）的 alpine 容器：
= docker run -it --network none alpine sh
= docker run --rm -it --network none alpine sh
= docker run -it --net none alpine sh
E> --network none 的容器只有 lo 介面。

@CARD docker2.compose | Docker Compose 設定檔
A> Compose 是「整桌菜的菜單」：一個 YAML 檔寫好網站（web）、資料庫（db）各要用什麼 image、開哪些 port、設哪些環境變數、資料存哪裡、誰要先上桌，一個指令就把整桌端上來。
B> 用 **YAML 設定檔**定義與管理**多容器**應用（檔名常用 compose.yml / docker-compose.yml）
B> **services:** 底下每個服務：**image** 或 **build**、**ports**、**environment**、**depends_on**、**volumes**、**restart**
B> ports **"5000:5000"** = host:container；只給本機：**"127.0.0.1:8000:8000"**
B> 同一個 compose 的服務可以用**服務名稱**互相連線（例：DB_URL=…@**db**:5432）
B> volumes：**./pgdata:/var/lib/postgresql/data**（bind mount，資料存在 host 目錄，容器刪掉也還在）
X> services:
X>   web:
X>     build: ./app
X>     ports:
X>       - "5000:5000"
X>     environment:
X>       - DB_URL=postgresql://postgres:postgres@db:5432/my_app
X>     depends_on:
X>       - db
X>   db:
X>     image: postgres:16.9-bookworm
X>     restart: always
X>     volumes:
X>       - ./pgdata:/var/lib/postgresql/data
?mc 上面的 compose 檔中，web 的 DB_URL 用 db:5432 連資料庫，db 這個名稱是怎麼解析的？
+ Compose 建立的網路有內建 DNS，服務名稱 db 會解析成 db 容器的 IP
- 要手動寫進 host 的 /etc/hosts
- db 是 PostgreSQL 的保留字
- 透過 docker0 的 DHCP
E> They can communicate with each other by IP addresses or by domain name (the service name)。
?mc ports 寫 "127.0.0.1:8100:8080" 的意思是？
+ 只在 host 的 127.0.0.1:8100 監聽，轉到容器的 8080；外部機器連不到
- 容器監聽 127.0.0.1:8100
- 對所有介面開放 8100 與 8080
- 只允許容器 8100 連到 host 8080
E> HW3 要求除了 PostgreSQL 外的 port 都只綁 127.0.0.1，由 host 的 NGINX 對外。
?tf ports 只寫 "5432:5432" 時，Docker 會在 host 的所有介面（0.0.0.0）開放 5432。
=T
E> 而且 Docker 會自行加 iptables 規則，可能繞過你以為的防火牆，所以內部服務要明確綁 127.0.0.1。

@CARD docker2.composecmd | docker compose 指令
A> compose 指令就是 docker 指令的「整桌版」：up 是把整桌菜依菜單端上來（菜單改了就重做那道），down 是整桌收掉（桌子、網路一起收，但冰箱裡的 volume 預設留著）。
B> **docker compose up -d**：啟動，YAML 改變時重建對應容器（-d 背景執行）
B> **docker compose down**：**移除所有容器與網路**（named volume 預設保留，加 **-v** 才會刪）
B> **docker compose start / restart / stop [<service>]**：啟動 / 重啟 / 停止（不刪容器）
B> 多數 docker 指令都有 compose 版本：**docker compose logs**、ps、exec、pull、build
B> **-f**：指定 compose 檔位置
X> $ docker compose -f /home/judge/hw3/compose.yml up -d
X> $ docker compose logs -f web
X> $ docker compose exec db psql -U postgres
?mt 配對 docker compose 指令：
> up -d :: 在背景啟動（或依新設定重建）所有服務
> down :: 移除所有容器與網路
> stop :: 停止容器但不刪除
> logs :: 查看服務輸出
> -f :: 指定 compose 檔的位置
E> down 會刪除容器與網路；stop 只停止不刪除。
?cmd 在背景啟動目前目錄 compose 檔的所有服務：
= docker compose up -d
= docker compose up --detach
E> -d（--detach）讓服務在背景執行，不佔用終端機。
?mc 執行 docker compose down 之後再 up -d，下列哪種資料一定還在？
+ bind mount 到 host 目錄（如 ./pgdata）的資料
- 容器內 /tmp 的檔案
- 容器可寫層（沒有掛 volume 的路徑）中的資料
- 執行中 process 的記憶體內容
E> down 會刪容器（可寫層一起消失）；bind mount 與 named volume（沒加 -v）會保留。HW3 要求 down + up 後服務仍能恢復。
?cmd 持續追蹤 compose 中 web 服務的 log：
= docker compose logs -f web
= docker compose logs --follow web
= docker compose logs web -f
E> -f 持續追蹤；--tail N 只顯示最後 N 行。

@CARD docker2.composebuild | Compose 的 image 與 build
A> image 是「直接買現成的」，build 是「照食譜自己做」。build.context 是「廚房範圍」：COPY 只能拿廚房裡的食材，所以要用上層目錄的共用程式，就得把廚房設在上層，再用 dockerfile 指出食譜放哪。
B> **image**：要啟動的 image
B> **build.context**：Docker build context（大多是 Dockerfile 所在目錄）
B> **build.dockerfile**：Dockerfile 的位置（是**檔案**，不是目錄）
B> **build.args**：build args（對應 ARG）
B> 若 backend 的 Dockerfile 要 COPY ../common /app/common → **context 設為上層目錄**、**dockerfile 設為 backend/Dockerfile**，否則 COPY 會失敗
B> **image 與 build 同時存在**時，image 代表 build 出來的 image 名稱
X> services:
X>   backend:
X>     build:
X>       context: .
X>       dockerfile: backend/Dockerfile
X>       args:
X>         - MY_VAR=hello
X>     image: registry.example.com/backend:1.0
?mc backend/Dockerfile 需要 COPY common/ /app/common/（common 與 backend 同層）。compose 應該怎麼設定？
+ context 設為兩者的上層目錄，dockerfile: backend/Dockerfile，Dockerfile 裡寫 COPY common/ …
- context: backend，Dockerfile 裡寫 COPY ../common /app/common
- 只要把 common 加進 .dockerignore 的例外
- 改用 volumes 掛載就好，不需改 build
E> build context 外的檔案 COPY 不到。
?tf compose 中同時寫 image 與 build 時，image 欄位會被忽略。
=F
E> image 會成為 build 出來的 image 名稱（之後也可 push）。

@CARD docker2.depends | depends_on 與 healthcheck
A> depends_on 只是「排隊順序」：資料庫的容器先開門，網站再開門，但不保證資料庫已經準備好接客。加上 condition: service_healthy，就變成「等資料庫的健康檢查通過才開網站」。
B> **depends_on** 只寫服務名稱 → 讓依賴**先啟動**，**不檢查依賴是否失敗或就緒**
B> condition：**service_started**（同上）、**service_completed_successfully**（exit code 必須 0）、**service_healthy**（health check 必須通過）
B> **healthcheck**：**CMD**（直接 exec，推薦）或 **CMD-SHELL**（經過 shell，可用 && 等）
B> 選項：**test、interval、timeout、retries、start_period**（啟動期間失敗不算）、**start_interval**（啟動期間的檢查間隔）
B> 也可寫在 Dockerfile（**HEALTHCHECK**）或 docker run（--health-cmd、--health-interval…）；docker ps 會顯示 (healthy)
X>   web:
X>     depends_on:
X>       db:
X>         condition: service_healthy
X>   db:
X>     healthcheck:
X>       test: ["CMD", "pg_isready", "-U", "user"]
X>       interval: 10s
X>       timeout: 5s
X>       retries: 5
?mc web 寫了 depends_on: [db]（只有名稱）。PostgreSQL 容器啟動但還在初始化時，web 會？
+ 照樣被啟動，可能因為資料庫還沒準備好而連線失敗
- 等到 PostgreSQL 可以接受連線才啟動
- 永遠不會被啟動
- 自動重試直到成功
E> 只有名稱時 No checks for container failure；要等就緒用 condition: service_healthy。
?mt 配對 depends_on condition：
> service_started :: 依賴啟動即可
> service_healthy :: 依賴的 health check 必須通過
> service_completed_successfully :: 依賴必須以 exit code 0 結束
E> 最後一種適合「先跑 migration 再啟動 app」。
?mc healthcheck 的 test 用 CMD 與 CMD-SHELL 的差別？
+ CMD 直接 exec 指令；CMD-SHELL 交給 shell 執行，可以用 &&、| 等 shell 功能
- CMD 只能檢查 HTTP；CMD-SHELL 可以檢查任何東西
- CMD-SHELL 比較安全，所以是推薦的寫法
- 兩者完全相同
E> 投影片：In most of cases, CMD is recommended。
?mt 配對 healthcheck 選項：
> interval :: 多久檢查一次
> timeout :: 單次檢查的逾時
> retries :: 允許連續失敗幾次才判定 unhealthy
> start_period :: 啟動初期，失敗不計入
E> start_interval 則是 start_period 期間的檢查間隔。
?fill Dockerfile 中宣告健康檢查的指令是＿＿
= HEALTHCHECK
E> 例：HEALTHCHECK --interval=10s --timeout=5s CMD pg_isready -U user。

@CARD docker2.restart | Restart policy：no、on-failure、always、unless-stopped
A> 重啟策略是「容器倒下要不要扶起來」。always 和 unless-stopped 平常一樣都會扶，差別在「你親手關掉的容器，Docker daemon 重開後要不要再把它叫起來」：always 會，unless-stopped 尊重你的決定。
B> **no**：不重啟（**預設**）
B> **on-failure**：**exit code 非 0** 時重啟
B> **always**：停止就重啟（手動 stop 除外）；**Docker daemon 重啟後連手動停掉的也會被啟動**
B> **unless-stopped**：停止就重啟（手動 stop 除外）；daemon 重啟後**手動停掉的保持停止**
B> Compose：**restart: always**；docker run：**--restart <mode>**
B> 想要「重開機後服務自動回來」：restart: always / unless-stopped，且 **docker.service 有 enable**
?mc 對一個設定 restart: unless-stopped 的容器執行 docker stop，然後重開機（Docker daemon 重啟），容器會？
+ 保持停止
- 自動啟動
- 被刪除
- 變成 paused
E> 若是 always，daemon 重啟後會被啟動。
?mt 配對 restart policy：
> no :: 預設，不自動重啟
> on-failure :: exit code 非 0 才重啟
> always :: daemon 重啟後連手動停的也會啟動
> unless-stopped :: 手動停掉的，daemon 重啟後仍保持停止
E> always 與 unless-stopped 的差別只在 daemon 重啟後，手動停止的容器要不要啟動。
?cmd 執行 nginx 容器（背景），並設定除非手動停止否則永遠自動重啟：
= docker run -d --restart unless-stopped nginx
= docker run -d --restart=unless-stopped nginx
= docker run --restart unless-stopped -d nginx
E> --restart 也接受 no、on-failure、always。
?tf 只要 compose 寫了 restart: always，不需要 enable docker.service，重開機後容器也會自動啟動。
=F
E> 容器靠 Docker daemon 拉起來，daemon 本身要開機自動啟動（Debian 安裝時通常已 enable）。

@CARD docker2.composenet | Compose 網路與 IPAM
A> Compose 預設幫整桌菜準備一台專屬交換器（新的 bridge 網路），大家用服務名稱互叫。需要固定 IP 或指定網段時，才自己寫 networks 區段；但要注意你指定的網段，host 的路由會被 Docker 拿去用。
B> 預設：所有容器使用 **一個新的 bridge 網路**（通常不需要額外設定）
B> 容器間可用 **IP** 或 **服務名稱**（domain name）互相連線
B> 可在 YAML 加 **networks** 區段設定：driver、**ipam.config.subnet / gateway**；服務中用 **ipv4_address** 指定固定 IP
B> **注意：設定的 subnet 路由會被 Docker 拿走**（與既有網段如 WireGuard 192.168.x.x 衝突時要小心）
X> services:
X>   coredns:
X>     image: coredns/coredns
X>     networks:
X>       coredns:
X>         ipv4_address: 192.168.0.2
X> networks:
X>   coredns:
X>     driver: bridge
X>     ipam:
X>       config:
X>         - subnet: 192.168.0.0/16
X>           gateway: 192.168.0.1
?mc compose 中把網路 subnet 設成 192.168.0.0/16，而 VM 的 WireGuard 網段是 192.168.1.0/24，可能發生什麼？
+ Docker 會在 host 加上 192.168.0.0/16 的路由，可能和 WireGuard 網段衝突，導致連不到 VPN 上的機器
- 沒有影響，Docker 網路與 host 路由完全無關
- WireGuard 會自動改用其他網段
- 容器會無法啟動
E> 投影片：The route to configured subnet will be taken by Docker。
?fill compose 中替服務指定固定 IPv4 位址的鍵是＿＿
= ipv4_address
E> 要搭配 networks 區段的 ipam.config.subnet。
?tf Compose 預設會為專案建立一個新的 bridge 網路。
=T
E> 網路名稱通常是 <專案名>_default，服務可以用名稱互相解析。

@CARD docker2.prune | 清理未使用的資源：prune
A> Docker 不會主動丟垃圾：沒人用的 image、volume、網路會一直堆著。prune 是「大掃除」，-a 是「連看起來還能用、但沒人用的也一起丟」。
B> 預設：**沒有容器使用的資源也不會被刪除**
B> **docker <resource> prune**：docker volume / network / image / container prune
B> **docker system prune**：一次清全部（預設不含 volume，要加 --volumes）
B> **-a**：清得更多：**docker image prune** 只刪 **dangling image**（沒有 tag 的），**-a** 刪除**所有沒有容器使用**的 image
?mc docker image prune 與 docker image prune -a 的差別？
+ 前者只刪 dangling（無 tag）image；-a 刪除所有沒有被任何容器使用的 image
- 前者刪全部 image；-a 只刪 dangling
- -a 會連執行中的容器一起刪
- 兩者相同
E> dangling image 指的是沒有任何 tag 的 image（常是 rebuild 後留下的舊層）。
?cmd 刪除所有沒有被使用的 Docker volume：
= docker volume prune
= docker volume prune -f
E> 小心：資料庫資料若在 named volume 且容器已刪，會被一起清掉。
?cmd 一次清除停止的容器、未使用的網路、dangling image 與 build cache：
= docker system prune
= docker system prune -f
E> 預設不刪 volume，要加 --volumes；加 -a 會刪掉所有沒有容器使用的 image。

@CARD docker2.p_debug | 實作：Compose 服務起不來怎麼查
A> Compose 出問題時依序問：設定檔解析得對嗎（config）？容器在不在、狀態是什麼（ps）？它說了什麼（logs）？能不能進去看（exec）？網路與名稱解析通不通？
B> 檢查合併後的設定：**docker compose config**（YAML 錯誤、變數替換結果）
B> 狀態：**docker compose ps -a**（Exit code、health 狀態）；log：**docker compose logs --tail 50 <svc>**
B> 進容器：**docker compose exec <svc> sh**；容器起不來就用 **docker compose run --rm --entrypoint sh <svc>**
B> 網路：**docker network inspect <proj>_default**、在容器內 getent hosts db 測名稱解析
B> 常見原因：port 已被佔用（host 上 **ss -tlnp**）、容器裡的程式只聽 **127.0.0.1**（從外面連不到，要聽 0.0.0.0）、volume 權限（UID 不同）、環境變數沒進去、image 沒重 build（**up -d --build**）
X> $ docker compose config
X> $ docker compose ps -a
X> $ docker compose logs --tail 50 web
X> $ docker compose up -d --build
?mc 容器內的 Web 程式監聽 127.0.0.1:8000，compose 也寫了 ports: "8000:8000"，但 host 上 curl localhost:8000 連不到。原因？
+ 容器內的程式只聽容器自己的 loopback，從 veth 進來的連線到不了；應改為監聽 0.0.0.0
- host 的 docker0 沒有啟動
- 需要改用 --network none
- ports 的寫法要倒過來
E> port mapping 是把流量轉到容器的 eth0，容器裡的程式要在該介面上監聽。
?cmd 顯示 compose 檔解析與變數替換後的最終設定：
= docker compose config
E> YAML 寫錯、變數沒替換、縮排問題都能從這裡看出來。
?cmd 修改 Dockerfile 後，重新 build 並在背景啟動所有服務：
= docker compose up -d --build
= docker compose up --build -d
E> 只有 up -d 不會重新 build 已存在的 image。

@CARD docker2.p_pid1 | 實作：exec form、PID 1 與 docker stop
A> 容器裡的第一個 process 是 PID 1，它要負責「接電話」（收 SIGTERM）和「收屍」（回收 zombie）。用 shell form 寫 CMD 時，PID 1 是 /bin/sh，它不會把 SIGTERM 轉給你的程式，於是 docker stop 只好等 10 秒後硬拔插頭（SIGKILL）。
B> **exec form**：CMD ["python","main.py"] → 程式本身是 **PID 1**，直接收到訊號
B> **shell form**：CMD python main.py → 實際是 **/bin/sh -c "python main.py"**，PID 1 是 sh，**SIGTERM 不一定傳給程式**
B> **docker stop**：送 **SIGTERM**（或 STOPSIGNAL 指定的訊號），等 **10 秒**（-t / stop_grace_period）後送 **SIGKILL**
B> entrypoint.sh 最後用 **exec "$@"**：讓 CMD 取代 shell 成為 PID 1
B> PID 1 預設不會處理沒寫 handler 的 SIGTERM，也要負責回收 zombie → 用 **docker run --init**（tini）或 compose 的 **init: true**
X> #!/bin/sh
X> # entrypoint.sh
X> set -e
X> mkdir -p /data/cache
X> exec "$@"
?mc 容器用 CMD python app.py（shell form），docker stop 總要等 10 秒才結束。原因？
+ PID 1 是 /bin/sh，SIGTERM 沒有傳給 python，10 秒後被 SIGKILL
- python 不支援 SIGTERM
- docker stop 本來就固定等 10 秒
- 容器沒有設定 healthcheck
E> 改成 exec form：CMD ["python", "app.py"]，或加 --init。
?fill entrypoint.sh 的最後一行，讓 CMD 取代 shell 成為 PID 1：＿＿ "$@"
= exec
E> exec 會把目前的 shell process 換成指定的程式，所以程式繼承 PID 1，可以直接收到 docker stop 的訊號。
?cmd 執行 myimg 容器時加上一個小型 init process 負責轉送訊號與回收 zombie：
= docker run --init myimg
= docker run --rm --init myimg
= docker run -d --init myimg
E> Compose 中寫 init: true。
?tf docker stop 會先送 SIGTERM，逾時後才送 SIGKILL。
=T
E> 逾時預設 10 秒，可用 docker stop -t 30 或 stop_grace_period 調整。

@CARD docker2.p_more | 實作：其他 Dockerfile 指令
A> 除了常用的幾個，Dockerfile 還有幾個「說明書欄位」與「安全開關」：EXPOSE 只是在說明書寫「我會用這個 port」（不會真的開）；USER 讓程式不要用 root 跑；VOLUME 標示「這裡放資料」；ADD 是會自動解壓縮、能抓網址的 COPY，但通常用 COPY 比較可預期。
B> **EXPOSE 8000**：**只是文件說明**，不會發布 port；要 -p 或 compose ports 才會對外
B> **USER app**：之後的 RUN / CMD 以非 root 執行（降低被攻破時的權限）；搭配 RUN useradd
B> **COPY --chown=app:app src/ /app/**：複製時設定擁有者
B> **ADD**：類似 COPY，但會**自動解壓本地 tar**、可下載 URL → 一般用 **COPY**
B> **VOLUME /data**：宣告資料目錄（沒指定時會自動建立匿名 volume）；**LABEL**：metadata；**STOPSIGNAL**；**SHELL**；**HEALTHCHECK**
B> Debian 新版的 pip 預設禁止裝進系統 Python（PEP 668），投影片用 **pip install --break-system-packages**；更好的作法是 venv 或用 python 官方 image
?mc Dockerfile 寫了 EXPOSE 8080，docker run 時沒有加 -p，從 host 能用 localhost:8080 連到嗎？
+ 不能，EXPOSE 只是說明，要用 -p 8080:8080 才會發布
- 能，EXPOSE 會自動發布 port
- 只有 root 可以
- 只能從另一台機器連
E> EXPOSE 的用途是文件，以及 docker run -P 時決定要發布哪些 port。
?mt 配對 Dockerfile 指令：
> EXPOSE :: 說明容器會使用的 port（不會真的發布）
> USER :: 之後的指令以指定使用者執行
> VOLUME :: 宣告資料存放位置
> ADD :: 類似 COPY，還會自動解壓 tar、可下載 URL
> LABEL :: 加上 metadata
E> EXPOSE、LABEL 屬於 metadata；USER、VOLUME 會影響執行時的行為。
?mc 為什麼建議在 Dockerfile 用 USER 切換成非 root？
+ 容器被攻破時，攻擊者拿到的不是 root，能做的事更少（尤其容器逃逸時）
- 非 root 執行比較快
- Docker 不允許 root 執行 CMD
- 為了讓 COPY 可以運作
E> 容器內的 root 與 host 的 root 預設是同一個 UID 0。

@CARD docker2.p_registry | 實作：image 命名、registry 與私有 CA
A> image 的全名像「國家/城市/街道/門牌」：registry 主機/命名空間/repo:tag。沒寫主機就是 Docker Hub。推到自己的 registry 前要先 docker tag 成那個全名、docker login，而且 Docker 要信任該 registry 的憑證。
B> 完整名稱：**[registry/][namespace/]repo[:tag][@sha256:digest]**；沒寫 registry → docker.io；沒寫 tag → **latest**
B> 推送流程：**docker tag 本地名 registry/ns/repo:tag** → **docker login registry** → **docker push**
B> **tag 可以被覆蓋**，**digest（@sha256:…）固定不變** → 要可重現就用 digest 或明確版本，不要依賴 latest
B> 私有 CA 簽的 registry：把 CA 放到 **/etc/docker/certs.d/<registry 主機>/ca.crt**（或加入系統信任後重啟 docker），否則出現 **x509: certificate signed by unknown authority**
B> 帳密存在 **~/.docker/config.json**（可用 credential helper）
X> docker tag lmsp:dev git.19.cs.nycu/hw3/llm-sandbox-platform:v1.0.0
X> docker login git.19.cs.nycu
X> docker push git.19.cs.nycu/hw3/llm-sandbox-platform:v1.0.0
X> sudo mkdir -p /etc/docker/certs.d/git.19.cs.nycu && sudo cp root.crt /etc/docker/certs.d/git.19.cs.nycu/ca.crt
?mc docker pull nginx 實際上拉的是哪個 image？
+ docker.io/library/nginx:latest
- 本機 /var/lib/docker 中的 nginx
- nginx 官網提供的 tar 檔
- registry.ta.cs.nycu/nginx
E> 省略 registry 是 Docker Hub、官方 image 在 library 命名空間、省略 tag 是 latest。
?mc 為什麼在正式環境不建議用 :latest？
+ latest 只是一個可以被覆蓋的 tag，不同時間拉到的可能是不同 image，無法重現也難以回滾
- latest 一定是測試版
- latest 不能 push
- latest 會停用 layer cache
E> HW3 的 CI/CD 用版本 tag（v1.2.3）部署正是這個道理。
?fill 讓 Docker 信任 registry git.19.cs.nycu 的私有 CA：把 CA 放到 /etc/docker/certs.d/git.19.cs.nycu/＿＿
= ca.crt
E> 目錄名稱要和 registry 主機名稱（含 port）完全一致。
?mc docker push 出現 x509: certificate signed by unknown authority，最可能的原因？
+ Docker daemon 不信任簽發 registry 憑證的 CA
- 帳號密碼錯誤
- image 太大
- tag 名稱有大寫字母
E> 帳密錯誤會是 unauthorized；x509 錯誤一定跟憑證信任有關。

@CARD docker2.p_inspect | 實作：inspect、history、stats 等觀察工具
A> 容器是黑盒子時，這些指令是「透視鏡」：inspect 看全部設定與狀態（IP、掛載、重啟次數、是不是被 OOM 殺掉）；history 看 image 每一層多大；stats 看即時資源；system df 看 Docker 吃掉多少硬碟。
B> **docker inspect 容器**：JSON 格式的完整資訊；**-f '{{.State.Status}}'**、**'{{.NetworkSettings.Networks}}'**、**'{{.State.OOMKilled}}'**、**'{{.RestartCount}}'**、**'{{json .Mounts}}'**
B> **docker image history image**：每一層由哪個指令產生、多大 → 找出肥大的層
B> **docker stats**：即時 CPU / 記憶體 / 網路 / I/O；**docker top 容器**：容器內的 process
B> **docker system df**：image、容器、volume、build cache 佔用空間
B> **docker cp 容器:路徑 本機路徑**：複製檔案進出；**docker diff 容器**：看容器可寫層改了哪些檔案
X> docker inspect -f '{{.State.OOMKilled}} {{.RestartCount}}' web
X> docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' web
X> docker image history myapp:1.0
X> docker system df
?cmd 查看 myapp:1.0 這個 image 每一層的大小與產生它的指令：
= docker image history myapp:1.0
= docker history myapp:1.0
E> 常用來找出哪個 RUN 讓 image 變肥。
?mc 容器一直重啟，想確認是不是因為超過記憶體限制被殺，最直接的是？
+ docker inspect -f '{{.State.OOMKilled}}' 容器
- docker image history
- docker network ls
- docker system df
E> 也可看 dmesg / journalctl -k 的 OOM 訊息。
?cmd 從容器 web 把 /etc/nginx/nginx.conf 複製到目前目錄：
= docker cp web:/etc/nginx/nginx.conf .
= docker cp web:/etc/nginx/nginx.conf ./
= docker container cp web:/etc/nginx/nginx.conf .
E> 反方向是 docker cp ./file web:/path。
?cmd 查看 Docker 的 image、容器、volume、build cache 各佔用多少空間：
= docker system df
= docker system df -v
E> -v 會列出每個 image、容器、volume 的明細。

@CARD docker2.p_limits | 實作：容器的資源限制（就是 cgroups）
A> Docker 的資源限制和 systemd 的 MemoryMax 是同一套東西：都是寫 cgroup 檔案。--memory 就是 memory.max，--cpus 就是 cpu.max，--pids-limit 就是 pids.max。超過記憶體上限一樣會被 OOM kill。
B> **--memory 512m**（memory.max）、**--memory-reservation**、**--cpus 1.5**（cpu.max）、**--cpu-shares**（相對權重）、**--pids-limit 100**（pids.max，防 fork bomb）
B> Compose：**mem_limit / cpus / pids_limit**，或 **deploy.resources.limits**
B> 超過記憶體上限 → **OOM kill**，inspect 中 **OOMKilled: true**，exit code **137**（128+9）
B> 查看：**docker stats**；容器的 cgroup 也在 /sys/fs/cgroup/system.slice/docker-<id>.scope/
X> docker run -d --memory 256m --cpus 0.5 --pids-limit 200 nginx
X> # compose
X>   sandbox:
X>     mem_limit: 512m
X>     cpus: 1.0
X>     pids_limit: 256
?mt 配對 docker run 選項與 cgroup 檔案：
> --memory :: memory.max
> --cpus :: cpu.max
> --pids-limit :: pids.max
> --cpu-shares :: cpu.weight（相對權重）
E> 跟 systemd 章節的 MemoryMax=、CPUQuota=、TasksMax= 是同一組機制。
?fill 容器因為記憶體超過上限被 OOM kill（SIGKILL），exit code 通常是＿＿
= 137
E> 128 + 9（SIGKILL）。
?mc HW3 的 sandbox 讓 AI agent 以 root 執行任意指令。為什麼建立容器時應該加 --pids-limit？
+ 防止 fork bomb 耗盡整台主機的 process 數
- 讓 agent 跑得更快
- 為了讓 docker exec 可以運作
- Docker 規定一定要設
E> 搭配 --memory、--cpus，避免單一 sandbox 拖垮 VM。

@CARD docker2.p_sock | 實作：docker.sock 等於 root
A> /var/run/docker.sock 是 Docker 的「萬能遙控器」：能控制 daemon，就能開一個把 host 根目錄掛進來的特權容器，等於拿到 host 的 root。所以把它掛進容器、或把人加進 docker 群組，都要當成「給 root」來看待。
B> 能存取 **/var/run/docker.sock** = 能叫 dockerd（以 root 執行）做任何事 → **等同 host root**
B> 例：docker run -v /:/host --privileged … → 直接改 host 檔案
B> **docker 群組**的成員一樣等同 root
B> HW3 的平台要掛 docker.sock 來管理 sandbox → 平台本身必須可信，**sandbox 絕對不能**拿到 docker.sock
B> **DinD**（Docker-in-Docker）：容器裡跑一個獨立的 dockerd（需要 --privileged）；**DooD**：掛 host 的 docker.sock（共用 host daemon）
B> 降低風險：rootless Docker、socket proxy（只開放需要的 API）、user namespace remap
?mc 為什麼把 /var/run/docker.sock 掛進容器，等於給這個容器 host 的 root 權限？
+ 容器可以透過它叫 Docker daemon 建立掛載 host 根目錄的特權容器
- docker.sock 裡面存著 root 密碼
- 因為 docker.sock 是 setuid 檔案
- 只會讓容器看到其他容器的 log
E> 所以 HW3 平台可以掛（它是你寫的管理程式），sandbox 絕對不行。
?mt 配對：
> DinD :: 容器內執行獨立的 dockerd，通常需要 --privileged
> DooD :: 掛載 host 的 docker.sock，共用 host 的 daemon
> rootless Docker :: dockerd 以一般使用者執行，降低被濫用的影響
E> HW3 的 Forgejo runner 要求用 Docker-in-Docker 執行 job。
?tf 把使用者加進 docker 群組，安全性上大約等同給他 sudo 權限。
=T
E> docker 群組的成員可以直接操作 docker.sock。

@CARD docker2.p_caps | 實作：Capabilities 與容器權限
A> Linux 把 root 的超能力拆成很多張「執照」（capabilities）：NET_ADMIN 能改網路、SYS_ADMIN 幾乎什麼都能做。Docker 預設只發給容器少數幾張，所以容器裡的 root 改不了路由；--privileged 則是把所有執照都發下去，非常危險。
B> 容器預設**只有部分 capabilities**；沒有 **CAP_NET_ADMIN** → 不能改路由、iptables
B> **--cap-add NET_ADMIN** / **--cap-drop ALL**：增減 capability（只給需要的）
B> **--privileged**：給全部 capability 並存取所有裝置 → **幾乎等於 host root**，只有 DinD 這類情況才用
B> **--read-only**：容器根檔案系統唯讀（搭配 tmpfs 給需要寫的地方）
B> **--security-opt no-new-privileges**：禁止 setuid 提權；**--user 1000:1000**：以非 root 執行
B> HW3：sandbox 內的程式**不能改路由或防火牆** → 不給 NET_ADMIN；平台容器做透明 proxy 則需要 NET_ADMIN
X> docker run --cap-drop ALL --cap-add NET_BIND_SERVICE --read-only --tmpfs /tmp myimg
X> docker run --network container:sbx1 --cap-add NET_ADMIN nicolaka/netshoot ip route
?mc 容器內以 root 執行 ip route add default via 10.0.0.1 卻出現 Operation not permitted。原因？
+ 容器預設沒有 CAP_NET_ADMIN
- 容器內的 root 不是 UID 0
- ip 指令在容器裡無法使用
- 需要先 docker restart
E> HW3 正是利用這點：sandbox 不給 NET_ADMIN，agent 就改不了路由。
?mt 配對選項：
> --cap-add NET_ADMIN :: 允許修改網路設定與防火牆
> --cap-drop ALL :: 移除所有 capability
> --privileged :: 給予全部 capability 與裝置存取
> --read-only :: 根檔案系統唯讀
E> 最小權限原則：先 --cap-drop ALL，再只加回需要的。
?mc docker run --network container:sbx1 的效果是？
+ 新容器與 sbx1 共用同一個 network namespace（同樣的介面、IP、路由）
- 新容器連到名為 container 的網路
- 兩個容器共用檔案系統
- 新容器會取代 sbx1
E> 常用來對另一個容器的網路除錯，或由有權限的輔助容器替它設定路由。

@CARD docker2.p_firewall | 實作：Docker 發布的 port 會繞過防火牆
A> Docker 為了讓 -p 生效，會自己在 iptables 加規則，而且排在 ufw 這類工具的規則「前面」。所以你以為 ufw 擋了 5432，外面其實照樣連得到。真正關門的方法是一開始就只綁 127.0.0.1，或在 DOCKER-USER chain 加規則。
B> -p 8000:8000 → Docker 在 nat 表加 **DNAT**，在 filter 表的 **DOCKER** chain 放行 → **ufw / 自己寫在 INPUT 的規則擋不住**（封包走的是 FORWARD）
B> 自訂限制要寫在 **DOCKER-USER** chain（Docker 不會覆蓋它）
B> 最簡單：**-p 127.0.0.1:8000:8000** 只在本機開
B> **internal: true** 的網路（docker network create --internal）：**沒有對外路由**，容器只能跟同網路的容器通訊（HW3 sandbox 網路的好起點）
B> 驗證：在**另一台機器**用 nc -vz VM 8000 或 nmap 測，不要只在本機測
X> # compose
X> networks:
X>   sandbox_net:
X>     internal: true
X> $ sudo iptables -L DOCKER-USER -n
?mc 用 ufw deny 8101 後，外部仍能連到用 -p 8101:3000 發布的 Forgejo 容器。原因？
+ Docker 自己的 iptables 規則（DNAT + FORWARD 鏈）比 ufw 的 INPUT 規則先生效，流量不經過 INPUT
- ufw 沒有啟用
- 8101 是保留 port
- Forgejo 自己有防火牆
E> 正確做法：只綁 127.0.0.1，或把規則寫在 DOCKER-USER。
?mc docker network create --internal sbxnet 建立的網路有什麼特性？
+ 接在上面的容器沒有對外的路由，只能跟同網路的容器互相連線
- 只能從 host 連進去
- 會自動加密流量
- 只允許 TCP
E> HW3 可以讓 sandbox 只接 internal 網路，平台同時接 internal 與一般網路，成為唯一出口。
?fill Docker 保留給使用者自訂過濾規則、不會被它覆蓋的 iptables chain 是＿＿
= DOCKER-USER
E> 例：iptables -I DOCKER-USER -i eth0 ! -s 192.168.0.0/16 -j DROP。

@CARD docker2.p_composeenv | 實作：.env、變數替換與 override
A> compose.yml 可以留「空格」（${VAR}），由同目錄的 .env 填入，同一份設定換個 .env 就能用在不同環境。注意兩種 env 不一樣：.env 是給「compose 檔本身」填空用的；environment / env_file 才是傳進「容器」的環境變數。
B> **.env**（與 compose.yml 同目錄）：提供 compose 檔中 **${VAR}** 的值；**${VAR:-預設值}**、**${VAR:?錯誤訊息}**（沒設就報錯）
B> **environment:**、**env_file: app.env**：傳進**容器**的環境變數
B> **docker compose config**：看替換後的結果
B> **compose.override.yml** 會自動疊加；**-f a.yml -f b.yml** 依序合併；**-p 名稱** 指定專案名稱（影響容器、網路、volume 的前綴）
B> **profiles:** 讓某些服務只在 --profile 指定時啟動；**secrets:** 以檔案掛到 /run/secrets/<name>
X> # .env
X> LMSP_TAG=v1.2.3
X> # compose.yml
X>   platform:
X>     image: git.19.cs.nycu/hw3/llm-sandbox-platform:${LMSP_TAG:?LMSP_TAG not set}
X>     env_file: platform.env
X>     secrets: [llm_api_key]
X> secrets:
X>   llm_api_key:
X>     file: ./secrets/llm_api_key
?mc .env 與 env_file 的差別？
+ .env 用來替換 compose 檔中的 ${VAR}；env_file 是把變數傳進容器的環境
- 兩者完全相同
- .env 只在 build 時使用
- env_file 只能有一個
E> 很多人以為寫在 .env 的變數容器裡就看得到，其實要另外用 environment 或 env_file 傳入。
?fill compose 中 ${TAG:＿＿請設定 TAG} 表示 TAG 沒設定時直接報錯停止
= ?
E> 語法和 shell 的 ${var:?message} 一樣，訊息會顯示在錯誤中。
?mc 以 secrets 傳入的 llm_api_key，容器內預設在哪個路徑讀取？
+ /run/secrets/llm_api_key
- 環境變數 LLM_API_KEY
- /etc/secrets/llm_api_key
- /var/lib/docker/secrets
E> 比起環境變數，檔案形式的 secret 不會出現在 docker inspect 的 Env 中。

@CARD docker2.p_volume2 | 實作：volume 權限、備份與資料庫
A> 資料庫容器的資料一定要放在 volume，否則容器一刪資料就沒了。bind mount 最常見的坑是「UID 對不上」：容器裡的 postgres 使用者 UID 999，host 的目錄卻屬於 1000，於是啟動失敗。
B> **named volume**：由 Docker 管理（/var/lib/docker/volumes/），權限自動處理，適合資料庫
B> **bind mount**：直接看得到 host 檔案，但要注意**容器內 process 的 UID** 要有權限（例：postgres 是 999）
B> 容器內外 UID 是同一套數字（沒有 user namespace 時）→ chown 999:999 ./pgdata
B> 備份 named volume：**docker run --rm -v pgdata:/data -v "$PWD":/backup debian tar czf /backup/pgdata.tgz -C /data .**；資料庫最好用 pg_dump
B> **docker compose down -v** 會刪掉 named volume → 資料庫資料消失；不要隨手加 -v
B> 官方 postgres image：**POSTGRES_USER、POSTGRES_PASSWORD、POSTGRES_DB** 只在**資料目錄是空的第一次初始化**時生效；/docker-entrypoint-initdb.d/ 的腳本也只跑那一次
X> docker run --rm -v pgdata:/data -v "$PWD":/backup debian tar czf /backup/pgdata.tgz -C /data .
X> docker compose exec db pg_dump -U postgres forgejo > forgejo.sql
?mc 已經跑過一次的 postgres 容器，修改 compose 的 POSTGRES_PASSWORD 後 down 再 up，密碼會變嗎？
+ 不會，這些變數只在資料目錄為空、第一次初始化時使用
- 會，每次啟動都會套用
- 會，但要重新 build
- 只有 superuser 的密碼會變
E> 要改密碼請連進資料庫用 ALTER USER；或清空 volume 重新初始化（資料會消失）。
?mc bind mount ./pgdata 給 postgres 容器，啟動時出現 permission denied。最可能的原因？
+ host 上 ./pgdata 的擁有者 UID 與容器內 postgres 使用者（999）不同
- 需要 --privileged
- bind mount 不能用在資料庫
- 需要先 docker volume create
E> 改用 named volume，或 chown 成容器內使用者的 UID。
?tf docker compose down -v 會刪除 compose 檔中宣告的 named volume。
=T
E> bind mount 的 host 目錄不會被刪。

@CARD docker2.p_buildkit | 實作：build 的進階技巧
A> 進階 build 技巧：--no-cache 是「全部重煮」；--target 是「只煮到某個 stage 就停」（拿 builder 來測試）；BuildKit 的 cache mount 是「共用的食材冰箱」，pip、apt 的下載快取放裡面，不會進 image，下次又能重用。
B> **docker build --no-cache**：忽略所有快取；**--pull**：重新拉最新的基底 image
B> **--target builder**：只 build 到指定 stage（除錯或做測試 image）
B> **--progress=plain**：顯示每個步驟完整輸出（BuildKit 預設會摺疊）
B> BuildKit cache mount：**RUN --mount=type=cache,target=/root/.cache/pip pip install -r requirements.txt**（快取不進 image）
B> secret mount：**RUN --mount=type=secret,id=token …**，build 時用 --secret 傳入，不會留在 layer
X> docker build --target builder -t myapp:builder .
X> docker build --progress=plain --no-cache -t myapp .
X> RUN --mount=type=cache,target=/root/.cache/pip pip install -r requirements.txt
?mc build 時要用到私有 repo 的 token，最安全的傳入方式是？
+ BuildKit 的 --secret 搭配 RUN --mount=type=secret，token 不會留在任何 layer
- ARG TOKEN 再 --build-arg
- ENV TOKEN=...
- COPY token.txt . 用完再 RUN rm
E> ARG、ENV 與 COPY 都會留在 image 歷史或 layer 中。
?cmd 只 build Dockerfile 中名為 builder 的 stage，並標記為 myapp:builder：
= docker build --target builder -t myapp:builder .
= docker build -t myapp:builder --target builder .
= docker build . --target builder -t myapp:builder
E> --target 也常用來只 build 測試用的 stage。

@CARD docker2.p_logs | 實作：容器 log 與 log rotation
A> 容器印到 stdout/stderr 的東西，Docker 預設寫成 JSON 檔存在硬碟，而且預設不會輪替，跑久了會把磁碟塞爆。要在 daemon.json 或每個服務設定上限。
B> 預設 logging driver：**json-file**，檔案在 /var/lib/docker/containers/<id>/<id>-json.log
B> 預設**不輪替** → 設 **max-size**、**max-file**（daemon.json 全域，或 compose 的 logging:）
B> 也可用 **journald** driver：log 進 journal，用 journalctl CONTAINER_NAME=web 查
B> **docker logs --since 10m --tail 100 -f 容器**；程式要寫到 **stdout/stderr**，不要只寫容器內的檔案
B> 改 /etc/docker/daemon.json 後要 **systemctl restart docker**（只影響之後建立的容器）
X> # /etc/docker/daemon.json
X> { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
X> # compose
X>     logging:
X>       driver: json-file
X>       options: { max-size: "10m", max-file: "3" }
?mc 一台跑了好幾個月的 Docker 主機磁碟爆滿，/var/lib/docker/containers 底下有超大的 *-json.log。根本原因？
+ json-file logging driver 預設不輪替，log 無限增長
- image layer 沒有清理
- volume 沒有備份
- journald 壞掉了
E> 設定 max-size / max-file，或定期 prune。
?cmd 查看容器 web 最近 10 分鐘的 log 並持續追蹤：
= docker logs --since 10m -f web
= docker logs -f --since 10m web
= docker logs --since=10m -f web
= docker logs --since 10m --follow web
E> --since 可以用 10m、1h 這類相對時間，也可以用絕對時間。
?tf 修改 /etc/docker/daemon.json 的 log 設定後，已存在的容器會立刻套用新的設定。
=F
E> 只影響之後建立的容器；既有容器要重建（compose up -d --force-recreate）。
</script>

@CH hw2 | HW2 實戰觀念：救援、SFTP、log、daemon | 🛠️ | hw2.pdf

@CARD hw2.preflight | Preflight：initramfs、LUKS、預設 target
A> HW2 的 VM 是一台「故意被弄壞的車」：開機零件（initramfs）被藏在 /root、預設停在維修模式（rescue）。修車原則：不重灌、不 mkfs，用學過的開機知識一層層修。
B> 開機問題：**initramfs** 映像放在 /root，需找出並放回 /boot（對應 kernel 版本），必要時 update-initramfs / 修 GRUB
B> 開機後落在 **rescue mode** → 檢查並修正預設 target：**systemctl get-default**、**systemctl set-default multi-user.target**
B> **LUKS / dm-crypt** 磁碟加密：預設密碼 judge 改為 ilovesa2026 → **cryptsetup luksChangeKey <device>**（或 luksAddKey 再 luksKillSlot）
B> **禁止重灌或對任何分割區 mkfs**；要以 **UEFI 模式**開機
B> 也要維持 HW0：sudo NOPASSWD、wireguard、ssh key、hostname
?cmd 把系統預設開機 target 改回 multi-user.target：
= systemctl set-default multi-user.target
E> get-default 查詢、set-default 設定。
?cmd 變更 LUKS 裝置 /dev/sda3 的解鎖密碼：
= cryptsetup luksChangeKey /dev/sda3
E> 會要求輸入舊密碼與新密碼。
?mc 開機時要求輸入 LUKS 密碼這一步，是在哪個階段由誰負責？
+ initramfs（early user space）解鎖加密裝置，之後才掛載 root
- GRUB 載入 kernel 之前由 BIOS 解鎖
- systemd 進入 multi-user.target 之後
- 使用者登入時由 PAM 解鎖
E> root 在加密裝置上時，解鎖一定要在掛載 root 之前。

@CARD hw2.snapper | SnApper：Btrfs 快照管理腳本
A> SnApper 是自己寫的「相機管家」：snapshot 拍照（唯讀、自動輪替只留 N 張）、list 列相簿、delete 刪照片、rollback 把照片「沖洗成可用的新版本」換回原處，而且照片本身要留著。
B> 指令：SnApper snapshot SUBVOL [-c ROTATION_COUNT]、list [-p SUBVOL] [-i ID]、delete [ID]、rollback ID；放在 **$PATH** 中
B> snapshot 放在 <ROOT_VOLUME>/snapshot/<SUBVOL>/**@YYYYMMDD-hhmmss**，直接在 root volume（ID 5）下，**唯讀**；輸出 Snap '<PATH>' [<ID>]

X> btrfs subvolume snapshot -r /mnt/hw2root/pool1 /mnt/hw2root/snapshot/pool1/@$(date +%Y%m%d-%H%M%S)
X> btrfs subvolume list -p -a -t /mnt/hw2

- 最新建立的那個

@CARD hw2.sftp | SFTP chroot 與 internal-sftp
A> chroot 是「把客人關在指定的展示間裡」：他以為展示間就是整棟樓的 /。sshd 有嚴格規定：展示間（以及往上每一層路徑）必須是 root 擁有、而且別人不能寫，不然 sshd 拒絕 chroot。internal-sftp 是 sshd 內建的 SFTP 服務，不需要 chroot 裡面有任何程式。
B> **Subsystem sftp internal-sftp**（內建 sftp server，chroot 內不需要 binary）
B> 用 **Match User / Match Group** 對特定使用者套用：**ChrootDirectory**、**ForceCommand internal-sftp**（只能 SFTP，不能 SSH shell）、可關閉 forwarding
B> **ChrootDirectory 的路徑每一層都必須是 root 擁有，且 group/other 不可寫**
B> 管理員（sysadm）**不 chroot**；所有人的 SFTP 起始目錄都在 $SFTP_ROOT（internal-sftp **-d** 設定起始目錄）
B> 上傳檔案移除 other 的 rwx：internal-sftp **-u 0007**（強制 umask）
B> 公鑰登入：每個帳號的 ~/.ssh/authorized_keys
X> Match User sftp-u1,sftp-u2,anonymous
X>     ChrootDirectory /mnt/hw2/sftp
X>     ForceCommand internal-sftp -u 0007
X>     AllowTcpForwarding no
?mc 設定 ChrootDirectory /mnt/hw2/sftp 後 SFTP 一登入就斷線，log 顯示 bad ownership or modes for chroot directory。原因？
+ chroot 路徑上的某一層目錄不是 root 擁有，或 group/other 可寫
- 使用者沒有 shell
- internal-sftp 沒有安裝
- 防火牆擋住 22 port
E> sshd 要求 chroot 目錄與其所有上層都 root 擁有且不可被他人寫入。
?mt 配對 sshd_config 指令：
> ChrootDirectory :: 把使用者限制在指定目錄當作 /
> ForceCommand internal-sftp :: 只允許 SFTP，不允許 shell
> Match Group :: 只對特定群組套用後面的設定
> internal-sftp -u 0007 :: 強制上傳檔案的 umask
E> Match 區塊一直作用到下一個 Match 或檔案結尾。
?tf 使用 internal-sftp 時，chroot 目錄內必須放一份 sftp-server 程式。
=F
E> internal-sftp 是 sshd 內建，這正是用它搭配 chroot 的原因。

@CARD hw2.sftpperm | SFTP 權限設計（public / private / hidden）
A> 用權限位元蓋一座「藏寶屋」：public/ 是大家都能放東西的公共區，但只能拿走自己的（sticky）；private/ 是「看不到房間清單、但知道名字就能走進去」（只給 x 不給 r），hidden/treasure 就是知道地址才拿得到的寶藏。
B> public/：registered user 可 get/put/mkdir，只能刪除**自己的**檔案 → **sticky bit** + 群組可寫；anonymous 唯讀 → 不在可寫群組
B> 管理員 sysadm 可刪除全部：讓 sysadm 成為目錄**擁有者**（sticky 允許目錄擁有者刪除）
B> private/：使用者**不能 ls**、**不能寫**、**能 cd**、能 get hidden/treasure → 目錄只給 **x**（--x）、treasure 給 r
B> 新目錄自動屬於共同群組 → **setgid** 目錄
B> 上傳檔移除 other 的 rwx → umask 007 或預設 ACL 的 o::---；但 anonymous 對檔案而言就是 other，所以要另外用 **ACL（u:anonymous:r）** 給它讀取權（見「umask 007 與 anonymous 唯讀的衝突」）
?mc 要讓使用者「可以 cd 進 private/、可以下載已知名稱的檔案，但不能 ls 列出內容」，private/ 對他們應給什麼權限？
+ 只給 x（執行/通過），不給 r
- 只給 r，不給 x
- 給 rw，不給 x
- 給 rwx 加 sticky
E> 目錄 r = 列出、x = 通過。
?mc public/ 中「使用者只能刪除自己上傳的檔案」，關鍵的權限位元是？
+ sticky bit
- setuid
- setgid
- 檔案本身的 w
E> sticky 目錄只允許檔案擁有者、目錄擁有者或 root 刪除 / 改名。

@CARD hw2.log | SFTP logging：journald + rsyslog
A> 讓 SFTP 的 log「獨立成一本帳」：先讓 internal-sftp / sftp-server 會寫 log（-l INFO -f 設施），再用 rsyslog 的過濾規則依程式名稱挑出來寫進 /var/log/sftp.log，並且「stop」避免混到其他 log。chroot 中的使用者還需要讓 /dev/log 在 chroot 裡可用，log 才送得出來。
B> internal-sftp / sftp-server 開 log：**-l INFO**（log level）、**-f AUTH / LOCAL*n***（facility）
B> 查 log：**journalctl -t internal-sftp -t sftp-server**（-t 依 syslog identifier 過濾）
B> rsyslog 依 **programname** 過濾寫到 /var/log/sftp.log，再 **stop** 避免寫進其他檔
B> chroot 使用者：需在 chroot 內提供 /dev/log（例如 rsyslog 增加 socket、或 bind mount）
B> 檔名要排在 50-default.conf 之前（例如 10-sftp.conf），stop 才能避免訊息又寫進 auth.log
X> # /etc/rsyslog.d/10-sftp.conf
X> if $programname == 'internal-sftp' or $programname == 'sftp-server' then {
X>     action(type="omfile" file="/var/log/sftp.log")
X>     stop
X> }
?cmd 用 journalctl 只看 syslog identifier 為 internal-sftp 與 sftp-server 的 log：
= journalctl -t internal-sftp -t sftp-server
= journalctl -t sftp-server -t internal-sftp
E> -t = SYSLOG_IDENTIFIER。
?mc rsyslog 規則寫完 action 後加 stop 的目的？
+ 讓符合的訊息不再被後面的規則處理（不會混進 /var/log/syslog 等）
- 停止 rsyslog daemon
- 停止 SFTP 服務
- 讓 log 只寫一次就關檔
E> 規格要求 sftp.log 是純 SFTP log，同時其他檔不該混入。

@CARD hw2.watchd | sftp_watchd：監控上傳並做成 systemd service
A> sftp_watchd 是「上傳檢查站的保全」：盯著每個新上傳的檔案，看前 4 個 bytes 是不是 ELF 的身分證（\x7fELF），或 MD5 是否在黑名單上；違規就移到 .violated/ 並寫 log。再把保全登記成 systemd service，讓 systemctl 能叫他上班、下班、看狀態，journalctl -u 能看他的值勤紀錄。
B> 偵測：**ELF** 檔（只看前 4 bytes：**0x7F 'E' 'L' 'F'**）、**MD5** 在禁止清單中（md5sum）
B> 違規 → 移到 ${SFTP_ROOT}/private/.violated/ 並記錄指定格式的 log
B> 監看檔案事件：如 **inotifywait -m -r -e close_write**
B> 寫成 systemd service：/etc/systemd/system/sftp_watchd.service → daemon-reload → enable --now；支援 start/stop/status/restart；log 用 **journalctl -u sftp_watchd**（印到 stdout/stderr 就會進 journal）
X> [Unit]
X> Description=SFTP upload watcher
X> After=network.target
X> [Service]
X> ExecStart=/usr/local/bin/sftp_watchd
X> Restart=on-failure
X> [Install]
X> WantedBy=multi-user.target
?mc 判斷檔案是不是 ELF 執行檔，只看前 4 bytes 應該是？
+ 0x7F 45 4C 46（\x7fELF）
- 4D 5A（MZ）
- 23 21（#!）
- 50 4B 03 04（PK）
E> MZ 是 Windows PE、#! 是 script、PK 是 zip。
?mt 配對 service unit 的 section：
> [Unit] :: 描述與依賴 / 順序（Description、After）
> [Service] :: 如何執行（ExecStart、Restart）
> [Install] :: enable 時掛到哪個 target（WantedBy）
E> 沒有 [Install] 就不能 enable。
?cmd 讓 sftp_watchd.service 立即啟動並在開機時自動啟動：
= systemctl enable --now sftp_watchd
= systemctl enable --now sftp_watchd.service
E> 新寫的 unit 記得先 daemon-reload。
?cmd 計算 upload.bin 的 MD5：
= md5sum upload.bin
E> FreeBSD 上是 md5。

@CARD hw2.p_plan | HW2 作戰順序與存檔點
A> HW2 像一款「不能讀檔重來」的遊戲：judge 甚至可能 dd 掉你的磁碟。所以每完成一個階段就在 VM 存一次檔（快照），並且每一關都問自己：重開機之後它還在嗎？
