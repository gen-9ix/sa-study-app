B> 每一階段結束：**VM 快照**＋**重開機驗證**；作業規格明寫「Make sure everything works after reboot」
B> 持久化清單：fstab（掛載）、systemctl enable（服務）、set-default（target）、crypttab 與 initramfs（解鎖）、hostnamectl
B> judge 從 `$(which SnApper)`、`$(which sftp_watchd)` 拿腳本：要在 PATH、judge 讀得到，而且**不能呼叫你自己寫的其他腳本或程式**
B> 同時維持 HW0：sudo NOPASSWD、WireGuard、SSH key、hostname
?mc 規格要求所有設定在重開機後仍然有效。下列哪一項「不會」自動在重開機後保留？
+ 只用 mount 指令手動掛上、沒有寫進 fstab 的掛載
- systemctl enable 過的服務
- set-default 設定的 target
- hostnamectl set-hostname 設定的名稱
E> 手動 mount 只存在於這次開機。
?tf SnApper 腳本可以把共用函式寫在另一個 /usr/local/lib/snap_lib.sh，再用 source 載入。
=F
E> 規格：腳本不得呼叫任何其他自寫的 script 或執行檔；全部寫在同一個檔案裡。

@CARD hw2.p_preflight | Preflight 實戰：從開不了機到登入
A> Preflight 是三道關卡串在一起：GRUB 找不到 initramfs（開不了機）→ 解鎖 LUKS → 一進系統就掉進 rescue。每一道都對應到開機流程的一層，照順序一關一關打。
B> 關卡一：開機卡在 kernel panic 或找不到 root → initramfs 不在 /boot。在 GRUB 按 **c** 用 `ls` 看分割區、或用 rescue / Live 環境把 /root 底下的 initrd 放回 /boot（版本與 vmlinuz 一致），再 `update-grub`
B> 臨時開機也可以在 GRUB 指令列手動下：`linux /vmlinuz-版本 root=...`、`initrd /initrd.img-版本`、`boot`（路徑依 /boot 是否獨立分割而不同）
B> 關卡二：解鎖密碼 judge → 進系統後 `cryptsetup luksChangeKey` 換成 ilovesa2026，**重開機實測**新密碼
B> 關卡三：每次都進 rescue → `systemctl get-default`、`cat /proc/cmdline`、`/etc/default/grub` 三處都查
B> 用 **find / -name 'initrd*' 2>/dev/null** 找出被藏起來的檔案；用 `uname -r` 對版本
B> 還要確認 UEFI 模式開機：存在 **/sys/firmware/efi** 目錄就是 UEFI
X> ls /sys/firmware/efi && echo "UEFI"
X> find / -name 'initrd.img*' 2>/dev/null
X> cp /root/initrd.img-$(uname -r) /boot/ && update-grub
?cmd 檢查系統是否以 UEFI 模式開機（判斷 /sys/firmware/efi 是否存在）：
= ls /sys/firmware/efi
= test -d /sys/firmware/efi
= [ -d /sys/firmware/efi ]
= ls -d /sys/firmware/efi
E> 以 legacy BIOS 開機時沒有這個目錄。
?mt 配對 Preflight 的症狀與對應的處理：
> 開機時 VFS: Unable to mount root fs :: 把 initramfs 放回 /boot 並 update-grub
> 一進系統就是 rescue mode :: systemctl set-default multi-user.target 並檢查 kernel 參數
> 要求的磁碟密碼是 judge :: cryptsetup luksChangeKey 換成新密碼
> 開機後 sudo 要輸入密碼 :: 用 visudo 設定 NOPASSWD
E> 每一關對應開機流程的不同層。
?fill 在 GRUB 選單按 ＿ 可以進入 GRUB 指令列，手動下 linux、initrd、boot 指令
= c
E> 按 e 則是編輯目前選中的那一筆。

@CARD hw2.p_layout | 2-1 實戰：Btrfs 子卷與掛載配置
A> 這一關的要點是「所有房間都直接開在大廳旁邊」：root、sftp、pool1、pool2 四個 subvolume 都直接在 ID 5 底下，snapshot/ 只是一般目錄。但掛載的時候，sftp、pool1、pool2 要掛在 root 的「裡面」，所以 root 裡要先有這三個空目錄當掛載點。
B> 在 top-level 建 4 個 subvolume 與 snapshot/{sftp,pool1,pool2} 三個**目錄**
B> 先把 root 掛到 /mnt/hw2，再在 /mnt/hw2 裡 `mkdir sftp pool1 pool2`（這些是 root subvolume 裡的普通目錄，當作掛載點，**不是**巢狀 subvolume）
B> fstab 四行，來源都寫 **/dev/mapper/SA2026vg-SARaid10**，選項用 **subvol=名稱**；/mnt/hw2 那行要排在前面
B> 驗證：`btrfs subvolume list -p -a -t /mnt/hw2` 每個的 parent 與 top level 都是 5；`findmnt -t btrfs` 看到四個掛載；`btrfs filesystem show` 確認 Label 是 SAHW2
X> mount -o subvol=root /dev/mapper/SA2026vg-SARaid10 /mnt/hw2
X> mkdir /mnt/hw2/{sftp,pool1,pool2}
X> # /etc/fstab
X> /dev/mapper/SA2026vg-SARaid10 /mnt/hw2       btrfs subvol=root  0 0
X> /dev/mapper/SA2026vg-SARaid10 /mnt/hw2/sftp  btrfs subvol=sftp  0 0
X> /dev/mapper/SA2026vg-SARaid10 /mnt/hw2/pool1 btrfs subvol=pool1 0 0
X> /dev/mapper/SA2026vg-SARaid10 /mnt/hw2/pool2 btrfs subvol=pool2 0 0
?mc 在掛著 root subvolume 的 /mnt/hw2 裡執行 `btrfs subvolume create /mnt/hw2/pool1`，會有什麼問題？
+ pool1 會變成 root 底下的巢狀 subvolume，違反「所有 subvolume 都直接在 ID 5 底下」
- 指令會失敗，因為 /mnt/hw2 是唯讀
- 沒有問題，結果和在 top-level 建立相同
- pool1 會變成 snapshot
E> subvolume 要在 top-level（例如 /mnt/root5）底下建立；/mnt/hw2/pool1 只要是普通目錄當掛載點。
?tf /mnt/hw2/sftp 這個掛載點目錄，本身必須是一個 Btrfs subvolume。
=F
E> 掛載點只是 root subvolume 裡的普通目錄；sftp subvolume 是從 top-level 掛過來的。

@CARD hw2.p_snapimpl | SnApper 實作拆解
A> 把 SnApper 拆成四個小零件分別做、分別測：找到大廳（掛 top-level）、拍照（唯讀快照 + 印出 ID）、整理相簿（依 ID 排序、刪最舊）、列印清單（解析名稱轉成時間）。每個零件都能用一行指令單獨驗證。
B> 腳本一開頭：檢查 root、把 top-level 掛到暫存點（例如 /mnt/root5），結束時用 **trap** 確保 umount
B> snapshot：名稱 `@$(date +%Y%m%d-%H%M%S)`，`btrfs subvolume snapshot -r`，再用 `subvolume show` 或 list 取 ID，印出 `Snap 'snapshot/pool1/@...' [ID]`
B> 輪替：列出 `snapshot/SUBVOL/@` 開頭的路徑與 ID → `sort -n` → 數量超過 N 就從最小的開始刪
B> list：由名稱 @20251002-205750 轉成 2025-10-02 20:57:50（字串切割或 `date -d`）；用 printf 對齊，**不能有 TAB**；-p 與 -i 可以同時篩選
B> delete：沒給 ID 就刪全部受管快照，每刪一個印 `Destroy ID <ID>`；給了不存在的 ID 要怎麼處理，自己想清楚並一致
B> 測試：連續 snapshot 7 次確認只剩 5 個；`list | cat -A` 確認沒有 ^I；rollback 後 `touch` 測可寫、`umount && mount` 測持久
X> name="@$(date +%Y%m%d-%H%M%S)"
X> ts=${name#@}                       # 20251002-205750
X> printf '%s-%s-%s %s:%s:%s\n' "${ts:0:4}" "${ts:4:2}" "${ts:6:2}" "${ts:9:2}" "${ts:11:2}" "${ts:13:2}"
X> btrfs subvolume list /mnt/root5 | awk -v p="snapshot/$sub/@" 'index($NF,p)==1 {print $2}' | sort -n
?mc 輪替時要刪「ID 最小」的快照。從 `btrfs subvolume list` 取出 ID 後，要怎麼確保排序正確？
+ 用 sort -n 依數值排序
- 用 sort，預設就是數值排序
- 不用排序，list 的順序就是 ID 順序
- 用 sort -r
E> 不加 -n 會按字串排序，例如 1000 會排在 999 前面。
?fill ts=20251002-205750 時，bash 取出前 4 個字元 2025 的寫法是 ${ts:＿＿}
= 0:4
E> ${var:offset:length}，offset 從 0 開始。
?mc 連續執行 7 次 `SnApper snapshot pool1`（沒有 -c）之後，應該觀察到什麼？
+ snapshot/pool1/ 底下只剩 5 個快照，留下的是 ID 最大的 5 個
- 有 7 個快照
- 只剩最舊的 5 個
- 第 6 次開始會報錯
E> 預設 ROTATION_COUNT 是 5，每次建立後刪掉多出來的最小 ID。

@CARD hw2.p_sshd | 2-2 實戰：sshd 設定的「第一個值獲勝」
A> sshd_config 有個反直覺的規則：同一個關鍵字出現好幾次時，**第一個**讀到的值生效。Debian 的主設定檔第一行就 Include 了 sshd_config.d/*.conf，所以藏在那個資料夾裡的設定會蓋過你在主檔後面寫的。作業的陷阱很可能就藏在這裡。
B> 先找出所有相關設定：`grep -rn -i -E 'port|permitroot|banner|printlastlog|printmotd' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/`
B> 看最後生效的值：**sshd -T**（要 root），例如 `sshd -T | grep -i banner` 應該是 **banner none**
B> 例外：**Port 可以寫多行**，每一行都會監聽；只能留 22，用 `ss -tlnp | grep sshd` 確認
B> **Match 區塊**一直延續到下一個 Match 或檔案結尾，寫在 Match 後面的「全域設定」其實不是全域的
B> uname 那段輸出來自 **/etc/update-motd.d/** 的腳本，`chmod -x` 停用那一支；motd 的歡迎詞（greeting）本身要保留
B> 改完 `sshd -t` → `systemctl reload ssh` → **另開一個新視窗**登入測試，原本的視窗先別關
X> sudo grep -rn -i banner /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
X> sudo sshd -T | grep -i -E '^(port|permitrootlogin|banner|printlastlog) '
X> sudo chmod -x /etc/update-motd.d/10-uname
X> sudo sshd -t && sudo systemctl reload ssh
?mc sshd_config 主檔最後寫了 `Banner none`，但 sshd_config.d/99-banner.conf 裡有 `Banner /etc/ssh/banner.txt`，而主檔開頭就 Include 了這個資料夾。登入時會怎樣？
+ 仍然顯示 banner，因為 Include 進來的設定比較早被讀到，第一個值獲勝
- 不顯示 banner，主檔的設定優先
- sshd 會因設定衝突而無法啟動
- 兩個都會生效
E> 用 sshd -T 就能看到最後生效的是哪一個。
?cmd 以 root 印出 sshd 實際生效的完整設定：
= sshd -T
= sudo sshd -T
= /usr/sbin/sshd -T
E> 搭配 grep 看單一項目最方便。
?mc sshd_config 中寫了 `Port 22` 與 `Port 2222` 兩行，結果是？
+ sshd 同時監聽 22 與 2222
- 只監聽 22（第一個值）
- 只監聽 2222
- 設定錯誤無法啟動
E> Port 與 ListenAddress 可以重複，是「第一個值獲勝」規則的例外。

@CARD hw2.p_sftptest | 2-2 實戰：用腳本驗收權限表
A> 權限表有 3 種角色乘以 2 個目錄乘以 6 個動作，靠手動一個一個試很容易漏。把每個角色要做的操作寫成 sftp 批次檔，一次跑完看哪一行成功、哪一行失敗，就是你自己的小 judge。
B> sftp -b 遇到失敗會停下並回傳非 0；在指令前加 **-**（例如 `-rm x`）表示「失敗也繼續」，適合一次測完
B> 每個角色測：public 的 ls / put / get / mkdir / rm 別人的檔 / rm 自己的檔；private 的 ls（應失敗）、cd（應成功）、get hidden/treasure（應成功）、put（應失敗）
B> 也要測：`ssh sftp-u1@host` 應該不能拿到 shell；登入後 `pwd` 應該是 /（registered / anonymous 被 chroot）
B> 上傳後在伺服器端 `ls -l` 確認 other 沒有任何權限
B> 伺服器端同時開 `journalctl -t internal-sftp -f` 或 auth log，失敗時看原因
X> cat > t.batch <<'EOT'
X> pwd
X> -ls private
X> cd private/hidden
X> -get treasure /tmp/treasure
X> -put /etc/hostname
X> EOT
X> sftp -b t.batch anonymous@hw2
?fill sftp 批次檔中，要讓某個指令失敗時不中斷整個批次，要在指令前面加上 ＿
= -
E> 例如 `-rm foo`。另外 @ 前綴可以不回顯該指令。
?mc 依作業權限表，sftp-u1 對 private/hidden/ 可以做的是？
+ cd 進去並 get treasure，但不能 ls、不能 put
- ls 與 get 都可以，但不能 put
- 完全不能進入
- 可以 put 但不能 get
E> 對應到目錄只有 x、檔案有 r 的權限設計。

@CARD hw2.p_chrootlog | 2-3 實戰：chroot 裡的 log 送不出來
A> 被 chroot 的 SFTP 使用者，世界只剩 /mnt/hw2/sftp；internal-sftp 想寫 log 時要找 /dev/log 這個「郵筒」，但 chroot 裡根本沒有 /dev。所以 sysadm 的 log 有、sftp-u1 的 log 卻沒有，是這一關最典型的現象。
B> 症狀：只看得到 **sftp-server**（沒有 chroot 的 sysadm）的 log，看不到 chroot 使用者的 **internal-sftp** log
B> 做法一：讓 rsyslog 多開一個 socket，`input(type="imuxsock" Socket="/mnt/hw2/sftp/dev/log" CreatePath="on")`；這樣訊息只進 rsyslog，**journald 收不到**
B> 做法二：在 chroot 裡建一個空檔 dev/log，把 **/run/systemd/journal/dev-log** bind mount 到它上面；訊息進 journald，再由 rsyslog 從 journal 轉出，兩邊都看得到；要寫進 fstab 才會持久
B> chroot 內新增的 dev/ 目錄同樣必須是 root 擁有、他人不可寫
B> 兩種做法對規格「journalctl 與 /var/log/sftp.log 都要有」的影響不同，選之前想清楚，做完兩種指令都實測
B> rsyslog 設定檢查：**rsyslogd -N1**；改完 `systemctl restart rsyslog`
X> sudo rsyslogd -N1
X> journalctl -t internal-sftp -t sftp-server -f
X> tail -f /var/log/sftp.log
?mc sysadm 的 SFTP log 正常，但 chroot 的 sftp-u1 登入完全沒有 internal-sftp 的 log。最可能的原因？
+ chroot 環境裡沒有 /dev/log，internal-sftp 無法把 log 送出去
- sftp-u1 沒有寫入 /var/log 的權限
- rsyslog 沒有安裝
- journald 只記錄 root 的活動
E> 不 chroot 的 sysadm 用的是正常的 /dev/log，所以沒問題。
?cmd 檢查 rsyslog 設定檔語法（不啟動服務）：
= rsyslogd -N1
= sudo rsyslogd -N1
= rsyslogd -N 1
E> -N 是 config check mode，1 是檢查等級。
?tf 用 rsyslog 的 imuxsock 在 chroot 中建立 /dev/log 時，訊息也會自動出現在 journalctl -t internal-sftp 中。
=F
E> 那個 socket 由 rsyslog 自己監聽，journald 收不到；要兩邊都有就得讓訊息先進 journald。

@CARD hw2.p_watchtest | 2-3 實戰：測試 sftp_watchd
A> 測試 daemon 要「自己扮演壞人」：故意上傳一個 ELF 檔、一個雜湊在黑名單上的檔、一個正常檔，看前兩個有沒有被搬走、log 格式對不對、正常檔有沒有被誤搬。
B> 準備違規檔：ELF 直接用系統裡的執行檔（例如 `cp /bin/true evil`）；黑名單測試可以先把你自己測試檔的 md5 暫時加進清單驗證流程，或確認比對邏輯正確
B> 用 sftp 以 sftp-u1 上傳 → 伺服器端檢查 `private/.violated/` 裡是否出現、`journalctl -u sftp_watchd` 的訊息是否**一字不差**符合規格
B> log 中的 {user} 是上傳者：用 **stat -c %U** 取檔案擁有者
B> 移動目的地 private/.violated/ 要事先存在（或由程式建立），而且監看時要排除它，避免搬進去又被處理一次
B> 重啟測試：`systemctl restart sftp_watchd` 後再上傳一次；`systemctl stop` 後確認沒有殘留的 inotifywait（`pgrep -af inotifywait`）
B> 重開機後 `systemctl is-enabled sftp_watchd` 與 `is-active` 都要正常
X> cp /bin/true /tmp/evil && echo 'put /tmp/evil public/' | sftp -b - sftp-u1@hw2
X> sudo ls -l /mnt/hw2/sftp/private/.violated/
X> journalctl -u sftp_watchd -n 5 --no-pager
?mc 測試 sftp_watchd 的 ELF 偵測，最簡單取得一個 ELF 檔的方法？
+ 複製系統上任何一個執行檔，例如 /bin/true
- 寫一個 #!/bin/bash 開頭的腳本
- 把 txt 檔改名成 .elf
- 用 zip 壓縮一個檔案
E> shell script 的開頭是 #!，不是 ELF；副檔名與判斷無關。
?cmd 確認 sftp_watchd 這個服務是否已設定為開機自動啟動：
= systemctl is-enabled sftp_watchd
= systemctl is-enabled sftp_watchd.service
E> is-active 則是查現在有沒有在跑。
?mc sftp_watchd 把違規檔搬進 private/.violated/ 之後，又對同一個檔案再處理了一次，log 出現兩筆。最可能的原因？
+ 監看範圍包含 .violated/，搬進去的 moved_to 事件又觸發了一次檢查
- md5sum 計算了兩次
- systemd 啟動了兩個實例
- journald 重複記錄
E> 監看時排除 .violated（例如 inotifywait 的 --exclude），或處理時略過這個路徑。

@CARD hw2.p_vmimport | Preflight：匯入 vmdk 與 UEFI 開機
A> 助教給的是一顆「已經裝好但故意弄壞的硬碟」（vmdk）。先把它接到一台新 VM 上當第一顆硬碟（/dev/sda），韌體要選 UEFI，不然連 GRUB 的 EFI 版本都找不到。
B> 依 CPU 選 **amd64 或 aarch64** 的 vmdk；VM 類型選 **Debian**
B> 有些虛擬化軟體要先轉檔：**qemu-img convert -f vmdk -O qcow2 hw2.vmdk hw2.qcow2**
B> 把 vmdk 接成 **/dev/sda**（第一顆 SATA/SCSI 碟）；韌體設定 **UEFI**（VirtualBox 勾 Enable EFI、QEMU 用 OVMF）
B> 確認 UEFI：**/sys/firmware/efi** 存在、**efibootmgr -v** 看得到開機項目
B> 預設帳密：judge/judge；root 密碼 judge；**不能重灌、不能對任何分割區 mkfs**
?cmd 把 hw2.vmdk 轉成 qcow2 格式的 hw2.qcow2：
= qemu-img convert -f vmdk -O qcow2 hw2.vmdk hw2.qcow2
= qemu-img convert -O qcow2 hw2.vmdk hw2.qcow2
= qemu-img convert -O qcow2 -f vmdk hw2.vmdk hw2.qcow2
E> -f 來源格式、-O 輸出格式。
?mc 開機後如何確認目前是以 UEFI 模式啟動？
+ /sys/firmware/efi 目錄存在
- /boot/grub 目錄存在
- lsblk 看得到 /dev/sda
- uname -m 顯示 x86_64
E> 以 BIOS（legacy）開機時沒有這個目錄。
?tf HW2 允許在無法開機時重新安裝 Debian，只要最後設定一樣就好。
=F
E> 規格明寫 DO NOT reinstall the VM or use mkfs against any partition。

@CARD hw2.p_luks2 | Preflight：LUKS 金鑰槽與密碼更換
A> LUKS 像一個保險箱，有好幾個鑰匙孔（keyslot），每個孔可以放一把不同的密碼，任何一把都能打開。換密碼可以直接換鎖芯（luksChangeKey），也可以先加一把新的、確認能用，再拆掉舊的，比較安全。
B> 查看分割區與 keyslot：**lsblk -f**（crypto_LUKS）、**cryptsetup luksDump /dev/sda3**
B> 直接更換：**cryptsetup luksChangeKey /dev/sda3**（輸入舊密碼 judge → 新密碼 ilovesa2026）
B> 較保險：**luksAddKey**（加新密碼）→ 重開機確認 → **luksRemoveKey**（移除舊密碼）
B> 開機解鎖設定在 **/etc/crypttab**（name、device/UUID、key、options），initramfs 依它解鎖 root；換密碼**不需要**重建 initramfs
B> 備份 header：**cryptsetup luksHeaderBackup**（header 壞掉資料就救不回來）
X> lsblk -f
X> sudo cryptsetup luksDump /dev/sda3 | grep -i -A2 keyslots
X> sudo cryptsetup luksAddKey /dev/sda3
X> sudo cryptsetup luksRemoveKey /dev/sda3
?mt 配對 cryptsetup 子指令：
> luksChangeKey :: 把某個 keyslot 的密碼換成新密碼
> luksAddKey :: 新增一組密碼到空的 keyslot
> luksRemoveKey :: 移除輸入的那組密碼
> luksDump :: 顯示 LUKS header 與 keyslot 資訊
E> LUKS2 預設有 32 個 keyslot，每組密碼各佔一個。
?cmd 顯示 /dev/sda3 的 LUKS header 與 keyslot 資訊：
= cryptsetup luksDump /dev/sda3
= sudo cryptsetup luksDump /dev/sda3
E> 可以看到 Keyslots 區段中哪些 slot 已使用，以及使用的金鑰衍生函式（如 argon2id）。
?mc 改完 LUKS 密碼後，下列何者「不必要」？
+ update-initramfs 重建 initramfs
- 重開機實測新密碼可以解鎖
- 確認舊密碼 judge 已無法解鎖
- 確認 /etc/crypttab 指到正確的裝置
E> 密碼存在 LUKS header 裡，initramfs 只負責詢問密碼並呼叫 cryptsetup。

@CARD hw2.p_rescuefix | Preflight：為什麼一直進 rescue mode
A> 每次開機都掉進 rescue，代表有人在某處下了「去 rescue」的指令。可能藏在三個地方：預設 target 的 symlink、GRUB 傳給 kernel 的參數、或某個 unit 的依賴。逐一檢查、修正後還要讓 GRUB 設定重新產生。
B> ① **systemctl get-default** → 若是 rescue.target：**systemctl set-default multi-user.target**
B> ② **cat /proc/cmdline** 是否有 **systemd.unit=rescue.target**、**single**、**rescue**、**1** → 修 **/etc/default/grub** 的 GRUB_CMDLINE_LINUX(_DEFAULT) → **update-grub**
B> ③ 某個開機必要元件失敗（fstab 掛不上、LUKS 解不開）會進 **emergency**，看 **journalctl -xb**
B> 當下離開 rescue：**systemctl isolate multi-user.target**（或修好後 systemctl default）
B> 不知道是哪裡：在 GRUB 選單按 **e** 檢查 linux 那一行的參數
X> systemctl get-default
X> cat /proc/cmdline
X> grep -n CMDLINE /etc/default/grub
X> sudo update-grub
?mc /proc/cmdline 出現 systemd.unit=rescue.target，set-default multi-user.target 後重開機還是進 rescue。下一步該做什麼？
+ 移除 /etc/default/grub 中的 systemd.unit=rescue.target 並執行 update-grub
- 再執行一次 set-default
- 重新安裝 systemd
- 刪除 /etc/systemd/system/default.target
E> kernel 參數 systemd.unit= 的優先順序高於 default.target。
?cmd 不重開機，直接從 rescue 切換到 multi-user.target：
= systemctl isolate multi-user.target
= sudo systemctl isolate multi-user.target
= systemctl isolate multi-user
E> isolate 會停止不屬於目標 target 的 unit。
?cmd 修改 /etc/default/grub 後重新產生 GRUB 設定（Debian）：
= update-grub
= sudo update-grub
= grub-mkconfig -o /boot/grub/grub.cfg
= sudo grub-mkconfig -o /boot/grub/grub.cfg
E> update-grub 是 grub-mkconfig -o /boot/grub/grub.cfg 的包裝。

@CARD hw2.p_shrinkroot | 2-1 實戰：縮小正在用的 root LV
A> ext4 可以「邊住邊擴建」（線上放大），但不能「邊住邊縮小」。root 一直被系統使用，所以縮 root 要先讓它下線：從 Live 光碟或救援環境開機，解開 LUKS、啟用 VG，才能先縮檔案系統、再縮 LV。順序錯了資料就毀了。
B> 目標：**debian-vg/root 縮到 15G**，剩餘空間建 **new-part**（ext4，掛在 **/mnt/new-part**，開機持久）
B> **ext4 不能線上縮小** → 用 Live ISO 或救援環境開機，root 不能是掛載狀態
B> 在 Live 環境：**cryptsetup open /dev/sda3 cryptroot** → **vgchange -ay** → **e2fsck -f** → **lvreduce --resizefs -L 15G debian-vg/root**
B> 順序：**先縮檔案系統再縮 LV**（手動時 resize2fs 比目標小一點 → lvreduce → resize2fs 撐滿）；**放大**則相反
B> device mapper 名稱：VG 名稱裡的 **- 會變成 --**：debian-vg/root → **/dev/mapper/debian--vg-root**
B> 之後：**lvcreate -l 100%FREE -n new-part debian-vg** → **mkfs.ext4** → fstab（UUID 或 /dev/mapper/debian--vg-new--part）→ **mount -a**、**findmnt --verify**
X> # Live 環境中
X> cryptsetup open /dev/sda3 cryptroot
X> vgchange -ay
X> e2fsck -f /dev/debian-vg/root
X> lvreduce --resizefs -L 15G /dev/debian-vg/root
X> # 回到系統後
X> lvcreate -l 100%FREE -n new-part debian-vg
X> mkfs.ext4 /dev/debian-vg/new-part
X> echo '/dev/mapper/debian--vg-new--part /mnt/new-part ext4 defaults 0 2' >> /etc/fstab
?mc 為什麼縮小 root LV 要從 Live 環境操作？
+ ext4 不支援線上縮小，而 root 在系統執行時一定是掛載狀態
- lvreduce 只存在於 Live ISO
- LUKS 在系統內無法讀取
- root LV 是唯讀的
E> ext4 可以線上放大（resize2fs 在掛載時也能擴大），但縮小必須卸載。
?fill VG debian-vg 的 LV new-part，在 /dev/mapper 底下的名稱是 /dev/mapper/＿＿
= debian--vg-new--part
E> device mapper 用單一 - 分隔 VG 與 LV，所以名稱中原本的 - 都會變成 --。
?ord 縮小 LV（手動、不用 --resizefs）的正確順序：
> 卸載檔案系統並 e2fsck -f
> resize2fs 把檔案系統縮到比目標小
> lvreduce 把 LV 縮到目標大小
> resize2fs 不帶大小，讓檔案系統撐滿 LV
E> 如果先縮 LV，檔案系統尾端的資料會被切掉。
?cmd 在 Live 環境把 debian-vg/root 連同檔案系統一起縮到 15G（一個指令）：
= lvreduce --resizefs -L 15G /dev/debian-vg/root
= lvreduce -r -L 15G /dev/debian-vg/root
= lvreduce --resizefs -L 15G debian-vg/root
= lvreduce -r -L 15G debian-vg/root
= lvresize --resizefs -L 15G /dev/debian-vg/root
= lvresize -r -L 15G /dev/debian-vg/root
E> -r（--resizefs）會先呼叫 fsadm/resize2fs 縮檔案系統，再縮 LV，順序由工具保證。

@CARD hw2.p_raid | 2-1 實戰：4 個 PV 與 LVM RAID10
A> RAID10 是「先鏡像再分散」：資料切成兩條（stripe）同時寫，每條再各存一份副本（mirror），所以至少要 4 個 PV。用一顆新硬碟切 4 個分割區就能滿足作業的結構要求，但真正的容錯需要 4 顆獨立的硬碟。
B> 加一顆（或多顆）虛擬硬碟 → 用 **parted / fdisk** 切成 4 個分割區（或直接加 4 顆）→ **pvcreate** 4 個
B> **vgcreate SA2026vg /dev/sdb1 /dev/sdb2 /dev/sdb3 /dev/sdb4**
B> **lvcreate --type raid10 -m 1 -i 2 -l 100%FREE -n SARaid10 SA2026vg**（-m 1：一份鏡像；-i 2：2 條 stripe → 需要 4 個 PV）
B> 觀察：**lvs -a -o name,segtype,copy_percent,devices SA2026vg**（看到 rimage / rmeta 子 LV、同步進度 Cpy%Sync）
B> **mkfs.btrfs -L SAHW2 /dev/mapper/SA2026vg-SARaid10**；確認 **btrfs filesystem show**
X> sudo parted -s /dev/sdb mklabel gpt mkpart p1 0% 25% mkpart p2 25% 50% mkpart p3 50% 75% mkpart p4 75% 100%
X> sudo pvcreate /dev/sdb1 /dev/sdb2 /dev/sdb3 /dev/sdb4
X> sudo vgcreate SA2026vg /dev/sdb1 /dev/sdb2 /dev/sdb3 /dev/sdb4
X> sudo lvcreate --type raid10 -m 1 -i 2 -l 100%FREE -n SARaid10 SA2026vg
X> sudo lvs -a -o name,segtype,copy_percent,devices SA2026vg

@CARD hw2.p_rollback | 2-1 實戰：SnApper rollback 的原理
A> rollback 不是「把照片貼回去」，而是「用照片洗出一份新的、可以寫的副本，換掉原本的房間」。照片（唯讀 snapshot）留著，舊房間刪掉，新房間取原本的名字，fstab 依名字掛，所以重新掛載後看到的就是回滾後的內容。
B> 從 ID 找 snapshot 路徑：snapshot/**<SUBVOL>**/@時間 → 由路徑**自動推出 SUBVOL**
B> 步驟：掛 top-level（**subvolid=5**）→ **umount /mnt/hw2/<SUBVOL>** → 舊子卷**改名**（mv 子卷目錄）→ **btrfs subvolume snapshot 唯讀快照 <top>/<SUBVOL>**（不加 -r → 可寫）→ 刪掉舊子卷 → **mount /mnt/hw2/<SUBVOL>**（依 fstab 的 subvol= 名稱）
B> 要求：**snapshot 仍存在**、子卷**可寫**、**umount / remount 後仍是回滾後的狀態**
B> 子卷正在使用（SFTP 連線、sftp_watchd 監看）→ umount 會 **target is busy**：先 **fuser -vm** 找出 process，必要時暫停服務
B> 驗證：**btrfs property get -ts <子卷> ro** 應為 false；touch 測試可寫
X> mount -o subvolid=5 /dev/mapper/SA2026vg-SARaid10 /mnt/root5
X> umount /mnt/hw2/pool2
X> mv /mnt/root5/pool2 /mnt/root5/pool2.old
X> btrfs subvolume snapshot /mnt/root5/snapshot/pool2/@20251003-194529 /mnt/root5/pool2
X> btrfs subvolume delete /mnt/root5/pool2.old
X> mount /mnt/hw2/pool2
?mc rollback 時用 btrfs subvolume snapshot（不加 -r）從唯讀快照建立新子卷，目的是？
+ 讓回滾後的子卷可寫，同時保留原本的唯讀快照
- 讓新子卷也是唯讀
- 刪除原本的快照
- 加快 snapshot 速度
E> 規格要求 snapshot 仍存在、subvolume 可寫。
?cmd 檢查子卷 /mnt/root5/pool2 是否為唯讀：
= btrfs property get -ts /mnt/root5/pool2 ro
= btrfs property get /mnt/root5/pool2 ro
= sudo btrfs property get -ts /mnt/root5/pool2 ro
E> 輸出 ro=true 或 ro=false。
?mc rollback 時 umount /mnt/hw2/sftp 出現 target is busy，第一步該做什麼？
+ fuser -vm /mnt/hw2/sftp（或 lsof）找出佔用的 process
- 直接 reboot
- 用 mkfs 重建
- 把 sftp 從 fstab 刪掉
E> 常見是 sftp_watchd 或還沒結束的 sftp session。
?sa 請說明 Btrfs 中「唯讀快照」如何用來實作 rollback，並解釋為什麼 fstab 應該用 subvol=名稱 而不是 subvolid= 掛載。
R> Btrfs 的 snapshot 本身也是一個 subvolume，以 copy-on-write 方式共享資料，建立時幾乎不佔空間。唯讀快照用來保存某個時間點的狀態，不會被意外修改。
R> rollback 時不能直接把唯讀快照拿來用（它不可寫，也要保留），所以對它再做一次「可寫的 snapshot」，得到一份內容相同、可寫的新 subvolume；把原本的 subvolume 改名或刪除，新 subvolume 取原本的名稱放在同一個位置（top-level 下），再重新掛載。
R> 新 subvolume 的 ID 和原本不同。若 fstab 寫 subvolid=，重新掛載時會找不到（舊的已刪）或掛到舊的；寫 subvol=名稱 則依路徑名稱尋找，自動掛到新建的那個，達成「umount/remount 後仍維持回滾狀態」。
P> snapshot 是 CoW 的 subvolume
P> 從唯讀快照建立可寫快照，取代原 subvolume 名稱
P> 原快照保留
P> 新 subvolume ID 不同，所以 fstab 要依名稱掛載

@CARD hw2.p_snapcli | 2-1 實戰：SnApper 的參數解析與輸出格式
A> 評分程式會一字一字比對輸出，所以 SnApper 的「外觀」跟功能一樣重要：help 文字、Snap / Destroy ID / Rollback 這幾行的格式、list 的欄位，都要跟規格完全一樣；錯誤訊息則印到 stderr，exit code 非 0。
B> 子指令在第一個參數：**case "$1" in snapshot|list|delete|rollback|-h)**，shift 後再用 **getopts** 解析 -c、-p、-i
B> 成功輸出：**Snap '<SNAPSHOT_PATH>' [<ID>]**、**Destroy ID <ID>**（刪全部時每個一行）、**Rollback '<SNAPSHOT_PATH>' [<ID>] to <SUBVOL>**
B> list 標頭 **ID    SUBVOLUME TIME**，欄位用**空白**（printf "%-5s %-10s %s\n"），**不能用 TAB**；-p 與 -i 可同時給，沒有符合時只印標頭
B> 「受 SnApper 管理」的快照：路徑符合 **snapshot/<SUBVOL>/@YYYYMMDD-hhmmss**
B> 取 ID：**btrfs subvolume show 路徑**（Subvolume ID:）或 list 的第 2 欄；刪除可用 **btrfs subvolume delete --subvolid ID <top>**
B> 錯誤處理：**>&2** 印訊息、**exit 1**；需要 root（[ "$(id -u)" -eq 0 ]）；用 **trap 'umount …' EXIT** 清理暫時掛載
X> cmd=$1; shift
X> case $cmd in
X>   snapshot) sub=$1; shift; count=5
X>             while getopts c: opt; do case $opt in c) count=$OPTARG;; *) usage >&2; exit 1;; esac; done ;;
X>   list)     while getopts p:i: opt; do case $opt in p) fp=$OPTARG;; i) fi=$OPTARG;; esac; done ;;
X>   -h|'')    usage; exit 0 ;;
X> esac
X> printf '%-5s %-10s %s\n' ID SUBVOLUME TIME

- getopts 只能處理一個選項
- shift 會自動解析 -c
- 不 shift 的話 -c 會被當成檔名刪除
E> getopts 解析的是「目前的」位置參數。

@CARD hw2.p_users | 2-2 實戰：建立 SFTP 帳號與金鑰
A> 四個角色：sysadm 是館長（能 SSH、不被關、什麼都能動），sftp-u1/u2 是會員，anonymous 是訪客。會員和訪客只能用 SFTP，被關在 $SFTP_ROOT 裡。大家都用跟 judge 一樣的公鑰登入，所以要把 judge 的 authorized_keys 複製一份，並且權限要正確，否則 sshd 會拒絕。

B> 群組：例如 **sftpusers**（sftp-u1、sftp-u2）、**sftponly**（sftp-u1、sftp-u2、anonymous，給 Match Group 用）
B> 金鑰：複製 judge 的 **~/.ssh/authorized_keys**；**~/.ssh 是 700、authorized_keys 是 600**，擁有者是該使用者（**StrictModes** 會檢查）

B> 驗證：**ssh sftp-u1@vm** 應失敗（只能 SFTP）；**sftp sftp-u1@vm** 成功且 pwd 為 /；sysadm 可 SSH、不被 chroot

X> sudo useradd -m -s /usr/sbin/nologin -G sftpusers,sftponly sftp-u1
X> sudo useradd -m -s /usr/sbin/nologin -G sftponly anonymous
X> sudo install -d -m 700 -o sftp-u1 -g sftp-u1 /home/sftp-u1/.ssh
X> sudo install -m 600 -o sftp-u1 -g sftp-u1 /home/judge/.ssh/authorized_keys /home/sftp-u1/.ssh/

- 666 讓 sshd 讀不到檔案
- 金鑰格式錯誤
- 需要重開 sshd

@CARD hw2.p_matchcfg | 2-2 實戰：sshd 的 Match 設定與起始目錄
A> sshd_config 用 Match 區塊替「某些人」換一套規則。會員和訪客：被 chroot、強制只能用 internal-sftp、起始目錄是 /（在 chroot 裡就是 $SFTP_ROOT）。館長 sysadm 不 chroot，走一般的 Subsystem，但起始目錄也指向 $SFTP_ROOT。這也解釋了規格裡 log 為什麼同時有 internal-sftp 與 sftp-server 兩種名字。
B> chroot 使用者：**Match Group sftponly** → **ChrootDirectory /mnt/hw2/sftp**、**ForceCommand internal-sftp -d / -u 0007 -l INFO**、AllowTcpForwarding no、X11Forwarding no、PermitTTY no
B> **-d /**：chroot 後的起始目錄（chroot 內的 / = $SFTP_ROOT）
B> sysadm：**Subsystem sftp /usr/lib/openssh/sftp-server -d /mnt/hw2/sftp -l INFO -u 0007** → log 名稱是 **sftp-server**；chroot 使用者的 log 名稱是 **internal-sftp**
B> **Match 一直到下一個 Match 或檔案結尾**：Match 放在檔案最後面
B> 陷阱：Debian 主檔開頭有 **Include /etc/ssh/sshd_config.d/*.conf**，若在被 include 的檔案寫 Match，主檔後面所有設定都會被吞進那個 Match
B> ChrootDirectory 每一層（/、/mnt、/mnt/hw2、/mnt/hw2/sftp）都必須 **root 擁有、group/other 不可寫**
X> Subsystem sftp /usr/lib/openssh/sftp-server -d /mnt/hw2/sftp -l INFO -u 0007
X> Match Group sftponly
X>     ChrootDirectory /mnt/hw2/sftp
X>     ForceCommand internal-sftp -d / -u 0007 -l INFO
X>     AllowTcpForwarding no

@CARD hw2.p_acldesign | 2-2 實戰：umask 007 與 anonymous 唯讀的衝突
A> 規格有兩個看起來打架的要求：「上傳的檔案要拿掉 other 的所有權限」，以及「anonymous 要能讀 public 裡的檔案」。anonymous 不在會員群組裡，對檔案來說它就是 other，other 沒權限它就讀不到。解法是 ACL：給 anonymous 一個「具名讀取權」，它就不必靠 other 位元。
B> 上傳檔案 other 為 ---（umask 007 或預設 ACL 的 **o::---**）→ anonymous（屬於 other）**讀不到**
B> 解法：在 public 設 **預設 ACL**：**d:u:anonymous:r-x**、d:u:sysadm:rwx、**d:o::---**；新建的檔案、目錄自動繼承
B> 有預設 ACL 的目錄裡，新檔權限由預設 ACL 決定、**不套用 umask**；要確認 **mask** 沒把 anonymous 的 r 截掉
B> 已存在的內容用 **setfacl -R -m** 補上（預設 ACL 只影響之後建立的）
B> public 本身：擁有者 sysadm、群組 sftpusers、**setgid + sticky（3770）** + ACL u:anonymous:r-x
B> 檢查：**getfacl** 看 ACL、**ls -l** 中權限後面有 **+** 代表有 ACL；以 anonymous 實際 get 測試
X> chown sysadm:sftpusers /mnt/hw2/sftp/public
X> chmod 3770 /mnt/hw2/sftp/public
X> setfacl -m u:anonymous:rx,u:sysadm:rwx /mnt/hw2/sftp/public
X> setfacl -d -m u::rwx,g::rwx,o::---,u:anonymous:rx,u:sysadm:rwx /mnt/hw2/sftp/public
X> getfacl /mnt/hw2/sftp/public
?mc sftp-u1 上傳的檔案權限是 -rw-rw----（群組 sftpusers），沒有 ACL。anonymous 能 get 它嗎？
+ 不能，anonymous 不是擁有者也不在 sftpusers，屬於 other，而 other 沒有權限
- 能，anonymous 是唯讀帳號所以可以讀所有檔案
- 能，因為 public 目錄有 r 權限
- 只有在 sticky bit 存在時可以
E> 目錄的權限只決定能不能列出與進入，讀檔要看檔案本身的權限。
?mc 為什麼用「預設 ACL 給 anonymous r」可以同時滿足「上傳檔 other 無權限」與「anonymous 可讀」？
+ anonymous 透過具名使用者 ACL 取得讀取權，不依賴 other 位元，other 仍可以是 ---
- ACL 會把 anonymous 改成檔案擁有者
- ACL 會自動把 other 設成 r
- 預設 ACL 會讓 umask 失效，所以 other 變成 rwx
E> ls -l 看到的 other 欄位仍是 ---，滿足評分條件。
?cmd 讓之後在 public 中新建的檔案，自動給使用者 anonymous 讀取（與目錄進入）權限：
= setfacl -d -m u:anonymous:rx public
= setfacl -d -m u:anonymous:r-x public
= setfacl -m d:u:anonymous:rx public
= setfacl -m d:u:anonymous:r-x public
= setfacl --default -m u:anonymous:rx public
E> -d（--default）設定預設 ACL；d:u:… 是等價寫法。
?tf ls -l 顯示 -rw-rw----+，最後的 + 表示這個檔案有額外的 ACL。

@CARD hw2.p_privdesign | 2-2 實戰：private 與 hidden 的「能進不能看」
A> private 像一條「沒有門牌的走廊」：大家能走進去（x），但看不到裡面有哪些房間（沒有 r 就不能 ls）；只要你知道房間名字（hidden），就能直接走到；房間裡的寶藏（treasure）有開放讀取，所以拿得到。

B> sysadm 是擁有者 → private 底下 get/put/mkdir/rm/rmdir 都可以
B> sftp_watchd 的 **private/.violated/**：建議 root 擁有、700，避免使用者讀取違規檔

@CARD hw2.p_watchimpl | 2-3 實戰：sftp_watchd 實作細節
A> sftp_watchd 是一位「收件室管理員」：盯著 SFTP 目錄，每當有人「寫完」一個檔案（close_write），就檢查前 4 個 byte 是不是 ELF 的魔術數字、算 MD5 比對黑名單，違規就搬進 .violated 並照固定格式記錄。它本身不能 fork 到背景，交給 systemd 管。
B> 監看：**inotifywait -m -r -e close_write,moved_to --format '%w%f' --exclude '/\.violated/' /mnt/hw2/sftp**（需 apt install **inotify-tools**）
B> **close_write**：檔案寫完才觸發（避免檢查到傳到一半的檔案）；**moved_to**：檔案被改名移入；**-r** 新建子目錄也會自動監看
B> ELF 判斷：前 4 bytes 為 **7f 45 4c 46**（\x7fELF）：**head -c 4 "$f" | od -An -tx1**
B> MD5：**md5sum "$f" | cut -d' ' -f1** 與黑名單比對；上傳者：**stat -c %U "$f"**
B> 搬移：mv 到 **private/.violated/**（處理同名衝突）；log 印到 **stdout** → journal；訊息**一字不差**
B> 規則：**不能呼叫其他自己寫的程式**（系統工具如 inotifywait、md5sum 可以）；放在 PATH（/usr/local/bin）、judge 讀得到
X> inotifywait -m -r -q -e close_write,moved_to --format '%w%f' --exclude '/\.violated/' "$SFTP_ROOT" |
X> while IFS= read -r f; do
X>   [ -f "$f" ] || continue
X>   user=$(stat -c %U "$f")
X>   if [ "$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')" = 7f454c46 ]; then
X>     echo "File $f uploaded by user $user is an ELF file. Moving to violated directory"
X>     mv -- "$f" "$SFTP_ROOT/private/.violated/"
X>   fi
X> done
?mc 為什麼用 close_write 而不是 create 事件來觸發檢查？

- create 事件只對目錄有效
- close_write 比較省 CPU
- inotify 沒有 create 事件
E> 檔案還沒傳完就計算 MD5，結果一定不對。
?fill ELF 檔案開頭 4 個 byte 的十六進位是 7f 45 4c ＿＿
= 46
E> 也就是 0x7F 'E' 'L' 'F'。
?mc 把違規檔搬進 private/.violated/ 後，watcher 又對它觸發 moved_to 事件而重複處理。最好的修法？

- 改用 cp 不要 mv
- 把 .violated 放在 public 裡
- 每次處理後重啟服務
E> 搬移本身就是一個 moved_to 事件。

A> 讓 systemd 當 sftp_watchd 的「保母」：開機自動啟動、掛了自動重來、log 自動進 journal。最重要的是它得等 /mnt/hw2/sftp 掛好才開始，不然會盯著一個空目錄。
B> **[Unit]**：Description=、**After=local-fs.target**、**RequiresMountsFor=/mnt/hw2/sftp**
B> **[Service]**：**Type=simple**、**ExecStart=/usr/local/bin/sftp_watchd**、**Restart=always**（或 on-failure）、RestartSec=2
B> **[Install]**：**WantedBy=multi-user.target**
B> 檔案放 **/etc/systemd/system/sftp_watchd.service** → **daemon-reload** → **enable --now**
B> 支援 start / stop / status / restart；log 用 **journalctl -u sftp_watchd**；stop 後確認沒有殘留的 inotifywait（同一個 cgroup 會被一起殺掉）

X> After=local-fs.target
X> RequiresMountsFor=/mnt/hw2/sftp
X> [Service]

- inotifywait 會偵測到父程序結束而自殺
- systemd 會掃描所有名為 inotifywait 的 process

A> rsyslog 讀 /etc/rsyslog.d/*.conf 是照檔名順序，而且每條訊息會依序經過所有規則。所以 sftp 的規則要放在預設規則（50-default.conf）之前，寫完檔案就 stop，訊息才不會又被複製進 syslog 或 auth.log，sftp.log 也能保持「純 SFTP」。
B> 新式（RainerScript）：**if $programname == 'internal-sftp' or $programname == 'sftp-server' then { action(type="omfile" file="/var/log/sftp.log") stop }**
B> 舊式（property-based filter）：**:programname, isequal, "internal-sftp" /var/log/sftp.log** 下一行 **& stop**
B> 檔名用小數字開頭（例如 **10-sftp.conf**），排在 50-default.conf 之前，stop 才能阻止重複寫入

B> 長期維運：**/etc/logrotate.d/** 為 /var/log/sftp.log 加輪替設定
X> # /etc/rsyslog.d/10-sftp.conf
X> :programname, isequal, "internal-sftp" /var/log/sftp.log
X> & stop
X> :programname, isequal, "sftp-server" /var/log/sftp.log
X> & stop
X> $ logger -t sftp-server "rsyslog test"; tail -1 /var/log/sftp.log

- stop 只對 kern 有效
- auth.log 由 journald 寫入
- 需要重開機

?cmd 不必真的用 SFTP，模擬一筆 SYSLOG 識別字為 internal-sftp 的訊息來測試 rsyslog 規則：

= logger -t internal-sftp hello

E> pathlen:0 表示它底下不能再有 CA；CA:FALSE 則連一般憑證都不能簽（它就不是 CA 了）。
?mc 現代瀏覽器檢查憑證是否屬於 git.19.cs.nycu 時，看的是？
+ SAN（subjectAltName）中的 DNS 名稱
- Subject 的 O（organization）
- 憑證的序號
- Issuer 的 CN
E> 只看 SAN；沒有 SAN 的憑證會被拒絕。
?cmd 用 root.crt 當信任根、intermediate.crt 當中繼，驗證 server.crt：
= openssl verify -CAfile root.crt -untrusted intermediate.crt server.crt
E> -untrusted 提供中繼憑證，但不把它當成信任根。
?mt 配對憑證 extension：
> basicConstraints CA:TRUE, pathlen:0 :: 只能簽發終端憑證的中繼 CA
> subjectAltName DNS:pg.19.cs.nycu :: 憑證適用的主機名稱
> extendedKeyUsage serverAuth :: 可用於 TLS 伺服器
> extendedKeyUsage clientAuth :: 可用於 TLS 用戶端認證（mTLS）
E> 伺服器憑證放 serverAuth 與 SAN；mTLS 的 client 憑證放 clientAuth。
?sa 請說明為什麼實務上會用「Root CA + Intermediate CA」兩層架構，而不是直接用 Root CA 簽所有伺服器憑證？並說明用戶端如何驗證一張由 intermediate 簽發的伺服器憑證。
R> 原因：Root CA 的私鑰是整個信任體系的根，一旦外洩所有憑證都失去意義，而且 root 已預先安裝在各用戶端的信任清單中，更換成本極高。因此 root 私鑰應離線保存、極少使用，只用來簽發 intermediate；日常簽發由 intermediate 負責。intermediate 若外洩，可以由 root 撤銷（CRL/OCSP）並重發新的 intermediate，不必更動所有用戶端的信任根；也可以為不同用途分出不同的 intermediate 並以 pathlen、name constraints 限制權限。
R> 驗證：伺服器在 TLS handshake 送出 leaf 憑證與 intermediate 憑證。用戶端用 intermediate 的公鑰驗證 leaf 的簽章、用自己信任清單中的 root 公鑰驗證 intermediate 的簽章，建立 leaf → intermediate → root 的鏈；同時檢查每張憑證的有效期限、basicConstraints（中間節點必須是 CA 且符合 pathlen）、keyUsage/EKU（leaf 需 serverAuth）、leaf 的 SAN 是否符合連線的主機名，以及撤銷狀態。
P> root 私鑰離線保存、降低外洩風險
P> intermediate 外洩可撤銷並重發，不必更換用戶端信任根
P> 伺服器送出 leaf + intermediate，用戶端逐層驗簽章直到信任的 root
P> 檢查有效期、CA 限制、EKU、SAN 主機名、撤銷

@CARD hw3.weakca | 有缺陷的 Intermediate CA：私鑰可被算出
A> RSA 的安全性靠「兩個超大質數相乘很容易，反過來分解很難」。如果私鑰是用很小的數字產生的，壞人就能把公鑰的 n 分解掉、算出私鑰，等於偷到 CA 的印章，可以替任何網站發「合法」的假證件，瀏覽器也會相信。
B> 背景：2026 年 10 月 Mozilla 發現 8 張 **eMudhra** intermediate CA 憑證的私鑰來自**非常小的數字** → 任何人都能算出私鑰
B> 作業中 TA root CA 也替每位學生簽了一張**同樣有缺陷的 intermediate CA**，並用它簽發 https://{STU_ID}.vuln.ta.cs.nycu
B> 要求：在 /etc/hosts 把 {STU_ID}.vuln.ta.cs.nycu 指向自己，用**算出私鑰的缺陷 CA** 簽一張 **SAN 只有該主機名**的憑證，能通過 **TA root CA** 驗證，回應原站內容並加上 header **X-Intercepted-By: {STU_ID}**
B> 教訓：CA 私鑰外洩 = 可以冒充任何網站；所以需要**撤銷（CRL / OCSP）**、**Certificate Transparency**，以及正確的金鑰產生
?mc 為什麼拿到一張 intermediate CA 的私鑰，就能冒充網站且瀏覽器不會警告？
+ 用它簽出的憑證可以串到瀏覽器信任的 root，整條鏈驗證都會通過
- 因為瀏覽器不檢查 intermediate
- 因為 intermediate 的私鑰也能解密所有 TLS 流量
- 因為這種憑證不需要 SAN
E> 信任是沿著鏈傳遞的，所以 CA 私鑰外洩後必須撤銷那張 intermediate。
?mc RSA 私鑰若由「很小的數字」產生，為什麼不安全？
+ 公鑰的模數 n 可以被輕易分解成兩個質數，進而算出私鑰
- 小數字會讓簽章無法驗證
- 公鑰長度會變成 0
- 小數字的憑證無法放入 SAN
E> RSA 的安全性建立在大整數分解的困難度上。
?tf CA 私鑰外洩後，最主要的補救方式是把該 CA 憑證撤銷（例如列入上層 CA 的 CRL）。
=T
E> 撤銷後，檢查 CRL 的用戶端就會拒絕它簽出的所有憑證（這正是 tls_revoked 的情境）。

@CARD hw3.nginxtls | NGINX：HTTPS、301、HSTS、隱藏 header
A> NGINX 是大門口的警衛：所有 HTTP 訪客都被請到 HTTPS 門口（301 永久轉址）；HSTS 是「告訴瀏覽器以後一年內直接走 HTTPS，別再走 HTTP」；不要告訴外人裡面用的是什麼軟體、什麼版本（拿掉 Server、X-Powered-By、Via）。
B> Part 1 所有主機（pg 除外）：**HTTPS**（你的 CA 簽的憑證）、**HTTP → HTTPS 用 301**、**HSTS max-age ≥ 31536000**
B> 依主機轉發到 port 表中的服務（**reverse proxy**）
B> 回應**不能有 Server、X-Powered-By、Via** header
B> **server_tokens off** 只會拿掉版本號，Server: nginx 還在；完全移除要用 **headers-more** 模組（more_clear_headers Server）
B> 後端送出的 header 用 **proxy_hide_header X-Powered-By;** 隱藏
X> server { listen 80; server_name git.19.cs.nycu; return 301 https://$host$request_uri; }
X> server {
X>   listen 443 ssl; server_name git.19.cs.nycu;
X>   ssl_certificate /etc/nginx/tls/git.fullchain.crt; ssl_certificate_key /etc/nginx/tls/git.key;
X>   add_header Strict-Transport-Security "max-age=31536000" always;
X>   proxy_hide_header X-Powered-By;
X>   location / { proxy_pass http://127.0.0.1:8101; proxy_set_header Host $host;
X>     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
X> }
?fill 把所有 HTTP 請求以 301 轉到 HTTPS：return 301 https://$host＿＿;
= $request_uri
E> $request_uri 包含原始路徑與 query string。
?mc HSTS（Strict-Transport-Security）的作用是？
+ 告訴瀏覽器在 max-age 期間內，對這個網域一律直接使用 HTTPS
- 讓伺服器的憑證有效期限延長
- 加密 HTTP header
- 防止 XSS 攻擊
E> 可避免使用者第一次打 http:// 時被中間人攔截降級（SSL stripping）。
?mc 只設定 server_tokens off 後，回應的 Server header 會是？
+ Server: nginx（只是沒有版本號）
- 完全沒有 Server header
- Server: hidden
- Server: off
E> 要完全移除得用 headers-more 模組的 more_clear_headers。
?tf ssl_certificate 應該指向「伺服器憑證 + intermediate 憑證」串在一起的檔案。
=T
E> 用戶端只信任 root，伺服器必須送出 intermediate 才能建立完整的鏈。
?cmd 檢查 nginx 設定檔語法：
= nginx -t
= sudo nginx -t
E> 通過後再 systemctl reload nginx。

@CARD hw3.lb | NGINX 負載平衡：upstream 與 failover
A> upstream 是「排班表」：三個 IP-Srv 分身輪流接客（round-robin）。其中一個倒了，NGINX 發現連不上就把這位客人改帶到下一位，客人完全不知道（passive health check + proxy_next_upstream）。
B> TA 提供 **IP-Srv** image：容器內聽 **8000**，/ 回 JSON：**host_ip**（處理請求的 replica IP）、**client_ip**（取自 **X-Forwarded-For**）
B> IP-Srv 環境變數：IP_SRV_METRICS_USER / IP_SRV_METRICS_PASSWORD（/metrics 的 basic auth）
B> 3 個 replica 各發布 8000、8001、8002；https://{STU_ID}.cs.nycu/ 用 **round-robin** 分配
B> **任一 replica 停掉，每個請求仍要成功** → 依賴 **proxy_next_upstream**（預設 error timeout：連線失敗就換下一台）與 max_fails / fail_timeout
B> 要正確設定 **X-Forwarded-For**，IP-Srv 才回得出真正的 client IP
X> upstream ipsrv {
X>   server 127.0.0.1:8000 max_fails=1 fail_timeout=10s;
X>   server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
X>   server 127.0.0.1:8002 max_fails=1 fail_timeout=10s;
X> }
X> location / { proxy_pass http://ipsrv; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
?mc NGINX upstream 沒有指定演算法時，預設的負載平衡方式是？
+ round-robin（輪流）
- least_conn
- ip_hash
- random
E> 可改用 least_conn、ip_hash、hash 等；也可以用 weight= 調整比例。
?mc 三個 replica 中一個被 docker stop 了，為什麼使用者的請求仍然能成功？
+ NGINX 連線失敗時（error/timeout）會依 proxy_next_upstream 把請求轉給下一台，並暫時標記失敗的 server
- Docker 會自動把流量導到其他容器
- 使用者瀏覽器會自動重試
- round-robin 會自動跳過沒有回應的 port，不需任何機制
E> 預設 proxy_next_upstream error timeout；對非冪等請求（POST）預設不重試。
?fill 把 client IP 附加到 X-Forwarded-For 的 NGINX 變數是 $＿＿
= proxy_add_x_forwarded_for
E> 若原本已有 X-Forwarded-For，會在後面附加 $remote_addr。
?tf IP-Srv 回傳的 client_ip 取自 TCP 連線的來源 IP。
=F
E> 取自 X-Forwarded-For header；後端看到的連線來源永遠是 NGINX。

@CARD hw3.oidc | OIDC provider：client credentials、discovery、introspection
A> OIDC provider 是「身分證中心」。機器對機器時用 client credentials：程式拿自己的帳號密碼（client ID / secret）換一張通行證（access token），沒有真人參與。discovery 是中心門口的「服務說明牌」，寫好各窗口地址；introspection 是「打電話問中心這張證還有效嗎」，revocation 是「註銷這張證」。
B> 在 https://auth.{STU_ID}.cs.nycu 提供 OIDC provider（推薦 **Keycloak、Authentik、kanidm**）
B> 給 judge 的 **confidential client**：支援 **client credentials grant**；issuer = SA_OIDC_ISSUER，judge 用 **OIDC Discovery** 取得設定
B> Discovery：**{issuer}/.well-known/openid-configuration** → token_endpoint、jwks_uri、introspection_endpoint、revocation_endpoint…
B> access token 要能 **introspect**（RFC 7662，回 active: true/false）與 **revoke**（RFC 7009）
B> Forgejo 與 Platform 都用它登入 / 驗證；Platform API **只接受這個 provider 發的 bearer token**
X> $ curl -s "$SA_OIDC_ISSUER/.well-known/openid-configuration" | jq .token_endpoint
X> $ curl -s -u "$SA_OIDC_CLIENT_ID:$SA_OIDC_CLIENT_SECRET" \
X>     -d grant_type=client_credentials "$TOKEN_ENDPOINT" | jq -r .access_token
X> $ curl -H "Authorization: Bearer $TOKEN" https://sandbox.19.cs.nycu/api/sandboxes
?fill OIDC Discovery 文件的路徑是 {issuer}/＿＿
= .well-known/openid-configuration
= /.well-known/openid-configuration
E> 用戶端只要知道 issuer，就能從這份 JSON 找到所有 endpoint。
?mc client credentials grant 適用於哪種情境？
+ 沒有使用者參與的機器對機器（服務對服務）存取
- 使用者在瀏覽器登入第三方網站
- 手機 App 讓使用者輸入密碼
- 單頁應用程式不保存 secret 的登入
E> 只有 confidential client（能安全保存 secret）可以用。
?mc 平台用 JWKS 在本機驗證 JWT 簽章與 exp，但 judge 把 token revoke 之後仍要拒絕它。平台應該怎麼做？
+ 呼叫 introspection endpoint 確認 token 是否仍 active（或縮短 token 有效期並搭配 introspection）
- 只檢查 JWT 簽章就夠了
- 檢查 token 字串長度
- 要求 judge 重新登入
E> 自包含的 JWT 在 exp 之前簽章永遠有效，撤銷只有問 provider 才知道。
?mt 配對 OAuth2 / OIDC endpoint：
> token_endpoint :: 用 client ID / secret 換 access token
> introspection_endpoint :: 查詢 token 是否仍有效
> revocation_endpoint :: 撤銷 token
> jwks_uri :: 取得驗證 JWT 簽章用的公鑰
E> 這些網址都列在 discovery 文件中。

@CARD hw3.pg | PostgreSQL：只接受 TLS 與 client 憑證登入
A> 資料庫的門禁三層：只准走加密通道（hostssl）、伺服器要拿你 CA 簽的證件讓客戶驗明正身（verify-full 會核對主機名）、judge 進門不收密碼只看 client 證件，證件上的名字（CN）就是使用者名稱。
B> **PostgreSQL 18** 在 pg.{STU_ID}.cs.nycu:5432；使用者 llm_sandbox_platform、forgejo **只能存取自己的資料庫**；**judge 是 superuser**
B> **只接受 TLS**（Docker 網路內也是）→ pg_hba.conf 只用 **hostssl**（不要有 host / hostnossl 允許規則）
B> 伺服器憑證由 intermediate 簽、SAN 含 pg.{STU_ID}.cs.nycu，能通過 **sslmode=verify-full**
B> client 憑證由 intermediate 簽，**cert CN 對應 username**（auth method **cert**）；judge 透過網路**只能用 client 憑證**，密碼被拒
B> postgresql.conf：**ssl = on**、ssl_cert_file、ssl_key_file、**ssl_ca_file**（用來驗證 client 憑證）；私鑰權限要 0600
X> # pg_hba.conf
X> hostssl all             judge                 all  cert
X> hostssl forgejo         forgejo               all  scram-sha-256
X> hostssl llm_sandbox_platform llm_sandbox_platform all scram-sha-256
X> $ psql "host=pg.19.cs.nycu dbname=postgres user=judge sslmode=verify-full \
X>   sslrootcert=root.crt sslcert=judge.crt sslkey=judge.key"
?mt 配對 libpq 的 sslmode：
> require :: 一定要加密，但不驗證伺服器憑證
> verify-ca :: 驗證憑證由信任的 CA 簽發
> verify-full :: 驗證 CA 且主機名要符合憑證的 SAN
> disable :: 不使用 TLS
E> 只有 verify-full 能防止中間人用「同一個 CA 簽的別台機器憑證」冒充。
?mc pg_hba.conf 中 hostssl 與 host 的差別？
+ hostssl 只匹配使用 TLS 的 TCP 連線；host 匹配 TLS 與非 TLS 的 TCP 連線
- hostssl 用於 Unix socket；host 用於 TCP
- 兩者相同，只是寫法不同
- host 會自動升級成 TLS
E> 要「只接受 TLS」就不能留下允許的 host 規則。
?mc pg_hba.conf 中 judge 使用 auth method cert 時，PostgreSQL 如何決定是哪個使用者？
+ 驗證 client 憑證由信任的 CA 簽發，並要求憑證的 CN 等於登入的使用者名稱（或經 pg_ident.conf 對應）
- 讀取 client 憑證中的 email 欄位
- 仍然要求輸入密碼
- 依 client 的 IP 決定
E> CN 不符就拒絕；這就是「CN maps to username」。
?cmd 在 psql 中建立資料庫 forgejo 並指定擁有者為 forgejo（SQL）：
= CREATE DATABASE forgejo OWNER forgejo;
= create database forgejo owner forgejo;
= CREATE DATABASE forgejo OWNER forgejo
E> 再 REVOKE CONNECT ON DATABASE forgejo FROM PUBLIC; 讓其他使用者連不進來。
?mc 要讓 forgejo 使用者「不能連到」llm_sandbox_platform 資料庫，下列哪個 SQL 是關鍵？
+ REVOKE CONNECT ON DATABASE llm_sandbox_platform FROM PUBLIC;
- DROP USER forgejo;
- ALTER DATABASE llm_sandbox_platform OWNER TO forgejo;
- GRANT ALL ON DATABASE llm_sandbox_platform TO PUBLIC;
E> 預設 PUBLIC 有 CONNECT 權限；撤掉後只有擁有者與 superuser 能連（也可在 pg_hba.conf 依資料庫限制使用者）。

@CARD hw3.forgejo | Forgejo、container registry 與受保護分支
A> Forgejo 是自架的 GitHub：程式碼放這裡、image 也放在它附帶的倉庫（container registry），登入交給 OIDC。main 分支設成「受保護」，誰都不能 force push 改寫歷史。runner 是「工人」，用 Docker-in-Docker 在隔離環境裡幫你跑 CI。
B> https://git.{STU_ID}.cs.nycu；資料存在 PostgreSQL 的 **forgejo** 資料庫；使用者用 **OIDC provider 登入**
B> repo **hw3/llm-sandbox-platform** 存平台程式碼；image 推到 Forgejo **container registry**：**git.{STU_ID}.cs.nycu/hw3/llm-sandbox-platform:<tag>**

B> **Forgejo runner** 用 **Docker-in-Docker** 執行 job
B> judge 的 SA_FORGEJO_TOKEN 需要 scope **write:repository、read:package**

X> $ docker tag lmsp:dev git.19.cs.nycu/hw3/llm-sandbox-platform:v1.0.0
X> $ docker push git.19.cs.nycu/hw3/llm-sandbox-platform:v1.0.0
?mc 「main 分支的歷史不能被改寫」主要是要阻止哪個操作？
+ git push --force（強制覆寫遠端歷史）
- git pull
- 建立新分支
- 推送新的 commit
E> 用 branch protection 禁止 force push（以及刪除分支）。
?cmd 把本地 image lmsp:dev 標記成要推到 Forgejo registry 的 v1.0.0（主機 git.19.cs.nycu）：
= docker tag lmsp:dev git.19.cs.nycu/hw3/llm-sandbox-platform:v1.0.0
E> image 名稱開頭的主機名決定要推到哪個 registry。
?tf push image 到 git.19.cs.nycu 之前，Docker 必須信任該網站的 TLS 憑證（由你的 CA 簽發）。
=T
E> 否則 docker login / push 會出現 x509: certificate signed by unknown authority。

@CARD hw3.cicd | CI/CD：推 tag 自動 build 與部署
A> CI/CD 是自動化的生產線：你推一個版本標籤 v1.2.3，生產線就自動做出同名的 image、放進倉庫、透過 SSH 到 host 換上新版。只認「三段都是數字」的標籤，其他標籤或分支不開工。
B> 推 tag **v<major>.<minor>.<patch>**（全數字）後 **5 分鐘內**：registry 有同 tag 的 image、host 上的平台容器用這個 image、**GET /api/version 回傳這個 tag**
B> **其他 tag 或分支不能 build image** → workflow 只在符合 v數字.數字.數字 的 tag 觸發（並在 job 內用正規表示式再檢查）
B> 部署後 **docker compose down + up -d 仍要用最新部署的 image** → 把 tag 寫進 host 上 compose 讀取的設定（例如 .env 的 LMSP_TAG），不要只靠臨時的 docker run
B> pipeline 透過 **SSH key** 部署到 host（私鑰存成 CI secret；host 端可用 authorized_keys 的 command= / restrict 限制這把 key 只能做部署）
X> # .forgejo/workflows/release.yml
X> on:
X>   push:
X>     tags: ['v[0-9]+.[0-9]+.[0-9]+']
X> # host 上的 compose.yml
X>   platform:
X>     image: git.19.cs.nycu/hw3/llm-sandbox-platform:${LMSP_TAG}
?mc 下列哪個 tag 應該觸發 build？
+ v2.10.3
- v2.10
- v2.10.3-rc1
- release-2.10.3
E> 必須剛好是 v + 三段數字。
?fill 檢查 tag 是否符合 v<數字>.<數字>.<數字> 的正規表示式：^v[0-9]+\.[0-9]+\.＿＿$
= [0-9]+
= \d+
E> + 表示至少一位數字；^ 和 $ 確保整個字串完全符合。
?mc 為什麼部署時要把新 tag 寫進 compose 讀取的 .env，而不是只在 host 上 docker run 新 image？
+ 這樣 docker compose down + up -d 之後仍會使用最新部署的 image，設定是持久的
- docker run 不能拉取私有 registry 的 image
- .env 會讓 image build 得比較快
- Forgejo 只支援 .env
E> HW3：After a deploy, docker compose down + up -d still uses the latest deployed image。
?sa 請設計 HW3 的 CI/CD 流程：從開發者推送 git tag 到 host 上的平台換成新版本，列出各步驟與需要注意的安全措施。
R> 1. 開發者推送 tag（如 v1.2.3）到 Forgejo；workflow 只在 tag 符合 v數字.數字.數字 時觸發，job 開頭再用 ^v[0-9]+\.[0-9]+\.[0-9]+$ 檢查一次，不符就結束。
R> 2. Forgejo runner 以 Docker-in-Docker 執行 job：checkout 程式碼，docker build，並把 tag 寫進 image（例如 --build-arg VERSION=v1.2.3，讓 /api/version 回傳它）。
R> 3. 用 registry 憑證（或 runner 提供的 token）docker login git.{STU_ID}.cs.nycu，push git.{STU_ID}.cs.nycu/hw3/llm-sandbox-platform:v1.2.3。
R> 4. 用存在 CI secret 中的 SSH 私鑰連到 host，更新 compose 使用的 tag（例如改 .env 中的 LMSP_TAG），執行 docker compose pull platform && docker compose up -d platform。
R> 安全：SSH key 專用於部署，在 host 的 authorized_keys 用 restrict、command= 限制只能執行部署腳本；私鑰只放在 secret 中、不進 repo；registry 與 host 的 TLS 憑證要被 runner 信任；main 分支受保護、禁止 force push；只有 tag 推送才部署，避免任何分支都能改動正式環境。
P> tag 格式過濾（workflow 觸發條件與再次檢查）
P> build 並 push 同名 tag 的 image 到 Forgejo registry
P> 透過 SSH 更新 host 上持久的 compose 設定並 up -d
P> 部署 key 權限限制、secret 不外洩、受保護分支

@CARD hw3.sandbox | Sandbox 容器與 sallm-cli
A> 每個 sandbox 是一間容器房間，agent 在裡面當 root（反正房間是隔離的）。agent 只有四樣工具：讀、寫、改檔、跑 bash；它的每個動作都以「一行一個 JSON 事件」的方式報告，平台就靠這些事件記錄與畫出 trace。
B> **sallm-cli**：只有 4 個 tool：**read、write、edit、bash**；沒有 session、沒有 log
B> 非互動模式：**sallm-cli run --json --task "<task>"** → stdout **每行一個 JSON event**；完成 exit 0、錯誤非 0；收到 **SIGTERM** 會停止
B> 環境變數：**AGENT_BASE_URL**（https://llm.ta.cs.nycu/v1，OpenAI 相容）、**AGENT_API_KEY**、**AGENT_MODEL**（SA2026-LLM）；平台在**建立容器時設定**
B> event：每個都有 **type、time（RFC 3339）**；**message**（content）、**tool_call**（call_id、tool、args）、**tool_result**（call_id 對應 tool_call、output、is_error）、**done**、**error**（message）
B> sandbox image 從 TA 的 sandbox-base 建立，並**信任平台的攔截 root CA**
X> {"type":"tool_call","time":"2026-12-01T10:00:01+08:00","call_id":"c1","tool":"bash","args":{"command":"ls /workspace"}}
X> {"type":"tool_result","time":"2026-12-01T10:00:02+08:00","call_id":"c1","output":"README.md\n","is_error":false}
?mc 平台要把 tool_call 與它的 tool_result 配對起來（例如畫出 tool call span），應該依據哪個欄位？
+ call_id
- time
- tool
- type
E> tool_result 的 call_id 與對應的 tool_call 相同。
?mt 配對 sallm-cli event type：
> message :: agent 的文字回應
> tool_call :: agent 呼叫 read/write/edit/bash
> tool_result :: 工具執行結果
> done :: 任務完成
> error :: 發生錯誤
E> 每個 event 都有 type 與 time（RFC 3339）。
?tf sandbox image 需要信任平台的 HTTPS 攔截 root CA，否則 agent 連 HTTPS 時會出現憑證錯誤。
